<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#1a4d4a">
<title>رحلة كوريا · مخطط ذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root {
  --bg: #f7f3ec;
  --paper: #fdfaf3;
  --ink: #1a1612;
  --ink-soft: #403a32;
  --muted: #6b6358;
  --accent: #1a4d4a;
  --accent-dk: #0f3331;
  --persimmon: #c9442b;
  --gold: #b8924a;
  --cream: #ede5d3;
  --border: #d9cfb9;
  --ok: #10b981;
  --warn: #f59e0b;
  --err: #ef4444;
  --sh: 0 1px 3px rgba(26,22,18,0.08);
  --sh-md: 0 4px 12px rgba(26,22,18,0.08);
  --r-sm: 0.375rem;
  --r-md: 0.5rem;
  --r-lg: 0.75rem;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  min-height: 100vh;
  font-size: 15px;
  overflow-x: hidden;
}
button, input, select, textarea, a { font-family: inherit; }
button { cursor: pointer; background: none; border: none; color: inherit; }
input, select, textarea {
  font-size: 16px; /* prevents iOS zoom */
  -webkit-appearance: none;
}
@media (min-width: 640px) { body { font-size: 14px; } }

/* ─────────────────────────────────────────
   HEADER (compact mobile, expanded desktop)
   ───────────────────────────────────────── */
.hdr {
  background: var(--accent);
  color: var(--paper);
  padding: 1.25rem 1rem 1rem;
  position: relative;
  overflow: hidden;
}
.hdr::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 15% 25%, rgba(184,146,74,0.35) 0%, transparent 45%),
    radial-gradient(circle at 85% 75%, rgba(201,68,43,0.25) 0%, transparent 45%);
  pointer-events: none;
}
.hdr-c { position: relative; max-width: 75rem; margin: 0 auto; }
.hdr-tag {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: var(--gold);
  margin-bottom: 0.4rem;
}
.hdr-tag svg { width: 12px; height: 12px; }
.hdr h1 {
  font-size: clamp(1.5rem, 6vw, 2.5rem);
  line-height: 1.1;
  margin-bottom: 0.25rem;
  font-weight: 700;
}
.hdr-sub {
  font-size: 0.85rem;
  color: rgba(253,250,243,0.85);
  margin-bottom: 0.875rem;
}
.hdr-stats {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.sb {
  flex: 1;
  min-width: max-content;
  padding: 0.5rem 0.65rem;
  border-radius: var(--r-md);
  background: rgba(253,250,243,0.12);
  border: 1px solid rgba(253,250,243,0.2);
  backdrop-filter: blur(8px);
}
.sb-acc { background: var(--persimmon); border-color: var(--persimmon); }
.sb-l { font-size: 0.55rem; letter-spacing: 0.06em; opacity: 0.75; margin-bottom: 0.15rem; text-transform: uppercase; }
.sb-v { font-size: 0.78rem; font-weight: 600; }

.hdr-tools {
  display: flex; gap: 0.4rem;
  margin-top: 0.6rem;
  flex-wrap: wrap;
}
.ht-btn {
  display: inline-flex; align-items: center; gap: 0.3rem;
  padding: 0.4rem 0.65rem;
  border-radius: var(--r-sm);
  font-size: 0.7rem;
  font-weight: 500;
  background: rgba(253,250,243,0.18);
  color: var(--paper);
  border: 1px solid rgba(253,250,243,0.25);
  transition: all 0.15s;
}
.ht-btn:hover {
  background: rgba(253,250,243,0.3);
  transform: translateY(-1px);
}
.ht-btn svg { width: 12px; height: 12px; opacity: 0.85; }
@media (min-width: 768px) {
  .ht-btn { font-size: 0.78rem; padding: 0.45rem 0.8rem; }
  .ht-btn svg { width: 14px; height: 14px; }
}
@media (min-width: 768px) {
  .hdr { padding: 2rem 1.5rem 1.75rem; }
  .hdr-sub { font-size: 1rem; }
  .sb-l { font-size: 0.6rem; }
  .sb-v { font-size: 0.85rem; }
}

/* ─────────────────────────────────────────
   NAV (sticky, scroll-snap on mobile)
   ───────────────────────────────────────── */
nav {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(247,243,236,0.97);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav-c {
  max-width: 75rem;
  margin: 0 auto;
  padding: 0.4rem 0.5rem;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.nav-c::-webkit-scrollbar { display: none; }
.nav-tabs { display: flex; gap: 0.2rem; min-width: max-content; }
.nav-t {
  display: flex; align-items: center; gap: 0.35rem;
  padding: 0.5rem 0.75rem;
  border-radius: var(--r-sm);
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--ink-soft);
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}
.nav-t:hover { background: rgba(0,0,0,0.04); }
.nav-t.act { background: var(--accent); color: var(--paper); }
.nav-t svg { width: 13px; height: 13px; flex-shrink: 0; }
@media (min-width: 768px) {
  .nav-t { padding: 0.55rem 0.95rem; font-size: 0.83rem; }
}

/* ─────────────────────────────────────────
   MAIN CONTENT
   ───────────────────────────────────────── */
main {
  max-width: 75rem;
  margin: 0 auto;
  padding: 1.25rem 0.875rem 6rem;
}
@media (min-width: 768px) { main { padding: 2rem 1.5rem; } }

.sec { display: none; animation: fade 0.2s; }
.sec.act { display: block; }
@keyframes fade {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}

/* ─── Section heading ─── */
.sec-t {
  margin-bottom: 1.25rem;
  padding-bottom: 0.875rem;
  border-bottom: 1px solid var(--border);
}
.sec-t-r {
  display: flex; align-items: center; gap: 0.625rem;
  margin-bottom: 0.35rem;
}
.sec-t-i {
  width: 2rem; height: 2rem;
  border-radius: var(--r-sm);
  background: var(--accent);
  color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sec-t-i svg { width: 16px; height: 16px; }
.sec-t h2 { font-size: 1.25rem; font-weight: 700; }
.sec-t p { font-size: 0.78rem; color: var(--muted); }
@media (min-width: 768px) {
  .sec-t { margin-bottom: 1.75rem; padding-bottom: 1.25rem; }
  .sec-t-i { width: 2.5rem; height: 2.5rem; }
  .sec-t-i svg { width: 20px; height: 20px; }
  .sec-t h2 { font-size: 1.6rem; }
  .sec-t p { font-size: 0.85rem; }
}

/* ─── Card primitives ─── */
.card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 0.875rem;
}
.card-cream { background: var(--cream); }
.card-acc { background: rgba(26,77,74,0.07); border-color: rgba(26,77,74,0.25); }
.card-orng { background: rgba(201,68,43,0.07); border-color: rgba(201,68,43,0.25); }
.card-gold { background: rgba(184,146,74,0.08); border-color: rgba(184,146,74,0.3); }
@media (min-width: 768px) { .card { padding: 1.125rem; } }

/* ─── Pills ─── */
.pill {
  display: inline-flex; align-items: center; gap: 0.2rem;
  font-size: 0.65rem;
  padding: 0.15rem 0.5rem;
  border-radius: 9999px;
  font-weight: 500;
  background: rgba(26,77,74,0.12);
  color: var(--accent);
  border: 1px solid rgba(26,77,74,0.25);
  white-space: nowrap;
}
.pill-orng { background: rgba(201,68,43,0.12); color: var(--persimmon); border-color: rgba(201,68,43,0.25); }
.pill-gold { background: rgba(184,146,74,0.18); color: var(--gold); border-color: rgba(184,146,74,0.3); }
.pill-warn { background: rgba(245,158,11,0.15); color: #b45309; border-color: rgba(245,158,11,0.4); }
.pill-ok { background: rgba(16,185,129,0.12); color: #047857; border-color: rgba(16,185,129,0.3); }
.pill-err { background: rgba(239,68,68,0.12); color: #b91c1c; border-color: rgba(239,68,68,0.3); }
.pill-sm { font-size: 0.6rem; padding: 0.1rem 0.4rem; }

/* ─── Grid ─── */
.gr { display: grid; gap: 0.75rem; }
.g2 { grid-template-columns: repeat(2, 1fr); }
.g3 { grid-template-columns: 1fr; }
.g4 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 768px) {
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .mdg2 { grid-template-columns: repeat(2, 1fr); }
}

/* ─── Buttons ─── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
  padding: 0.55rem 0.875rem;
  border-radius: var(--r-sm);
  font-size: 0.83rem;
  font-weight: 500;
  transition: all 0.15s;
  white-space: nowrap;
  min-height: 38px;
}
.btn svg { width: 13px; height: 13px; flex-shrink: 0; }
.btn-pri { background: var(--accent); color: var(--paper); }
.btn-pri:hover { background: var(--accent-dk); }
.btn-sec { background: var(--cream); color: var(--ink-soft); }
.btn-sec:hover { background: var(--border); }
.btn-orng { background: var(--persimmon); color: var(--paper); }
.btn-orng:hover { filter: brightness(0.95); }
.btn-out { background: transparent; border: 1px solid var(--border); color: var(--ink-soft); }
.btn-out:hover { background: var(--cream); }
.btn-sm { padding: 0.35rem 0.65rem; font-size: 0.72rem; min-height: 30px; }
.btn-block { width: 100%; }

/* ─── Input ─── */
.input {
  width: 100%;
  padding: 0.55rem 0.75rem;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: var(--paper);
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  font-size: 0.9rem;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,77,74,0.1); }
.input-sm { padding: 0.35rem 0.55rem; font-size: 0.83rem; }
textarea.input { resize: vertical; min-height: 60px; }
.fld { margin-bottom: 0.75rem; }
.fld label {
  display: block;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--ink-soft);
  margin-bottom: 0.25rem;
}
.fld-row { display: flex; gap: 0.5rem; }
.fld-row > * { flex: 1; min-width: 0; }

/* ─── Filter bar ─── */
.fb {
  display: flex; flex-wrap: wrap; gap: 0.35rem;
  margin-bottom: 0.875rem;
}
.fb-btn {
  padding: 0.4rem 0.7rem;
  border-radius: var(--r-sm);
  font-size: 0.75rem;
  font-weight: 500;
  background: var(--paper);
  color: var(--ink-soft);
  border: 1px solid var(--border);
  display: flex; align-items: center; gap: 0.3rem;
  white-space: nowrap;
  transition: all 0.15s;
}
.fb-btn.act { background: var(--accent); color: var(--paper); border-color: var(--accent); }
.fb-btn svg { width: 11px; height: 11px; }
.fb-cnt { opacity: 0.7; font-variant-numeric: tabular-nums; }

/* ─── Tab strip (inner tabs) ─── */
.tabs {
  display: flex; gap: 0.2rem;
  background: var(--cream);
  padding: 0.2rem;
  border-radius: var(--r-md);
  margin-bottom: 0.875rem;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1;
  min-width: max-content;
  padding: 0.5rem 0.75rem;
  border-radius: var(--r-sm);
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--ink-soft);
  display: flex; align-items: center; justify-content: center; gap: 0.3rem;
  white-space: nowrap;
  transition: all 0.15s;
}
.tab.act {
  background: var(--paper);
  color: var(--ink);
  box-shadow: var(--sh);
  font-weight: 600;
}
.tab svg { width: 12px; height: 12px; }

/* ─── Empty state ─── */
.empty {
  text-align: center;
  padding: 2.5rem 1rem;
  background: var(--paper);
  border: 2px dashed var(--border);
  border-radius: var(--r-md);
}
.empty-i {
  width: 3rem; height: 3rem;
  margin: 0 auto 0.875rem;
  border-radius: 50%;
  background: var(--cream);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
}
.empty-t { font-size: 1rem; font-weight: 600; color: var(--ink); margin-bottom: 0.35rem; }
.empty-d { font-size: 0.83rem; color: var(--muted); margin-bottom: 1rem; max-width: 24rem; margin-left: auto; margin-right: auto; }
.empty-acts { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }

/* ─── Modal ─── */
.modal-bk {
  position: fixed; inset: 0;
  background: rgba(26,22,18,0.55);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
}
.modal-bk.show { display: flex; }
.modal {
  background: var(--paper);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  width: 100%;
  max-width: 32rem;
  padding: 1.25rem;
  max-height: 92vh;
  overflow-y: auto;
  animation: slideUp 0.25s ease-out;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: none; }
}
@media (min-width: 640px) {
  .modal-bk { align-items: center; padding: 1rem; }
  .modal { border-radius: var(--r-lg); animation: zoomIn 0.2s ease-out; }
  @keyframes zoomIn {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
}
.modal-h {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
}
.modal-h h3 { font-size: 1.05rem; font-weight: 700; }
.modal-x {
  width: 2rem; height: 2rem;
  border-radius: 50%;
  background: var(--cream);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
}
.modal-act {
  display: flex; gap: 0.5rem; justify-content: flex-end;
  margin-top: 1.25rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

/* ─── Utils ─── */
.flx { display: flex; }
.flx-c { display: flex; flex-direction: column; }
.itm { align-items: center; }
.its { align-items: flex-start; }
.jb { justify-content: space-between; }
.je { justify-content: flex-end; }
.jc { justify-content: center; }
.fls { flex: 1; min-width: 0; }
.fwr { flex-wrap: wrap; }
.g25 { gap: 0.25rem; }
.g35 { gap: 0.35rem; }
.g5 { gap: 0.5rem; }
.g75 { gap: 0.75rem; }
.g1 { gap: 1rem; }
.txx { font-size: 0.7rem; }
.txs { font-size: 0.8rem; }
.txm { font-size: 0.85rem; }
.fb5 { font-weight: 500; }
.fb6 { font-weight: 600; }
.fb7 { font-weight: 700; }
.cli { color: var(--ink); }
.cls { color: var(--ink-soft); }
.clm { color: var(--muted); }
.cla { color: var(--accent); }
.clp { color: var(--persimmon); }
.cn { font-variant-numeric: tabular-nums; }
.tac { text-align: center; }
.mb1 { margin-bottom: 0.5rem; }
.mb2 { margin-bottom: 0.75rem; }
.mb3 { margin-bottom: 1rem; }
.mb4 { margin-bottom: 1.25rem; }
.mb5 { margin-bottom: 1.5rem; }
.mt1 { margin-top: 0.5rem; }
.mt2 { margin-top: 0.75rem; }
.mt3 { margin-top: 1rem; }
[hidden] { display: none !important; }

/* ─── Footer ─── */
footer {
  text-align: center;
  padding: 1.5rem 1rem;
  border-top: 1px solid var(--border);
  margin-top: 2rem;
}
footer p { font-size: 0.7rem; color: var(--muted); }

/* ═════════════════════════════════════════
   CURRENCY CONVERTER MODAL
   ═════════════════════════════════════════ */
.cur-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.6rem;
  margin-bottom: 1rem;
}
.cur-row {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.65rem 0.75rem;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  transition: border-color 0.15s;
}
.cur-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,77,74,0.1); }
.cur-flag { font-size: 1.4rem; }
.cur-info { flex-shrink: 0; min-width: 3rem; }
.cur-c { font-size: 0.85rem; font-weight: 700; color: var(--ink); }
.cur-l { font-size: 0.6rem; color: var(--muted); }
.cur-inp {
  flex: 1;
  border: none;
  background: transparent;
  text-align: left;
  font-size: 1.1rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  outline: none;
  font-family: inherit;
  padding: 0;
  width: 100%;
  min-width: 0;
}
.cur-quick {
  display: flex; flex-wrap: wrap; gap: 0.3rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--border);
  margin-top: 0.5rem;
}
.cur-quick-btn {
  padding: 0.35rem 0.6rem;
  background: var(--cream);
  border-radius: var(--r-sm);
  font-size: 0.7rem;
  color: var(--ink-soft);
  border: 1px solid transparent;
}
.cur-quick-btn:hover { background: var(--border); }
.cur-quick-btn.act { background: var(--accent); color: var(--paper); }
.cur-rate-info {
  background: var(--cream);
  border-radius: var(--r-sm);
  padding: 0.6rem 0.75rem;
  font-size: 0.7rem;
  color: var(--muted);
  text-align: center;
}

/* ═════════════════════════════════════════
   IMPROVED LIBRARY FILTERS
   ═════════════════════════════════════════ */
.flt-bar {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 0.65rem;
  margin-bottom: 1rem;
}
.flt-search { position: relative; margin-bottom: 0.6rem; }
.flt-search svg {
  position: absolute; right: 0.7rem; top: 50%;
  transform: translateY(-50%);
  color: var(--muted); width: 14px; height: 14px;
}
.flt-search input {
  width: 100%;
  padding: 0.5rem 2.2rem 0.5rem 2.5rem;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  outline: none;
}
.flt-search input:focus { border-color: var(--accent); }
.flt-search-x {
  position: absolute; left: 0.5rem; top: 50%;
  transform: translateY(-50%);
  width: 1.5rem; height: 1.5rem;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
  background: var(--cream);
}
.flt-search-x svg { width: 11px; height: 11px; position: static; transform: none; color: inherit; }

.flt-row {
  display: flex; align-items: center; gap: 0.4rem;
  flex-wrap: wrap;
}
.flt-row + .flt-row { margin-top: 0.4rem; padding-top: 0.4rem; border-top: 1px dashed var(--border); }
.flt-lbl {
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  flex-shrink: 0;
  min-width: 2.5rem;
}
.flt-chip {
  display: inline-flex; align-items: center; gap: 0.25rem;
  padding: 0.32rem 0.6rem;
  border-radius: 9999px;
  font-size: 0.72rem;
  font-weight: 500;
  background: var(--bg);
  color: var(--ink-soft);
  border: 1px solid var(--border);
  white-space: nowrap;
  transition: all 0.12s;
}
.flt-chip:hover { background: var(--cream); }
.flt-chip.act {
  background: var(--accent);
  color: var(--paper);
  border-color: var(--accent);
}
.flt-chip.act-orng { background: var(--persimmon); color: var(--paper); border-color: var(--persimmon); }
