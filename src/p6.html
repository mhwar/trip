<script>
// ═══════════════════════════════════════════════════════════
//   MODAL HELPERS
// ═══════════════════════════════════════════════════════════

function openModal(html) {
  $("modal-body").innerHTML = html;
  $("modal-bk").classList.add("show");
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  $("modal-bk").classList.remove("show");
  document.body.style.overflow = '';
}

// ═══════════════════════════════════════════════════════════
//   ITEM PICKER MODAL (library + new)
// ═══════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════
//   📋 CATEGORY-BASED ITEM PICKER (Logical Day Builder)
// ═══════════════════════════════════════════════════════════

// 7 logical categories for building a day
const ADD_CATEGORIES = [
  { id: "stay", icon: "🏨", label: "السكن", desc: "تسجيل دخول/خروج، فندق", color: "#1a4d4a", types: ["hotel"] },
  { id: "transport", icon: "✈️", label: "مواصلات", desc: "طيران، KTX، AREX، تنقل", color: "#f59e0b", types: ["transport"] },
  { id: "meal", icon: "🍽️", label: "وجبة", desc: "فطور، غداء، عشاء", color: "#16a34a", types: ["food"] },
  { id: "activity", icon: "📍", label: "نشاط/زيارة", desc: "معلم، مسجد، تسوق، ترفيه", color: "#0891b2", types: ["attraction", "mosque", "shop", "entertainment", "festival"] },
  { id: "tour", icon: "🎯", label: "جولة منظمة", desc: "DMZ، Gyeongju، جولات حجزها مسبق", color: "#7c3aed", types: ["tour"] },
  { id: "rest", icon: "☕", label: "راحة/استراحة", desc: "نوم، صلاة، تجوّل حر", color: "#d97706", types: ["rest"] },
  { id: "note", icon: "📝", label: "ملاحظة", desc: "تذكير، معلومة مهمة لليوم", color: "#64748b", types: ["note"] }
];

function openItemPicker(dayIdx) {
  state.pendingInsert = { dayIdx };
  state.pickerStep = "category"; // category → subtype → details
  state.pickerCategory = null;
  state.pickerType = "all";
  renderPicker();
}

function renderPicker() {
  const day = state.itinerary[state.pendingInsert.dayIdx];
  openModal(`
    <div class="modal-h">
      <h3>${state.pickerStep === 'category' ? 'ماذا تريد إضافة؟' : 'إضافة بند'} · يوم ${day.day}</h3>
      <button class="modal-x" onclick="closeModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="picker-body"></div>
  `);
  renderPickerBody();
}

function renderPickerBody() {
  const body = $("picker-body");
  if (!body) return;
  if (state.pickerStep === "category") {
    body.innerHTML = renderCategoryGrid();
  } else if (state.pickerStep === "details") {
    body.innerHTML = renderCategoryFlow();
  }
}

function renderCategoryGrid() {
  return `
    <p class="txs clm mb3">اختر نوع البند الذي تريد إضافته. كل نوع له حقول مخصصة وذكية.</p>
    <div class="cat-grid">
      ${ADD_CATEGORIES.map(c => `
        <button class="cat-card" onclick="selectCategory('${c.id}')" style="--cat-c:${c.color}">
          <div class="cat-ic">${c.icon}</div>
          <div class="cat-info">
            <div class="cat-l">${c.label}</div>
            <div class="cat-d">${c.desc}</div>
          </div>
          <svg class="cat-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      `).join('')}
    </div>
  `;
}

function selectCategory(catId) {
  state.pickerCategory = catId;
  state.pickerStep = "details";
  renderPicker();
}

function backToCategory() {
  state.pickerStep = "category";
  state.pickerCategory = null;
  renderPicker();
}

function renderCategoryFlow() {
  const cat = ADD_CATEGORIES.find(c => c.id === state.pickerCategory);
  const day = state.itinerary[state.pendingInsert.dayIdx];

  // Suggest next time
  const sorted = [...day.items].sort((a,b) => (a.time || "99:99").localeCompare(b.time || "99:99"));
  const lastTime = sorted.length ? sorted[sorted.length - 1].time : "09:00";
  const [h, m] = (lastTime || "09:00").split(":").map(Number);
  const nextH = Math.min(h + (cat.id === 'meal' ? 3 : 2), 22);
  const suggestedTime = `${String(nextH).padStart(2,'0')}:00`;

  let formHTML = '';

  if (cat.id === "stay") {
    formHTML = renderStayForm(suggestedTime);
  } else if (cat.id === "transport") {
    formHTML = renderTransportForm(suggestedTime);
  } else if (cat.id === "meal") {
    formHTML = renderMealForm(suggestedTime);
  } else if (cat.id === "activity") {
    formHTML = renderActivityForm(suggestedTime);
  } else if (cat.id === "tour") {
    formHTML = renderTourForm(suggestedTime);
  } else if (cat.id === "rest") {
    formHTML = renderRestForm(suggestedTime);
  } else if (cat.id === "note") {
    formHTML = renderNoteForm(suggestedTime);
  }

  return `
    <button class="back-btn" onclick="backToCategory()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      رجوع للفئات
    </button>
    <div class="cat-header" style="--cat-c:${cat.color}">
      <div class="cat-header-ic">${cat.icon}</div>
      <div>
        <div class="fb7 cli">${cat.label}</div>
        <div class="txx clm">${cat.desc}</div>
      </div>
    </div>
    ${formHTML}
  `;
}



// ─── 🏨 STAY (Hotel/Accommodation) ───
function renderStayForm(suggestedTime) {
  return `
    <div class="fld-row">
      <div class="fld">
        <label>نوع البند *</label>
        <select class="input" id="stay-action">
          <option value="checkin">🛬 تسجيل دخول (Check-in)</option>
          <option value="checkout">🛫 تسجيل خروج (Check-out)</option>
          <option value="stay">🛌 مبيت في الفندق</option>
        </select>
      </div>
      <div class="fld">
        <label>الوقت *</label>
        <input type="time" class="input" id="stay-time" value="${suggestedTime}">
      </div>
    </div>
    <div class="fld">
      <label>اسم الفندق *</label>
      <input type="text" class="input" id="stay-name" placeholder="مثال: Lotte Hotel Seoul">
    </div>
    <div class="fld">
      <label>المنطقة (اختياري)</label>
      <input type="text" class="input" id="stay-area" placeholder="مثال: ميونغ‌دونغ">
    </div>
    <div class="fld-row">
      <div class="fld">
        <label>رقم الحجز (اختياري)</label>
        <input type="text" class="input" id="stay-booking" placeholder="ABC123">
      </div>
      <div class="fld">
        <label>رقم الغرفة (اختياري)</label>
        <input type="text" class="input" id="stay-room" placeholder="1024">
      </div>
    </div>
    <div class="fld">
      <label>ملاحظات (اختياري)</label>
      <textarea class="input" id="stay-note" rows="2" placeholder="مثال: طلب Early Check-in، إطلالة بحرية..."></textarea>
    </div>
    <div class="modal-act">
      <button class="btn btn-sec" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-pri" onclick="saveStayItem()">إضافة للجدول</button>
    </div>
  `;
}

function saveStayItem() {
  const action = $("stay-action").value;
  const time = $("stay-time").value;
  const name = $("stay-name").value.trim();
  if (!name) { alert("اسم الفندق مطلوب"); return; }
  const area = $("stay-area").value.trim();
  const booking = $("stay-booking").value.trim();
  const room = $("stay-room").value.trim();
  const note = $("stay-note").value.trim();

  const actionLabels = { checkin: "🛬 Check-in", checkout: "🛫 Check-out", stay: "🛌 مبيت" };
  let text = `${actionLabels[action]} - ${name}`;
  const meta = [];
  if (booking) meta.push(`حجز: ${booking}`);
  if (room) meta.push(`غرفة: ${room}`);
  if (area) meta.push(area);

  const day = state.itinerary[state.pendingInsert.dayIdx];
  day.items.push({
    id: "i_" + Date.now(),
    time, text, type: "hotel",
    stayAction: action,
    stayName: name, stayArea: area, stayBooking: booking, stayRoom: room,
    note: note || (meta.length ? meta.join(" · ") : null)
  });
  saveItin();
  closeModal();
  renderItinerary();
}

// ─── ✈️ TRANSPORT (Flights, Trains, Transfers) ───
function renderTransportForm(suggestedTime) {
  return `
    <div class="fld-row">
      <div class="fld">
        <label>نوع المواصلات *</label>
        <select class="input" id="tr-mode" onchange="updateTransportFields()">
          <option value="flight">✈️ طيران</option>
          <option value="train">🚄 قطار / KTX</option>
          <option value="arex">🚆 AREX (مطار)</option>
          <option value="bus">🚌 باص</option>
          <option value="taxi">🚖 تاكسي / Kakao T</option>
          <option value="metro">🚇 مترو</option>
          <option value="rental">🚗 سيارة مستأجرة</option>
          <option value="ferry">⛴️ عبارة</option>
        </select>
      </div>
      <div class="fld">
        <label>الوقت *</label>

      <div class="fld">
        <label>من *</label>
        <input type="text" class="input" id="tr-from" placeholder="مثال: ICN">
      </div>
      <div class="fld">
        <label>إلى *</label>
        <input type="text" class="input" id="tr-to" placeholder="مثال: محطة سيول">
      </div>
    </div>
    <div class="fld-row">
      <div class="fld">
        <label>رقم الرحلة/القطار (اختياري)</label>
        <input type="text" class="input" id="tr-num" placeholder="EY822">
      </div>
      <div class="fld">
        <label>المدة المتوقعة (اختياري)</label>
        <input type="text" class="input" id="tr-dur" placeholder="2س 15د">
      </div>
    </div>
    <div class="fld-row">
      <div class="fld">
        <label>السعر التقديري (اختياري)</label>
        <input type="text" class="input" id="tr-price" placeholder="₩59,800">
      </div>
      <div class="fld">
        <label>المقعد/البوابة (اختياري)</label>
        <input type="text" class="input" id="tr-seat" placeholder="12A أو Gate 22">
      </div>
    </div>
    <div class="fld">
      <label>ملاحظات (اختياري)</label>
      <textarea class="input" id="tr-note" rows="2" placeholder="مثال: الوصول قبل ساعتين، تسجيل الدخول..."></textarea>
    </div>
    <div class="card card-cream mb3">
      <label class="flx itm g25" style="cursor:pointer">
        <input type="checkbox" id="tr-locked" style="width:1rem;height:1rem">
        <span class="txs cls">🔒 قفل هذا البند (للرحلات المحجوزة - يمنع الحذف بالخطأ)</span>
      </label>
    </div>
    <div class="modal-act">
      <button class="btn btn-sec" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-pri" onclick="saveTransportItem()">إضافة للجدول</button>
    </div>
  `;
}

function updateTransportFields() {
  // Future: customize fields per mode
}

function saveTransportItem() {
  const mode = $("tr-mode").value;
  const time = $("tr-time").value;
  const from = $("tr-from").value.trim();
  const to = $("tr-to").value.trim();
  if (!from || !to) { alert("نقطة الانطلاق والوصول مطلوبتان"); return; }
  const num = $("tr-num").value.trim();
  const dur = $("tr-dur").value.trim();
  const price = $("tr-price").value.trim();
  const seat = $("tr-seat").value.trim();
  const note = $("tr-note").value.trim();
  const locked = $("tr-locked").checked;

  const icons = { flight: "✈️", train: "🚄", arex: "🚆", bus: "🚌", taxi: "🚖", metro: "🚇", rental: "🚗", ferry: "⛴️" };
  let text = `${icons[mode]} ${from} → ${to}`;
  if (num) text += ` (${num})`;
  if (dur) text += ` · ${dur}`;

  const meta = [];
  if (seat) meta.push(seat);
  if (price) meta.push(price);
  const fullNote = [note, meta.join(" · ")].filter(Boolean).join(" — ");

  const day = state.itinerary[state.pendingInsert.dayIdx];
  day.items.push({
    id: "i_" + Date.now(),
    time, text, type: "transport",
    transportMode: mode,
    transportFrom: from, transportTo: to, transportNum: num,
    transportDuration: dur, transportPrice: price, transportSeat: seat,
    note: fullNote || null,
    locked
  });
  saveItin();
  closeModal();
  renderItinerary();
}

// ─── 🍽️ MEAL ───
function renderMealForm(suggestedTime) {
  const day = state.itinerary[state.pendingInsert.dayIdx];
  const cityFood = LIB.filter(l => l.type === "food" && l.city === day.city);

  return `
    <div class="fld-row">
      <div class="fld">
        <label>نوع الوجبة *</label>
        <select class="input" id="meal-type">
          <option value="breakfast">🌅 فطور</option>
          <option value="lunch" selected>☀️ غداء</option>
          <option value="dinner">🌃 عشاء</option>
          <option value="snack">🍡 وجبة خفيفة</option>
        </select>
      </div>
      <div class="fld">
        <label>الوقت *</label>
        <input type="time" class="input" id="meal-time" value="${suggestedTime}">
      </div>
    </div>
    <div class="fld">
      <label>المطعم</label>
      <select class="input" id="meal-from-lib" onchange="onMealLibSelect()">
        <option value="">— اكتب مطعم جديد أدناه —</option>
        ${cityFood.map(f => `<option value="${f.id}">${f.icon} ${f.name} ${f.halal ? '✅حلال' : ''} ${f.gf ? '✅GF' : ''}</option>`).join('')}
      </select>
    </div>
    <div class="fld">
      <label>أو اسم مطعم جديد</label>
      <input type="text" class="input" id="meal-name" placeholder="اسم المطعم">
    </div>
    <div class="card card-cream mb2">
      <strong class="txs cli mb1" style="display:block">خصائص</strong>
      <div class="flx g5 fwr">
        <label class="flx itm g25" style="cursor:pointer">
          <input type="checkbox" id="meal-halal" style="width:1rem;height:1rem">
          <span class="txs cls">🥩 حلال</span>
        </label>
        <label class="flx itm g25" style="cursor:pointer">
          <input type="checkbox" id="meal-gf" style="width:1rem;height:1rem">
          <span class="txs cls">🌾 خالٍ من الجلوتين</span>
        </label>
      </div>
    </div>
    <div class="fld-row">
      <div class="fld">
        <label>الميزانية لشخصين (اختياري)</label>
        <input type="text" class="input" id="meal-budget" placeholder="₩50,000">
      </div>
      <div class="fld">
        <label>رقم الحجز (اختياري)</label>
        <input type="text" class="input" id="meal-booking" placeholder="مثال: 123-456">
      </div>
    </div>
    <div class="fld">
      <label>ملاحظات (اختياري)</label>
      <textarea class="input" id="meal-note" rows="2" placeholder="مثال: طاولة بإطلالة، حساسية محددة..."></textarea>
    </div>
    <div class="modal-act">
      <button class="btn btn-sec" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-pri" onclick="saveMealItem()">إضافة للجدول</button>
    </div>
  `;
}

function onMealLibSelect() {
  const id = $("meal-from-lib").value;
  if (!id) return;
  const f = libById(id);
  if (!f) return;
  $("meal-name").value = f.name;
  if (f.halal) $("meal-halal").checked = true;
  if (f.gf) $("meal-gf").checked = true;
  if (f.price) $("meal-budget").value = f.price;
}

function saveMealItem() {
  const mealType = $("meal-type").value;
  const time = $("meal-time").value;
  const fromLib = $("meal-from-lib").value;
  const name = $("meal-name").value.trim();
  if (!name && !fromLib) { alert("اختر مطعم أو اكتب اسم"); return; }
  const halal = $("meal-halal").checked;
  const gf = $("meal-gf").checked;
  const budget = $("meal-budget").value.trim();
  const booking = $("meal-booking").value.trim();
  const note = $("meal-note").value.trim();

  const labels = { breakfast: "🌅 فطور", lunch: "☀️ غداء", dinner: "🌃 عشاء", snack: "🍡 خفيف" };
  let text = `${labels[mealType]} - ${name || libById(fromLib)?.name}`;

  const tags = [];
  if (halal) tags.push("حلال");
  if (gf) tags.push("GF");
  if (budget) tags.push(budget);
  if (booking) tags.push(`حجز: ${booking}`);
  const fullNote = [note, tags.join(" · ")].filter(Boolean).join(" — ");

  const day = state.itinerary[state.pendingInsert.dayIdx];
  const ref = fromLib ? libById(fromLib) : null;
  day.items.push({
    id: "i_" + Date.now(),
    time, text, type: "food",
    refId: fromLib || undefined,
    mealType, mealHalal: halal, mealGf: gf, mealBudget: budget, mealBooking: booking,
    note: fullNote || null,
    lat: ref?.lat, lng: ref?.lng
  });
  saveItin();
  closeModal();
  renderItinerary();
}

function renderActLibList() {
  const day = state.itinerary[state.pendingInsert.dayIdx];
  const q = ($("act-search")?.value || "").toLowerCase();
  const list = $("act-lib-list");
  if (!list) return;

  const types = ["attraction", "mosque", "shop", "entertainment", "festival"];
  const filtered = allLib().filter(l => {
    if (l.city !== day.city) return false;
    if (!types.includes(l.type)) return false;
    if (actFilter !== "all" && l.type !== actFilter) return false;
    if (q && !((l.name || '') + ' ' + (l.area || '')).toLowerCase().includes(q)) return false;
    return true;
  });

  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="empty-i">🔍</div><div class="empty-t">لا نتائج</div><p class="empty-d">جرّب "موقع جديد"</p></div>`;

function openTimePicker(refId) {
  const item = libById(refId);
  if (!item) return;
  const day = state.itinerary[state.pendingInsert.dayIdx];
  // Suggest next time slot
  const sorted = [...day.items].sort((a,b) => (a.time || "99:99").localeCompare(b.time || "99:99"));
  const lastTime = sorted.length ? sorted[sorted.length - 1].time : "09:00";
  const [h, m] = (lastTime || "09:00").split(":").map(Number);
  const nextH = Math.min(h + 2, 22);
  const suggested = `${String(nextH).padStart(2,'0')}:00`;

  openModal(`
    <div class="modal-h">
      <h3>وقت الزيارة</h3>

      <label>المدينة</label>
      <select class="input" id="dm-city">
        ${CITIES.map(c => `<option value="${c.id}" ${day.city === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
      </select>
    </div>

    <div class="fld">
      <label>📝 وصف اليوم (اختياري - يظهر تحت العنوان)</label>
      <textarea class="input" id="dm-narrative" rows="3" placeholder="مثال: يوم القصور التراثية - تنقل بالمشي بين المعالم القريبة، استئجار هانبوك للدخول مجاناً">${day.narrative || ''}</textarea>
    </div>

    <div class="fld">
      <label>نوع اليوم</label>
      <select class="input" id="dm-type" onchange="document.getElementById('flight-fields').hidden = this.value === 'normal'">
        <option value="normal" ${day.type === 'normal' ? 'selected' : ''}>عادي</option>
        <option value="arrival" ${day.type === 'arrival' ? 'selected' : ''}>🛬 وصول للبلد</option>
        <option value="transit" ${day.type === 'transit' ? 'selected' : ''}>✈️ تنقل بين المدن</option>
        <option value="departure" ${day.type === 'departure' ? 'selected' : ''}>🛫 مغادرة</option>
      </select>
    </div>

    <div id="flight-fields" ${day.type === 'normal' ? 'hidden' : ''}>
      <div class="card card-cream mb3">
        <strong class="txs cli mb2" style="display:block">معلومات الرحلة</strong>
        <div class="fld-row">
          <div class="fld">
            <label>من</label>
            <input type="text" class="input" id="dm-from" value="${day.flight?.from || ''}" placeholder="ICN, GMP...">
          </div>
          <div class="fld">
            <label>إلى</label>
            <input type="text" class="input" id="dm-to" value="${day.flight?.to || ''}" placeholder="CJU, PUS...">
          </div>
        </div>
        <div class="fld-row">
          <div class="fld">
            <label>وقت الانطلاق</label>
            <input type="time" class="input" id="dm-dep" value="${day.flight?.depTime || ''}">
          </div>
          <div class="fld">
            <label>وقت الوصول</label>
            <input type="time" class="input" id="dm-arr" value="${day.flight?.arrTime || ''}">
          </div>
        </div>
      </div>
    </div>

    <div class="modal-act">
      <button class="btn btn-sec" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-pri" onclick="saveDayMeta()">حفظ</button>
    </div>
  `);
}

function saveDayMeta() {
  const day = state.itinerary[state.activeDayIdx];
  day.title = $("dm-title").value.trim();
  day.city = $("dm-city").value;
  day.type = $("dm-type").value;
  day.narrative = $("dm-narrative").value.trim() || null;
  if (day.type !== "normal") {
    day.flight = {
      from: $("dm-from").value.trim(),
      to: $("dm-to").value.trim(),
      depTime: $("dm-dep").value,
      arrTime: $("dm-arr").value
    };
  } else {
    day.flight = null;
  }
  saveItin();
  closeModal();
  renderItinerary();
}

// ═══════════════════════════════════════════════════════════
//   EDIT ITEM
// ═══════════════════════════════════════════════════════════

function editItem(id) {
  const day = state.itinerary[state.activeDayIdx];
  const item = day.items.find(i => i.id === id);
  if (!item) return;

  openModal(`
    <div class="modal-h">
      <h3>تعديل النشاط</h3>
      <button class="modal-x" onclick="closeModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="fld">
      <label>الوصف</label>
      <input type="text" class="input" id="ei-text" value="${item.text}">
    </div>
    <div class="fld-row">
      <div class="fld">
        <label>الوقت</label>
        <input type="time" class="input" id="ei-time" value="${item.time || ''}">
      </div>
      <div class="fld">
        <label>التصنيف</label>
        <select class="input" id="ei-type">
          ${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${item.type === k ? 'selected' : ''}>${v.icon} ${v.label}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="modal-act">
      <button class="btn btn-sec" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-pri" onclick="saveEditItem('${id}')">حفظ</button>
    </div>
  `);
}

function saveEditItem(id) {
  const day = state.itinerary[state.activeDayIdx];
  const item = day.items.find(i => i.id === id);
  if (!item) return;
  item.text = $("ei-text").value.trim();
  item.time = $("ei-time").value;
  item.type = $("ei-type").value;
  saveItin();
  closeModal();
  renderDayContent();
}

// ═══════════════════════════════════════════════════════════
//   CITIES SECTION
// ═══════════════════════════════════════════════════════════

function renderCities() {
  $("sec-cities").innerHTML = `
    <div class="sec-t">
      <div class="sec-t-r">
        <div class="sec-t-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
        <h2>المدن الثلاث</h2>
      </div>
      <p>الأحياء + الفنادق المرشحة + المواصلات + النصائح</p>
    </div>

    <div class="fb mb3">
      ${CITIES.map(c => `
        <button class="fb-btn ${state.activeCity === c.id ? 'act' : ''}" onclick="state.activeCity='${c.id}';renderCities()">
          ${c.name}
        </button>
      `).join('')}
    </div>

    <div id="city-content"></div>
  `;
  renderCityContent();
}

function renderCityContent() {
  const c = cityById(state.activeCity);
  $("city-content").innerHTML = `
    <div class="city-banner">
      <h3>${c.name}</h3>
      <div class="cb-en">${c.nameEn} · ${c.nameKo}</div>
      <span class="pill pill-orng">${c.tag}</span>
      <p style="margin-top:0.75rem">${c.desc}</p>
    </div>

    <div class="tabs">
      <button class="tab ${state.cityTab === 'overview' ? 'act' : ''}" onclick="state.cityTab='overview';renderCityContent()">نبذة</button>
      <button class="tab ${state.cityTab === 'districts' ? 'act' : ''}" onclick="state.cityTab='districts';renderCityContent()">الأحياء + الفنادق</button>
      <button class="tab ${state.cityTab === 'transport' ? 'act' : ''}" onclick="state.cityTab='transport';renderCityContent()">المواصلات</button>
    </div>

    <div id="city-tab-body"></div>
  `;
  renderCityTabBody();
}

function renderCityTabBody() {
  const c = cityById(state.activeCity);
  const body = $("city-tab-body");

  if (state.cityTab === "overview") {
    body.innerHTML = `
      <div class="card mb3">
        <h4 class="fb7 cli mb2 txm">أبرز المعالم</h4>
        <div class="gr g3">
          ${c.highlights.map(h => `<div class="hl"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${h}</div>`).join('')}
        </div>
      </div>
      <div class="card card-cream">
        <h4 class="fb7 cli mb2 txm">📚 من المكتبة في هذه المدينة</h4>
        <div class="gr g3">
          ${["food","attraction","entertainment","shop","mosque"].map(t => {
            const count = LIB.filter(l => l.city === c.id && l.type === t).length;
            return count ? `<button class="card txs" onclick="state.libFilters.city='${c.id}';state.libFilters.type='${t}';switchTab('library')" style="cursor:pointer;text-align:right">
              <div style="font-size:1.3rem;margin-bottom:0.2rem">${TYPES[t].icon}</div>
              <div class="fb6 cli">${count} ${TYPES[t].label}</div>
            </button>` : '';
          }).join('')}
        </div>
      </div>
    `;
  } else if (state.cityTab === "districts") {
    body.innerHTML = c.districts.map(d => `
      <div class="dist-card">
        <div class="dist-h">
          <div class="dist-n">📍 ${d.name}</div>
          <div class="dist-tag">${d.nameEn} · ${d.tag}</div>
          <div class="dist-pros">
            ${d.pros.map(p => `<div class="dist-pro">${p}</div>`).join('')}
          </div>
          <div class="dist-best">${d.bestFor}</div>
        </div>
        <div class="dist-hotels">
          <div class="txs fb6 cls mb1" style="padding-top:0.5rem">🏨 أفضل الفنادق</div>
          ${d.hotels.map(h => `
            <div class="hotel-row">
              <div class="hotel-rk">${h.rank}</div>
              <div class="hotel-info">
                <div class="hotel-n">${h.name}</div>
                <div class="hotel-pr">${h.price} / ليلة</div>
                <div class="hotel-no">${h.note}</div>
                <div class="hotel-acts">
                  <a class="btn btn-sec btn-sm" href="https://www.google.com/maps/search/?api=1&query=${h.lat},${h.lng}" target="_blank">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>
                    خرائط
                  </a>
                  <a class="btn btn-sec btn-sm" href="https://www.google.com/search?q=${encodeURIComponent(h.name + ' ' + c.nameEn)}" target="_blank">
                    🔍 بحث
                  </a>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
  } else if (state.cityTab === "transport") {
    const t = c.transport;
    body.innerHTML = `
      <div class="card card-acc mb3">
        <div class="flx itm g5">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent)"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
          <strong class="cla">${t.arrive}</strong>
        </div>
      </div>

      <h4 class="fb7 cli mb2 mt3 txm">🛬 الوصول إلى المدينة</h4>
      <div class="gr mdg2 mb3">
        ${t.from_airport.map(o => `
          <div class="card">
            <div class="flx jb itm mb1">
              <strong class="cli txs">${o.mode}</strong>
              <span class="pill pill-gold">${o.price}</span>
            </div>
            <div class="txx clm mb1">⏱️ ${o.time}</div>
            <p class="txs cls">${o.note}</p>
          </div>
        `).join('')}
      </div>

      <h4 class="fb7 cli mb2 txm">🚇 التنقل داخل ${c.name}</h4>
      <div class="card mb3">
        ${t.inside.map((o, i) => `
          <div class="flx itm g75" style="padding:0.5rem 0;${i < t.inside.length - 1 ? 'border-bottom:1px solid var(--border)' : ''}">
            <div style="font-size:1.3rem">${o.mode.split(' ')[0]}</div>
            <div class="fls">
              <strong class="cli txs">${o.mode.replace(/^[\u{1F300}-\u{1F9FF}]\s*/u, '')}</strong>
              <p class="txs cls" style="margin-top:2px">${o.note}</p>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="card card-gold">
        <h4 class="fb7 mb2 txm" style="color:var(--gold)">💡 نصائح ذهبية</h4>
        <ul class="tip-list">
          ${t.tips.map(tip => `<li>${tip}</li>`).join('')}
        </ul>
      </div>
    `;
  }
}
</script>
