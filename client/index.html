<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جدول رحلتك · خطّار</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,1,0" rel="stylesheet">
  <style>
    :root {
      --ink:          #0A2540;
      --ink-soft:     #2C3E5C;
      --ink-muted:    #6B7C93;
      --sky:          #2E7CF6;
      --sky-deep:     #1957C2;
      --sky-soft:     #E7F0FE;
      --pearl:        #FAFAF7;
      --sand:         #F5EFE6;
      --sand-deep:    #ECE3D2;
      --line:         rgba(10,37,64,.08);
      --glass:        rgba(255,255,255,.65);
      --glass-strong: rgba(255,255,255,.88);
      --sh-xs:  0 1px 2px rgba(10,37,64,.04);
      --sh-sm:  0 4px 12px rgba(10,37,64,.06);
      --sh-md:  0 20px 50px rgba(10,37,64,.07);
      --sh-lg:  0 32px 80px rgba(10,37,64,.11);
      --sh-glow:0 12px 40px rgba(46,124,246,.28);
      --r-sm: 12px; --r-md: 20px; --r-lg: 28px; --r-xl: 40px;
      --ease: cubic-bezier(.2,.7,.2,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Readex Pro', 'Plus Jakarta Sans', sans-serif;
      background: var(--pearl);
      color: var(--ink);
      line-height: 1.7;
      min-height: 100vh;
      direction: rtl;
    }
    h1,h2,h3,h4,h5 { letter-spacing:-0.025em; font-weight:700; }

    /* ── HEADER ── */
    .site-header {
      position: sticky; top: 0; z-index: 100;
      background: var(--glass-strong);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--line);
      padding: 0.8rem 1.25rem;
      display: flex; align-items: center; gap: 0.75rem;
      transition: padding .3s var(--ease);
    }
    .site-header.compact { padding: 0.45rem 1.25rem; }
    .logo {
      display: flex; align-items: center; gap: 0.45rem;
      font-weight: 800; font-size: 1rem; color: var(--ink);
      text-decoration: none; flex-shrink: 0;
    }
    .logo-mark {
      width: 30px; height: 30px; background: var(--ink);
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; color: #fff; font-size: 0.85rem; font-weight: 800;
    }
    .hdr-trip-name {
      flex: 1; font-size: 0.85rem; font-weight: 600;
      color: var(--ink-soft); text-align: center;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hdr-share {
      display: flex; align-items: center; gap: 0.3rem;
      background: var(--sky-soft); color: var(--sky-deep);
      border: none; border-radius: 999px; padding: 0.4rem 0.8rem;
      font-size: 0.78rem; font-weight: 600; cursor: pointer;
      transition: all .2s var(--ease); font-family: inherit; flex-shrink: 0;
    }
    .hdr-share:hover { background: var(--sky); color: #fff; box-shadow: var(--sh-glow); }
    .hdr-share .ms { font-size: 15px; }

    /* ── LOADING / ERROR ── */
    .screen-center {
      min-height: 65vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem;
      padding: 2rem; text-align: center;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--sky-soft); border-top-color: var(--sky);
      border-radius: 50%; animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── MAIN LAYOUT ── */
    .page-wrap { max-width: 1100px; margin: 0 auto; padding: 0 1rem 5rem; }

    @media (min-width: 1024px) {
      .client-layout { display: grid; grid-template-columns: 1fr 320px; gap: 1.5rem; align-items: start; }
      .budget-sidebar { position: sticky; top: 80px; }
    }

    /* ── HERO ── */
    .trip-hero {
      background: linear-gradient(135deg, #0A2540 0%, #143456 55%, #1957C2 100%);
      border-radius: var(--r-xl); padding: 2rem 1.75rem 1.5rem;
      margin: 1.25rem 0; color: #fff; position: relative; overflow: hidden;
    }
    .trip-hero::before {
      content:''; position:absolute; top:-80px; inset-inline-start:-80px;
      width:260px; height:260px;
      background: radial-gradient(circle, rgba(46,124,246,.25) 0%, transparent 70%);
      pointer-events:none;
    }
    .hero-flag { font-size: 2.8rem; line-height: 1; margin-bottom: 0.5rem; }
    .hero-title { font-size: clamp(1.5rem, 4.5vw, 2.2rem); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.6rem; }
    .hero-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.25rem; }
    .hero-chip {
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px; padding: 0.22rem 0.65rem; font-size: 0.75rem; font-weight: 500;
      display: flex; align-items: center; gap: 0.25rem;
    }
    .hero-chip .ms { font-size: 13px; }
    .chip-status { font-weight: 700; }
    .chip-active { background: rgba(34,197,94,.2); border-color: rgba(34,197,94,.4); }
    .chip-done   { background: rgba(255,255,255,.08); }
    .flights-strip { border-top: 1px solid rgba(255,255,255,.1); padding-top: 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    @media (max-width: 520px) { .flights-strip { grid-template-columns: 1fr; } }
    .fl-row { background: rgba(255,255,255,.08); border-radius: var(--r-sm); padding: 0.55rem 0.7rem; }
    .fl-label { font-size: 0.62rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; opacity: .6; margin-bottom: 0.15rem; display: flex; align-items: center; gap: 0.2rem; }
    .fl-detail { font-size: 0.78rem; font-weight: 500; opacity: .9; }

    /* ── DAY TABS ── */
    .day-tabs-wrap {
      position: sticky; top: 61px; z-index: 90;
      background: var(--glass-strong);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border-bottom: 1px solid var(--line);
      margin: 0 -1rem; padding: 0 1rem;
    }
    .day-tabs { display: flex; gap: 0.3rem; overflow-x: auto; padding: 0.55rem 0; scrollbar-width: none; }
    .day-tabs::-webkit-scrollbar { display: none; }
    .day-tab {
      flex: 0 0 auto; background: none; border: 1.5px solid var(--line);
      border-radius: 999px; padding: 0.3rem 0.8rem; font-size: 0.72rem;
      font-weight: 600; color: var(--ink-muted); cursor: pointer;
      white-space: nowrap; transition: all .2s var(--ease); font-family: inherit;
    }
    .day-tab:hover { border-color: var(--sky); color: var(--sky); }
    .day-tab.active { background: var(--sky); border-color: var(--sky); color: #fff; box-shadow: 0 4px 12px rgba(46,124,246,.3); }

    /* ── DAY CARD ── */
    .day-section { margin: 1.25rem 0; scroll-margin-top: 115px; }
    .day-card { background: #fff; border-radius: var(--r-lg); box-shadow: var(--sh-sm); overflow: hidden; }
    .day-hdr {
      background: linear-gradient(135deg, #0A2540 0%, #2C3E5C 100%);
      padding: 1.1rem 1.25rem 0.9rem; color: #fff;
      display: flex; align-items: flex-start; gap: 0.85rem;
    }
    .day-badge {
      width: 44px; height: 44px; background: var(--sky); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 800; flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(46,124,246,.4);
    }
    .day-info { flex: 1; min-width: 0; }
    .day-wkday { font-size: 0.68rem; font-weight: 600; opacity: .6; text-transform: uppercase; letter-spacing: .05em; }
    .day-name { font-size: 1.05rem; font-weight: 700; margin: 0.1rem 0; line-height: 1.3; }
    .day-city-row { font-size: 0.75rem; opacity: .72; display: flex; align-items: center; gap: 0.25rem; }
    .day-city-row .ms { font-size: 13px; }
    .hotel-banner {
      background: rgba(255,255,255,.09); border-radius: var(--r-sm);
      margin: 0.6rem 1.25rem 0.9rem;
      padding: 0.45rem 0.7rem; font-size: 0.73rem; font-weight: 500;
      color: #fff; display: flex; align-items: center; gap: 0.4rem;
      width: fit-content;
    }
    .hotel-banner .ms { font-size: 14px; opacity: .75; }
    .day-narrative {
      background: var(--sky-soft); margin: 0 1.25rem 0.75rem;
      border-radius: var(--r-sm); padding: 0.55rem 0.75rem;
      font-size: 0.76rem; color: var(--sky-deep); line-height: 1.6;
      display: flex; gap: 0.35rem;
    }
    .day-narrative .ms { font-size: 14px; flex-shrink: 0; margin-top: 2px; }

    /* ── TIMELINE ── */
    .timeline { padding: 0.5rem 0 0.75rem; }
    .tl-item {
      display: flex; gap: 0; padding: 0 1.25rem;
      opacity: 0; transform: translateY(10px);
      transition: opacity .4s var(--ease), transform .4s var(--ease);
    }
    .tl-item.vis { opacity: 1; transform: none; }
    .tl-time {
      font-size: 0.68rem; font-weight: 700; color: var(--sky);
      width: 42px; flex-shrink: 0; padding-top: 0.8rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .tl-pin {
      width: 24px; flex-shrink: 0; display: flex;
      flex-direction: column; align-items: center; padding-top: 0.75rem;
    }
    .tl-dot {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--sky-soft); border: 2px solid var(--sky);
      display: flex; align-items: center; justify-content: center; z-index: 1;
    }
    .tl-dot .ms { font-size: 11px; color: var(--sky); }
    .tl-item.done-item .tl-dot { background: var(--sky); }
    .tl-item.done-item .tl-dot .ms { color: #fff; }
    .tl-vline { width: 2px; background: var(--line); flex: 1; min-height: 16px; }
    .tl-body { flex: 1; padding: 0.55rem 0 0.55rem 0.65rem; }
    .tl-text { font-size: 0.85rem; font-weight: 500; color: var(--ink); line-height: 1.5; }
    .tl-item.done-item .tl-text { color: var(--ink-muted); text-decoration: line-through; }
    .tl-tags { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.3rem; }
    .tag {
      font-size: 0.65rem; font-weight: 600; padding: 0.12rem 0.5rem;
      border-radius: 999px; display: flex; align-items: center; gap: 0.2rem; cursor: pointer;
    }
    .tag .ms { font-size: 10px; }
    .tag-booked  { background: rgba(34,197,94,.1); color: #15803d; }
    .tag-note    { background: var(--sand); color: var(--ink-soft); }
    .tag-nearby  { background: var(--sky-soft); color: var(--sky-deep); }
    .tag-map     { background: rgba(10,37,64,.06); color: var(--ink-soft); text-decoration: none; }
    .tl-note-body {
      background: var(--sand); border-radius: var(--r-sm); padding: 0.45rem 0.65rem;
      font-size: 0.75rem; color: var(--ink-soft); margin-top: 0.3rem;
      line-height: 1.55; display: none;
    }
    .tl-note-body.open { display: block; }
    .tl-nearby-panel { margin-top: 0.45rem; display: none; }
    .tl-nearby-panel.open { display: block; }
    .nearby-head { font-size: 0.7rem; font-weight: 700; color: var(--sky-deep); margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.2rem; }
    .nearby-head .ms { font-size: 12px; }
    .nc-card {
      display: flex; align-items: center; gap: 0.55rem;
      background: #fff; border: 1px solid var(--line);
      border-radius: var(--r-sm); padding: 0.45rem 0.65rem; margin-bottom: 0.3rem;
    }
    .nc-icon { font-size: 1rem; }
    .nc-name { font-size: 0.76rem; font-weight: 600; color: var(--ink); }
    .nc-meta { font-size: 0.65rem; color: var(--ink-muted); }

    /* ── BUDGET PANEL ── */
    .budget-section { margin-top: 1.5rem; }
    .sec-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
    .sec-head h2 { font-size: 1.1rem; font-weight: 800; }
    .sec-head .ms { font-size: 20px; color: var(--sky); }
    .bcard { background: #fff; border-radius: var(--r-lg); box-shadow: var(--sh-sm); padding: 1.25rem; margin-bottom: 1rem; }
    .donut-wrap { position: relative; width: 160px; height: 160px; margin: 0 auto 1rem; }
    .donut-svg { transform: rotate(-90deg); width: 100%; height: 100%; display: block; }
    .donut-center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; pointer-events: none;
    }
    .donut-lbl { font-size: 0.6rem; font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .05em; }
    .donut-val { font-size: 1.2rem; font-weight: 800; color: var(--ink); font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.2; }
    .donut-unit { font-size: 0.65rem; color: var(--ink-muted); }
    .bstatus {
      display: inline-flex; align-items: center; gap: 0.3rem;
      border-radius: 999px; padding: 0.25rem 0.65rem;
      font-size: 0.72rem; font-weight: 700; margin: 0 auto 0.75rem; display: flex; justify-content: center; width: fit-content; margin: 0 auto 0.6rem;
    }
    .bstatus .ms { font-size: 13px; }
    .bstatus.ok   { background: rgba(34,197,94,.1); color: #15803d; }
    .bstatus.over { background: rgba(239,68,68,.1); color: #dc2626; }
    .bsum-row { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--ink-muted); margin-top: 0.2rem; }
    .bsum-row strong { color: var(--ink); font-family: 'Plus Jakarta Sans', sans-serif; }
    .bcat-list { background: #fff; border-radius: var(--r-lg); box-shadow: var(--sh-sm); overflow: hidden; }
    .bcat-row-item { padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); }
    .bcat-row-item:last-child { border-bottom: none; }
    .bcat-top { display: flex; align-items: center; gap: 0.6rem; }
    .bcat-ico { width: 32px; height: 32px; border-radius: 8px; background: var(--sky-soft); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; flex-shrink: 0; }
    .bcat-meta-wrap { flex: 1; }
    .bcat-name { font-size: 0.78rem; font-weight: 600; color: var(--ink); }
    .bcat-vals { font-size: 0.68rem; color: var(--ink-muted); margin-top: 0.05rem; font-family: 'Plus Jakarta Sans', sans-serif; }
    .bcat-vals .act { color: var(--sky-deep); font-weight: 700; }
    .bcat-vals .act-over { color: #dc2626; font-weight: 700; }
    .bbar-wrap { height: 3px; background: var(--sand-deep); border-radius: 999px; margin-top: 0.4rem; overflow: hidden; }
    .bbar { height: 100%; border-radius: 999px; background: var(--sky); width: 0; transition: width 1s var(--ease); }
    .bbar.over { background: #ef4444; }

    /* ── POST-TRIP REPORT ── */
    .report-hero {
      background: linear-gradient(135deg, #0A2540 0%, #1957C2 100%);
      border-radius: var(--r-xl); padding: 2rem 1.75rem; color: #fff;
      text-align: center; margin: 2rem 0 1.25rem;
    }
    .report-emoji { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .report-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.35rem; }
    .report-sub { font-size: 0.82rem; opacity: .75; }
    .report-stats { display: flex; justify-content: center; gap: 2.5rem; margin-top: 1.25rem; flex-wrap: wrap; }
    .rstat-val { font-size: 1.8rem; font-weight: 800; font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1; }
    .rstat-lbl { font-size: 0.7rem; opacity: .7; margin-top: 0.15rem; }
    .fin-card { background: var(--sand); border-radius: var(--r-lg); padding: 1.25rem; margin-bottom: 1rem; }
    .fin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.75rem; }
    .fin-col { background: #fff; border-radius: var(--r-md); padding: 0.85rem; text-align: center; }
    .fin-lbl { font-size: 0.65rem; color: var(--ink-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .fin-val { font-size: 1.25rem; font-weight: 800; color: var(--ink); font-family: 'Plus Jakarta Sans', sans-serif; margin-top: 0.2rem; }
    .fin-unit { font-size: 0.65rem; color: var(--ink-muted); }
    .savings { text-align: center; padding: 0.55rem; border-radius: var(--r-sm); font-weight: 700; font-size: 0.82rem; }
    .savings.good { background: rgba(34,197,94,.1); color: #15803d; }
    .savings.bad  { background: rgba(239,68,68,.1); color: #dc2626; }
    .hlights-scroll { display: flex; gap: 0.6rem; overflow-x: auto; padding-bottom: 0.5rem; margin-top: 0.75rem; scrollbar-width: none; }
    .hlights-scroll::-webkit-scrollbar { display: none; }
    .hl-card { flex: 0 0 140px; background: #fff; border-radius: var(--r-md); padding: 0.85rem; box-shadow: var(--sh-sm); text-align: center; }
    .hl-card .hl-ico { font-size: 1.6rem; margin-bottom: 0.3rem; }
    .hl-card .hl-txt { font-size: 0.72rem; font-weight: 600; color: var(--ink); line-height: 1.4; }

    /* ── FAB ── */
    .fab {
      position: fixed; bottom: 1.5rem; inset-inline-start: 1.5rem; z-index: 80;
      background: var(--sky); color: #fff; border: none;
      border-radius: 999px; padding: 0.7rem 1.15rem;
      font-size: 0.82rem; font-weight: 700; cursor: pointer;
      box-shadow: var(--sh-glow); display: none;
      align-items: center; gap: 0.35rem; font-family: inherit;
      transition: transform .2s var(--ease), box-shadow .2s var(--ease);
    }
    .fab:hover { transform: translateY(-2px); box-shadow: 0 20px 50px rgba(46,124,246,.4); }
    .fab.show { display: flex; }
    .fab .ms { font-size: 17px; }

    /* ── MODAL ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(10,37,64,.45);
      backdrop-filter: blur(4px); z-index: 200;
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    .sheet {
      background: #fff; border-radius: var(--r-xl) var(--r-xl) 0 0;
      padding: 1.25rem 1.25rem 2rem; width: 100%; max-width: 500px;
      transform: translateY(100%); transition: transform .35s var(--ease);
    }
    .overlay.open .sheet { transform: none; }
    .sheet-handle { width: 36px; height: 4px; background: var(--sand-deep); border-radius: 999px; margin: 0 auto 1rem; }
    .sheet-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 1rem; }
    .form-group { margin-bottom: 0.85rem; }
    .form-label { font-size: 0.75rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 0.3rem; display: block; }
    .form-ctrl {
      width: 100%; border: 1.5px solid var(--line); border-radius: var(--r-sm);
      padding: 0.6rem 0.8rem; font-size: 0.85rem; font-family: inherit;
      color: var(--ink); background: var(--pearl); outline: none;
      transition: border-color .2s;
    }
    .form-ctrl:focus { border-color: var(--sky); }
    select.form-ctrl { appearance: none; -webkit-appearance: none; }
    .btn-pri {
      width: 100%; background: var(--sky); color: #fff; border: none;
      border-radius: var(--r-md); padding: 0.8rem; font-size: 0.9rem;
      font-weight: 700; cursor: pointer; font-family: inherit;
      transition: all .2s var(--ease); margin-top: 0.35rem;
    }
    .btn-pri:hover { background: var(--sky-deep); box-shadow: var(--sh-glow); }
    .btn-sec {
      width: 100%; background: var(--pearl); color: var(--ink);
      border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 0.7rem;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all .2s var(--ease);
      display: flex; align-items: center; justify-content: center; gap: 0.45rem;
      margin-top: 0.5rem;
    }
    .btn-sec:hover { border-color: var(--sky); color: var(--sky); }
    .url-box {
      background: var(--pearl); border: 1.5px solid var(--line); border-radius: var(--r-sm);
      padding: 0.7rem 0.8rem; font-size: 0.75rem; direction: ltr;
      word-break: break-all; cursor: pointer; margin-bottom: 0.75rem;
      transition: background .2s, border-color .2s;
      font-family: 'Plus Jakarta Sans', monospace;
    }
    .url-box:hover { background: var(--sky-soft); border-color: var(--sky); }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 5rem; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--ink); color: #fff; border-radius: 999px;
      padding: 0.45rem 1.1rem; font-size: 0.8rem; font-weight: 600;
      opacity: 0; transition: all .3s var(--ease); pointer-events: none; z-index: 300;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── FOOTER ── */
    .site-footer { background: var(--ink); color: rgba(255,255,255,.6); text-align: center; padding: 2.5rem 1rem; font-size: 0.78rem; margin-top: 3rem; }
    .footer-brand { font-size: 1.1rem; font-weight: 800; color: #fff; margin-bottom: 0.35rem; }
    .site-footer a { color: var(--sky); text-decoration: none; }

    /* ── REVEAL ── */
    [data-r] { opacity: 0; transform: translateY(14px); transition: opacity .5s var(--ease), transform .5s var(--ease); }
    [data-r].rv { opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
    }
  </style>
</head>

<!-- Expense Modal -->

<script>
// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let _data = null;   // { itinerary, budget, tripInfo, … }
let _code = null;
let _cExp = [];     // client-entered expenses

const ICONS = {
  flight:'flight', hotel:'hotel', food:'restaurant', transport:'directions_car',
  attraction:'star', shop:'shopping_bag', activity:'local_activity', prayer:'mosque',
  rest:'self_improvement', tour:'tour', departure:'flight_takeoff', arrival:'flight_land',
  ktx:'train', bus:'directions_bus', metro:'subway', walk:'directions_walk',
  check_in:'hotel', check_out:'logout', default:'location_on'
};

const BCOLORS = [
  '#2E7CF6','#1957C2','#0EA5E9','#7C3AED',
  '#EC4899','#F59E0B','#10B981','#EF4444','#6366F1','#14B8A6','#F97316'
];

// ─────────────────────────────────────────────
//  BOOT
// ─────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const p = new URLSearchParams(location.search);
  _code = p.get('code');
  if (!_code) { showErr('لم يتم تحديد رمز الرحلة. تأكد من الرابط.'); return; }

  try { _cExp = JSON.parse(localStorage.getItem('kt2_cexp_' + _code) || '[]'); } catch { _cExp = []; }

  await loadData();
});

window.addEventListener('scroll', () => {
  document.getElementById('hdr').classList.toggle('compact', scrollY > 36);
}, { passive: true });

// ─────────────────────────────────────────────
//  LOAD
// ─────────────────────────────────────────────
async function loadData() {
  try {
    const r = await fetch('/.netlify/functions/load?code=' + encodeURIComponent(_code));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (!j.data) throw new Error('empty');
    _data = j.data;
    render();
  } catch (e) {
    showErr('تعذّر تحميل بيانات الرحلة. تحقق من الرابط أو تواصل مع المنظّم.');
  }
}

function showErr(msg) {
  document.getElementById('scr-loading').style.display = 'none';
  document.getElementById('scr-error').style.display = 'flex';
  if (msg) document.getElementById('err-msg').textContent = msg;
}

// ─────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────
function render() {
  document.getElementById('scr-loading').style.display = 'none';
  document.getElementById('trip-wrap').style.display = 'block';

  const ti   = _data.tripInfo   || {};
  const itin = _data.itinerary  || [];
  const bud  = _data.budget     || [];

  // Header name
  const hn = document.getElementById('hdr-trip-name');
  if (hn) hn.textContent = ti.destination || 'جدول الرحلة';

  // Share URL placeholder
  document.getElementById('share-url').textContent = location.href;

  // Hero
  document.getElementById('hero-slot').innerHTML = buildHero(ti, itin);

  // Tabs
  buildTabs(itin);

  // Day cards
  document.getElementById('days-col').innerHTML = itin.map((d,i) => buildDay(d,i)).join('');

  // Budget sidebar
  document.getElementById('budget-sidebar').innerHTML = buildBudget(bud);

  // FAB — always show once data loaded
  document.getElementById('fab').classList.add('show');

  // Post-trip report
  const ed = ti.endDate ? new Date(ti.endDate + 'T00:00:00') : null;
  const now = new Date(); now.setHours(0,0,0,0);
  if (ed && ed < now) {
    document.getElementById('report-slot').innerHTML = buildReport(ti, itin, bud);
  }

  initReveal();
  initBars();
  initTabsObs(itin);
}

// ─────────────────────────────────────────────
//  HERO
// ─────────────────────────────────────────────
function buildHero(ti, itin) {
  const dest = ti.destination || 'رحلتك';
  const flag = destFlag(dest);
  const dur  = (ti.startDate && ti.endDate) ? daysBetween(ti.startDate, ti.endDate) : itin.length;

  const now = new Date(); now.setHours(0,0,0,0);
  const sd  = ti.startDate ? new Date(ti.startDate + 'T00:00:00') : null;
  const ed  = ti.endDate   ? new Date(ti.endDate   + 'T00:00:00') : null;
  let stxt = 'قادمة ✦', scls = '';
  if (sd && ed) {
    if (now >= sd && now <= ed) { stxt = 'جارية الآن 🟢'; scls = 'chip-active'; }
    else if (now > ed)          { stxt = 'مكتملة ✓';     scls = 'chip-done';   }
  }

  const out = (ti.outboundFlights || []).filter(f => f.airline || f.from);
  const ret = (ti.returnFlights   || []).filter(f => f.airline || f.from);
  const flHtml = (out.length || ret.length) ? `
    <div class="flights-strip">
      <div class="fl-row">
        <div class="fl-label"><span class="material-symbols-rounded ms" style="font-size:11px">flight_takeoff</span> الذهاب</div>
        ${out.slice(0,1).map(f=>`<div class="fl-detail">${f.airline||''}${f.depTime?' · '+f.depTime:''}</div>`).join('')}
        ${out.length>1?`<div style="font-size:.62rem;opacity:.6">+${out.length-1} رحلة</div>`:''}
      </div>
      <div class="fl-row">
        <div class="fl-label"><span class="material-symbols-rounded ms" style="font-size:11px">flight_land</span> العودة</div>
        ${ret.slice(0,1).map(f=>`<div class="fl-detail">${f.airline||''}${f.depTime?' · '+f.depTime:''}</div>`).join('')}
        ${ret.length>1?`<div style="font-size:.62rem;opacity:.6">+${ret.length-1} رحلة</div>`:''}
      </div>
    </div>
  ` : '';

  return `
    <div class="trip-hero" data-r>
      <div class="hero-flag">${flag}</div>
      <div class="hero-title">${dest}</div>
      <div class="hero-chips">
        ${ti.startDate?`<span class="hero-chip"><span class="material-symbols-rounded ms">calendar_today</span>${fmtDate(ti.startDate)}${ti.endDate?' — '+fmtDate(ti.endDate):''}</span>`:''}
        ${dur?`<span class="hero-chip"><span class="material-symbols-rounded ms">schedule</span>${dur} يوم</span>`:''}
        ${ti.travelers?`<span class="hero-chip"><span class="material-symbols-rounded ms">group</span>${ti.travelers} مسافر</span>`:''}
        ${ti.ticketRef?`<span class="hero-chip"><span class="material-symbols-rounded ms">confirmation_number</span>${ti.ticketRef}</span>`:''}
        <span class="hero-chip chip-status ${scls}">${stxt}</span>
      </div>
      ${flHtml}
    </div>`;
}

// ─────────────────────────────────────────────
//  TABS
// ─────────────────────────────────────────────
function buildTabs(itin) {
  document.getElementById('day-tabs').innerHTML = itin.map((d,i)=>`
    <button class="day-tab${i===0?' active':''}" data-i="${i}" onclick="goDay(${i})">
      ${d.day?'يوم '+d.day:'يوم '+(i+1)} · ${(d.city||d.title||'').replace(/[\u{1F000}-\u{1FFFF}]|[\u{2600}-\u{27BF}]/gu,'').trim().split(/\s/)[0]}
    </button>`).join('');
}

function goDay(i) {
  const el = document.getElementById('ds-' + i);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  document.querySelectorAll('.day-tab').forEach((t,j) => t.classList.toggle('active', j===i));
  const tab = document.querySelector(`.day-tab[data-i="${i}"]`);
  if (tab) tab.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
}

function initTabsObs(itin) {
  if (!('IntersectionObserver' in window)) return;
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const i = +e.target.dataset.di;
        document.querySelectorAll('.day-tab').forEach((t,j) => t.classList.toggle('active', j===i));
        const tab = document.querySelector(`.day-tab[data-i="${i}"]`);
        if (tab) tab.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
      }
    });
  }, { threshold:.25, rootMargin:'-100px 0px -45% 0px' });
  itin.forEach((_,i) => {
    const el = document.getElementById('ds-'+i);
    if (el) { el.dataset.di = i; obs.observe(el); }
  });
}

// ─────────────────────────────────────────────
//  DAY CARD
// ─────────────────────────────────────────────
function buildDay(d, i) {
  const num   = d.day || (i+1);
  const hotel = d.hotel || {};
  const items = d.items || [];

  const hotelBanner = hotel.name ? `
    <div class="hotel-banner">
      <span class="material-symbols-rounded ms">hotel</span>
      ${hotel.name}${hotel.area?' · '+hotel.area:''}${hotel.checkIn?' · دخول '+hotel.checkIn:''}
    </div>` : '';

  const narr = (d.narrative||'').replace(/💡\s*/g,'').trim();
  const narrHtml = narr ? `
    <div class="day-narrative">
      <span class="material-symbols-rounded ms">lightbulb</span>
      <span>${narr.substring(0,220)}${narr.length>220?'…':''}</span>
    </div>` : '';

  return `
    <div class="day-section" id="ds-${i}">
      <div class="day-card" data-r style="--rd:${Math.min(i*50,300)}ms">
        <div class="day-hdr">
          <div class="day-badge">${num}</div>
          <div class="day-info">
            <div class="day-wkday">${d.weekday||''}${d.dateLabel?' · '+d.dateLabel:d.date?' · '+d.date:''}</div>
            <div class="day-name">${noEmoji(d.title||d.city||'')}</div>
            ${d.city?`<div class="day-city-row"><span class="material-symbols-rounded ms">location_on</span>${d.city}</div>`:''}
          </div>
        </div>
        ${hotelBanner}
        ${narrHtml}
        <div class="timeline">
          ${items.map((it,j) => buildItem(it, j, items.length)).join('')}
        </div>
      </div>
    </div>`;
}

function buildItem(it, j, total) {
  const icon  = ICONS[it.type] || ICONS.default;
  const last  = j === total - 1;
  const done  = !!it.done;

  const tags = [
    it.bookingLink ? `<span class="tag tag-booked"><span class="material-symbols-rounded ms">check_circle</span>محجوز</span>` : '',
    it.notes       ? `<span class="tag tag-note" onclick="tNote(this)"><span class="material-symbols-rounded ms">sticky_note_2</span>ملاحظة</span>` : '',
    it.nearby?.length ? `<span class="tag tag-nearby" onclick="tNear(this)"><span class="material-symbols-rounded ms">explore</span>في المنطقة (${it.nearby.length})</span>` : '',
    (it.lat && it.lng) ? `<a class="tag tag-map" href="https://maps.google.com/?q=${it.lat},${it.lng}" target="_blank"><span class="material-symbols-rounded ms">map</span>خريطة</a>` : ''
  ].filter(Boolean).join('');

  const nearCards = (it.nearby||[]).map(n=>`
    <div class="nc-card">
      <div class="nc-icon">${n.icon||'📍'}</div>
      <div>
        <div class="nc-name">${n.name||''}</div>
        <div class="nc-meta">${n.dist||''}${n.note?' · '+n.note:''}</div>
      </div>
    </div>`).join('');

  return `
    <div class="tl-item${done?' done-item':''}" style="--d:${j*45}ms">
      <div class="tl-time">${it.time||''}</div>
      <div class="tl-pin">
        <div class="tl-dot"><span class="material-symbols-rounded ms">${done?'check':icon}</span></div>
        ${!last?'<div class="tl-vline"></div>':''}
      </div>
      <div class="tl-body">
        <div class="tl-text">${noEmoji(it.text||'')}</div>
        ${tags?`<div class="tl-tags">${tags}</div>`:''}
        ${it.notes?`<div class="tl-note-body">${it.notes}</div>`:''}
        ${it.nearby?.length?`
          <div class="tl-nearby-panel">
            <div class="nearby-head"><span class="material-symbols-rounded ms">explore</span>اقتراحات في المنطقة</div>
            <div>${nearCards}</div>
          </div>`:''}
      </div>
    </div>`;
}

// ─────────────────────────────────────────────
//  BUDGET
// ─────────────────────────────────────────────
function buildBudget(bud) {
  if (!bud || !bud.length) return '';

  const cats = bud.map((b,i) => {
    const ce  = _cExp.filter(e => e.catId===b.id).reduce((s,e)=>s+e.amount,0);
    const act = (b.actual||0) + ce;
    return { ...b, act, color: BCOLORS[i % BCOLORS.length] };
  });

  const totEst = cats.reduce((s,c)=>s+(c.estimated||0),0);
  const totAct = cats.reduce((s,c)=>s+c.act,0);
  const over   = totAct > totEst;

  // Donut
  const R = 62, CX = 80, CY = 80, circ = 2*Math.PI*R;
  let off = 0;
  const segs = cats.map(c => {
    const frac = totEst>0 ? (c.estimated||0)/totEst : 0;
    const len  = frac * circ;
    const s    = { da:`${len.toFixed(2)} ${(circ-len).toFixed(2)}`, off:off.toFixed(2), color:c.color };
    off += len;
    return s;
  });

  const donutSvg = `
    <svg class="donut-svg" viewBox="0 0 160 160">
      <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="var(--sand-deep)" stroke-width="14"/>
      ${segs.map(s=>`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${s.color}" stroke-width="14"
        stroke-dasharray="${s.da}" stroke-dashoffset="-${s.off}"/>`).join('')}
    </svg>`;

  const catRows = cats.map(c => {
    const pBar  = c.estimated>0 ? Math.min(c.act/c.estimated*100,100) : 0;
    const isOvr = c.act > c.estimated;
    return `
      <div class="bcat-row-item">
        <div class="bcat-top">
          <div class="bcat-ico">${c.icon||'💰'}</div>
          <div class="bcat-meta-wrap">
            <div class="bcat-name">${c.category}</div>
            <div class="bcat-vals">
              <span class="${isOvr?'act-over':'act'}">${c.act.toLocaleString('ar-SA')}</span>
              <span style="color:var(--ink-muted)"> / ${(c.estimated||0).toLocaleString('ar-SA')} ر.س</span>
            </div>
          </div>
        </div>
        <div class="bbar-wrap"><div class="bbar${isOvr?' over':''}" style="width:0" data-w="${pBar.toFixed(1)}"></div></div>
      </div>`;
  }).join('');

  return `
    <div class="budget-section">
      <div class="sec-head">
        <span class="material-symbols-rounded ms">account_balance_wallet</span>
        <h2>ميزانية الرحلة</h2>
      </div>

      <div class="bcard" data-r>
        <div class="donut-wrap">
          ${donutSvg}
          <div class="donut-center">
            <div class="donut-lbl">المتوقع</div>
            <div class="donut-val">${totEst.toLocaleString('ar-SA')}</div>
            <div class="donut-unit">ر.س</div>
          </div>
        </div>
        <div class="bstatus ${over?'over':'ok'}">
          <span class="material-symbols-rounded ms">${over?'trending_up':'check_circle'}</span>
          ${over?'تجاوزت الميزانية':'ضمن الميزانية'}
        </div>
        <div class="bsum-row">
          <span>المتوقع</span>
          <strong>${totEst.toLocaleString('ar-SA')} ر.س</strong>
        </div>
        <div class="bsum-row">
          <span>الفعلي</span>
          <strong>${totAct.toLocaleString('ar-SA')} ر.س</strong>
        </div>
      </div>

      <div class="bcat-list" data-r>
        ${catRows}
      </div>
    </div>`;
}

// ─────────────────────────────────────────────
//  POST-TRIP REPORT
// ─────────────────────────────────────────────
function buildReport(ti, itin, bud) {
  const cats = (bud||[]).map(b => {
    const ce = _cExp.filter(e=>e.catId===b.id).reduce((s,e)=>s+e.amount,0);
    return { ...b, act:(b.actual||0)+ce };
  });
  const totEst = cats.reduce((s,c)=>s+(c.estimated||0),0);
  const totAct = cats.reduce((s,c)=>s+c.act,0);
  const diff   = totEst - totAct;

  const allItems = itin.flatMap(d=>d.items||[]);
  const done     = allItems.filter(it=>it.done).length;
  const dests    = [...new Set(itin.map(d=>d.city).filter(Boolean))].length;
  const hls      = itin.flatMap(d=>(d.items||[]).filter(it=>it.type==='attraction'||it.type==='activity')).slice(0,8);

  return `
    <div data-r>
      <div class="report-hero">
        <div class="report-emoji">🎉</div>
        <div class="report-title">رحلتك مكتملة!</div>
        <div class="report-sub">شكراً لاختيارك خطّار — نتمنى أنك استمتعت بكل لحظة</div>
        <div class="report-stats">
          <div><div class="rstat-val">${itin.length}</div><div class="rstat-lbl">يوماً</div></div>
          <div><div class="rstat-val">${dests}</div><div class="rstat-lbl">وجهة</div></div>
          <div><div class="rstat-val">${done}</div><div class="rstat-lbl">تجربة مكتملة</div></div>
        </div>
      </div>

      <div class="sec-head">
        <span class="material-symbols-rounded ms">summarize</span>
        <h2>التقرير المالي</h2>
      </div>
      <div class="fin-card">
        <div class="fin-grid">
          <div class="fin-col">
            <div class="fin-lbl">الميزانية المتوقعة</div>
            <div class="fin-val">${totEst.toLocaleString('ar-SA')}</div>
            <div class="fin-unit">ر.س</div>
          </div>
          <div class="fin-col">
            <div class="fin-lbl">المصاريف الفعلية</div>
            <div class="fin-val">${totAct.toLocaleString('ar-SA')}</div>
            <div class="fin-unit">ر.س</div>
          </div>
        </div>
        ${Math.abs(diff)>0?`
          <div class="savings ${diff>0?'good':'bad'}">
            ${diff>0
              ?`🎯 وفّرت ${diff.toLocaleString('ar-SA')} ر.س عن الميزانية`
              :`⚠️ تجاوزت الميزانية بـ ${Math.abs(diff).toLocaleString('ar-SA')} ر.س`}
          </div>` : ''}
      </div>

      ${hls.length?`
        <div class="sec-head">
          <span class="material-symbols-rounded ms">star</span>
          <h2>أبرز اللحظات</h2>
        </div>
        <div class="hlights-scroll">
          ${hls.map(it=>`
            <div class="hl-card">
              <div class="hl-ico">${itEmoji(it)}</div>
              <div class="hl-txt">${noEmoji(it.text||'').substring(0,55)}</div>
            </div>`).join('')}
        </div>` : ''}
    </div>`;
}

function saveExp() {
  const catId  = document.getElementById('exp-cat').value;
  const amount = parseFloat(document.getElementById('exp-amount').value)||0;
  const note   = document.getElementById('exp-note').value.trim();
  if (!amount||amount<=0) { toast('أدخل مبلغاً صحيحاً'); return; }
  _cExp.push({ catId, amount, note, date:new Date().toISOString().split('T')[0], ts:Date.now() });
  try { localStorage.setItem('kt2_cexp_'+_code, JSON.stringify(_cExp)); } catch {}
  closeExp();
  document.getElementById('budget-sidebar').innerHTML = buildBudget((_data&&_data.budget)||[]);
  initBars();
  toast('تم إضافة المصروف ✓');

// ─────────────────────────────────────────────
//  ANIMATIONS
// ─────────────────────────────────────────────
function initReveal() {
  if (!('IntersectionObserver' in window)) {
    document.querySelectorAll('[data-r], .tl-item').forEach(el => {
      el.classList.add(el.classList.contains('tl-item') ? 'vis' : 'rv');
    });
    return;
  }
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const isTl = e.target.classList.contains('tl-item');
      const d    = parseInt(e.target.style.getPropertyValue('--d')||e.target.style.getPropertyValue('--rd')||'0');
      setTimeout(() => e.target.classList.add(isTl?'vis':'rv'), d||0);
      obs.unobserve(e.target);
    });
  }, { threshold:.06 });
  document.querySelectorAll('[data-r], .tl-item').forEach(el => obs.observe(el));
}

function initBars() {
  if (!('IntersectionObserver' in window)) {
    document.querySelectorAll('.bbar').forEach(b => b.style.width = (b.dataset.w||0)+'%');
    return;
  }
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.querySelectorAll('.bbar').forEach(b => { setTimeout(() => b.style.width=(b.dataset.w||0)+'%', 150); });
      obs.unobserve(e.target);
    });
  }, { threshold:.15 });
  document.querySelectorAll('.bcat-list').forEach(el => obs.observe(el));
}

//  TOAST
// ─────────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ─────────────────────────────────────────────
//  UTILS
// ─────────────────────────────────────────────
function destFlag(d) {
  if (!d) return '✈️';
  const s = d.toLowerCase();
  if (s.includes('كور')||s.includes('korea')) return '🇰🇷';
  if (s.includes('بريطان')||s.includes('uk')||s.includes('لند')) return '🇬🇧';
  if (s.includes('يابان')||s.includes('japan')) return '🇯🇵';
  if (s.includes('تركي')||s.includes('turkey')) return '🇹🇷';
  if (s.includes('فرنس')||s.includes('france')) return '🇫🇷';
  if (s.includes('إيطال')||s.includes('italy')) return '🇮🇹';
  if (s.includes('دبي')||s.includes('امار')) return '🇦🇪';
  return '✈️';
}

function fmtDate(ds) {
  try { return new Date(ds+'T00:00:00').toLocaleDateString('ar-SA',{day:'numeric',month:'long',year:'numeric'}); }
  catch { return ds; }
}

function daysBetween(a,b) {
  try { return Math.round((new Date(b)-new Date(a))/86400000)+1; } catch { return 0; }
}

function noEmoji(s) {
  return (s||'').replace(/[\u{1F000}-\u{1FFFF}]|[\u{2600}-\u{27BF}]|[︀-️]|[\u{1F300}-\u{1F9FF}]/gu,'').trim();
}

function itEmoji(it) {
  const m = (it.text||'').match(/^([\p{Emoji_Presentation}\p{Extended_Pictographic}])/u);
  if (m) return m[1];
  return {flight:'✈️',hotel:'🏨',food:'🍽️',attraction:'⭐',shop:'🛍️',transport:'🚗',activity:'🎯'}[it.type]||'📍';
}
