  background: var(--cream);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.poi-ic .material-symbols-rounded { font-size: 1.1rem; }
.poi-info { flex: 1; min-width: 0; }
.poi-n { font-size: 0.85rem; font-weight: 600; color: var(--ink); line-height: 1.3; }
.poi-loc { font-size: 0.68rem; color: var(--muted); margin-top: 1px; }
.poi-fav {
  position: absolute;
  top: 0.5rem;
  left: 0.5rem;
  width: 1.6rem; height: 1.6rem;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--persimmon);
  background: rgba(253,250,243,0.85);
}
.poi-fav svg { width: 13px; height: 13px; }
.poi-pills { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-bottom: 0.4rem; }
.poi-note { font-size: 0.72rem; color: var(--ink-soft); line-height: 1.5; margin-bottom: 0.5rem; }
.poi-acts {
  display: flex; gap: 0.3rem;
  padding-top: 0.5rem;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.poi-add {
  flex: 1;
  font-size: 0.7rem;
  padding: 0.35rem;
  border-radius: var(--r-sm);
  background: var(--accent);
  color: var(--paper);
  display: flex; align-items: center; justify-content: center; gap: 0.25rem;
  font-weight: 500;
  min-height: 28px;
}
.poi-add:hover { background: var(--accent-dk); }
.poi-add svg { width: 11px; height: 11px; }

.poi-edit, .poi-link {
  width: 1.85rem; height: 1.85rem;
  border-radius: var(--r-sm);
  background: var(--cream);
  color: var(--ink-soft);
  display: flex; align-items: center; justify-content: center;
}
.poi-edit:hover, .poi-link:hover { background: var(--border); }
.poi-edit svg, .poi-link svg { width: 12px; height: 12px; }

/* Item type icon colors */
.poi-ic.t-food { background: rgba(201,68,43,0.12); color: var(--persimmon); }
.poi-ic.t-attraction { background: rgba(26,77,74,0.12); color: var(--accent); }
.poi-ic.t-entertainment { background: rgba(225,29,72,0.12); color: #e11d48; }
.poi-ic.t-tour { background: rgba(8,145,178,0.12); color: #0891b2; }
.poi-ic.t-cafe { background: rgba(184,146,74,0.18); color: var(--gold); }
.poi-ic.t-hotel { background: rgba(184,146,74,0.18); color: var(--gold); }
.poi-ic.t-shop { background: rgba(124,58,237,0.12); color: #7c3aed; }
.poi-ic.t-mosque { background: rgba(16,185,129,0.12); color: #047857; }
.poi-ic.t-transport { background: rgba(245,158,11,0.15); color: #b45309; }
.poi-ic.t-festival { background: rgba(219,39,119,0.12); color: #db2777; }
.poi-ic.t-other { background: var(--cream); color: var(--ink-soft); }

/* ═════════════════════════════════════════
   ADD-ITEM MODAL with library picker
   ═════════════════════════════════════════ */

.picker-tabs {
  display: flex;
  gap: 0.3rem;
  background: var(--cream);
  padding: 0.2rem;
  border-radius: var(--r-md);
  margin-bottom: 0.875rem;
}
.picker-tab {
  flex: 1;
  padding: 0.55rem;
  border-radius: var(--r-sm);
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--ink-soft);
  text-align: center;
  transition: all 0.15s;
}
.picker-tab.act {
  background: var(--paper);
  color: var(--ink);
  font-weight: 600;
  box-shadow: var(--sh);
}

.picker-list {
  max-height: 22rem;
  overflow-y: auto;
  padding-right: 4px;
  margin-bottom: 0.75rem;
}
.picker-item {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.6rem;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  margin-bottom: 0.4rem;
  background: var(--paper);
  transition: all 0.15s;
  width: 100%;
  text-align: right;
}
.picker-item:hover {
  border-color: var(--accent-lt);
  background: var(--accent-soft);
}
.picker-item-ic {
  width: 2.1rem; height: 2.1rem;
  border-radius: var(--r-sm);
  background: var(--cream);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.05rem;
  flex-shrink: 0;
}
.picker-item-info { flex: 1; min-width: 0; }
.picker-item-n { font-size: 0.83rem; font-weight: 600; color: var(--ink); }
.picker-item-m { font-size: 0.68rem; color: var(--muted); margin-top: 1px; }
.picker-item-pills { display: flex; gap: 0.25rem; margin-top: 0.25rem; flex-wrap: wrap; }

.s-row { position: relative; margin-bottom: 0.75rem; }
.s-row svg { position: absolute; right: 0.7rem; top: 50%; transform: translateY(-50%); color: var(--muted); width: 14px; height: 14px; }
.s-inp { width: 100%; padding: 0.55rem 2.2rem 0.55rem 0.7rem; }

/* ═════════════════════════════════════════
   MAP
   ═════════════════════════════════════════ */
.map-wrap {
  height: 22rem;
  border-radius: var(--r-md);
  overflow: hidden;
  border: 1px solid var(--border);
  margin-bottom: 0.875rem;
}
@media (min-width: 768px) { .map-wrap { height: 32rem; } }
#tripmap { height: 100%; width: 100%; }

.map-leg {
  display: flex; flex-wrap: wrap; gap: 0.5rem;
  padding: 0.5rem 0.65rem;
  background: var(--cream);
  border-radius: var(--r-sm);
  font-size: 0.68rem;
  margin-bottom: 0.75rem;
}
.lg-d { display: flex; align-items: center; gap: 0.3rem; }
.lg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ═════════════════════════════════════════
   BUDGET
   ═════════════════════════════════════════ */
.bud-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
  margin-bottom: 1rem;
}
.bud-stat { padding: 0.65rem; text-align: center; }
.bud-l { font-size: 0.6rem; opacity: 0.85; margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.04em; }
.bud-v { font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.bud-sar { font-size: 0.6rem; margin-top: 0.15rem; opacity: 0.75; }
.bud-act-c { background: rgba(201,68,43,0.1); border-color: rgba(201,68,43,0.3); }
.bud-act-c .bud-l, .bud-act-c .bud-v, .bud-act-c .bud-sar { color: var(--persimmon); }
.bud-rem-c { background: rgba(26,77,74,0.1); border-color: rgba(26,77,74,0.3); }
.bud-rem-c .bud-l, .bud-rem-c .bud-v, .bud-rem-c .bud-sar { color: var(--accent); }

.b-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
.b-icon { font-size: 1.2rem; }
.b-info { flex: 1; min-width: 0; }
.b-n { font-size: 0.8rem; font-weight: 600; color: var(--ink); }
.b-num { font-size: 0.65rem; display: flex; gap: 0.5rem; margin-top: 1px; color: var(--muted); }
.b-inp {
  width: 5rem;
  padding: 0.3rem 0.4rem;
  text-align: center;
  font-variant-numeric: tabular-nums;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--bg); color: var(--ink);
  outline: none; font-size: 0.78rem;
}
.b-prog { height: 4px; border-radius: 9999px; background: var(--cream); overflow: hidden; }
.b-prog-f { height: 100%; transition: width 0.3s; }

/* ═════════════════════════════════════════
   CITY OVERVIEW
   ═════════════════════════════════════════ */
.city-banner {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 1rem;
  margin-bottom: 1rem;
}
.city-banner h3 {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 0.2rem;
}
.city-banner .cb-en { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.5rem; }
.city-banner p { font-size: 0.83rem; color: var(--ink-soft); line-height: 1.65; margin-bottom: 0.75rem; }

/* ═════════════════════════════════════════
   MISC
   ═════════════════════════════════════════ */

.tr-info {
  display: flex; flex-direction: column; gap: 0.25rem;
  padding: 0.55rem 0;
  border-bottom: 1px solid var(--border);
}
.tr-info:last-child { border-bottom: none; }
.tr-mode { font-weight: 600; font-size: 0.83rem; color: var(--ink); }
.tr-meta { font-size: 0.7rem; color: var(--muted); }
.tr-pr { font-size: 0.78rem; color: var(--persimmon); font-weight: 600; }

.tip-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
.tip-list li {
  font-size: 0.78rem;
  color: var(--ink-soft);
  line-height: 1.55;
  padding-right: 1.2rem;
  position: relative;
}
.tip-list li::before {
  content: '💡';
  position: absolute;
  right: 0;
  top: 0;
}
.tip-list li.cle::before { content: '⚠️'; }
.tip-list li.cle { color: var(--persimmon); }

/* Translation card */
.tc {
  background: var(--accent);
  color: var(--paper);
  border-radius: var(--r-md);
  padding: 0.875rem;
}
.tc-t {
  font-size: 0.95rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
}
.tc-text {
  background: rgba(253,250,243,0.1);
  border-radius: var(--r-sm);
  padding: 0.65rem;
  font-size: 0.78rem;
  line-height: 1.6;
  font-family: 'Courier New', monospace;
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 0.5rem;
}

/* App icons */
.app-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.4rem;
}
@media (min-width: 768px) { .app-grid { grid-template-columns: repeat(4, 1fr); } }
.app-c {
  text-align: center;
  background: var(--cream);
  padding: 0.6rem 0.4rem;
  border-radius: var(--r-sm);
}
.app-i { font-size: 1.3rem; margin-bottom: 0.1rem; }
.app-n { font-size: 0.7rem; font-weight: 700; color: var(--ink); }
.app-no { font-size: 0.6rem; color: var(--muted); margin-top: 1px; line-height: 1.3; }

/* Emergency rows */
.em-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.5rem 0;
  border-bottom: 1px solid rgba(201,68,43,0.2);
  gap: 0.5rem;
}
.em-row:last-child { border-bottom: none; }
.em-n { font-size: 0.8rem; font-weight: 600; color: var(--ink); }
.em-m { font-size: 0.68rem; color: var(--muted); }
.em-p {
  font-size: 0.78rem; font-weight: 700;
  font-variant-numeric: tabular-nums;
  padding: 0.3rem 0.55rem;
  border-radius: var(--r-sm);
  background: var(--persimmon);
  color: var(--paper);
  text-decoration: none;
  white-space: nowrap;
}

/* Festival rows */
.fest-row {
  display: flex; flex-direction: column; gap: 0.3rem;
  padding: 0.625rem 0;
  border-bottom: 1px solid var(--border);
}
.fest-row:last-child { border-bottom: none; }
@media (min-width: 640px) {
  .fest-row { flex-direction: row; align-items: center; gap: 0.75rem; }
}

/* Highlight badge */
.hl {
  font-size: 0.7rem;
  padding: 0.4rem 0.55rem;
  border-radius: var(--r-sm);
  background: var(--cream);
  color: var(--ink-soft);
  display: flex; align-items: center; gap: 0.35rem;
}
.hl svg { color: var(--gold); flex-shrink: 0; }

/* FAB - floating action button on mobile */
.fab {
  position: fixed;
  bottom: 1rem;
  left: 1rem;
  z-index: 25;
  width: 3.5rem; height: 3.5rem;
  border-radius: var(--r-lg);
  background: var(--accent);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--sh-lg);
  transition: all 0.15s;
}
.fab:hover { background: var(--accent-dk); transform: translateY(-1px); box-shadow: var(--sh-lg); }
.fab svg { width: 22px; height: 22px; }
@media (min-width: 1024px) { .fab { left: calc(var(--sidebar-w) + 1rem); display: none; } }

/* Quick info bar (date, weather) */
.qi-bar {
  display: flex; gap: 0.4rem; flex-wrap: wrap;
  margin-bottom: 0.875rem;
}
.qi-pill {
  font-size: 0.7rem;
  padding: 0.3rem 0.55rem;
  border-radius: var(--r-sm);
  background: var(--cream);
  color: var(--ink-soft);
  display: flex; align-items: center; gap: 0.3rem;
}
.qi-pill svg { width: 11px; height: 11px; }

/* ═══════════════ PRINT / PDF EXPORT (Material 3 light) ═══════════════ */
#print-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 9999;
  background: #f8f9fa; overflow-y: auto; padding: 1.5rem;
  font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; direction: rtl;
  color: #1f1f1f;
}
#print-overlay.active { display: block; }
#print-overlay .print-doc {
  max-width: 760px; margin: 0 auto;
  background: #fff;
  border-radius: 16px;
  padding: 2.5rem 2rem;
  box-shadow: 0 1px 3px rgba(60,64,67,0.12), 0 8px 24px rgba(60,64,67,0.10);
}
.print-close-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin: 0 auto 1.25rem;
  max-width: 760px;
  gap: 0.5rem; flex-wrap: wrap;
  background: #fff;
  border: 1px solid #e8eaed;
  padding: 0.65rem 0.85rem;
  border-radius: 999px;
}
.print-header {
  display: flex; align-items: center; gap: 1rem;
  padding-bottom: 1.25rem; margin-bottom: 1.5rem;
  border-bottom: 1px solid #e8eaed;
}
.print-hero {
  width: 64px; height: 64px;
  border-radius: 14px;
  background: linear-gradient(135deg, #ffe4e1 0%, #ffafb0 50%, #5b8def 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; flex-shrink: 0;
}
.print-hero[data-country="turkey"] { background: linear-gradient(135deg, #fde2e4 0%, #f76c5e 50%, #b71c1c 100%); }
.print-hero[data-country="uk"]     { background: linear-gradient(135deg, #d6e4ff 0%, #5b8def 50%, #cf2828 100%); }
.print-hero[data-country="japan"]  { background: linear-gradient(135deg, #fff1f0 0%, #ffb4b8 50%, #d63031 100%); }
.print-header-info { flex: 1; min-width: 0; }
.print-title { font-size: 1.35rem; font-weight: 600; color: #1f1f1f; letter-spacing: -0.01em; }
.print-sub { font-size: 0.85rem; color: #5f6368; margin-top: 0.3rem; }
.print-section { margin-bottom: 1.5rem; }
.print-section h3 {
  font-size: 0.85rem; font-weight: 600; color: #0b57d0;
  letter-spacing: 0.02em;
  margin-bottom: 0.6rem;
  display: flex; align-items: center; gap: 0.4rem;
}
.print-item {
  display: flex; gap: 0.85rem;
  padding: 0.65rem 0.85rem; margin-bottom: 0.35rem;
  align-items: flex-start;
  background: #f8f9fa;
  border-radius: 10px;
  border: 1px solid #e8eaed;
}
.print-item-time {
  font-size: 0.78rem; font-weight: 700; color: #0b57d0;
  min-width: 3.2rem; padding: 0.15rem 0.55rem;
  background: #d3e3fd; border-radius: 999px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.print-item-body { flex: 1; min-width: 0; }
.print-item-text { font-size: 0.88rem; font-weight: 500; color: #1f1f1f; line-height: 1.5; }
.print-item-note { font-size: 0.75rem; color: #5f6368; margin-top: 0.2rem; }
.print-hotel-card {
  background: #e8f0fe;
  border: 1px solid #d3e3fd;
  border-radius: 12px;
  padding: 0.85rem 1rem; font-size: 0.85rem;
  line-height: 1.6;
}
.print-hotel-card strong { color: #0842a0; font-size: 0.95rem; }
.print-tips {
  background: #fef7e0;
  border: 1px solid #fde29c;
  border-radius: 12px;
  padding: 0.85rem 1rem; font-size: 0.82rem;
  line-height: 1.7;
}
.print-tips p { margin-bottom: 0.3rem; }
.print-footer {
  font-size: 0.7rem; color: #5f6368; text-align: center;
  margin-top: 2rem; padding-top: 1rem;
  border-top: 1px solid #e8eaed;
}
@media print {
  body > *:not(#print-overlay) { display: none !important; }
  #print-overlay { display: block !important; position: static !important; background: #fff !important; padding: 0 !important; }
  #print-overlay .print-doc { box-shadow: none !important; padding: 1rem 0 !important; }
  .print-close-bar { display: none !important; }
}

/* ─── Permission-based UI restrictions for shared client links ───────── */
body.perms-view #fab,
body.perms-view #sync-fab,
body.perms-view .hdr-share-btn,
body.perms-view .hdr-hero-upload { display: none !important; }

  font-size: 0.78rem; font-family: system-ui;
}
body.perms-tasks::before {

  font-size: 0.78rem; font-family: system-ui;
}
body.perms-view, body.perms-tasks { padding-top: 0 !important; }

const OWNER_KEY = "mhwar2026"; // Legacy backup key
const OWNER_EMAIL = "info@mhwar.sa"; // Primary owner identity
// Additional access keys: stored in localStorage as JSON ["key1","key2",...]
function getAccessKeys() {
  try { return JSON.parse(localStorage.getItem("kt2_access_keys") || "[]"); } catch { return []; }
}
function saveAccessKeys(keys) {
  localStorage.setItem("kt2_access_keys", JSON.stringify(keys));
}
function isValidAccessKey(key) {
  if (!key) return false;
  const k = String(key).trim().toLowerCase();
  if (k === OWNER_EMAIL.toLowerCase()) return true;
  if (k === OWNER_KEY.toLowerCase()) return true;
  return getAccessKeys().some(x => String(x).trim().toLowerCase() === k);
}

// ─── Real authentication module (server-validated sessions) ───────────────
const Auth = {
  TOKEN_KEY: "kt2_session_token",
  USER_KEY:  "kt2_session_user",

  getToken()  { return localStorage.getItem(this.TOKEN_KEY) || ""; },
  getUser()   { try { return JSON.parse(localStorage.getItem(this.USER_KEY) || "null"); } catch { return null; } },
  isLoggedIn(){ return !!this.getToken(); },
  isOwner()   { const u = this.getUser(); return u && u.role === "owner"; },
  isTeam()    { const u = this.getUser(); return u && (u.role === "owner" || u.role === "team"); },
  setSession(token, user) {
    localStorage.setItem(this.TOKEN_KEY, token);
    localStorage.setItem(this.USER_KEY, JSON.stringify(user));
    // Mirror to legacy flag so existing isOwner() checks keep working
    if (user && (user.role === "owner" || user.role === "team")) {
      localStorage.setItem("kt2_is_owner", "1");
    }
  },
  clear() {
    localStorage.removeItem(this.TOKEN_KEY);
    localStorage.removeItem(this.USER_KEY);
    localStorage.removeItem("kt2_is_owner");
  },

  async login(email, password) {
    const res = await fetch("/.netlify/functions/auth?action=login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) return { ok: false, error: j.error || "login failed" };
    this.setSession(j.token, j.user);
    return { ok: true, user: j.user };
  },

  async logout() {
    const token = this.getToken();
    if (token) {
      try {
        await fetch("/.netlify/functions/auth?action=logout", {
          method: "POST",
          headers: { "Authorization": "Bearer " + token }
        });
      } catch {}
    }
    this.clear();
  },

  async me() {
    const token = this.getToken();
    if (!token) return null;
    try {
      const res = await fetch("/.netlify/functions/auth?action=me", {
        headers: { "Authorization": "Bearer " + token }
      });
      if (!res.ok) { this.clear(); return null; }
      const j = await res.json();
      if (j.user) localStorage.setItem(this.USER_KEY, JSON.stringify(j.user));
      return j.user;
    } catch { return null; }
  },

  async invite(email) {
    const token = this.getToken();
    const res = await fetch("/.netlify/functions/auth?action=invite", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ email })
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) return { ok: false, error: j.error || "invite failed" };
    return { ok: true, inviteToken: j.inviteToken, email: j.email };
  },

  async redeemInvite(inviteToken, password) {
    const res = await fetch("/.netlify/functions/auth?action=redeem", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ inviteToken, password })
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) return { ok: false, error: j.error || "redeem failed" };
    this.setSession(j.token, j.user);
    return { ok: true, user: j.user };
  },

  async inviteInfo(inviteToken) {
    try {
      const res = await fetch(`/.netlify/functions/auth?action=invite-info&token=${encodeURIComponent(inviteToken)}`);
      if (!res.ok) return null;
      return await res.json();
    } catch { return null; }
  },

  async createShare(tripCode, perms, label) {
    const token = this.getToken();
    const res = await fetch("/.netlify/functions/share?action=create", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ tripCode, perms, label })
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) return { ok: false, error: j.error || "share failed" };
    return { ok: true, shareToken: j.shareToken, perms: j.perms };
  },

  async listShares(tripCode) {
    const token = this.getToken();
    const url = `/.netlify/functions/share?action=list${tripCode ? "&tripCode=" + encodeURIComponent(tripCode) : ""}`;
    try {
      const res = await fetch(url, { headers: { "Authorization": "Bearer " + token } });
      if (!res.ok) return [];
      const j = await res.json();
      return j.shares || [];
    } catch { return []; }
  },

  async revokeShare(shareToken) {
    const token = this.getToken();
    const res = await fetch("/.netlify/functions/share?action=revoke", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ shareToken })
    });
    return res.ok;
  },

  async resolveShare(shareToken) {
    try {
      const res = await fetch(`/.netlify/functions/share?action=resolve&token=${encodeURIComponent(shareToken)}`);
      if (!res.ok) return null;
      return await res.json();
    } catch { return null; }
  },

  async changePassword(oldPassword, newPassword) {
    const token = this.getToken();
    if (!token) return { ok: false, error: "not authenticated" };
    try {
      const res = await fetch("/.netlify/functions/auth?action=change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ oldPassword, newPassword })
      });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) return { ok: false, error: j.error || "change failed" };
      return { ok: true };
    } catch (e) { return { ok: false, error: "network error" }; }
  },

  async teamList() {
    const token = this.getToken();
    if (!token) return [];
    try {
      const res = await fetch("/.netlify/functions/auth?action=team-list", {
        headers: { "Authorization": "Bearer " + token }
      });
      if (!res.ok) return [];
      const j = await res.json();
      return j.users || [];
    } catch { return []; }
  }
};

const Trip = {
  current: "korea", // current trip ID

  storageKey(suffix) {
    return this.current === "korea" ? `kt2_${suffix}` : `kt2_trip_${this.current}_${suffix}`;
  },
  load(suffix, def) {
    try { const v = localStorage.getItem(this.storageKey(suffix)); return v !== null ? JSON.parse(v) : def; }
    catch { return def; }
  },
  save(suffix, val) {
    try { localStorage.setItem(this.storageKey(suffix), JSON.stringify(val)); } catch {}
    // Trigger debounced cloud auto-sync if user has sync code
    if (typeof scheduleAutoSync === 'function') scheduleAutoSync();
  },
  delete(suffix) { try { localStorage.removeItem(this.storageKey(suffix)); } catch {} }
};

const TripsRegistry = {
  KOREA_DEFAULT: {
    id: "korea", name: "كوريا الجنوبية", destination: "كوريا الجنوبية",
    icon: "🇰🇷", color: "#1a4d4a", isBuiltIn: true, countryLib: "korea",
    startDate: "2026-05-14", endDate: "2026-05-24",
    createdAt: "2026-01-01"
  },
  UK_DEFAULT: {
    id: "uk", name: "بريطانيا", destination: "المملكة المتحدة",
    icon: "🇬🇧", color: "#1e3a5f", isBuiltIn: true, countryLib: "uk",
    startDate: "2026-08-14", endDate: "2026-08-23",
    createdAt: "2026-01-01"
  },
  list() {
    const stored = (() => {
      try { return JSON.parse(localStorage.getItem("kt2_trips_registry") || "[]"); } catch { return []; }
    })();
    if (!stored.find(t => t.id === "korea")) stored.unshift(this.KOREA_DEFAULT);
    if (!stored.find(t => t.id === "uk")) stored.splice(1, 0, this.UK_DEFAULT);
    return stored;
  },
  save(list) { localStorage.setItem("kt2_trips_registry", JSON.stringify(list)); },
  get(id) { return this.list().find(t => t.id === id); },
  upsert(trip) {
    const list = this.list().filter(t => t.id !== trip.id);
    list.push(trip);
    this.save(list);
  },
  remove(id) {
    if (id === "korea" || id === "uk") return false;
    const list = this.list().filter(t => t.id !== id);
    this.save(list);
    // Clean up trip data
    Object.keys(localStorage).filter(k => k.startsWith(`kt2_trip_${id}_`)).forEach(k => localStorage.removeItem(k));
    return true;
  },
  duplicate(srcId) {
    const src = this.get(srcId);
    if (!src) return null;
    const newName = (src.name || "رحلة") + " — نسخة";
    let newId = generateTripId(newName);
    // ensure unique
    while (this.get(newId)) newId += "2";
    const newTrip = { ...src, id: newId, name: newName, isBuiltIn: false, createdAt: new Date().toISOString() };
    // Copy all localStorage keys from src to new trip
    const srcPrefix = srcId === "korea" ? "kt2_" : `kt2_trip_${srcId}_`;
    const dstPrefix = `kt2_trip_${newId}_`;
    const suffixes = ["itin","clib","bud","tasks","favs","tripinfo","citycolors","customcities"];
    suffixes.forEach(s => {
      const key = srcId === "korea" ? `kt2_${s}` : `kt2_trip_${srcId}_${s}`;
      const raw = localStorage.getItem(key);
      if (raw) localStorage.setItem(`kt2_trip_${newId}_${s}`, raw);
    });
    this.upsert(newTrip);
    return newTrip;
  }
};

function isOwner() {
  return localStorage.getItem("kt2_is_owner") === "1";
}

function isKoreaTrip() {
  if (Trip.current === "korea") return true;
  const t = TripsRegistry.get(Trip.current);
  return t?.countryLib === "korea";
}
function isUKTrip() {
  const t = TripsRegistry.get(Trip.current);
  return t?.countryLib === "uk";
}

function getRouteParams() {
  const u = new URL(location.href);
  return {
    trip: u.searchParams.get("trip"),
    dashboard: u.searchParams.get("dashboard") === "1",
    owner: u.searchParams.get("owner"),
    loadCode: u.searchParams.get("code"),
    shareData: u.searchParams.get("share"),
    shareToken: u.searchParams.get("s"),       // new MVP share token
    inviteToken: u.searchParams.get("invite")  // team invite redemption
  };
}

function applyRoute() {
  const p = getRouteParams();

  // 1. Owner key check (supports primary OWNER_KEY + additional access keys)
  if (p.owner !== null) {
    if (isValidAccessKey(p.owner)) {
      localStorage.setItem("kt2_is_owner", "1");
      const url = new URL(location.href); url.searchParams.delete("owner");
      history.replaceState(null, "", url.toString());
      alert("✓ تم تفعيل صلاحية الوصول");
    } else {
      alert("مفتاح الوصول غير صحيح");
    }
  }

  // 2. Determine view
  const showDashboard = p.dashboard; // all users can access dashboard
  const tripId = p.trip || null;

  return {
    showDashboard,
    tripId,
    loadCode: p.loadCode,
    shareData: p.shareData,
    shareToken: p.shareToken,
    inviteToken: p.inviteToken
  };
}

function navTo({ trip, dashboard, code }) {
  const u = new URL(location.href);
  u.searchParams.delete("trip");
  u.searchParams.delete("dashboard");
  u.searchParams.delete("code");
  if (dashboard) u.searchParams.set("dashboard", "1");
  if (trip) u.searchParams.set("trip", trip);
  if (code) u.searchParams.set("code", code);
  location.href = u.toString();
}

function generateTripId(name) {
  const base = (name || "trip").toLowerCase()
    .replace(/[؀-ۿ]+/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 24) || "trip";
  let id = base;
  let n = 1;
  const existing = TripsRegistry.list().map(t => t.id);
  while (existing.includes(id)) { id = `${base}-${++n}`; }
  return id;
}

const LIBS_VERSION = 4; // bump when TURKEY_LIB or UK_LIB content changes
function seedBuiltinLibraries() {
  try {
    const storedVer = parseInt(localStorage.getItem("kt2_libs_version") || "0");
    const libs = JSON.parse(localStorage.getItem("kt2_global_libs") || "{}");
    if (storedVer < LIBS_VERSION || !libs.turkey || !libs.uk) {
      libs.turkey = TURKEY_LIB;
      libs.uk     = UK_LIB;
      localStorage.setItem("kt2_global_libs", JSON.stringify(libs));
      localStorage.setItem("kt2_libs_version", String(LIBS_VERSION));
    }
  } catch {}
}

// Day view mode: 'timeline' | 'compact' — persisted in localStorage
let _dayViewMode = localStorage.getItem('dayViewMode') || 'timeline';
function toggleDayViewMode() {
  _dayViewMode = _dayViewMode === 'timeline' ? 'compact' : 'timeline';
  localStorage.setItem('dayViewMode', _dayViewMode);
  renderDayContent();
}

let _todayJumped = false;
function _jumpToTodayIfActive() {
  if (_todayJumped) return;
  _todayJumped = true;
  const sd = state.tripInfo?.startDate;
  if (!sd || !state.itinerary.length) return;
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(sd); start.setHours(0,0,0,0);
  const dayOffset = Math.round((today - start) / 86400000);
  if (dayOffset >= 0 && dayOffset < state.itinerary.length) {
    state.activeDayIdx = dayOffset;
    Trip.save("uidx", dayOffset);
  }
}

// Default empty itinerary (12 days)
const TRIP_START = new Date("2026-05-14");

// Creates blank day objects (skeleton) — used by template import
function makeSkeletonDays() {
  const days = [];
  for (let i = 0; i < 11; i++) {
    const d = new Date(TRIP_START);
    d.setDate(d.getDate() + i);
    const weekdays = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
    let city;
    if (i < 3) city = "seoul";
    else if (i < 6) city = "busan";
    else if (i < 9) city = "jeju";
    else city = "seoul";
    days.push({
      day: i + 1,
      date: d.toISOString().split('T')[0],
      dateLabel: `${d.getDate()} ${["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"][d.getMonth()]}`,
      weekday: weekdays[d.getDay()],
      city, title: "", type: "normal", flight: null, items: []
    });
  }
  return days;
}

let _saveIndicatorTimer = null;
let _autoCloudTimer = null;

function _showSaveIndicator(text) {
  const el = $("auto-sync-indicator");
  if (!el) return;
  el.textContent = text || "✓ محفوظ";
  el.style.opacity = "1";
  if (_saveIndicatorTimer) clearTimeout(_saveIndicatorTimer);
  _saveIndicatorTimer = setTimeout(() => { el.style.opacity = "0"; }, 2500);
}

function _scheduleCloudSave() {
  const code = syncGetCode();
  if (_autoCloudTimer) clearTimeout(_autoCloudTimer);
  _autoCloudTimer = setTimeout(async () => {
    _showSaveIndicator("↻ حفظ سحابي...");
    const ok = await syncSave(code);
    _showSaveIndicator(ok ? "✓ محفوظ في السحابة" : "✓ محفوظ محلياً");
  }, 2000);
}

function saveItin() { Trip.save("itin", state.itinerary); _showSaveIndicator(); _scheduleCloudSave(); }
function saveLib() { Trip.save("clib", state.customLib); _invalidateLibCache(); _scheduleCloudSave(); }

// All POIs (built-in + custom) — respects countryLib of current trip
let _libCache = null;
function _invalidateLibCache() { _libCache = null; }
function allLib() {
  if (_libCache) return _libCache;
  const t = TripsRegistry.get(Trip.current);
  const lib = t?.countryLib || null;
  let base = [];
  if (lib === "korea") {
    base = typeof LIB !== 'undefined' ? [...LIB] : [];
  } else if (lib) {
    // Non-Korea global library (turkey, uk, or any custom)
    const libs = (() => { try { return JSON.parse(localStorage.getItem("kt2_global_libs") || "{}"); } catch { return {}; } })();
    base = libs[lib] || [];
  }
  _libCache = [...base, ...state.customLib];
  return _libCache;
}

function _applyTemplateOption(optId) {
  const hasItems = state.itinerary.some(d => d.items.length > 0);
  if (hasItems && !confirm("جدولك يحتوي على عناصر. الاستيراد سيستبدلها. متابعة؟")) return;

  let days;
  if (optId === 'uk10') {
    days = makeUKTemplateItinerary();
  } else if (optId === 'uk7') {
    days = makeUKTemplateItinerary().slice(0, 7);
    // Fix: add a departure day at the end
    const last = days[days.length-1];
    days[days.length-1] = {...last, title:'المغادرة', items:[
      ...last.items.filter(it=>it.type!=='hotel'),
      { id:'uk_dep', time:'12:00', text:'المغادرة من إدنبرة', type:'transport', locked:true }
    ]};
  } else if (optId === 'uk5') {
    // London only: take first 4 London days + a departure day
    const full = makeUKTemplateItinerary();
    days = full.slice(0, 4);
    days.push({...full[9], day:5, city:'london', title:'المغادرة من لندن', items:[
      { id:'uk_dep5', time:'10:00', text:'الخروج من الفندق والمغادرة', type:'transport', locked:true }
    ]});
  } else if (optId === 'kr11') {
    days = makeTemplateItinerary();
  } else if (optId === 'kr5') {
    days = makeTemplateItinerary().slice(0, 5);
  }

  state.itinerary = days;
  renumberDays();
  saveItin();
  closeModal();
  switchTab('itinerary');
}

function makeUKSkeletonDays() {
  const start = new Date("2026-08-14");
  const cities = ["london","london","london","london","edinburgh","edinburgh","edinburgh","manchester","manchester","manchester"];
  const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const wdays  = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  return Array.from({length:10},(_,i)=>{
    const d = new Date(start); d.setDate(d.getDate()+i);
    return { day:i+1, date:d.toISOString().split('T')[0],
      dateLabel:`${d.getDate()} ${months[d.getMonth()]}`,
      weekday:wdays[d.getDay()], city:cities[i], title:"", type:"normal", flight:null, hotel:null, items:[] };
  });
}

function renderDayTabs() {
  const tabs = $("day-tabs");
  let html = '';
  state.itinerary.forEach((d, i) => {
    const col = state.cityColors[d.city] || CITY_COLORS_DEFAULT[d.city] || "#1a4d4a";
    const isAct = i === state.activeDayIdx;
    const borderType = d.type !== 'normal' ? ` ${d.type}` : '';
    const cityShort = (cityById(d.city)?.name || d.city).replace('جزيرة ','');
    // Compute light rgba from hex color
    const r = parseInt(col.slice(1,3),16), g = parseInt(col.slice(3,5),16), b = parseInt(col.slice(5,7),16);
    const inactiveStyle = `background:rgba(${r},${g},${b},0.1);border-color:rgba(${r},${g},${b},0.35);color:${col}`;
    const activeStyle   = `background:${col};border-color:${col};color:#fff`;
    html += `
      <button class="dt${borderType}${isAct ? ' act' : ''}"
        onclick="state.activeDayIdx=${i};Trip.save('uidx',${i});renderItinerary()"
        style="${isAct ? activeStyle : inactiveStyle}">
        <div class="dt-d" style="opacity:0.75">يوم</div>
        <div class="dt-n">${d.day}</div>
        <div class="dt-c" style="opacity:0.85">${cityShort}</div>
      </button>
    `;
    // "+" after every day including the last
    html += `<div class="dt-between"><button class="dt-between-btn" onclick="addNewDay(${i})" title="إضافة يوم${i < state.itinerary.length - 1 ? ` بين اليوم ${d.day} و${d.day + 1}` : ' في النهاية'}">+</button></div>`;
  });
  tabs.innerHTML = html;
}

  const startDate = state.tripInfo?.startDate || new Date().toISOString().split('T')[0];
  openModal(`
    <div class="modal-h">
      <h3>إضافة أول يوم</h3>
      <button class="modal-x" onclick="closeModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="fld">
      <label>نوع اليوم</label>
      <select class="input" id="fd-type">
        <option value="arrival">🛬 يوم الوصول</option>
        <option value="normal">📅 يوم عادي</option>
      </select>
    </div>
    <div class="fld">
      <label>المدينة</label>
      ${isKoreaTrip() ? `<select class="input" id="fd-city">
        ${CITIES.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
      </select>` : `<input type="text" class="input" id="fd-city" placeholder="مثال: طوكيو">`}
    </div>
    <div class="fld">
      <label>التاريخ</label>
      <input type="date" class="input" id="fd-date" value="${startDate}">
    </div>
    <div class="fld">
      <label>وقت الوصول إلى المطار</label>
      <input type="time" class="input" id="fd-arr" value="10:50">
    </div>
    <div class="fld">
      <label>وسيلة التنقل من المطار للفندق</label>
      <select class="input" id="fd-transport">
        <option value="train">🚆 قطار</option>
        <option value="bus">🚌 حافلة عامة</option>
        <option value="taxi">🚕 تاكسي</option>
        <option value="private">🚗 سيارة خاصة</option>
        <option value="limousine">🚌 ليموزين المطار</option>
      </select>
    </div>
    <div class="fld">
      <label>ملاحظات الوصول (اختياري)</label>
      <input type="text" class="input" id="fd-note" placeholder="مثال: استئجار T-money من المطار">
    </div>
    <div class="modal-act">
      <button class="btn btn-sec" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-pri" onclick="saveFirstDay()">إضافة اليوم</button>
    </div>
  `);
}

function saveFirstDay() {
  const type = $("fd-type").value;
  const city = $("fd-city").value;
  const dateStr = $("fd-date").value || state.tripInfo?.startDate || new Date().toISOString().split('T')[0];
  const arrTime = $("fd-arr").value;
  const transport = $("fd-transport").value;
  const note = $("fd-note").value.trim();

  // Update tripInfo startDate if changed
  if (dateStr && state.tripInfo) {
    state.tripInfo.startDate = dateStr;
    saveTripInfo();
  }

  const transportLabels = { train: "قطار AREX", bus: "حافلة عامة", taxi: "تاكسي", private: "سيارة خاصة", limousine: "ليموزين المطار" };
  const transportIcons = { train: "🚆", bus: "🚌", taxi: "🚕", private: "🚗", limousine: "🚌" };

  const d = new Date(dateStr);
  const weekdays = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

  const items = [];
  if (arrTime) {
    items.push({
      id: "fd_" + Date.now(),
      time: arrTime, type: "transport",
      text: `${transportIcons[transport] || '🚆'} من المطار للفندق بـ${transportLabels[transport] || transport}`,
      notes: note || null, bookingLink: null, requiresTicket: false, done: false, locked: false
    });
  }

  const newDay = {
    day: 1,
    date: dateStr,
    dateLabel: `${d.getDate()} ${months[d.getMonth()]}`,
    weekday: weekdays[d.getDay()],
    city, title: type === 'arrival' ? 'يوم الوصول' : '',
    type, flight: type === 'arrival' ? { from: "المطار", to: city, arrTime, mode: transport } : null,
    narrative: null, notes: null, hotel: null, items
  };

  state.itinerary = [newDay];
  saveItin();
  state.activeDayIdx = 0;
  closeModal();
  renderItinerary();
}

// ── City color picker ──
function openCityColorPicker() {
  const PALETTE = ["#1a4d4a","#c9442b","#b8924a","#0891b2","#7c3aed","#059669","#d97706","#db2777","#4f46e5","#374151","#b45309","#047857"];
  openModal(`
    <div class="modal-h">
      <h3>🎨 ألوان المدن في الشريط</h3>
      <button class="modal-x" onclick="closeModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <p class="txs clm mb3">اختر لوناً مميزاً لكل مدينة. يُطبَّق فوراً على شريط الأيام.</p>
    ${CITIES.map(c => `
      <div class="fld">
        <label style="font-weight:600;color:${state.cityColors[c.id] || CITY_COLORS_DEFAULT[c.id]}">${c.name}</label>
        <div class="color-palette" id="pal-${c.id}">
          ${PALETTE.map(col => `
            <button class="color-swatch${state.cityColors[c.id] === col ? ' selected' : ''}"
              style="background:${col}"
              onclick="setCityColor('${c.id}', '${col}')"></button>
          `).join('')}
          <input type="color" class="color-custom" value="${state.cityColors[c.id] || CITY_COLORS_DEFAULT[c.id]}"
            oninput="setCityColor('${c.id}', this.value)" title="لون مخصص">
        </div>
      </div>
    `).join('')}
    <div class="modal-act">
      <button class="btn btn-sec" onclick="resetCityColors()">إعادة ضبط</button>
      <button class="btn btn-pri" onclick="closeModal();renderItinerary()">تطبيق</button>
    </div>
  `);
}

function setCityColor(cityId, color) {
  state.cityColors[cityId] = color;
  saveCityColors();
  // Update swatch selected state in modal
  document.querySelectorAll(`#pal-${cityId} .color-swatch`).forEach(s => {
    s.classList.toggle("selected", s.style.background === color || s.style.backgroundColor === color);
  });
}

function resetCityColors() {
  state.cityColors = { ...CITY_COLORS_DEFAULT };
  saveCityColors();
  closeModal();
  renderItinerary();
}

function renderDayContent() {
  const day = state.itinerary[state.activeDayIdx];
  const c = cityById(day.city);
  const modeInfo = TRANSPORT_MODE[day.flight?.mode] || TRANSPORT_MODE.flight;
  const typeLabel = day.type === 'transit'
    ? { label: `${modeInfo.icon} تنقل`, cls: 'pill-warn' }
    : TYPE_LABELS[day.type];

  let html = `
    <div class="day-hdr ${day.type !== 'normal' ? day.type : ''}">
      <div class="day-hdr-i">${day.day}</div>
      <div class="day-hdr-info">
        <div class="day-hdr-d">${day.weekday} · ${day.dateLabel}</div>
        <div class="day-hdr-t">${day.title || `يوم ${day.day}${c ? ` - ${c.name}` : (day.city ? ` - ${day.city}` : '')}`}</div>
        <div class="day-hdr-row">
          ${typeLabel ? `<span class="pill ${typeLabel.cls}">${typeLabel.label}</span>` : ''}
          ${day.city ? `<span class="pill" style="background:${(CITY_COLORS[day.city]||'#1a4d4a')}1a;color:${CITY_COLORS[day.city]||'#1a4d4a'};border-color:${(CITY_COLORS[day.city]||'#1a4d4a')}40">${c?.name || day.city}</span>` : ''}
          ${day.items.length ? `<span class="pill pill-sm">${day.items.length} نشاط</span>` : ''}
        </div>
      </div>
      <div class="day-tb-menu-wrap" style="flex-shrink:0">
        <button class="day-hdr-opt" onclick="toggleDayMenu(event)" title="خيارات اليوم">
          <span class="material-symbols-rounded">more_vert</span>
        </button>
        <div class="day-tb-menu" id="day-tb-menu" hidden>
          <button class="day-tb-mi" onclick="closeDayMenu();setDayMeta()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            تعديل اليوم
          </button>
          <div class="day-tb-mi-sep"></div>
          <button class="day-tb-mi" onclick="closeDayMenu();duplicateDay(${state.activeDayIdx})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            نسخ هذا اليوم
          </button>
          <button class="day-tb-mi" onclick="closeDayMenu();moveDayUp(${state.activeDayIdx})" ${state.activeDayIdx === 0 ? 'disabled' : ''}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
            نقل لأعلى
          </button>
          <button class="day-tb-mi" onclick="closeDayMenu();moveDayDown(${state.activeDayIdx})" ${state.activeDayIdx === state.itinerary.length - 1 ? 'disabled' : ''}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            نقل لأسفل
          </button>
          <div class="day-tb-mi-sep"></div>
          <button class="day-tb-mi" onclick="closeDayMenu();printDay(${state.activeDayIdx})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            تصدير اليوم (PDF)
          </button>
          <div class="day-tb-mi-sep"></div>
          <button class="day-tb-mi day-tb-mi-danger" onclick="closeDayMenu();deleteDay(${state.activeDayIdx})" ${state.itinerary.length <= 1 ? 'disabled' : ''}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
            حذف اليوم
          </button>
        </div>
      </div>
    </div>

    <div class="day-toolbar">
      <button class="day-tb-btn day-tb-pri" onclick="_dayAddMenu(${state.activeDayIdx},event)" title="إضافة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>إضافة ▾</span>
      </button>
      <button class="day-tb-btn" onclick="_openHotelOverview()" title="خطة السكن">
        <span class="material-symbols-rounded" style="font-size:1rem">hotel</span>
        <span>السكن</span>
      </button>
      <button class="day-tb-btn day-tb-view-toggle" onclick="toggleDayViewMode()" title="${_dayViewMode === 'timeline' ? 'عرض مضغوط' : 'عرض التايم لاين'}">
        <span class="material-symbols-rounded">${_dayViewMode === 'timeline' ? 'view_agenda' : 'timeline'}</span>
      </button>
    </div>
  `;

  // ─── Day progress bar (only when there are items and at least one done) ───
  if (day.items && day.items.length > 0) {
    const totalCount = day.items.length;
    const doneCount = day.items.filter(i => i.done).length;
    const pct = Math.round((doneCount / totalCount) * 100);
    if (pct > 0) {
      html += `<div class="day-progress">
        <div class="day-progress-bar" style="width:${pct}%"></div>
        <span class="day-progress-text">${doneCount} من ${totalCount} مكتمل</span>
      </div>`;
    }
  }

  // Flight/transport banner
  if (day.flight) {
    const f = day.flight;
    const fm = TRANSPORT_MODE[f.mode] || TRANSPORT_MODE.flight;
    const typePrefix = day.type === 'arrival' ? '🛬 الوصول:' : day.type === 'departure' ? '🛫 المغادرة:' : `${fm.icon} ${fm.label}:`;
    let txt = `<strong>${typePrefix}</strong> ${f.from} → ${f.to}`;
    if (f.depTime) txt += ` · انطلاق ${f.depTime}`;
    if (f.arrTime) txt += ` · وصول ${f.arrTime}`;
    if (f.ref) txt += ` · <span style="opacity:.8">رقم الحجز: ${f.ref}</span>`;
    html += `<div class="fl-bnr">
      <div style="flex:1">
        <span>${txt}</span>
        ${f.bookingLink ? `<div style="margin-top:.35rem"><a href="${f.bookingLink}" target="_blank" style="font-size:.75rem;color:#b45309;font-weight:600;text-decoration:none">🎫 فتح التذكرة ↗</a></div>` : ''}
      </div>
    </div>`;
  }

  // ─── Checkout-hotel banner (the hotel being left in the morning) ───
  if (day.hotelOut && day.hotelOut.name) {
    const ho = day.hotelOut;
    const hoMaps = ho.address ? _mapsUrl(ho.address) : (ho.name ? _mapsUrl(ho.name, ho.area) : null);
    html += `<div class="day-hotel day-hotel-out">
      <div class="day-hotel-ic">🛬</div>
      <div class="day-hotel-bd">
        <div class="day-hotel-n">
          <span class="day-hotel-night-pill" style="background:#fef2f2;color:#991b1b">خروج</span>
          ${ho.name}
        </div>
        ${ho.address ? `<div class="txs clm">📍 ${ho.address}</div>` : (ho.area ? `<div class="txs clm">📍 ${ho.area}</div>` : '')}
        <div class="day-hotel-m">
          <span style="font-weight:700;color:#991b1b">🔴 تسجيل خروج حتى ${ho.checkOut || '11:00'}</span>
          ${day.hotel?.name ? `<span style="color:#475569">← ${day.hotel.name}</span>` : ''}
        </div>
        ${ho.notes ? `<div class="txs cls" style="margin-top:0.3rem">${ho.notes}</div>` : ''}
        <div class="day-hotel-acts">
          ${hoMaps ? `<a class="day-hotel-act" href="${hoMaps}" target="_blank">📍 خرائط</a>` : ''}
          <button class="day-hotel-act" onclick="setDayHotelOut(${state.activeDayIdx})">✏️ تعديل</button>
          <button class="day-hotel-act day-hotel-act-danger" onclick="clearDayHotelOut(${state.activeDayIdx})">🗑️ إزالة</button>
        </div>
      </div>
    </div>`;
    // Transition flow bar between checkout and new hotel
    if (day.hotel && day.hotel.name) {
      const outCity = ho.area || ho.name || '—';
      const inCity = day.hotel.area || day.hotel.name || '—';
      html += `<div class="transition-flow">🛬 ${outCity} &nbsp;→&nbsp; 🚆 انتقال &nbsp;→&nbsp; 🏨 ${inCity}</div>`;
    }
  }

  // ─── Hotel banner (always visible) ───
  if (day.hotel && day.hotel.name) {
    const h = day.hotel;
    const isCheckIn = h.isFirst;
    const isCheckOut = h.isLast && h.totalNights > 1;
    const mapsLink = h.address ? _mapsUrl(h.address) : (h.name ? _mapsUrl(h.name, h.area) : null);
    const hasHotelOut = !!(day.hotelOut && day.hotelOut.name);
    html += `<div class="day-hotel${isCheckOut ? ' day-hotel-last' : ''}">
      <div class="day-hotel-ic">🏨</div>
      <div class="day-hotel-bd">
        <div class="day-hotel-n">
          ${hasHotelOut ? `<span class="day-hotel-night-pill" style="background:#dcfce7;color:#166534">🛏️ مبيت الليلة</span>` : ''}
          ${h.totalNights > 1 ? `<span class="day-hotel-night-pill">ليلة ${h.nightIndex}/${h.totalNights}</span>` : ''}
          ${h.name}
        </div>
        ${h.address ? `<div class="txs clm">📍 ${h.address}</div>` : ''}
        <div class="day-hotel-m">
          ${isCheckIn ? `<span>🟢 دخول ${h.checkIn || '15:00'}</span>` : ''}
          ${isCheckOut ? `<span style="color:#92400e;font-weight:600">⚠️ آخر ليلة — الخروج غداً بحلول ${h.checkOut || '11:00'}</span>` : ''}
          ${!isCheckIn && !isCheckOut ? `<span>🛏️ مبيت</span>` : ''}
        </div>
        ${h.notes ? `<div class="txs cls" style="margin-top:0.3rem">${h.notes}</div>` : ''}
        <div class="day-hotel-acts">
          ${mapsLink ? `<a class="day-hotel-act" href="${mapsLink}" target="_blank">📍 خرائط</a>` : ''}
          ${h.bookingLink ? `<a class="day-hotel-act" href="${h.bookingLink}" target="_blank">🔗 الحجز</a>` : ''}
          <button class="day-hotel-act" onclick="openDayHotelPicker(${state.activeDayIdx})">✏️ تعديل</button>
          <button class="day-hotel-act day-hotel-act-danger" onclick="clearDayHotel(${state.activeDayIdx})">🗑️ إزالة</button>
        </div>
      </div>
    </div>`;
    // Offer to add a checkout hotel (for transition days) when not already set
    if (!day.hotelOut) {
      html += `<button class="day-hotel-out-add" onclick="setDayHotelOut(${state.activeDayIdx})">+ إضافة فندق خروج (للانتقال)</button>`;
    }
  } else {
    html += `<button class="day-hotel-empty" onclick="openDayHotelPicker(${state.activeDayIdx})">
      <div class="day-hotel-empty-ic">🏨</div>
      <div class="day-hotel-empty-bd">
        <div class="day-hotel-empty-t">لم يُحدَّد فندق هذا اليوم</div>
        <div class="day-hotel-empty-d">اختر من المكتبة أو أدخل يدوياً</div>
      </div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>`;
    // Hotel suggestions from library
    const cityHotels = allLib().filter(h => h.type === 'hotel' && (h.city === day.city || h.city === 'all'));
    if (cityHotels.length) {
      const top = cityHotels.slice(0, 3);
      html += `<div class="hotel-sugg">
        <div class="hotel-sugg-hd">اقتراحات من المكتبة</div>
        ${top.map(h => `
          <button class="hotel-sugg-btn" onclick="_pickHotelFromLib('${h.id}', ${state.activeDayIdx})">
            <span class="material-symbols-rounded">hotel</span>
            <span class="hotel-sugg-n">${h.name.replace(/^✨ /, '')}</span>
            ${h.price ? `<span class="hotel-sugg-p">${h.price}</span>` : ''}
          </button>`).join('')}
      </div>`;
    }
  }

  // ─── Day-level personal notes ───
  if (day.notes) {
    html += `<div class="day-notes">📒 ${day.notes}</div>`;
  }

  // ─── Narrative card (description of the day) ───
  if (day.narrative) {
    html += `<div class="narrative-card">
      <div class="narrative-icon">💡</div>
      <div class="narrative-text">${day.narrative}</div>
    </div>`;
  }

  // ─── Smart Warnings ───
  const warnings = analyzeDayWarnings(day);
  if (warnings.length > 0) {
    html += `<div class="day-warns">
      ${warnings.map(w => `
        <div class="day-warn day-warn-${w.level}">
          <span class="day-warn-i">${w.icon}</span>
          <span class="day-warn-t">${w.text}</span>
        </div>
      `).join('')}
    </div>`;
  }

  // Timeline
  if (day.items.length === 0) {
    // Travel-day special view: when the day is purely a flight/transit day
    if (day.flight) {
      const f = day.flight;
      const flightFromTo = `${f.from || ''} → ${f.to || ''}`;
      const heroTitle = day.type === 'arrival' ? 'يوم الوصول' : day.type === 'departure' ? 'يوم المغادرة' : 'يوم انتقال';
      html += `<div class="travel-day-hero">
        <div class="travel-day-icon">✈️</div>
        <div class="travel-day-title">${heroTitle}</div>
        <div class="travel-day-sub">${flightFromTo}</div>
        <button onclick="openItemPicker(${state.activeDayIdx})" class="btn btn-pri" style="margin-top:1rem">+ إضافة نشاط في هذا اليوم</button>
      </div>`;
    } else {
      html += `<div class="empty">
        <div class="empty-i">📍</div>
        <div class="empty-t">لا توجد أنشطة لهذا اليوم</div>
        <p class="empty-d">اضغط الزر أدناه لإضافة بند بفئته (سكن، مواصلات، وجبة، نشاط، جولة، راحة، ملاحظة)</p>
        <div class="empty-acts">
          <button class="btn btn-pri" onclick="openItemPicker(${state.activeDayIdx})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            + إضافة بند
          </button>
        </div>
      </div>`;
    }
  } else {
    const sorted = [...day.items].sort((a,b) => (a.time || "99:99").localeCompare(b.time || "99:99"));

    if (_dayViewMode === 'compact') {
      // ── Compact list view ──
      const compactHTML = sorted.map(it => renderCompactItem(it)).join('');
      html += `<div class="cv-list">${compactHTML}</div>
        <button class="tl-add" onclick="openItemPicker(${state.activeDayIdx})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          + إضافة بند للجدول
        </button>`;
    } else {
      // ── Timeline view ──
      let timelineHTML = '';
      sorted.forEach((it, i) => {
        if (i > 0) {
          const prev = sorted[i - 1];
          const gapMins = _timeGapMins(prev.time, it.time);
          if (gapMins !== null && gapMins > 60) {
            const gh = Math.floor(gapMins / 60);
            const gm = gapMins % 60;
            const gapTxt = gm === 0 ? `${gh}س` : `${gh}س ${gm}د`;
            timelineHTML += `<div class="tl-gap"><span>⏸ ${gapTxt} وقت حر</span></div>`;
          } else {
            const buffer = computeBuffer(prev.time, it.time);
            if (buffer) {
              timelineHTML += `<div class="tl-buffer"><span class="tl-buffer-l">⏱️ ${buffer}</span></div>`;
            }
          }
        }
        timelineHTML += renderTimelineItem(it);
      });

      html += `<div class="tl">
        ${timelineHTML}
        <button class="tl-add" onclick="openItemPicker(${state.activeDayIdx})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          + إضافة بند للجدول
        </button>
      </div>`;
    }
  }

  $("day-content").innerHTML = html;
}

// ─── 🗓️ DAY MANAGEMENT ───
function getTripStartDate() {
  const sd = state.tripInfo?.startDate;
  return sd ? new Date(sd) : new Date(TRIP_START);
}

function getHotelSegments() {
  const segs = [];
  let i = 0;
  while (i < state.itinerary.length) {
    const city = state.itinerary[i].city || '';
    let j = i + 1;
    while (j < state.itinerary.length && (state.itinerary[j].city || '') === city) j++;
    const days = state.itinerary.slice(i, j);
    const covered = days.filter(d => d.hotel?.name).length;
    const hotelNames = [...new Set(days.map(d => d.hotel?.name).filter(Boolean))];
    const color = (state.cityColors && state.cityColors[city]) || '#1a4d4a';
    const LCN = typeof LIB_CITY_NAMES !== 'undefined' ? LIB_CITY_NAMES : {};

    // Check-in = first day of segment
    // Check-out = first day of NEXT segment (the morning you leave)
    // This matches how booking apps work: "May 14 → May 17" = 3 nights
    const checkInDate = state.itinerary[i].date || '';
    const checkInLabel = state.itinerary[i].dateLabel || '';
    let checkOutDate = '', checkOutLabel = '';
    if (j < state.itinerary.length) {
      // Next segment's first day = checkout morning
      checkOutDate = state.itinerary[j].date || '';
      checkOutLabel = state.itinerary[j].dateLabel || '';
    } else if (checkInDate) {
      // Last segment: compute by adding nights to start date
      const d = new Date(checkInDate);
      d.setDate(d.getDate() + days.length);
      const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
      checkOutDate = d.toISOString().split('T')[0];
      checkOutLabel = `${d.getDate()} ${months[d.getMonth()]}`;
    }

    segs.push({
      cityId: city,
      cityName: LCN[city] || city || 'غير محددة',
      color,
      startIdx: i,
      endIdx: j - 1,
      dayCount: days.length,
      nightsNeeded: days.length,
      startDay: state.itinerary[i].day,
      endDay: state.itinerary[j-1].day,
      startDate: state.itinerary[i].dateLabel || '',
      endDate: state.itinerary[j-1].dateLabel || '',
      checkInDate, checkInLabel,
      checkOutDate, checkOutLabel,
      hotelNames,
      primaryHotel: hotelNames[0] || null,
      coveredCount: covered,
      allCovered: covered === days.length,
      partCovered: covered > 0 && covered < days.length,
      noCovered: covered === 0,
    });
    i = j;
  }
  return segs;
}

function renumberDays() {
  const base = getTripStartDate();
  state.itinerary.forEach((d, i) => {
    d.day = i + 1;
    const date = new Date(base);
    date.setDate(date.getDate() + i);
    const weekdays = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
    const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
    d.date = date.toISOString().split('T')[0];
    d.dateLabel = `${date.getDate()} ${months[date.getMonth()]}`;
    d.weekday = weekdays[date.getDay()];
  });
}

function addNewDay(afterIdx) {
  const sourceDay = state.itinerary[afterIdx];
  const t = state.tripInfo || {};
  const defaultCity = isKoreaTrip() ? "seoul" : (t.arrCity || "");
  const newDay = {
    day: 0, // will be renumbered
    date: "",
    dateLabel: "",
    weekday: "",
    city: sourceDay?.city || defaultCity,
    title: "",
    type: "normal",
    flight: null,
    narrative: null,
    notes: null,
    hotel: sourceDay?.hotel ? { ...sourceDay.hotel } : null,
    items: []
  };
  state.itinerary.splice(afterIdx + 1, 0, newDay);
  renumberDays();
  saveItin();
  state.activeDayIdx = afterIdx + 1;
  renderItinerary();
}

function deleteDay(idx) {
  if (state.itinerary.length <= 1) {
    alert("لا يمكن حذف اليوم الوحيد");
    return;
  }
  const day = state.itinerary[idx];
  const hasContent = (day.items?.length || 0) > 0 || day.title || day.flight;
  const confirmMsg = hasContent
    ? `حذف يوم ${day.day} (${day.dateLabel})؟\n\nيحتوي على ${day.items?.length || 0} نشاط${day.title ? ` · "${day.title}"` : ''}.\n\nلا يمكن التراجع.`
    : `حذف يوم ${day.day} (${day.dateLabel})؟`;
  if (!confirm(confirmMsg)) return;
  state.itinerary.splice(idx, 1);
  renumberDays();
  saveItin();
  state.activeDayIdx = Math.min(idx, state.itinerary.length - 1);
  renderItinerary();
}

function saveCityTransfer(dayIdx, fromCityId, fromCityName) {
  // Determine destination city
  let toCityId = '';
  let toCityName = '';
  const sel = $("ct-to-city");
  const txtInput = $("ct-to-city-txt");

  if (sel) {
    if (sel.value === '__new__') {
      toCityName = $("ct-new-city-name")?.value.trim();
      if (!toCityName) { alert("يرجى كتابة اسم المدينة الجديدة"); return; }
      toCityId = toCityName.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9؀-ۿ-]/g,"").slice(0,30) || ("city_"+Date.now());
      if (!state.customCities.find(c=>c.id===toCityId)) {
        state.customCities.push({ id: toCityId, name: toCityName, color: "#0891b2" });
        state.cityColors[toCityId] = "#0891b2";
        saveCustomCities(); saveCityColors();
      }
    } else {
      toCityId = sel.value;
      if (!toCityId) { alert("يرجى اختيار مدينة الوصول"); return; }
      toCityName = cityById(toCityId)?.name || state.customCities?.find(c=>c.id===toCityId)?.name || toCityId;
    }
  } else if (txtInput) {
    toCityName = txtInput.value.trim();
    if (!toCityName) { alert("يرجى كتابة اسم المدينة"); return; }
    toCityId = toCityName.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9؀-ۿ-]/g,"").slice(0,30) || ("city_"+Date.now());
    if (!state.customCities.find(c=>c.id===toCityId)) {
      state.customCities.push({ id: toCityId, name: toCityName, color: "#0891b2" });
      state.cityColors[toCityId] = "#0891b2";
      saveCustomCities(); saveCityColors();
    }
  }

  const modeMap = { flight:"✈️ طيران", train:"🚄 قطار", bus:"🚌 باص", car:"🚗 سيارة خاصة", rental:"🚗 سيارة مستأجرة", ferry:"⛴️ عبارة", other:"🛤️" };
  const mode = $("ct-mode").value;
  const time = $("ct-time").value;
  const ref  = $("ct-ref").value.trim();
  const dur  = $("ct-dur").value.trim();
  const notes = $("ct-notes").value.trim();
  const applyForward = $("ct-apply-forward").checked;

  const day = state.itinerary[dayIdx];
  // Add transport item to this day
  day.type = "transit";
  day.flight = { from: fromCityName || fromCityId, to: toCityName, depTime: time, arrTime: "" };
  const itemId = "tr_" + Date.now();
  const modeLabel = modeMap[mode] || mode;
  const itemText = `${modeLabel}: ${fromCityName || fromCityId} → ${toCityName}${ref ? ` (${ref})` : ''}${dur ? ` · ${dur}` : ''}`;
  day.items.push({
    id: itemId, time, type: "transport",
    text: itemText,
    notes: notes || null,
    bookingLink: null, requiresTicket: mode==='flight', done: false, locked: false
  });
  day.city = toCityId; // day of travel ends in the new city

  // Apply new city forward
  if (applyForward) {
    for (let i = dayIdx + 1; i < state.itinerary.length; i++) {
      if (!state.itinerary[i].city || state.itinerary[i].city === fromCityId) {
        state.itinerary[i].city = toCityId;
        // Inherit hotel from last day if not set
        if (!state.itinerary[i].hotel?.name && day.hotel?.name) {
          state.itinerary[i].hotel = { ...day.hotel };
        }
      } else break; // stop at first day that already has a different city
    }
  }

  saveItin();
  closeModal();
  renderItinerary();
}

}

  renumberDays();
  saveItin();
  state.activeDayIdx = idx + 1;
  renderItinerary();
}

// ─── 🔍 DAY ANALYTICS & SMART WARNINGS ───
function analyzeDayWarnings(day) {
  const warnings = [];
  const items = (day.items || []).slice().sort((a, b) =>
    (a.time || "99:99").localeCompare(b.time || "99:99")
  );
  const itemsWithTime = items.filter(i => i.time);

  // Warning 1: Too many activities
  if (items.length >= 9) {
    warnings.push({ level: "warn", icon: "⚠️", text: `يوم مزدحم - ${items.length} نشاط. فكّر في تأجيل بعضها.` });
  }

  // Warning 2: Time conflicts (overlapping items - <30min gap when one is meal/activity)
  for (let i = 0; i < itemsWithTime.length - 1; i++) {
    const a = itemsWithTime[i], b = itemsWithTime[i + 1];
    if (a.time === b.time) {
      warnings.push({ level: "err", icon: "⏰", text: `تداخل: نشاطان في نفس الوقت (${a.time})` });
    }
  }

  // Warning 3: No meals planned
  const hasMeal = items.some(i => i.type === "food");
  if (items.length >= 3 && !hasMeal && day.type === "normal") {
    warnings.push({ level: "info", icon: "🍽️", text: "لم تضع وجبة في هذا اليوم" });
  }

  // Warning 4: Friday → no Friday prayer
  if (day.weekday === "الجمعة" && !items.some(i => i.type === "mosque")) {
    warnings.push({ level: "info", icon: "🕌", text: "يوم جمعة - لم تضع وقتاً لصلاة الجمعة" });
  }

  // Warning 5: Long distance between consecutive items
  for (let i = 0; i < itemsWithTime.length - 1; i++) {
    const a = itemsWithTime[i], b = itemsWithTime[i + 1];
    if (a.lat && a.lng && b.lat && b.lng) {
      const dist = calcDistKm(a.lat, a.lng, b.lat, b.lng);
      if (dist > 20) {
        warnings.push({ level: "info", icon: "🚇", text: `مسافة كبيرة (${dist.toFixed(0)}كم) بين "${shortText(a.text)}" و "${shortText(b.text)}"` });
      }
    }
  }

  // Warning 6: Very early start
  if (itemsWithTime.length && itemsWithTime[0].time < "06:00") {
    warnings.push({ level: "info", icon: "🌅", text: `بداية مبكرة جداً (${itemsWithTime[0].time}) - تأكد من النوم مبكراً` });
  }

  // Warning 7: Very late ending
  if (itemsWithTime.length && itemsWithTime[itemsWithTime.length - 1].time > "23:00") {
    warnings.push({ level: "info", icon: "🌙", text: "ينتهي اليوم متأخراً - فكّر في الاستراحة قبل النشاط الأخير" });
  }

  return warnings;
}

function calcDistKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
            Math.sin(dLng/2) * Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function shortText(s) {
  if (!s) return "";
  return s.length > 25 ? s.slice(0, 25) + "…" : s;
}

// Compute buffer time between two consecutive items
// Returns gap in minutes between two "HH:MM" strings, or null if either missing/invalid
function _timeGapMins(t1, t2) {
  if (!t1 || !t2) return null;
  const p1 = t1.split(":").map(Number);
  const p2 = t2.split(":").map(Number);
  if (p1.length < 2 || p2.length < 2 || isNaN(p1[0]) || isNaN(p2[0])) return null;
  const m1 = p1[0] * 60 + (p1[1] || 0);
  const m2 = p2[0] * 60 + (p2[1] || 0);
  return m2 - m1;
}

function computeBuffer(prevTime, nextTime) {
  if (!prevTime || !nextTime) return null;
  const [h1, m1] = prevTime.split(":").map(Number);
  const [h2, m2] = nextTime.split(":").map(Number);
  const mins = (h2 * 60 + m2) - (h1 * 60 + m1);
  if (mins <= 0) return null;
  if (mins < 30) return null; // too short to show
  if (mins < 60) return `${mins}د فجوة`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m === 0 ? `${h}س فجوة` : `${h}س ${m}د فجوة`;
}

// Toggle item completion status
function toggleItemDone(id) {
  const day = state.itinerary[state.activeDayIdx];
  const item = day.items.find(i => i.id === id);
  if (!item) return;
  item.done = !item.done;
  saveItin();
  renderItinerary();
}

function backToCategory() {
  state.pickerStep = "category";
  state.pickerCategory = null;
  renderPicker();
}

function renderCategoryFlow() {
  const cat = ADD_CATEGORIES.find(c => c.id === state.pickerCategory);
  const day = state.itinerary[state.pendingInsert.dayIdx];

  // Suggest next time
  const sorted = [...day.items].sort((a,b) => (a.time || "99:99").localeCompare(b.time || "99:99"));
  const lastTime = sorted.length ? sorted[sorted.length - 1].time : "09:00";
  const [h, m] = (lastTime || "09:00").split(":").map(Number);
  const nextH = Math.min(h + (cat.id === 'meal' ? 3 : 2), 22);
  const suggestedTime = `${String(nextH).padStart(2,'0')}:00`;

  let formHTML = '';

  if (cat.id === "stay") {
    formHTML = renderStayForm(suggestedTime);
  } else if (cat.id === "transport") {
    formHTML = renderTransportForm(suggestedTime);
  } else if (cat.id === "meal") {
    formHTML = renderMealForm(suggestedTime);
  } else if (cat.id === "activity") {
    formHTML = renderActivityForm(suggestedTime);
  } else if (cat.id === "tour") {
    formHTML = renderTourForm(suggestedTime);
  } else if (cat.id === "note") {
    formHTML = renderNoteForm(suggestedTime);
  }

  return `
    <button class="back-btn" onclick="backToCategory()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      رجوع للفئات
    </button>
    <div class="cat-header" style="--cat-c:${cat.color}">
      <div class="cat-header-ic">${cat.icon}</div>
      <div>
        <div class="fb7 cli">${cat.label}</div>
        <div class="txx clm">${cat.desc}</div>
      </div>
    </div>
    ${formHTML}
  `;
}

function _switchMealTab(tab) {
  const libSec = document.getElementById("meal-lib-section");
  const newSec = document.getElementById("meal-new-section");
  const tabLib = document.getElementById("tab-meal-lib");
  const tabNew = document.getElementById("tab-meal-new");
  if (tab === "lib") {
    if (libSec) libSec.hidden = false;
    if (newSec) newSec.hidden = true;
    tabLib?.classList.add("act"); tabNew?.classList.remove("act");
    renderMealLibList();
  } else {
    if (libSec) libSec.hidden = true;
    if (newSec) newSec.hidden = false;
    tabLib?.classList.remove("act"); tabNew?.classList.add("act");
    setTimeout(() => document.getElementById("meal-name")?.focus(), 50);
  }
}

function renderMealLibList() {
  const q = ($("meal-search")?.value || "").toLowerCase();
  const cityFilter = $("meal-city-filter")?.value ?? "";
  const list = $("meal-lib-list");
  if (!list) return;

  const filtered = allLib().filter(l => {
    if (l.type !== "food") return false;
    if (cityFilter) {
      const lc = _CITY_AL[l.city] || l.city;
      const fc = _CITY_AL[cityFilter] || cityFilter;
      if (lc !== fc && l.city !== "all") return false;
    }
    if (q && !((l.name||"") + " " + (l.area||"")).toLowerCase().includes(q)) return false;
    return true;
  });

  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="empty-i">🔍</div><div class="empty-t">لا نتائج</div></div>`;
    return;
  }
  list.innerHTML = `<div class="picker-list">${filtered.map(l => `
    <button class="picker-item" onclick="addMealFromLib('${l.id}')">
      <div class="picker-item-ic" style="background:#16a34a1a;color:#16a34a">${l.icon||"🍽️"}</div>

      </div>
    </button>`).join('')}</div>`;
}

function _switchActTab(tab) {

  const tabNew = document.getElementById("tab-new");
  if (tab === 'lib') {
    if (libSec) libSec.hidden = false;
    if (newSec) newSec.hidden = true;
    tabLib?.classList.add('act'); tabNew?.classList.remove('act');
    const day = state.itinerary[state.pendingInsert?.dayIdx];
    const dayCityNorm = (day?.city||"").toLowerCase();
    const cityAliases = {"إسطنبول":"istanbul","اسطنبول":"istanbul","أنطاليا":"antalya","انطاليا":"antalya","طرابزون":"trabzon","أنقرة":"ankara","انقرة":"ankara","بورصة":"bursa","إزمير":"izmir","كابادوكيا":"cappadocia","لندن":"london","إدنبرة":"edinburgh","ادنبره":"edinburgh","مانشستر":"manchester","سيول":"seoul","بوسان":"busan","جيجو":"jeju"};

  } else {

let actFilter = "all";
function setActFilter(t, ev) {
  actFilter = t;
  document.querySelectorAll('#act-type-filter .fb-btn').forEach(b => b.classList.toggle('act', b.dataset.t === t));
  renderActLibList();
}

function renderActLibList() {
  const q = ($("act-search")?.value || "").toLowerCase();
  const cityFilter = $("act-city-filter")?.value ?? "";
  const list = $("act-lib-list");
  if (!list) return;

  const cityAliases = {"إسطنبول":"istanbul","اسطنبول":"istanbul","أنطاليا":"antalya","انطاليا":"antalya","طرابزون":"trabzon","أنقرة":"ankara","انقرة":"ankara","بورصة":"bursa","إزمير":"izmir","كابادوكيا":"cappadocia","لندن":"london","إدنبرة":"edinburgh","ادنبره":"edinburgh","مانشستر":"manchester","سيول":"seoul","بوسان":"busan","جيجو":"jeju"};

  const filtered = allLib().filter(l => {
    if (cityFilter) {
      const lCity = cityAliases[l.city] || l.city;
      const fCity = cityAliases[cityFilter] || cityFilter;
      if (lCity !== fCity && l.city !== "all") return false;
    }
    if (actFilter !== "all" && l.type !== actFilter) return false;
    if (q && !((l.name || '') + ' ' + (l.area || '')).toLowerCase().includes(q)) return false;
    return true;
  });

  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="empty-i">🔍</div><div class="empty-t">لا نتائج</div><p class="empty-d">جرّب "موقع جديد"</p></div>`;
    return;
  }

  list.innerHTML = `<div class="picker-list">${filtered.map(l => `
    <button class="picker-item" onclick="addActivityFromLib('${l.id}')">
      <div class="picker-item-ic" style="background:${TYPES[l.type]?.color || '#888'}1a;color:${TYPES[l.type]?.color || '#888'}">${l.icon}</div>
      <div class="picker-item-info">
        <div class="picker-item-n">${l.name}</div>
        <div class="picker-item-m">${l.area} · ${TYPES[l.type]?.label || l.type}</div>
        <div class="picker-item-pills">
          ${l.halal ? '<span class="pill pill-sm pill-ok">🥩 حلال</span>' : ''}
          ${l.price ? `<span class="pill pill-sm">${l.price}</span>` : ''}
        </div>
      </div>
    </button>
  `).join('')}</div>`;
}

function saveActivityNew() {
  const name = $("act-name").value.trim();
  if (!name) { alert("الاسم مطلوب"); return; }
  const type = $("act-type").value;
  const time = $("act-time").value;
  const area = ($("act-area")?.value || "").trim();
  const price = ($("act-price")?.value || "").trim();
  const dur = ($("act-dur")?.value || "").trim();
  const note = ($("act-note")?.value || "").trim();
  const save = $("act-save")?.checked ?? false;

  const meta = [];
  if (price) meta.push(price);
  if (dur) meta.push(`⏱️ ${dur}`);

  const day = state.itinerary[state.pendingInsert.dayIdx];

  if (save) {
    const customId = "c_" + Date.now();
    state.customLib.push({
      id: customId, name, type, area,
      icon: TYPES[type]?.icon || "📍",
      city: day.city, note, price, custom: true
    });
    saveLib();
    day.items.push({
      id: "i_" + Date.now(), time, text: name, type, refId: customId,
      note: [note, meta.join(" · ")].filter(Boolean).join(" — ") || null
    });

    day.items.push({
      id: "i_" + Date.now(), time, text: name, type,
      note: [note, meta.join(" · ")].filter(Boolean).join(" — ") || null
    });
  }
  saveItin();
  closeModal();
  renderItinerary();
}

function openTimePicker(refId) {
  const item = libById(refId);
  if (!item) return;
  const day = state.itinerary[state.pendingInsert.dayIdx];
  // Suggest next time slot
  const sorted = [...day.items].sort((a,b) => (a.time || "99:99").localeCompare(b.time || "99:99"));
  const lastTime = sorted.length ? sorted[sorted.length - 1].time : "09:00";
  const [h, m] = (lastTime || "09:00").split(":").map(Number);
  const nextH = Math.min(h + 2, 22);
  const suggested = `${String(nextH).padStart(2,'0')}:00`;

  openModal(`
    <div class="modal-h">
      <h3>وقت الزيارة</h3>
      <button class="modal-x" onclick="closeModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="card mb3">
      <div class="flx its g75">
        <div class="picker-item-ic" style="background:${TYPES[item.type]?.color || '#888'}1a;color:${TYPES[item.type]?.color || '#888'}">${item.icon}</div>
        <div class="fls">
          <div class="fb6 cli txm">${item.name}</div>
          <div class="txx clm">${item.area}</div>
        </div>
      </div>
    </div>
    <div class="fld">
      <label>الوقت</label>
      <input type="time" class="input" id="time-pick" value="${suggested}">
    </div>
    <div class="fld">
      <label>وصف مخصص (اختياري - افتراضياً اسم الموقع)</label>
      <input type="text" class="input" id="text-pick" placeholder="${item.name}">
    </div>
    <div class="modal-act">
      <button class="btn btn-sec" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-pri" onclick="addItemFromLib('${refId}')">إضافة</button>
    </div>
  `);
}

function addItemFromLib(refId) {
  const item = libById(refId);
  const time = $("time-pick").value;
  const customText = $("text-pick").value.trim();
  const day = state.itinerary[state.pendingInsert.dayIdx];
  day.items.push({
    id: "i_" + Date.now(),
    time,
    text: customText || item.name,
    type: item.type,
    refId: item.id,
    lat: item.lat,
    lng: item.lng
  });
  saveItin();
  closeModal();
  renderItinerary();
}

function saveNewItem() {
  const name = $("new-name").value.trim();

  const lng = parseFloat($("new-lng").value) || null;
  const note = $("new-note").value.trim();
  const halal = $("new-halal").checked;
  const gf = $("new-gf").checked;
  const save = $("new-save").checked;

  const day = state.itinerary[state.pendingInsert.dayIdx];

  let refId = null;
  if (save) {
    refId = "c_" + Date.now();
    state.customLib.push({
      id: refId, name, type, city: day.city, area: area || day.city,

  day.items.push({

  const list = kind === "out" ? state.tripInfo.outboundFlights : state.tripInfo.returnFlights;

}

  const isNew = i < 0;
  openModal(`

    <div class="fld-row">
      <div class="fld">
        <label>من</label>
        <input type="text" class="input" id="fl-from" value="${f.from || ''}" placeholder="جدة (JED)">

      <div class="fld">

    <div class="fld">

      <input type="date" class="input" id="fl-date" value="${f.depDate || ''}">
    </div>
    <div class="fld-row">
      <div class="fld">
        <label>وقت الانطلاق</label>

      <div class="fld">

        <input type="time" class="input" id="fl-arr" value="${f.arrTime || ''}">
      </div>
    </div>
    <div class="fld">
      <label>رقم الحجز / PNR (اختياري)</label>
      <input type="text" class="input" id="fl-pnr" value="${f.pnr || ''}">
    </div>
    <div class="modal-act">
      <button class="btn btn-sec" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-pri" onclick="saveFlightFromModal('${kind}', ${i})">حفظ</button>
    </div>
  `);
}

function saveFlightFromModal(kind, i) {
  const f = {
    airline: $("fl-air").value.trim(),
    from: $("fl-from").value.trim(),
    to: $("fl-to").value.trim(),
    depDate: $("fl-date").value,
    depTime: $("fl-dep").value,
    arrTime: $("fl-arr").value,
    pnr: $("fl-pnr").value.trim()
  };
  const key = kind === "out" ? "outboundFlights" : "returnFlights";
  if (!state.tripInfo[key]) state.tripInfo[key] = [];
  if (i < 0) state.tripInfo[key].push(f);
  else state.tripInfo[key][i] = f;
  saveTripInfo();
  openTripSettings();
}

function deleteFlight(kind, i) {
  if (!confirm("حذف هذه الرحلة؟")) return;
  const key = kind === "out" ? "outboundFlights" : "returnFlights";
  state.tripInfo[key].splice(i, 1);
  saveTripInfo();
  openTripSettings();
}

function saveTripInfoForm() {
  state.tripInfo.destination = $("ti-dest")?.value.trim() || state.tripInfo.destination;
  state.tripInfo.travelers = parseInt($("ti-trav")?.value, 10) || 1;
  state.tripInfo.startDate = $("ti-sdate")?.value || state.tripInfo.startDate;
  state.tripInfo.endDate = $("ti-edate")?.value || state.tripInfo.endDate;
  state.tripInfo.ticketRef = $("ti-ref")?.value.trim() || "";
  state.tripInfo.notes = $("ti-notes")?.value.trim() || "";
  saveTripInfo();
}

function updateDayMetaSections() {
  const v = $("dm-type").value;
