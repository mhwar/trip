}

function saveDayMeta() {
  const day = state.itinerary[state.activeDayIdx];
  day.title = $("dm-title").value.trim();
  day.city = $("dm-city").value;
  day.type = $("dm-type").value;
  day.narrative = $("dm-narrative").value.trim() || null;
  day.notes = $("dm-notes").value.trim() || null;

  if (day.type !== "normal") {
    day.flight = {
      from: $("dm-from").value.trim(),
      to: $("dm-to").value.trim(),
      depTime: $("dm-dep").value,
      arrTime: $("dm-arr").value,
      mode: $("dm-mode").value,
      ref: $("dm-flref").value.trim(),
      bookingLink: ($("dm-flbooklink")?.value || '').trim() || null,
      checkoutTime: $("dm-checkout-time").value
    };
  } else {
    day.flight = null;
  }

  // Hotel handling — apply to N consecutive days
  const hotelName = $("dm-hotel-name").value.trim();
  if (hotelName) {
    const nights = Math.max(1, parseInt($("dm-hotel-nights").value, 10) || 1);
    const hotel = {
      name: hotelName,
      address: $("dm-hotel-addr").value.trim(),
      checkIn: $("dm-hotel-cin").value || "15:00",
      checkOut: $("dm-hotel-cout").value || "11:00",
      nights,
      bookingLink: $("dm-hotel-link").value.trim(),
      notes: $("dm-hotel-notes").value.trim()
    };
    const startIdx = state.activeDayIdx;
    const endIdx = Math.min(state.itinerary.length - 1, startIdx + nights - 1);
    for (let i = startIdx; i <= endIdx; i++) {
      state.itinerary[i].hotel = {
        ...hotel,
        nightIndex: i - startIdx + 1,
        totalNights: nights,
        isFirst: i === startIdx,
        isLast: i === endIdx
      };
    }
  } else {
    day.hotel = null;
  }

  saveItin();
  closeModal();
  renderItinerary();
}

function openDayHotelPicker(dayIdx) {
  const day = state.itinerary[dayIdx];
  const h = day.hotel || {};
  const cityKey = day.city || "";
  // Calculate remaining days in this city segment for smart night suggestion
  let segEnd = dayIdx;
  while (segEnd + 1 < state.itinerary.length && (state.itinerary[segEnd + 1].city || '') === cityKey) segEnd++;
  const segRemainingNights = segEnd - dayIdx + 1;
  const remainingDays = state.itinerary.length - dayIdx;
  const defaultNights = h.nights || segRemainingNights;

  // Pull hotels from LIB (AI-generated) and from CITIES districts (built-in)
  const libHotels = (typeof allLib === "function" ? allLib() : (typeof LIB !== "undefined" ? LIB : []))
    .filter(it => it.type === "hotel");

  // Flatten CITIES districts hotels into a unified format
  const districtHotels = [];
  if (typeof CITIES !== "undefined") {
    CITIES.forEach(c => {
      (c.districts || []).forEach(dist => {
        (dist.hotels || []).forEach((dh, idx) => {
          districtHotels.push({
            id: `dist_${c.id}_${dist.id}_${idx}`,
            name: dh.name,
            area: dist.name,
            city: c.id,
            price: dh.price,
            note: dh.note,
            lat: dh.lat, lng: dh.lng,
            _isDist: true
          });
        });
      });
    });
  }

  const allHotels = [...libHotels, ...districtHotels];
  const cityHotels = allHotels.filter(h2 => (h2.city || "").toLowerCase() === cityKey.toLowerCase());
  const otherHotels = allHotels.filter(h2 => (h2.city || "").toLowerCase() !== cityKey.toLowerCase());
  const hasLib = cityHotels.length > 0 || otherHotels.length > 0;

  const hotelCard = (it) => `
    <button class="hotel-pick-card" onclick="_pickHotelFromLib('${it.id}', ${dayIdx})">
      <div class="hotel-pick-ic">🏨</div>
      <div class="hotel-pick-bd">
        <div class="hotel-pick-n">${it.name.replace(/^✨ /,'')}</div>
        ${it.area ? `<div class="hotel-pick-a">📍 ${it.area}</div>` : ''}
        ${it.price ? `<div class="hotel-pick-p">${it.price}</div>` : ''}
        ${it.note ? `<div class="hotel-pick-a" style="color:var(--ink-soft)">${it.note.substring(0,60)}${it.note.length>60?'…':''}</div>` : ''}
      </div>
      <svg class="hotel-pick-arr" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
  `;

  openModal(`
    <div class="modal-h">
      <h3>🏨 فندق · يوم ${day.day} (${day.dateLabel || ''})</h3>
      <button class="modal-x" onclick="closeModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>

    <div class="hotel-pick-nights">
      <div class="hotel-pick-nights-l">🌙 عدد الليالي</div>
      <div class="hotel-pick-nights-ctrl">
        <button class="hotel-pick-nights-btn" onclick="dhNightsAdj(-1,${remainingDays})">−</button>
        <span class="hotel-pick-nights-val" id="dh-nights-val">${defaultNights}</span>
        <button class="hotel-pick-nights-btn" onclick="dhNightsAdj(1,${remainingDays})">+</button>
      </div>
    </div>

    ${cityHotels.length > 0 ? `
      <div class="hotel-pick-sec">
        <div class="hotel-pick-sec-l">🏙️ من المكتبة · ${LIB_CITY_NAMES?.[cityKey] || cityKey}</div>
        <div class="hotel-pick-grid">${cityHotels.map(hotelCard).join('')}</div>
      </div>
    ` : ''}
    ${otherHotels.length > 0 ? `
      <details class="hotel-pick-sec">
        <summary class="hotel-pick-sec-l" style="cursor:pointer;list-style:none;display:flex;align-items:center;gap:0.4rem">
          <span>📚 فنادق مدن أخرى (${otherHotels.length})</span>
        </summary>
        <div class="hotel-pick-grid" style="margin-top:0.5rem">${otherHotels.map(hotelCard).join('')}</div>
      </details>
    ` : ''}

    <button class="hotel-pick-manual-toggle" onclick="document.getElementById('dh-manual').classList.toggle('open');this.textContent=document.getElementById('dh-manual').classList.contains('open')?'▲ إخفاء الإدخال اليدوي':'✏️ إدخال يدوي (اسم + تفاصيل)'">
      ✏️ إدخال يدوي (اسم + تفاصيل)
    </button>

    <div class="hotel-pick-manual-body ${!hasLib ? 'open' : ''}" id="dh-manual">

let _dhNights = null;
function dhNightsAdj(delta, max) {
  const el = $("dh-nights-val");
  if (!el) return;
  const cur = parseInt(el.textContent, 10) || 1;
  el.textContent = Math.max(1, Math.min(max, cur + delta));
}

function _pickHotelFromLib(libId, dayIdx) {
  // Search in LIB first, then in CITIES districts (dist_ prefix)
  let it = (typeof allLib === "function" ? allLib() : LIB).find(x => x.id === libId);
  if (!it && libId.startsWith("dist_")) {
    const parts = libId.split("_"); // dist_cityId_distId_idx
    const cityId = parts[1], distId = parts[2], idx = parseInt(parts[3]);
    const city = (typeof CITIES !== "undefined" ? CITIES : []).find(c => c.id === cityId);
    const dist = city?.districts?.find(d => d.id === distId);
    const dh = dist?.hotels?.[idx];
    if (dh) it = { id: libId, name: dh.name, area: dist.name, city: cityId, price: dh.price, note: dh.note };
  }
  if (!it) return;
  const nights = parseInt($("dh-nights-val")?.textContent, 10) || 1;
  // Try to extract a numeric cost from the library price string (e.g. "من $120", "£130/night", "1200 ر.س")
  const _pm = (it.price || '').replace(/[،,]/g, '').match(/(\d+(?:\.\d+)?)/);
  const costPerNight = _pm ? parseFloat(_pm[1]) : 0;
  const hotel = {
    name: it.name,
    address: it.area || '',
    checkIn: '15:00',
    checkOut: '11:00',
    nights,
    bookingLink: it.bookingLink || '',
    notes: '',
    costPerNight
  };
  const endIdx = Math.min(state.itinerary.length - 1, dayIdx + nights - 1);
  for (let i = dayIdx; i <= endIdx; i++) {
    state.itinerary[i].hotel = {
      ...hotel,
      nightIndex: i - dayIdx + 1,
      totalNights: nights,
      isFirst: i === dayIdx,
      isLast: i === endIdx
    };
  }
  saveItin();
  closeModal();
  renderItinerary();
}

function _saveDayHotelManual(dayIdx) {
  const name = $("dh-name").value.trim();
  if (!name) {
    alert("⚠️ أدخل اسم الفندق أولاً");
    return;
  }
  const nights = Math.max(1, parseInt($("dh-nights-val")?.textContent, 10) || 1);
  const hotel = {
    name,
    address: $("dh-addr").value.trim(),
    checkIn: $("dh-cin").value || "15:00",
    checkOut: $("dh-cout").value || "11:00",
    nights,
    bookingLink: $("dh-link").value.trim(),
    notes: $("dh-notes").value.trim(),
    costPerNight: parseFloat($("dh-cost")?.value) || 0
  };
  const startIdx = dayIdx;
  const endIdx = Math.min(state.itinerary.length - 1, startIdx + nights - 1);
  for (let i = startIdx; i <= endIdx; i++) {
    state.itinerary[i].hotel = {
      ...hotel,
      nightIndex: i - startIdx + 1,
      totalNights: nights,
      isFirst: i === startIdx,
      isLast: i === endIdx
    };
  }
  saveItin();
  closeModal();
  renderItinerary();
}

function clearDayHotel(dayIdx) {
  if (!confirm("إزالة الفندق من هذا اليوم؟")) return;
  const day = state.itinerary[dayIdx];
  // Clear all related days that share the same hotel
  if (day.hotel && day.hotel.totalNights > 1) {
    const offset = day.hotel.nightIndex - 1;
    const start = dayIdx - offset;
    const end = start + day.hotel.totalNights - 1;
    for (let i = start; i <= end; i++) {
      if (state.itinerary[i]) state.itinerary[i].hotel = null;
    }
  } else {
    day.hotel = null;
  }
  saveItin();
  renderItinerary();
}

function _openHotelOverview() {
  const existing = document.getElementById('hov-overlay');
  if (existing) { existing.remove(); return; }
  const segs = getHotelSegments();
  const totalNightsNeeded = segs.reduce((s, sg) => s + sg.nightsNeeded, 0);
  const totalBooked = segs.reduce((s, sg) => s + sg.coveredCount, 0);
  const allDone = segs.every(sg => sg.allCovered);

  const segHtml = segs.map(sg => {
    const r = parseInt(sg.color.slice(1,3),16)||26, gv = parseInt(sg.color.slice(3,5),16)||77, bv = parseInt(sg.color.slice(5,7),16)||74;
    const badgeStyle = sg.allCovered
      ? 'background:#dcfce7;color:#166534'
      : sg.partCovered
        ? 'background:#fef9c3;color:#854d0e'
        : 'background:#fee2e2;color:#991b1b';
    const badgeText = sg.allCovered ? '✓ محجوز' : sg.noCovered ? '⚠ غير محجوز' : `${sg.coveredCount}/${sg.dayCount} محجوز`;

    const nightDots = Array.from({length: sg.nightsNeeded}, (_, k) => {
      const dayI = sg.startIdx + k;
      const booked = state.itinerary[dayI]?.hotel?.name;
      return `<div class="hov-night-dot" style="background:${booked ? sg.color : '#e5e7eb'}" title="ليلة ${k+1}"></div>`;
    }).join('');

    const hotelNamesHtml = sg.hotelNames.length
      ? sg.hotelNames.map(n => `<span style="font-size:0.82rem;font-weight:600;color:#0f172a">${n.replace(/^✨ /,'')}</span>`).join('<span style="color:#94a3b8;font-size:0.7rem"> · </span>')
      : `<span style="color:#94a3b8;font-style:italic;font-size:0.78rem">لم يُحدَّد فندق بعد</span>`;

    // Booking recommendation: checkin → checkout dates (how booking apps show it)
    const bookingRec = sg.checkInLabel && sg.checkOutLabel

function _hovClearSegment(startIdx, endIdx) {
  if (!confirm('مسح بيانات السكن لكل هذه الأيام؟')) return;

  }
  saveItin();
  document.getElementById('hov-overlay')?.remove();
  renderItinerary();
}

function _libFltActiveCount() {
  const f = state.libFilters;
  return (f.types?.length || 0) + (f.halal ? 1 : 0) + (f.gf ? 1 : 0) + (f.fav ? 1 : 0) + (f.city && f.city !== 'all' ? 1 : 0);
}

function _syncLibFltBar() {
  const cnt = _libFltActiveCount();
  const trigger = document.getElementById('lib-flt-trigger');
  if(trigger) {
    trigger.classList.toggle('has-active', cnt > 0);
    const badge = trigger.querySelector('.lib-flt-badge');
    if(badge) { badge.textContent = cnt; badge.style.display = cnt > 0 ? 'inline-flex' : 'none'; }
  }
  const tagsEl = document.getElementById('lib-flt-tags');
  if(tagsEl) tagsEl.innerHTML = _buildLibFltTagsHtml();
}

function _buildLibFltTagsHtml() {
  const f = state.libFilters;
  const LCN = typeof LIB_CITY_NAMES !== 'undefined' ? LIB_CITY_NAMES : {};
  const typeLabels = {food:'مطاعم',attraction:'معالم',entertainment:'ترفيه',shop:'تسوق',mosque:'مساجد',festival:'فعاليات'};
  const tags = [];
  if (f.city && f.city !== 'all') tags.push(`<span class="lib-flt-tag">📍 ${LCN[f.city]||f.city}<button onclick="state.libFilters.city='all';renderLibList();_syncLibFltBar()" title="إزالة">×</button></span>`);
  (f.types||[]).forEach(t => tags.push(`<span class="lib-flt-tag">${typeLabels[t]||t}<button onclick="state.libFilters.types=state.libFilters.types.filter(x=>x!=='${t}');renderLibList();_syncLibFltBar()" title="إزالة">×</button></span>`));
  if(f.halal) tags.push(`<span class="lib-flt-tag">🥩 حلال<button onclick="state.libFilters.halal=false;renderLibList();_syncLibFltBar()" title="إزالة">×</button></span>`);
  if(f.gf) tags.push(`<span class="lib-flt-tag">🌾 GF<button onclick="state.libFilters.gf=false;renderLibList();_syncLibFltBar()" title="إزالة">×</button></span>`);
  if(f.fav) tags.push(`<span class="lib-flt-tag">❤️ المفضلة<button onclick="state.libFilters.fav=false;renderLibList();_syncLibFltBar()" title="إزالة">×</button></span>`);
  return tags.join('');
}

function _libFltTypeSet(t) {
  if (!Array.isArray(state.libFilters.types)) state.libFilters.types = [];
  if (t === 'all') {
    state.libFilters.types = [];
  } else {
    const arr = state.libFilters.types;
    const i = arr.indexOf(t);
    if (i >= 0) arr.splice(i, 1); else arr.push(t);
  }
  renderLibList();
  _syncLibFltBar();
  const types = state.libFilters.types;
  document.querySelectorAll('.flt-type-btn').forEach(b => {
    if (b.dataset.type === 'all') b.classList.toggle('act', types.length === 0);
    else b.classList.toggle('act', types.includes(b.dataset.type));
  });
}

function _libFltCitySet(cid) {
  state.libFilters.city = cid;
  renderLibList();
  _syncLibFltBar();
  const color = (state.cityColors && cid !== 'all' && state.cityColors[cid]) || '#1a4d4a';
  document.querySelectorAll('.flt-city-btn').forEach(b => {
    const isAct = b.dataset.city === cid;
    b.classList.toggle('act', isAct);
    b.style.background = isAct && cid !== 'all' ? color : '';
    b.style.borderColor = isAct && cid !== 'all' ? color : '';
    b.style.color = isAct && cid !== 'all' ? '#fff' : '';
  });
}

function _libFltToggle(feat, colorClass) {
  state.libFilters[feat] = !state.libFilters[feat];
  renderLibList();
  _syncLibFltBar();
  const btn = document.querySelector(`.flt-feat-btn[data-feat="${feat}"]`);
  if(btn) btn.className = 'lib-toggle flt-feat-btn' + (state.libFilters[feat] ? ' '+colorClass : '');
}

function _getMapsApp() { return localStorage.getItem('mapsApp') || 'google'; }
function _setMapsApp(app) {
  localStorage.setItem('mapsApp', app);
  document.querySelectorAll('.maps-toggle').forEach(b => b.classList.toggle('act', b.dataset.app === app));
}
function _mapsUrl(name, area) {
  const q = encodeURIComponent(name + (area ? ' ' + area : ''));
  return _getMapsApp() === 'naver'
    ? `https://map.naver.com/v5/search/${q}`
    : `https://www.google.com/maps/search/?api=1&query=${q}`;
}

function renderLibrary() {
  const trip = TripsRegistry.get(Trip.current);
  const linkedLib = trip?.countryLib || null;
  const all = allLib();
  const hasLib = all.length > 0 || state.customLib.length > 0;

  if (!hasLib) {
    // Auto-detect matching library from trip name / destination / country
    const globalLibs = getGlobalLibs();
    const availableLibIds = ["korea", ...Object.keys(globalLibs)];
    const tripText = ((trip?.name || "") + " " + (trip?.destination || "") + " " + (state.tripInfo?.arrCity || "")).toLowerCase();
    const countryKeywords = {
      turkey: ["تركيا","turkey","turkish","اسطنبول","إسطنبول","istanbul","ankara","antalya"],
      uk: ["بريطانيا","britain","uk","england","london","لندن","ادنبره","edinburgh"],
      korea: ["كوريا","korea","korean","seoul","سيول","busan"],
      japan: ["اليابان","japan","japanese","tokyo","طوكيو"],
      malaysia: ["ماليزيا","malaysia","kuala","كوالا"],
      uae: ["الإمارات","امارات","uae","dubai","دبي","abudhabi"],
      egypt: ["مصر","egypt","cairo","القاهرة"],
      morocco: ["المغرب","morocco","marrakech","مراكش"],
      france: ["فرنسا","france","paris","باريس"],
      italy: ["إيطاليا","italy","rome","روما"],
      spain: ["إسبانيا","spain","barcelona","برشلونة"],
    };
    let suggestedLib = null;
    for (const [key, keywords] of Object.entries(countryKeywords)) {
      if (keywords.some(k => tripText.includes(k)) && availableLibIds.includes(key)) {
        suggestedLib = key;
        break;
      }
    }
    const suggestedMeta = suggestedLib ? (LIB_META[suggestedLib] || {}) : null;
    const libCount = suggestedLib === "korea"
      ? (typeof LIB !== 'undefined' ? LIB.length : 0)
      : (globalLibs[suggestedLib] || []).length;

    $("sec-library").innerHTML = `
      <div class="sec-t">
        <div class="sec-t-r">
          <div class="sec-t-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div>
          <h2>مكتبة المواقع</h2>
        </div>
        <p>مواقع مقترحة لزيارتها خلال رحلتك</p>
      </div>
      <div class="itin-welcome">
        <div class="itin-welcome-icon">📚</div>
        ${suggestedLib ? `
          <h3 class="itin-welcome-title">${suggestedMeta.icon||'🌍'} تم اكتشاف مكتبة ${suggestedMeta.name||suggestedLib}</h3>
          <p class="itin-welcome-desc">يوجد ${libCount} موقع في مكتبة ${suggestedMeta.name||suggestedLib} جاهزة للربط بهذه الرحلة.</p>
          <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;margin-top:1rem">
            <button class="btn btn-pri" onclick="_linkLibToTrip('${suggestedLib}')">

function renderLibList() {
  const list = $("lib-list");
  const bar = $("lib-result-bar");
  if (!list) return;
  const f = state.libFilters;

  let filtered = allLib().filter(l => {
    const cityMatch = !f.city || f.city === 'all'
      ? true
      : f.city === 'festivals'
        ? l.type === 'festival'
        : (l.city === f.city || l.city === 'all');
    if (!cityMatch) return false;
    if (f.types && f.types.length && !f.types.includes(l.type)) return false;
    if (f.halal && !l.halal) return false;
    if (f.gf && !l.gf) return false;
    if (f.fav && !state.favs.includes(l.id)) return false;
    if (f.q) {
      const q = f.q.toLowerCase();
      const hay = ((l.name || '') + ' ' + (l.area || '') + ' ' + (l.note || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  // Sort
  if (f.sort === "name") filtered.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  else if (f.sort === "city") filtered.sort((a, b) => (a.city || '').localeCompare(b.city) || a.name.localeCompare(b.name, 'ar'));
  else if (f.sort === "type") filtered.sort((a, b) => (a.type || '').localeCompare(b.type) || a.name.localeCompare(b.name, 'ar'));

  // Active filter pills
  const activePills = [];
  if (f.city !== "all") activePills.push({ k: 'city', l: cityById(f.city)?.name || f.city, clear: "state.libFilters.city='all'" });
  (f.types||[]).forEach(t => activePills.push({ k: 'type', l: TYPES[t]?.label || t, clear: `state.libFilters.types=state.libFilters.types.filter(x=>x!=='${t}')` }));
  if (f.halal) activePills.push({ k: 'halal', l: '🥩 حلال', clear: "state.libFilters.halal=false" });
  if (f.gf) activePills.push({ k: 'gf', l: '🌾 GF', clear: "state.libFilters.gf=false" });
  if (f.fav) activePills.push({ k: 'fav', l: '❤️ مفضلة', clear: "state.libFilters.fav=false" });
  if (f.q) activePills.push({ k: 'q', l: `"${f.q}"`, clear: "state.libFilters.q=''" });

  if (bar) {
    bar.innerHTML = `
      <div class="flt-result-bar">
        <div class="flt-cnt">
          <strong>${filtered.length}</strong> من ${allLib().length} موقع
          ${activePills.length > 0 ? `· <span class="flt-cnt-active">${activePills.length} فلتر نشط</span>` : ''}
        </div>
        ${activePills.length > 0 ? `
          <div class="flt-active-list">
            ${activePills.map(p => `
              <span class="flt-active-pill">
                ${p.l}
                <button onclick="${p.clear};renderLibrary()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
              </span>
            `).join('')}
            <button class="flt-clear-all" onclick="resetFilters()">مسح الكل</button>
          </div>
        ` : ''}
      </div>
    `;
  }

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="empty-i">🔍</div>
        <div class="empty-t">لا توجد نتائج</div>
        <p class="empty-d">جرّب تغيير الفلاتر أو ابحث عن كلمة أخرى. لديك ${activePills.length} فلتر نشط الآن.</p>

          ${activePills.length > 0 ? `<button class="btn btn-pri" onclick="resetFilters()">مسح كل الفلاتر</button>` : ''}
        </div>
      </div>
    `;
    return;
  }

  list.innerHTML = `<div class="lib-grid">${filtered.map(l => renderPOI(l)).join('')}</div>`;
}

function initMap() {
  // Wait for Leaflet to load (it's loaded async from CDN)
  if (typeof L === 'undefined') {
    const tm = document.getElementById('tripmap');
    if (tm) tm.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--muted)">⏳ جاري تحميل الخريطة...</div>';
    setTimeout(initMap, 200);
    return;
  }
  if (state.mapInst) {
    state.mapInst.remove();
    state.mapInst = null;
  }
  const tm = document.getElementById('tripmap');
  if (!tm) return;
  tm.innerHTML = ''; // clear any loading message
  const map = L.map('tripmap', { zoomControl: true }).setView([36.5, 127.5], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 19
  }).addTo(map);
  state.mapInst = map;
  state.mapMarkers = L.layerGroup().addTo(map);
  drawMarkers();
}

function flyToCity(cid) {
  const c = cityById(cid);
  if (state.mapInst && c) state.mapInst.setView([c.lat, c.lng], 11);
}

function drawMarkers() {
  if (typeof L === 'undefined' || !state.mapMarkers) return;

  // Clear previous cluster group
  if (window._mapClusterGroup) { state.mapInst.removeLayer(window._mapClusterGroup); window._mapClusterGroup = null; }
  state.mapMarkers.clearLayers();

  // Set up cluster group
  const clusterGroup = (typeof L.markerClusterGroup === 'function')
    ? L.markerClusterGroup({ maxClusterRadius: 50 })
    : null;

  const visibleLatLngs = [];

  // Library POIs
  allLib().forEach(l => {
    if (!l.lat || !l.lng) return;
    if (state.mapCity !== "all" && l.city !== state.mapCity) return;
    if (l.custom && !state.mapLayers.custom) return;
    if (!l.custom && !state.mapLayers[l.type]) return;
    const color = TYPES[l.type]?.color || "#888";
    const icon = L.divIcon({
      className: '',
      html: `<div style="background:${color};width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);font-size:14px">${l.icon}</div>`,
      iconSize: [28, 28], iconAnchor: [14, 14]
    });
    const noteShort = (l.note||'').slice(0,90) + ((l.note||'').length>90?'…':'');
    const typeLabel = TYPES?.[l.type]?.label || l.type || '';
    const marker = L.marker([l.lat, l.lng], { icon });
    marker.bindPopup(`
      <div style="direction:rtl;min-width:160px;font-family:system-ui">
        <div style="font-weight:700;font-size:.95rem;margin-bottom:.25rem">${l.icon||''} ${l.name}</div>
        <div style="font-size:.75rem;color:#6b7280;margin-bottom:.3rem">${l.area||''} ${typeLabel?`· ${typeLabel}`:''}</div>
        ${noteShort?`<div style="font-size:.8rem;margin-bottom:.4rem;color:#374151">${noteShort}</div>`:''}
        ${l.halal?'<span style="background:#dcfce7;color:#166534;font-size:.7rem;padding:.1rem .4rem;border-radius:4px;margin-left:.25rem">حلال</span>':''}
        ${l.gf?'<span style="background:#fef9c3;color:#854d0e;font-size:.7rem;padding:.1rem .4rem;border-radius:4px">GF</span>':''}
        ${l.name?`<div style="margin-top:.4rem"><a href="${_mapsUrl(l.name, l.area)}" target="_blank" style="font-size:.72rem;color:#2563eb">فتح بالخرائط ↗</a></div>`:''}
      </div>
    `, { maxWidth: 220 });
    clusterGroup ? clusterGroup.addLayer(marker) : marker.addTo(state.mapMarkers);
    visibleLatLngs.push([l.lat, l.lng]);
  });

  // Plan items (itinerary)
  if (state.mapLayers.plan) {
    state.itinerary.forEach((d, di) => {
      d.items.forEach(it => {
        if (!it.lat || !it.lng) return;
        if (state.mapCity !== "all" && d.city !== state.mapCity) return;
        const icon = L.divIcon({
          className: '',
          html: `<div style="background:var(--accent);color:white;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--gold);box-shadow:0 2px 6px rgba(0,0,0,0.4);font-size:11px;font-weight:700">D${d.day}</div>`,
          iconSize: [26, 26], iconAnchor: [13, 13]
        });
        const marker = L.marker([it.lat, it.lng], { icon });
        marker.bindPopup(`
          <div style="direction:rtl;min-width:140px;font-family:system-ui">
            <div style="font-weight:700;font-size:.9rem;margin-bottom:.2rem">${TYPES[it.type]?.icon || ''} ${it.text}</div>
            <div style="font-size:.75rem;color:#6b7280">يوم ${d.day} · ${it.time || ''}</div>
          </div>
        `, { maxWidth: 200 });
        clusterGroup ? clusterGroup.addLayer(marker) : marker.addTo(state.mapMarkers);
        visibleLatLngs.push([it.lat, it.lng]);
      });
    });
  }

  if (clusterGroup) {
    state.mapInst.addLayer(clusterGroup);
    window._mapClusterGroup = clusterGroup;
  }

  // Fit map to visible markers
  try {
    if (visibleLatLngs.length > 1) state.mapInst.fitBounds(visibleLatLngs, { padding:[30,30], maxZoom:14 });
    else if (visibleLatLngs.length === 1) state.mapInst.setView(visibleLatLngs[0], 14);
  } catch(e){}
}

function computeHotelBudget() {
  const segs = getHotelSegments();
  return segs.map(seg => {
    let costPerNight = 0, hotelNameFromPicker = '', hotelNameFromItem = '';
    for (let i = seg.startIdx; i <= seg.endIdx; i++) {
      const d = state.itinerary[i];
      // From day.hotel (hotel picker widget)
      if (!hotelNameFromPicker && d.hotel?.name) hotelNameFromPicker = d.hotel.name;
      if (!costPerNight && d.hotel?.costPerNight) costPerNight = d.hotel.costPerNight;
      // From day.items (hotel-type timeline items)
      if (!hotelNameFromItem) {
        const hi = (d.items || []).find(it => it.type === 'hotel');
        if (hi) hotelNameFromItem = hi.text || '';
      }
    }
    const hotelName = hotelNameFromPicker || hotelNameFromItem || '';
    return {
      cityId: seg.cityId,
      cityName: seg.cityName,
      nights: seg.nightsNeeded,
      hotelName,
      costPerNight,
      totalCost: costPerNight * seg.nightsNeeded,
      allCovered: seg.allCovered,
      partCovered: seg.partCovered,
      noCovered: seg.noCovered,
      hasHotelItem: !!(hotelNameFromPicker || hotelNameFromItem)
    };
  });
}

function updateSegHotelCost(cityId, val) {
  const cost = Math.max(0, parseFloat(val) || 0);
  state.itinerary.forEach(d => {
    if ((d.city || '') === cityId) {
      if (!d.hotel) d.hotel = {};
      d.hotel.costPerNight = cost;
    }
  });
  saveItin();
  renderBudget();
}

        <h2>الميزانية الذكية</h2>
      </div>

    <div class="bud-stats">
      <div class="card bud-stat">
        <div class="bud-l">الإجمالي المخطط</div>
        <div class="bud-v">${fmtMain(totalEst)}</div>
        <div class="bud-sar">${fmtSec(totalEst)}</div>
      </div>
      <div class="card bud-stat bud-act-c">
        <div class="bud-l">المنفق / المحجوز</div>
        <div class="bud-v">${fmtMain(totalAct)}</div>
        <div class="bud-sar">${fmtSec(totalAct)}</div>
      </div>
      <div class="card bud-stat bud-rem-c">
        <div class="bud-l">المتبقي</div>
        <div class="bud-v" style="color:${remaining < 0 ? 'var(--err)' : 'inherit'}">${fmtMain(remaining)}</div>

      </div>

    ${hotelSectionHTML}

function updateBud(id, val) {
  const b = state.budget.find(b => b.id === id);
  if (!b) return;
  b.actual = Math.max(0, parseInt(val) || 0);
  Storage.set("kt2_bud", state.budget);
  renderBudget();
}

function renderTasks() {
  const tasks = state.tasks;
  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const pct = total ? Math.round((done / total) * 100) : 0;

  // Categories
  const cats = {};
  tasks.forEach(t => {
    if (!cats[t.cat]) cats[t.cat] = { label: t.catLabel, items: [] };
    cats[t.cat].items.push(t);
  });

  // Filter
  const filter = state.taskFilter;
  const isVisible = (t) => {
    if (filter === "all") return true;
    if (filter === "undone") return !t.done;
    if (filter === "done") return t.done;
    return t.cat === filter;
  };
  const visibleTotal = tasks.filter(isVisible).length;

  // Compute days until trip
  const target = new Date("2026-05-13");
  const daysLeft = Math.max(0, Math.ceil((target - new Date()) / 86400000));

  const _tasksTarget = $("modal-tasks-content") || $("sec-tasks");

  _tasksTarget.innerHTML = `

      <div class="flx jb itm mb2 fwr g5">
        <div>
          <div class="fb7 cli" style="font-size:1.1rem">${done} / ${total} مهمة</div>
          <div class="txs cls">${daysLeft > 0 ? `${daysLeft} يوم متبقٍ على السفر` : 'بدأت الرحلة!'}</div>
        </div>
        <div class="fb7" style="font-size:2rem;color:${pct === 100 ? 'var(--ok)' : 'var(--accent)'}">${pct}%</div>
      </div>
      <div class="task-prog"><div class="task-prog-f" style="width:${pct}%;background:${pct === 100 ? 'var(--ok)' : 'var(--accent)'}"></div></div>
    </div>

    <div class="fb mb3">
      <button class="fb-btn ${filter === 'all' ? 'act' : ''}" onclick="state.taskFilter='all';renderTasks()">الكل (${total})</button>
      <button class="fb-btn ${filter === 'undone' ? 'act' : ''}" onclick="state.taskFilter='undone';renderTasks()">⏳ غير منجز (${total - done})</button>
      <button class="fb-btn ${filter === 'done' ? 'act' : ''}" onclick="state.taskFilter='done';renderTasks()">✅ منجز (${done})</button>
      ${Object.entries(cats).map(([k, v]) => `
        <button class="fb-btn ${filter === k ? 'act' : ''}" onclick="state.taskFilter='${k}';renderTasks()">${v.label} (${v.items.length})</button>
      `).join('')}
    </div>

    <div id="task-list">
      ${visibleTotal === 0 ? `<div class="empty"><div class="empty-i">${filter === 'done' ? '✅' : '🎉'}</div><div class="empty-t">${filter === 'done' ? 'لا توجد مهام منجزة بعد' : filter === 'undone' ? 'كل المهام منجزة!' : 'لا توجد مهام'}</div></div>` :
      Object.entries(cats).map(([k, v]) => {
        const items = v.items.filter(isVisible);
        if (items.length === 0) return '';
        return `
          <div class="task-cat">
            <h3 class="task-cat-h">${v.label} <span class="task-cat-cnt">${items.filter(t => t.done).length}/${items.length}</span></h3>

              </div>
            `).join('')}
          </div>

      }).join('')

    <div class="card card-cream mt3">

        <div style="font-size:1.5rem">💡</div>

    </div>
  `;
}

function toggleTask(id) {
  const t = state.tasks.find(t => t.id === id);
  if (!t) return;
  t.done = !t.done;
  saveTasks();
  renderTasks();
}

function addCustomTask() {
  const inp = $("new-task-text");
  if (!inp || !inp.value.trim()) return;
  state.tasks.push({
    id: "custom_" + Date.now(),
    cat: "custom",
    catLabel: "⭐ مخصص",
    label: inp.value.trim(),
    priority: "med",
    timing: "مخصص",
    done: false
  });
  saveTasks();
  renderTasks();
}

// Rates relative to USD (approximate, May 2026)
const CUR_RATES = {
  USD: 1,
  KRW: 1330,
  SAR: 3.75,
  EUR: 0.92,
  AED: 3.67
};

const CUR_INFO = {
  USD: { flag: "🇺🇸", name: "دولار أمريكي" },
  KRW: { flag: "🇰🇷", name: "وون كوري" },
  SAR: { flag: "🇸🇦", name: "ريال سعودي" },
  EUR: { flag: "🇪🇺", name: "يورو" },
  AED: { flag: "🇦🇪", name: "درهم إماراتي" }
};

function fmtCur(n, c) {
  if (!isFinite(n)) return "0";
  const opts = c === "KRW" ? { maximumFractionDigits: 0 } : { maximumFractionDigits: 2 };
  return n.toLocaleString("en-US", opts);
}

function openCurrency() {
  state.curBase = state.curBase || "SAR";
  state.curAmount = state.curAmount || 100;
  renderCurrency();
}

function renderCurrency() {
  const base = state.curBase;
  const amount = state.curAmount;
  const usd = amount / CUR_RATES[base];

  const targetOrder = ["KRW", "SAR", "USD", "EUR", "AED"].filter(c => c !== base);
  // Always show base first
  const display = [base, ...targetOrder];

  openModal(`
    <div class="modal-h">
      <h3>💱 محول العملات</h3>
      <button class="modal-x" onclick="closeModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="cur-quick mb2" style="border:none;padding:0;margin-top:0">
      <span class="txx clm fb6" style="margin-left:0.3rem;align-self:center">المبلغ بـ:</span>
      ${["SAR","USD","KRW"].map(c => `
        <button class="cur-quick-btn ${base === c ? 'act' : ''}" onclick="state.curBase='${c}';renderCurrency()">${CUR_INFO[c].flag} ${c}</button>
      `).join('')}
    </div>

    <div class="cur-grid">
      ${display.map((c, i) => {
        const val = i === 0 ? amount : (usd * CUR_RATES[c]);
        const isBase = i === 0;
        return `
          <div class="cur-row" style="${isBase ? 'background:var(--cream);border-color:var(--accent)' : ''}">
            <div class="cur-flag">${CUR_INFO[c].flag}</div>
            <div class="cur-info">
              <div class="cur-c">${c}</div>
              <div class="cur-l">${CUR_INFO[c].name}</div>
            </div>
            <input type="number" class="cur-inp" 
              value="${fmtCur(val, c).replace(/,/g,'')}"
              ${isBase ? '' : 'readonly'}
              ${isBase ? `oninput="state.curAmount=parseFloat(this.value)||0;updateCurDisplay()"` : ''}
              id="cur-${c}">
          </div>
        `;
      }).join('')}
    </div>

    <div class="cur-quick mb2">
      <span class="txx clm fb6" style="margin-left:0.3rem;align-self:center">مبالغ سريعة:</span>
      ${[100, 500, 1000, 5000, 10000].map(n => `
        <button class="cur-quick-btn" onclick="state.curAmount=${n};renderCurrency()">${n.toLocaleString()}</button>
      `).join('')}
    </div>

    <div class="cur-rate-info">
      📊 1 ${base} = ${fmtCur(CUR_RATES.KRW / CUR_RATES[base], 'KRW')} ₩  ·  ${fmtCur(CUR_RATES.SAR / CUR_RATES[base], 'SAR')} ر.س  ·  ${fmtCur(1 / CUR_RATES[base], 'USD')} $
      <br><span style="opacity:0.7">⚠️ الأسعار تقريبية - تحقق من البنك قبل السفر</span>
    </div>
  `);
}

function updateCurDisplay() {
  const base = state.curBase;
  const amount = state.curAmount;
  const usd = amount / CUR_RATES[base];
  ["KRW","SAR","USD","EUR","AED"].forEach(c => {
    if (c === base) return;
    const el = $("cur-" + c);
    if (el) el.value = fmtCur(usd * CUR_RATES[c], c).replace(/,/g,'');
  });
}

// Copy Korean text helper
function copyKorean(btn, text) {
  const orig = btn.innerHTML;
  navigator.clipboard.writeText(text).then(() => {
    btn.innerHTML = '✅ تم النسخ';
    setTimeout(() => { btn.innerHTML = orig; }, 1800);
  }).catch(() => {
    btn.innerHTML = '⚠️ فشل';
    setTimeout(() => { btn.innerHTML = orig; }, 1800);
  });
}

function syncGetCode() {
  let code = localStorage.getItem("kt2_sync_code");
  if (!code) {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    code = Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
    localStorage.setItem("kt2_sync_code", code);
  }
  return code;
}

function syncGetAllState() {
  return {
    itinerary: state.itinerary,
    customLib: state.customLib,
    budget: state.budget,
    tasks: state.tasks,
    favs: state.favs,
    tripInfo: state.tripInfo,
    cityColors: state.cityColors
  };
}

function syncApplyState(data) {
  if (data.itinerary)   { state.itinerary   = data.itinerary;   Storage.set("kt2_itin", data.itinerary); }
  if (data.customLib)   { state.customLib   = data.customLib;   Storage.set("kt2_clib", data.customLib); }
  if (data.budget)      { state.budget      = data.budget;      Storage.set("kt2_bud",  data.budget); }
  if (data.tasks)       { state.tasks       = data.tasks;       Storage.set("kt2_tasks", data.tasks); }
  if (data.favs)        { state.favs        = data.favs;        Storage.set("kt2_favs", data.favs); }
  if (data.tripInfo)    { state.tripInfo    = data.tripInfo;    Storage.set("kt2_tripinfo", data.tripInfo); }
  if (data.cityColors)  { state.cityColors  = data.cityColors;  Storage.set("kt2_citycolors", data.cityColors); CITY_COLORS = { ...data.cityColors }; }
  switchTab(state.active);
}

// Debounced cloud auto-sync (triggered automatically after any Trip.save)
let _autoSyncTimer = null;
let _autoSyncInflight = false;
function scheduleAutoSync() {
  const code = localStorage.getItem("kt2_sync_code");
  if (!code) return;
  if (_autoSyncTimer) clearTimeout(_autoSyncTimer);
  _autoSyncTimer = setTimeout(async () => {
    if (_autoSyncInflight) { scheduleAutoSync(); return; }
    _autoSyncInflight = true;
    const indicator = $("auto-sync-indicator");
    if (indicator) { indicator.textContent = "↻ جاري الحفظ..."; indicator.style.opacity = "1"; }
    const ok = await syncSave(code);
    if (indicator) {
      indicator.textContent = ok ? "✓ محفوظ في السحابة" : "⚠️ فشل الحفظ";
      setTimeout(() => { indicator.style.opacity = "0"; }, 2000);
    }
    _autoSyncInflight = false;
  }, 1500);
}

async function syncSave(code) {
  const fab = $("sync-fab");
  if (fab) { fab.classList.add("saving"); fab.querySelector("span") && (fab.querySelector("span").textContent = "جاري..."); }
  try {
    const headers = { "Content-Type": "application/json" };
    const token = Auth.getToken();
    if (token) headers["Authorization"] = "Bearer " + token;
    const payload = { code, data: syncGetAllState() };
    if (window._shareToken) payload.shareToken = window._shareToken;
    const res = await fetch("/.netlify/functions/save", {
      method: "POST",
      headers,
      body: JSON.stringify(payload)
    });
    return res.ok;
  } catch { return false; }
  finally { if (fab) fab.classList.remove("saving"); }
}

async function syncLoad(code) {
  try {
    const headers = {};
    const token = Auth.getToken();
    if (token) headers["Authorization"] = "Bearer " + token;
    const res = await fetch(`/.netlify/functions/load?code=${encodeURIComponent(code)}`, { headers });
    if (!res.ok) return null;
    const json = await res.json();
    if (json.perms) window._loadedPerms = json.perms;
    return json.data || null;
  } catch { return null; }
}

async function doSyncSave(code) {
  const st = $("sync-status");
  st.className = "sync-status"; st.textContent = "جاري الرفع..."; st.style.display = "block";
  const ok = await syncSave(code);
  if (ok) {
    st.className = "sync-status ok";
    st.textContent = "✓ تم حفظ بياناتك بنجاح على السحابة";
  } else {
    st.className = "sync-status err";
    st.innerHTML = "✗ تعذّر الاتصال بالسحابة.<br><span style='font-size:0.78rem'>استخدم <strong>تصدير ملف</strong> بدلاً من ذلك ↑</span>";
  }
}

function exportTripFile() {
  const data = JSON.stringify(syncGetAllState(), null, 2);
  const blob = new Blob([data], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const tripName = state.tripInfo?.destination || "my-trip";
  a.href = url; a.download = `trip-${tripName}-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  const st = $("sync-status");
  if (st) { st.className = "sync-status ok"; st.textContent = "✓ تم تصدير الملف — أرسله لأي جهاز"; st.style.display = "block"; }
}

function importTripFile(input) {
  const file = input.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      syncApplyState(data);
      const st = $("sync-status");
      if (st) { st.className = "sync-status ok"; st.textContent = "✓ تم استيراد البيانات بنجاح!"; st.style.display = "block"; }
      setTimeout(() => { closeModal(); location.reload(); }, 1500);
    } catch {
      const st = $("sync-status");
      if (st) { st.className = "sync-status err"; st.textContent = "✗ الملف غير صالح"; st.style.display = "block"; }
    }
  };
  reader.readAsText(file);
}

async function doSyncLoad() {
  const input = $("sync-load-input");
  const st = $("sync-status");
  const code = (input?.value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length < 4) {
    st.className = "sync-status err"; st.textContent = "الرمز قصير جداً"; return;
  }
  st.className = "sync-status"; st.textContent = "جاري التحميل..."; st.style.display = "block";
  const data = await syncLoad(code);
  if (!data) {
    st.className = "sync-status err"; st.textContent = "✗ الرمز غير موجود أو منتهي";
    return;
  }
  syncApplyState(data);
  localStorage.setItem("kt2_sync_code", code);
  st.className = "sync-status ok"; st.textContent = "✓ تم تحميل البيانات بنجاح!";
  setTimeout(closeModal, 1500);
}

// ─── Library Browser Modal ───
function openLibBrowser(libId) {
  const isKorea = libId === "korea";
  const allItems = isKorea
    ? (typeof LIB !== 'undefined' ? LIB : [])
    : (getGlobalLibs()[libId] || []);
  const meta = LIB_META[libId] || {};
  const name = meta.name || libId;
  const icon = meta.icon || "🌍";

  const cities = [...new Set(allItems.map(x=>x.city).filter(Boolean))];
  const types  = [...new Set(allItems.map(x=>x.type).filter(Boolean))];
  const typeLabels = {food:"مطاعم",attraction:"معالم",mosque:"مساجد",shop:"تسوق",entertainment:"ترفيه",transport:"مواصلات",tour:"جولات",cafe:"مقاهي",hotel:"فنادق",festival:"فعاليات",other:"أخرى"};
  const typeIcons  = {food:"🍽️",attraction:"📍",mosque:"🕌",shop:"🛍️",entertainment:"🎢",transport:"🚄",tour:"🎯",cafe:"☕",hotel:"🏨",festival:"🎉",other:"⭐"};

  function renderItems(cityF, typeF, q) {
    let items = allItems;
    if (cityF) items = items.filter(x=>x.city===cityF);
    if (typeF) items = items.filter(x=>x.type===typeF);
    if (q) { const lq=q.toLowerCase(); items = items.filter(x=>(x.name+x.area+x.note).toLowerCase().includes(lq)); }
    if (!items.length) return `<p style="text-align:center;color:var(--muted);padding:2rem">لا توجد نتائج</p>`;
    return items.map(it => `
      <div style="background:var(--cream);border-radius:10px;padding:0.75rem;display:flex;gap:0.7rem;align-items:flex-start">
        <div style="font-size:1.4rem;line-height:1">${it.icon||typeIcons[it.type]||"📍"}</div>
        <div style="flex:1;min-width:0">
          <div class="fb6" style="font-size:0.85rem">${it.name}${it.halal?'<span style="color:#047857;font-size:0.65rem;margin-right:4px">● حلال</span>':''}</div>
          ${it.area?`<div style="font-size:0.7rem;color:var(--muted)">${LIB_CITY_NAMES[it.city]||it.city||''} · ${it.area}</div>`:''}
          ${it.note?`<div style="font-size:0.72rem;color:var(--ink-soft);margin-top:2px">${it.note}</div>`:''}
          ${it.price?`<div style="font-size:0.68rem;color:var(--gold);margin-top:2px">${it.price}</div>`:''}
        </div>
        ${!isKorea?`<button title="حذف" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.75rem;padding:2px 4px" onclick="deleteLibItem('${libId}','${it.id}')">✕</button>`:''}
      </div>
    `).join('');
  }

  function buildModal(cityF='', typeF='', q='') {
    return `
      <div class="modal-h">
        <h3>${icon} مكتبة ${name}</h3>
        <button class="modal-x" onclick="closeModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.75rem">
        <input type="text" class="input" id="lb-search" placeholder="بحث..." value="${q}" oninput="_libFilter('${libId}')" style="flex:1;min-width:120px;padding:0.4rem 0.6rem;font-size:0.8rem">
        <select class="input" id="lb-city" onchange="_libFilter('${libId}')" style="padding:0.4rem 0.6rem;font-size:0.8rem">
          <option value="">كل المدن</option>
          ${cities.map(c=>`<option value="${c}"${cityF===c?' selected':''}>${LIB_CITY_NAMES[c]||c}</option>`).join('')}
        </select>
        <select class="input" id="lb-type" onchange="_libFilter('${libId}')" style="padding:0.4rem 0.6rem;font-size:0.8rem">
          <option value="">كل الأنواع</option>
          ${types.map(t=>`<option value="${t}"${typeF===t?' selected':''}>${typeIcons[t]||''} ${typeLabels[t]||t}</option>`).join('')}
        </select>
      </div>
      <div id="lb-results" style="display:flex;flex-direction:column;gap:0.5rem;max-height:55vh;overflow-y:auto">
        ${renderItems(cityF, typeF, q)}
      </div>
      <div style="margin-top:0.75rem;display:flex;gap:0.5rem;justify-content:space-between;flex-wrap:wrap;align-items:center">
        <div style="display:flex;gap:0.4rem;flex-wrap:wrap">
          ${!isKorea?`<button class="btn btn-out btn-sm" onclick="openAddLibItemModal('${libId}')">+ إضافة موقع</button>`:''}
          ${!isKorea?`
            <button class="btn btn-pri btn-sm" style="background:linear-gradient(135deg,#6366f1,#8b5cf6)" onclick="closeModal();setTimeout(()=>openGeminiAssistant('${libId}'),80)">
              🤖 توليد بـ AI
            </button>
            <div style="position:relative;display:inline-block">
              <button class="btn btn-out btn-sm" id="lb-ai-menu-btn" onclick="_toggleLibAiMenu('${libId}')" title="مهام AI سريعة">▾</button>
              <div id="lb-ai-menu" style="display:none;position:absolute;bottom:2rem;right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:999;min-width:170px;padding:0.4rem 0">
                ${['hotels','halal_food','mosques','attractions','shopping','enrich'].map(tid => {
                  const t = GEMINI_TASKS.find(x=>x.id===tid);
                  return t ? `<button onclick="_libQuickGenerate('${libId}','${tid}')" style="display:flex;gap:0.5rem;align-items:center;width:100%;padding:0.45rem 0.75rem;background:none;border:none;cursor:pointer;font-size:0.78rem;text-align:right;color:var(--ink)"><span>${t.icon}</span><span>${t.label}</span></button>` : '';
                }).join('')}
              </div>
            </div>
          `:''}
        </div>
        <span class="txs clm" style="font-size:0.72rem">${allItems.length} موقع إجمالاً</span>
      </div>
    `;
  }

  window._libFilter = function(lid) {
    const q  = ($("lb-search")||{value:''}).value.trim();
    const cf = ($("lb-city")||{value:''}).value;
    const tf = ($("lb-type")||{value:''}).value;
    const res = document.getElementById("lb-results");
    if (res) {
      const items2 = lid==="korea"
        ? (typeof LIB!=='undefined'?LIB:[])
        : (getGlobalLibs()[lid]||[]);
      let fil = items2;
      if (cf) fil = fil.filter(x=>x.city===cf);
      if (tf) fil = fil.filter(x=>x.type===tf);
      if (q) { const lq=q.toLowerCase(); fil=fil.filter(x=>(x.name+x.area+x.note).toLowerCase().includes(lq)); }
      if (!fil.length) { res.innerHTML='<p style="text-align:center;color:var(--muted);padding:2rem">لا توجد نتائج</p>'; return; }

function saveLibItem(libId) {

function saveNewLib() {
  const name = ($("al-name")||{}).value?.trim();
  if (!name) { alert("اسم الوجهة مطلوب"); return; }
  const id = name.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"").slice(0,30) || ("lib_"+Date.now());
  const jsonStr = ($("al-json")||{}).value?.trim();
  let items = [];
  if (jsonStr) {
    try { items = JSON.parse(jsonStr); if (!Array.isArray(items)) throw new Error("ليس مصفوفة"); }
    catch (e) { alert("JSON غير صحيح: "+e.message); return; }
  }
  items = items.map((it,i)=>({ id:it.id||`${id}_${i+1}`, ...it }));
  const libs = getGlobalLibs();
  libs[id] = items;
  saveGlobalLibs(libs);
  closeModal();
  renderDashboard();
}

function deleteCustomLib(id) {
  if (!confirm(`حذف مكتبة "${LIB_META[id]?.name||id}" نهائياً؟`)) return;
  const libs = getGlobalLibs();
  delete libs[id];
  saveGlobalLibs(libs);
  renderDashboard();
}

  if (val.startsWith("new:")) {
    _geminiSelectTask("new_country");
  }
  _geminiRefreshPrompt();
}

function _geminiSelectTask(taskId) {
  if (!window._gemState) window._gemState = {};
  window._gemState.task = taskId;
  document.querySelectorAll(".gem-task-btn").forEach(b => b.classList.toggle("act", b.dataset.task===taskId));
  _geminiRefreshPrompt();
}

function _geminiRefreshPrompt() {
  const el = document.getElementById("gem-prompt");
  if (!el) return;
  const libVal = ($("gem-lib")||{}).value || "";
  const taskId = window._gemState?.task || "enrich";
  const task = GEMINI_TASKS.find(t=>t.id===taskId) || GEMINI_TASKS[5];

  const isNew = libVal.startsWith("new:");
  const countryKey = isNew ? libVal.replace("new:","") : libVal;
  const country = GEMINI_COUNTRIES[countryKey] || { name: LIB_META[countryKey]?.name || countryKey, cities: "المدن الرئيسية" };

  const libs = getGlobalLibs();
  const existingCount = countryKey==="korea"
    ? (typeof LIB!=='undefined'?LIB.length:0)
    : (libs[countryKey]||[]).length;

  el.value = task.prompt(country.name, country.cities, existingCount);
}

async function runGeminiAssistant() {
  const key    = ($("gem-key")||{}).value?.trim();
  const libVal = ($("gem-lib")||{}).value || "";
  const prompt = ($("gem-prompt")||{}).value?.trim();
  const status = document.getElementById("gem-status");
  const btn    = document.getElementById("gem-btn");
  const preview= document.getElementById("gem-preview");

  if (!key)    { status.textContent="⚠️ أدخل مفتاح API أولاً"; return; }
  if (!prompt) { status.textContent="⚠️ الطلب فارغ"; return; }

  const isNew = libVal.startsWith("new:");
  const libId = isNew ? libVal.replace("new:","") : libVal;
  if (!libId)  { status.textContent="⚠️ اختر المكتبة أولاً"; return; }

  const model = ($("gem-model")||{}).value || "Qwen/Qwen2.5-7B-Instruct";
  localStorage.setItem("kt2_sf_key", key);
  localStorage.setItem("kt2_sf_model", model);
  btn.disabled = true;
  const isFree = model.includes("7B") || model.includes("9b") || model.includes("7b");
  status.textContent = `⏳ جاري الإرسال إلى SiliconFlow ${isFree?"(نموذج مجاني 🆓)":""}...`;
  preview.innerHTML = "";

  const systemInstr = `أنت مساعد متخصص في بناء مكتبات مواقع سياحية بصيغة JSON.
قواعد صارمة:
1. أجب بـ JSON فقط — مصفوفة مباشرة بدون أي كلام قبلها أو بعدها.
2. كل عنصر يجب أن يحتوي على: name, type, city, area, icon, note
3. الحقول: name (الاسم), type (hotel|food|attraction|mosque|shop|entertainment|tour|other), city (بالإنجليزية حروف صغيرة بدون مسافات), area (الحي/المنطقة), icon (إيموجي واحد), note (وصف مفيد بالعربية), halal (true/false للمطاعم), price (للمطاعم والفنادق والجولات), lat, lng (إحداثيات تقريبية).
4. للفنادق: type="hotel", icon="🏨", price=عدد النجوم
5. للمساجد: type="mosque", icon="🕌"
6. للجولات: type="tour", icon مناسب, price تقريبي بالعملة المحلية
7. المكتبة يجب أن تكون متنوعة ومفيدة للسائح المسلم.
مثال صحيح:
[{"name":"برج غلطة","type":"attraction","city":"istanbul","area":"بيوغلو","icon":"🗼","note":"برج جنوي القرن 14م - إطلالة بانورامية","lat":41.0256,"lng":28.9741}]`;

  try {
    const res = await fetch("/.netlify/functions/claude-ai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, system: systemInstr, model, apiKey: key })
    });
    const data = await res.json();
    if (!res.ok) {
      const apiMsg = data.error?.message || data.error || JSON.stringify(data);
      throw Object.assign(new Error(String(apiMsg)), { apiCode: res.status, rawData: data });
    }

    const raw = data.content?.[0]?.text || "";
    const jsonMatch = raw.match(/\[[\s\S]*\]/s);
    if (!jsonMatch) throw new Error("لم يُرجع النموذج JSON صالحاً — جرّب مرة أخرى");
    let items;
    try { items = JSON.parse(jsonMatch[0]); }
    catch { throw new Error("خطأ في تحليل JSON — جرّب مرة أخرى"); }
    if (!Array.isArray(items) || !items.length) throw new Error("القائمة فارغة");

    status.textContent = `✓ تم استلام ${items.length} موقع — راجع المعاينة أدناه`;

    preview.innerHTML = `
      <div style="border:1px solid var(--border);border-radius:10px;overflow:hidden">
        <div style="background:var(--accent);color:white;padding:0.4rem 0.75rem;font-size:0.78rem;font-weight:600">
          معاينة ${items.length} موقع مقترح
        </div>
        <div style="max-height:180px;overflow-y:auto;padding:0.5rem">
          ${items.slice(0,8).map(it=>`
            <div style="display:flex;gap:0.4rem;padding:4px 0;border-bottom:1px solid var(--border);font-size:0.75rem">
              <span>${it.icon||"📍"}</span>
              <span style="flex:1"><strong>${it.name}</strong></span>
              <span style="color:var(--muted)">${LIB_CITY_NAMES[it.city]||it.city||''}</span>
              <span style="color:var(--accent);font-size:0.65rem">${it.type||''}</span>
            </div>`).join('')}
          ${items.length>8?`<div style="font-size:0.7rem;color:var(--muted);padding:4px">... و${items.length-8} مواقع إضافية</div>`:''}
        </div>
      </div>
      <div style="margin-top:0.6rem;display:flex;gap:0.5rem;flex-wrap:wrap">
        <button class="btn btn-pri btn-sm" onclick="_geminiAppend(${JSON.stringify(items).replace(/\\/g,'\\\\').replace(/"/g,'&quot;')}, '${libId}', ${isNew})">✓ إضافة للمكتبة</button>
        <button class="btn btn-out btn-sm" onclick="document.getElementById('gem-preview').innerHTML='';document.getElementById('gem-status').textContent='جاهز'">تجاهل</button>
      </div>
    `;
  } catch(e) {
    const rawMsg = e.message || "";
    const code = e.apiCode || "";
    let hint = "";
    if (code === 401 || rawMsg.includes("authentication") || rawMsg.includes("api_key") || rawMsg.includes("Invalid")) {
      hint = "💡 تحقق من مفتاح SiliconFlow في cloud.siliconflow.com/account/ak";
    } else if (code === 402 || rawMsg.includes("balance") || rawMsg.includes("Insufficient")) {
      hint = "💡 رصيدك غير كافٍ — استخدم نموذجاً مجانياً 🆓 أو أضف رصيداً في cloud.siliconflow.com";
    } else if (code === 429) {
      hint = "💡 تجاوزت الحد المجاني — انتظر قليلاً أو جرب نموذجاً مجانياً آخر";
    } else if (rawMsg.includes("fetch") || rawMsg.includes("network")) {
      hint = "💡 تحقق من اتصالك بالإنترنت";
    }
    status.innerHTML = `<details open><summary style="cursor:pointer;color:var(--danger)">❌ خطأ من SiliconFlow API (HTTP ${code||'?'})</summary><pre style="font-size:0.68rem;white-space:pre-wrap;margin:0.4rem 0;background:var(--cream);padding:0.5rem;border-radius:6px;max-height:120px;overflow-y:auto">${rawMsg.replace(/</g,'&lt;')}</pre>${hint?`<div style="font-size:0.75rem;color:var(--muted);margin-top:0.3rem">${hint}</div>`:''}</details>`;
  }
  btn.disabled = false;
}

function _geminiAppend(items, libId, isNewLib) {
  const libs = getGlobalLibs();
  if (!libs[libId]) libs[libId] = [];
  const existing = new Set(libs[libId].map(x=>(x.name||"").toLowerCase()));
  let added = 0;
  items.forEach((it,i) => {
    const nm = (it.name||"").toLowerCase();
    if (!existing.has(nm)) {
      libs[libId].push({ id:`${libId}_ai_${Date.now()}_${i}`, ...it });
      existing.add(nm);
      added++;
    }
  });
  // Register new country in LIB_META if it was a new lib
  if (isNewLib && GEMINI_COUNTRIES[libId]) {
    const gc = GEMINI_COUNTRIES[libId];
    LIB_META[libId] = { name:gc.name, icon:"🌍", color:"#0891b2", cities: gc.cities.split("و").map(c=>c.trim()), builtIn:false };
  }
  saveGlobalLibs(libs);
  closeModal();
  renderDashboard();
  setTimeout(()=>openLibBrowser(libId), 120);
}

  const title = get('st-title'), desc = get('st-desc'), icon = get('st-icon') || '🛍️';
  const price = parseFloat(get('st-price')) || 0;
  if (!title) { alert('اسم الخدمة مطلوب'); return; }
  let items = _storeList();
  if (editId) {
    items = items.map(it => it.id === editId ? { ...it, title, desc, price, icon } : it);
  } else {
    items.unshift({ id: 's' + Date.now(), title, desc, price, icon });
  }
  _storeSave(items);
  renderDashboard();
}
function _storeDelete(id) {
  if (!confirm('حذف هذه الخدمة؟')) return;
  _storeSave(_storeList().filter(x => x.id !== id));
  renderDashboard();
}

function _crmSubmit(editId) {
  const get = id => (document.getElementById(id)?.value || '').trim();

  if (!name) { alert('الاسم مطلوب'); return; }
  let list = _crmList();
  if (editId) {
    list = list.map(c => c.id === editId ? { ...c, name, email, phone, notes } : c);
  } else {
    list.unshift({ id: 'c' + Date.now(), name, email, phone, notes, createdAt: new Date().toISOString() });
  }
  _crmSave(list);
  renderDashboard();
}
function _crmDelete(id) {
  if (!confirm('حذف هذا العميل؟')) return;
  _crmSave(_crmList().filter(x => x.id !== id));
  renderDashboard();
}

async function _setPwdSubmit() {
  const oldP = document.getElementById('set-pwd-old').value;
  const newP = document.getElementById('set-pwd-new').value;
  const msg = document.getElementById('set-pwd-msg');
  if (!oldP || !newP) { msg.innerHTML = '<span style="color:var(--err)">✗ أكمل الحقول</span>'; return; }
  if (newP.length < 6) { msg.innerHTML = '<span style="color:var(--err)">✗ كلمة المرور قصيرة</span>'; return; }
  msg.textContent = 'جاري الحفظ...';
  const out = await Auth.changePassword(oldP, newP);
  if (out.ok) {
    msg.innerHTML = '<span style="color:var(--ok)">✓ تم التغيير</span>';
    document.getElementById('set-pwd-old').value = '';
    document.getElementById('set-pwd-new').value = '';
  } else {
    msg.innerHTML = `<span style="color:var(--err)">✗ ${out.error || 'فشل'}</span>`;

async function _redeemSubmit(inviteToken) {
  const p1 = document.getElementById("redeem-pwd")?.value || "";
  const p2 = document.getElementById("redeem-pwd2")?.value || "";
  const msg = document.getElementById("redeem-msg");
  const btn = document.getElementById("redeem-btn");
  if (p1.length < 6) { if (msg) msg.innerHTML = '<span style="color:#ef4444">✗ كلمة المرور قصيرة</span>'; return; }
  if (p1 !== p2)    { if (msg) msg.innerHTML = '<span style="color:#ef4444">✗ كلمتا المرور غير متطابقتين</span>'; return; }
  if (btn) { btn.disabled = true; btn.textContent = "..."; }
  const out = await Auth.redeemInvite(inviteToken, p1);
  if (!out.ok) {
    if (msg) msg.innerHTML = `<span style="color:#ef4444">✗ ${out.error}</span>`;
    if (btn) { btn.disabled = false; btn.textContent = "إنشاء الحساب وتسجيل الدخول"; }
    return;
  }
  if (msg) msg.innerHTML = '<span style="color:#16a34a">✓ تم — جاري التحويل...</span>';
  setTimeout(() => { location.href = "/?dashboard=1"; }, 800);
}

function generateAccessKey() {
  const chars = "abcdefghjkmnpqrstuvwxyz23456789";
  const key = Array.from({ length: 10 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
  const keys = getAccessKeys();
  keys.push(key);
  saveAccessKeys(keys);
  renderDashboard();
}

function revokeAccessKey(key) {
  if (!confirm(`إلغاء صلاحية المفتاح "${key}"؟ من يستخدمه لن يستطيع الدخول.`)) return;
  const keys = getAccessKeys().filter(k => k !== key);
  saveAccessKeys(keys);
  renderDashboard();
}

function renderTripCard(t) {
  // Load trip stats from its storage
  const prevCurrent = Trip.current;
  Trip.current = t.id;
  const itin = Trip.load("itin", []);
  const tripInfo = Trip.load("tripinfo", null);
  Trip.current = prevCurrent;

  const totalItems = itin.reduce((s, d) => s + (d.items?.length || 0), 0);
  const startDate = (tripInfo && tripInfo.startDate) || t.startDate;
  const endDate = (tripInfo && tripInfo.endDate) || t.endDate;
  const fmt = d => d ? d.replace(/^(\d{4})-(\d{2})-(\d{2})$/, '$3/$2/$1') : '';
  const datesText = startDate && endDate
    ? `${fmt(startDate)} ← ${fmt(endDate)}`
    : startDate ? `${fmt(startDate)} ←` : "بدون تواريخ";

  return `
    <div class="trip-card" style="--card-color:${t.color || '#1a4d4a'}">
      <style>.trip-card[style*="${t.color}"]::before{background:${t.color || '#1a4d4a'}}</style>
      <div class="trip-card-h">
        <div class="trip-card-icon">${t.icon || "🗺️"}</div>
        <div style="flex:1;min-width:0">
          <div class="trip-card-name">${t.name}</div>
          <div class="trip-card-dest">${t.destination || ''}</div>
        </div>
      </div>
      <div class="trip-card-dates">📅 ${datesText}</div>
      ${(t.depAir || t.arrAir) ? `<div class="trip-card-route">${t.depAir || '—'} → ${t.arrAir || '—'}</div>` : ''}
      <div class="trip-card-stats">
        <div><strong>${itin.length}</strong> يوم</div>
        <div><strong>${totalItems}</strong> نشاط</div>
        ${t.countryLib === 'korea' ? '<div title="مكتبة كوريا مدمجة">🇰🇷</div>' : ''}
      </div>
      <div class="trip-card-acts">
        <button class="trip-card-act trip-card-act-pri" onclick="navTo({trip:'${t.id}'})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
          فتح
        </button>
        <button class="trip-card-act" onclick="openShareModalFor('${t.id}')" title="مشاركة">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>
        <button class="trip-card-act" onclick="confirmDuplicateTrip('${t.id}')" title="تكرار الرحلة">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        ${!t.isBuiltIn ? `
          <button class="trip-card-act trip-card-act-danger" onclick="deleteTrip('${t.id}')" title="حذف">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        ` : ''}
      </div>
    </div>
  `;
}

function createNewTrip() {
  const country = $("ct-country").value;
  if (!country) { alert("يرجى اختيار الدولة أولاً"); return; }
  const name = $("ct-name").value.trim();
  if (!name) { alert("اسم الرحلة مطلوب"); return; }

  const destVal = country === "other" ? ($("ct-dest").value.trim() || name) : name;
  // Link to global library by country key (korea=built-in, turkey/uk=global lib)
  const knownLibs = ["korea","turkey","uk","japan","france","italy","spain","malaysia","uae","egypt","morocco","greece","indonesia","portugal","netherlands","switzerland"];
  const countryLib = knownLibs.includes(country) ? country : null;
  const id = generateTripId(name);

  const depCity = $("ct-depcity").value.trim();
  const depAir = $("ct-depair").value.trim();
  const arrCity = $("ct-arrcity").value.trim();
  const arrAir = $("ct-arrair").value.trim();
  const sdate = $("ct-sdate").value || "";
  const edate = $("ct-edate").value || "";

  const trip = {
    id, name,
    destination: destVal,
    icon: $("ct-icon").value.trim() || "🗺️",
    color: $("ct-color").value || "#0891b2",
    countryLib,
    startDate: sdate,
    endDate: edate,
    depCity, depAir, arrCity, arrAir,
    isBuiltIn: false,
    createdAt: new Date().toISOString().split('T')[0]
  };
  TripsRegistry.upsert(trip);

  const oldCurrent = Trip.current;
  Trip.current = id;

  // Auto-generate skeleton days from dates (if provided)
  const skeletonDays = [];
  if (sdate && edate) {
    const start = new Date(sdate);
    const end = new Date(edate);
    const ms = end - start;
    const dayCount = Math.round(ms / 86400000) + 1;
    if (dayCount > 0 && dayCount <= 60) {
      const weekdays = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
      const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
      const cityForDay = arrCity || "";
      for (let i = 0; i < dayCount; i++) {
        const dt = new Date(start);
        dt.setDate(start.getDate() + i);
        const isFirst = i === 0;
        const isLast = i === dayCount - 1;
        skeletonDays.push({
          day: i + 1,
          date: dt.toISOString().split('T')[0],
          dateLabel: `${dt.getDate()} ${months[dt.getMonth()]}`,
          weekday: weekdays[dt.getDay()],
          city: cityForDay,
          title: "",
          type: isFirst ? "arrival" : (isLast ? "departure" : "normal"),
          flight: null, narrative: null, notes: null, hotel: null, items: []
        });
      }
    }
  }

  Trip.save("itin", skeletonDays);
  Trip.save("clib", []);
  Trip.save("favs", []);
  Trip.save("tasks", []);
  Trip.save("tripinfo", {
    destination: destVal,
    startDate: sdate, endDate: edate,
    depCity, depAirport: depAir,
    arrCity, arrAirport: arrAir,
    travelers: 1, ticketRef: "",
    outboundFlights: [], returnFlights: [], notes: ""
  });
  Trip.save("citycolors", {});
  Trip.current = oldCurrent;

  closeModal();
  navTo({ trip: id });
}

function deleteTrip(id) {
  const t = TripsRegistry.get(id);
  if (!t || t.isBuiltIn) return;
  if (!confirm(`حذف رحلة "${t.name}" نهائياً؟ لا يمكن التراجع.`)) return;
  TripsRegistry.remove(id);
  renderDashboard();
}

function executeDuplicateTrip(srcId) {
  const nameInput = document.getElementById("dup-trip-name");
  const customName = nameInput?.value?.trim();
  const newTrip = TripsRegistry.duplicate(srcId);
  if (!newTrip) return;
  if (customName && customName !== newTrip.name) {
    newTrip.name = customName;
    TripsRegistry.upsert(newTrip);
  }
  const st = document.getElementById("dup-status");
  if (st) { st.style.display = "block"; st.textContent = `✓ تم إنشاء "${newTrip.name}" بنجاح`; }
  setTimeout(() => { closeModal(); renderDashboard(); }, 1200);
}

async function _createShareLink(tripCode, perms) {
  const result = document.getElementById("_share-link-result");
  if (result) result.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:0.85rem">جاري الإنشاء...</div>';
  const trip = TripsRegistry.get(Trip.current);
  const label = (trip?.name || tripCode) + " · " + ({ view: "عرض", tasks: "مهام", full: "كامل" }[perms] || perms);
  const out = await Auth.createShare(tripCode, perms, label);
  if (!out.ok) {
    if (result) result.innerHTML = `<div style="color:var(--err);font-size:0.85rem;text-align:center">✗ ${out.error}</div>`;
    return;
  }
  const url = `${location.origin}/?s=${out.shareToken}`;
  const safe = url.replace(/'/g, "\\'");
  const permLabel = { view: "👁️ عرض فقط", tasks: "✏️ تعديل المهام", full: "🛠️ تعديل كامل" }[perms];
  if (result) result.innerHTML = `

  `;
}

function getMissingTripFields() {
  const t = state.tripInfo || {};
  const trip = TripsRegistry.get(Trip.current) || {};
  const missing = [];
  if (!(t.arrCity || trip.arrCity)) missing.push("مدينة الوصول");
  if (!t.startDate) missing.push("تاريخ المغادرة");
  if (!t.endDate) missing.push("تاريخ العودة");
  if (state.itinerary.length === 0) missing.push("أيام الجدول");
  else if (!state.itinerary[0]?.hotel?.name) missing.push("فندق الوصول");
  return missing;
}

function tsSyncDays() {
  const s = $("ts-sdate")?.value;
  const e = $("ts-edate")?.value;
  if (s && e) {
    const ms = new Date(e) - new Date(s);
    const d = Math.round(ms / 86400000);
    if (d >= 0) {
      $("ts-days").value = d + 1;
      const hint = $("ts-days-hint");
      if (hint) hint.textContent = `(محسوب تلقائياً من التاريخين: ${d + 1} يوم)`;
    }
  }
}

function getTripCities() {
  const map = {};
  state.itinerary.forEach(d => {
    if (!d.city) return;
    if (!map[d.city]) {
      const cityInfo = cityById(d.city) || state.customCities?.find(c => c.id === d.city);
      map[d.city] = {
        id: d.city,
        name: cityInfo?.name || d.city,
        color: state.cityColors[d.city] || CITY_COLORS_DEFAULT[d.city] || '#1a4d4a',
        daysCount: 0,
        firstDate: d.dateLabel || '',
        hotel: ''
      };
    }
    map[d.city].daysCount++;
    if (d.hotel?.name && !map[d.city].hotel) map[d.city].hotel = d.hotel.name;
  });
  return Object.values(map);
}

function addCustomCity() {
  const name = $("ts-new-city-name")?.value.trim();
  if (!name) return;
  const color = $("ts-new-city-color")?.value || "#0891b2";
  const id = name.toLowerCase().replace(/\s+/g, "-").replace(/[^a-z0-9؀-ۿ-]/g, "").slice(0, 30) || ("city_" + Date.now());
  if (state.customCities.find(c => c.id === id || c.name === name)) { alert("المدينة موجودة بالفعل"); return; }
  state.customCities.push({ id, name, color });
  state.cityColors[id] = color;
  saveCustomCities();
  saveCityColors();
  // Refresh just the cities section in the modal
  openTripSettings();
}

function removeCustomCity(id) {
  state.customCities = state.customCities.filter(c => c.id !== id);
  saveCustomCities();
  openTripSettings();
}

function editCityInSettings(cityId) {
  // Find first day with that city and trigger setDayMeta on it
  const idx = state.itinerary.findIndex(d => d.city === cityId);
  if (idx < 0) return;
  state.activeDayIdx = idx;
  closeModal();
  switchTab('itinerary');
  setTimeout(() => setDayMeta(), 200);
}

function saveTripSettings() {
  const newName = $("ts-name").value.trim();
  const sdate = $("ts-sdate").value;
  const edate = $("ts-edate").value;
  const targetDays = Math.max(0, parseInt($("ts-days").value, 10) || 0);

  // Gather new fields
  const depCity = $("ts-depcity")?.value.trim() || "";
  const depAirport = $("ts-depair")?.value.trim() || "";
  const arrCity = $("ts-arrcity")?.value.trim() || "";
  const arrAirport = $("ts-arrair")?.value.trim() || "";
  const retDepCity = $("ts-retdepcity")?.value.trim() || "";
  const retAirport = $("ts-retair")?.value.trim() || "";
  const hotelName = $("ts-hotel-name")?.value.trim() || "";
  const hotelArea = $("ts-hotel-area")?.value.trim() || "";
  const hotelLink = $("ts-hotel-link")?.value.trim() || "";

  // Update tripInfo
  if (sdate) state.tripInfo.startDate = sdate;
  if (edate) state.tripInfo.endDate = edate;
  if (depCity) state.tripInfo.depCity = depCity;
  if (depAirport) state.tripInfo.depAirport = depAirport;
  if (arrCity) state.tripInfo.arrCity = arrCity;
  if (arrAirport) state.tripInfo.arrAirport = arrAirport;
  if (retDepCity) state.tripInfo.retDepCity = retDepCity;
  if (retAirport) state.tripInfo.retAirport = retAirport;
  const travelers = parseInt($("ts-travelers")?.value, 10) || 1;
  state.tripInfo.travelers = travelers;
  const ticketRef = $("ts-pnr")?.value.trim() || "";
  if (ticketRef) state.tripInfo.ticketRef = ticketRef;
  state.tripInfo.notes = $("ts-notes")?.value.trim() || "";
  const customTitle = $("ts-custom-title")?.value.trim() || "";
  state.tripInfo.customTitle = customTitle;
  saveTripInfo();

  // Update trip registry
  const newCountryLib = $("ts-countrylib")?.value ?? undefined;
  if (newName || sdate || edate || newCountryLib !== undefined) {
    const trip = TripsRegistry.get(Trip.current) || { ...TripsRegistry.KOREA_DEFAULT };
    if (newName) trip.name = newName;
    if (sdate) trip.startDate = sdate;
    if (edate) trip.endDate = edate;
    if (depCity) trip.depCity = depCity;
    if (depAirport) trip.depAir = depAirport;
    if (arrCity) trip.arrCity = arrCity;
    if (arrAirport) trip.arrAir = arrAirport;
    if (newCountryLib !== undefined) trip.countryLib = newCountryLib || null;
    TripsRegistry.upsert(trip);
  }

  // Auto-generate days from sdate/targetDays with proper city + hotel
  const defaultCity = arrCity || (state.itinerary[0]?.city || (isKoreaTrip() ? "seoul" : ""));
  const defaultHotel = hotelName ? { name: hotelName, area: hotelArea, bookingLink: hotelLink || null } : null;

  // Add days if needed
  while (state.itinerary.length < targetDays) {
    state.itinerary.push({
      day: 0, date: "", dateLabel: "", weekday: "",
      city: state.itinerary[state.itinerary.length - 1]?.city || defaultCity,
      title: "", type: "normal",
      flight: null, narrative: null, notes: null,
      hotel: state.itinerary[state.itinerary.length - 1]?.hotel || (defaultHotel ? { ...defaultHotel } : null),
      items: []
    });
  }
  // Remove from end
  while (state.itinerary.length > targetDays && state.itinerary.length > 0) {
    state.itinerary.pop();
  }

  // Apply default city/hotel to days that don't have them yet (smart: only fill blanks)
  if (state.itinerary.length > 0 && sdate) {
    const start = new Date(sdate);
    const weekdays = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
    const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
    state.itinerary.forEach((d, i) => {
      const dt = new Date(start);
      dt.setDate(start.getDate() + i);
      const iso = dt.toISOString().split('T')[0];
      if (!d.date) d.date = iso;
      if (!d.weekday) d.weekday = weekdays[dt.getDay()];
      if (!d.dateLabel) d.dateLabel = `${dt.getDate()} ${months[dt.getMonth()]}`;
      if (!d.city && defaultCity) d.city = defaultCity;
      if (!d.hotel?.name && defaultHotel) d.hotel = { ...defaultHotel };
    });
    // Mark first day as arrival, last as departure (if not already set)
    if (state.itinerary[0] && state.itinerary[0].type === 'normal') state.itinerary[0].type = 'arrival';
    const last = state.itinerary[state.itinerary.length - 1];
    if (last && last.type === 'normal' && state.itinerary.length > 1) last.type = 'departure';
  }

  renumberDays();
  if (state.activeDayIdx >= state.itinerary.length) state.activeDayIdx = Math.max(0, state.itinerary.length - 1);
  saveItin();

  closeModal();
  updateHeaderForTrip();
  renderItinerary();
}

function addNewDayQuiet() {
  const last = state.itinerary[state.itinerary.length - 1];
  const t = state.tripInfo || {};
  const defaultCity = isKoreaTrip() ? "seoul" : (t.arrCity || "");
  const newDay = {
    day: 0, date: "", dateLabel: "", weekday: "",
    city: last?.city || defaultCity,
    title: "", type: "normal",
    flight: null, narrative: null, notes: null,
    hotel: last?.hotel ? { ...last.hotel } : null,
    items: []
  };
  state.itinerary.push(newDay);
  renumberDays();
}

async function _compressToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  const cs = new CompressionStream("deflate-raw");
  const writer = cs.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const buf = await new Response(cs.readable).arrayBuffer();
  const arr = new Uint8Array(buf);
  let bin = "";
  for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
  return btoa(bin);
}

async function _decompressFromBase64(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const ds = new DecompressionStream("deflate-raw");
  const writer = ds.writable.getWriter();
  writer.write(arr);
  writer.close();
  return await new Response(ds.readable).text();
}
