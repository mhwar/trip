function updateHeaderForTrip() {
  const trip = TripsRegistry.get(Trip.current) || TripsRegistry.KOREA_DEFAULT;
  const t = state.tripInfo || {};
  const start = t.startDate || trip.startDate;
  const end = t.endDate || trip.endDate;
  const days = state.itinerary.length;

  // Tag: country/destination name
  const countryName = trip.destination || trip.name || 'رحلة';
  $("hdr-tag-text") && ($("hdr-tag-text").textContent = `${trip.icon || '✈️'} ${countryName}`);
  // H1: custom trip title (editable) — separate from country name
  const customTitle = t.customTitle || trip.name || countryName;
  $("hdr-title") && ($("hdr-title").textContent = customTitle);
  // Hero strip: themed by country
  const hero = $("hdr-hero");
  if (hero) hero.setAttribute("data-country", trip.countryLib || "");

  // Subtitle: days · dates · ticket ref (if any)
  const fmt = d => d ? d.replace(/^(\d{4})-(\d{2})-(\d{2})$/, '$3/$2/$1') : '';
  let subText = '';
  if (days) subText += `${days} يوم`;
  if (start && end) subText += (subText ? ' · ' : '') + `${fmt(start)} ← ${fmt(end)}`;
  if (t.ticketRef) subText += (subText ? ' · ' : '') + `مرجع: ${t.ticketRef}`;
  $("hdr-sub") && ($("hdr-sub").textContent = subText || 'افتح إعدادات الرحلة لتعبئة البيانات');

  // Stats: dynamically show what's available
  const statsEl = $("hdr-stats");
  if (statsEl) {
    const stats = [];
    if (start) {
      const ob = (t.outboundFlights && t.outboundFlights[0]) || {};
      const arrTime = ob.arrTime ? ` · ${ob.arrTime}` : '';
      stats.push(`<div class="sb"><div class="sb-l">الوصول</div><div class="sb-v">${fmt(start)}${arrTime}</div></div>`);
    }
    if (end) {
      const rb = (t.returnFlights && t.returnFlights[0]) || {};
      const depTime = rb.depTime ? ` · ${rb.depTime}` : '';
      stats.push(`<div class="sb"><div class="sb-l">المغادرة</div><div class="sb-v">${fmt(end)}${depTime}</div></div>`);
    }
    if (start) {
      const today = new Date(); today.setHours(0,0,0,0);
      const sd = new Date(start);
      const diff = Math.round((sd - today) / 86400000);
      const cdLabel = diff > 0 ? `${diff} يوم` : (diff === 0 ? 'اليوم!' : `بدأت قبل ${Math.abs(diff)} يوم`);
      stats.push(`<div class="sb sb-acc"><div class="sb-l">العد التنازلي</div><div class="sb-v">${cdLabel}</div></div>`);
    }
    statsEl.innerHTML = stats.join('');
  }

  $("footer-text") && ($("footer-text").textContent = `${trip.name || 'رحلة'} · يُحفظ تلقائياً ومُزامَن عبر الأجهزة`);

  const back = $("hdr-back-btn");
  if (back) back.hidden = false;
}

// ═══════════════════════════════════════════════════════════
//   INIT
// ═══════════════════════════════════════════════════════════

async function initApp() {
  seedBuiltinLibraries();
  const route = applyRoute();

  // ─── Invite redemption flow ────────────────────────────────────────────
  if (route.inviteToken) {
    const info = await Auth.inviteInfo(route.inviteToken);
    if (info && info.ok) {
      _renderInviteForm(route.inviteToken, info.email, info.role);
    } else {
      document.body.innerHTML = `<div style="max-width:480px;margin:5rem auto;padding:2rem;font-family:system-ui;direction:rtl;text-align:center;border:1px solid #e5e7eb;border-radius:12px;background:#fff">
        <div style="font-size:2rem;margin-bottom:0.5rem">⚠️</div>
        <h2 style="margin:0 0 0.5rem">رابط الدعوة غير صالح</h2>
        <p style="color:#6b7280">قد يكون الرابط منتهي الصلاحية أو مستخدماً مسبقاً.</p>
        <a href="/" style="display:inline-block;margin-top:1rem;padding:0.6rem 1.5rem;background:#0ea5e9;color:#fff;border-radius:6px;text-decoration:none">العودة للموقع</a>
      </div>`;
      return;
    }
    return;
  }

  // ─── Share token flow (?s=TOKEN) ───────────────────────────────────────
  if (route.shareToken) {
    const resolved = await Auth.resolveShare(route.shareToken);
    if (resolved && resolved.ok) {
      window._shareToken = route.shareToken;
      window._loadedPerms = resolved.perms;
      window._shareLabel  = resolved.label;
      // Set route.loadCode so the existing load flow runs against the trip
      route.loadCode = resolved.tripCode;
    } else {
      window._cloudLoadFailed = true;
      window._cloudLoadCode = "(invalid share)";
    }
  }

  // Dashboard mode — always accessible
  if (route.showDashboard || !route.tripId) {
    $("trip-view").hidden = true;
    $("dashboard-view").hidden = false;
    $("fab").hidden = true;
    $("sync-fab").hidden = true;
    renderDashboard();
    try { if (typeof lucide !== 'undefined') lucide.createIcons(); } catch {}
    return;
  }

  // Specific trip view
  Trip.current = route.tripId || "korea";

  // If a share param is in URL, decompress+decode and apply (no server needed)
  if (route.shareData) {
    try {
      let json;
      try {
        json = await _decompressFromBase64(route.shareData);
      } catch {
        // fallback: old uncompressed format
        json = decodeURIComponent(escape(atob(route.shareData)));
      }
      const data = JSON.parse(json);
      if (data.itinerary)  Trip.save("itin", data.itinerary);
      if (data.tripInfo)   Trip.save("tripinfo", data.tripInfo);
      if (data.cityColors) Trip.save("citycolors", data.cityColors);
      // Clean share param from URL so it doesn't re-apply on refresh
      const cleanUrl = new URL(location.href);
      cleanUrl.searchParams.delete("share");
      history.replaceState(null, "", cleanUrl.toString());
    } catch {}
  }

  // If a load code is in URL, fetch from cloud first
  let _liveUpdatedAt = null;
  if (route.loadCode) {
    let _cloudOk = false;
    const loadUrl = window._shareToken
      ? `/.netlify/functions/load?share=${encodeURIComponent(window._shareToken)}`
      : `/.netlify/functions/load?code=${encodeURIComponent(route.loadCode)}`;
    const headers = {};
    const authToken = Auth.getToken();
    if (authToken) headers["Authorization"] = "Bearer " + authToken;
    try {
      const res = await fetch(loadUrl, { headers });
      if (res.ok) {
        const json = await res.json();
        if (json.data) {
          if (json.data.itinerary)  Trip.save("itin", json.data.itinerary);
          if (json.data.customLib)  Trip.save("clib", json.data.customLib);
          if (json.data.budget)     Trip.save("bud",  json.data.budget);
          if (json.data.tasks)      Trip.save("tasks", json.data.tasks);
          if (json.data.favs)       Trip.save("favs", json.data.favs);
          if (json.data.tripInfo)   Trip.save("tripinfo", json.data.tripInfo);
          if (json.data.cityColors) Trip.save("citycolors", json.data.cityColors);
          Trip.save("sync_code", route.loadCode);
          _liveUpdatedAt = json.updatedAt || null;
          if (json.perms) window._loadedPerms = json.perms;
          _cloudOk = true;
        }
      }
    } catch {}
    window._cloudLoadFailed = !_cloudOk;
    window._cloudLoadCode = route.loadCode;
    // Apply perm class to body for UI restriction
    if (window._loadedPerms) {
      document.body.classList.remove("perms-view","perms-tasks","perms-full");
      document.body.classList.add("perms-" + window._loadedPerms);
    }
    // Auto-poll every 90s for live updates
    setInterval(async () => {
      try {
        const r = await fetch(loadUrl, { headers });
        if (!r.ok) return;
        const j = await r.json();
        if (j.data && j.updatedAt && j.updatedAt !== _liveUpdatedAt) {
          _liveUpdatedAt = j.updatedAt;
          syncApplyState(j.data);
          switchTab(state.active);
          _showSaveIndicator("↻ تم تحديث الرحلة");
        }
      } catch {}
    }, 90000);
  }

  // Reload state from current trip's storage (use trip-specific defaults)
  const _uk = isUKTrip();
  state.itinerary = Trip.load("itin", makeEmptyItinerary());
  state.customLib = Trip.load("clib", []);
  state.budget    = Trip.load("bud",  _uk ? UK_BUDGET_DEFAULT : BUDGET_DEFAULT);
  state.tasks     = Trip.load("tasks", _uk ? UK_TASKS_DEFAULT : TASKS_DEFAULT);
  state.favs      = Trip.load("favs", []);
  state.tripInfo  = Trip.load("tripinfo", _uk ? UK_TRIP_INFO_DEFAULT : TRIP_INFO_DEFAULT);
  state.cityColors    = Trip.load("citycolors", { ...CITY_COLORS_DEFAULT });
  state.customCities  = Trip.load("customcities", []);
  state.active    = Trip.load("tab", "overview");
  CITY_COLORS = { ...state.cityColors };

  $("trip-view").hidden = false;
  $("dashboard-view").hidden = true;

  renderNav();
  updateCountdown();
  setInterval(updateCountdown, 60 * 60 * 1000);
  switchTab(state.active);
  updateHeaderForTrip();
}

document.addEventListener("DOMContentLoaded", () => {
  // Modal close on backdrop click
  $("modal-bk").addEventListener("click", (e) => {
    if (e.target === $("modal-bk")) closeModal();
  });

  // Esc to close modal
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
  });

  initApp();
  loadHeroImage();
});

</script>
</body>
</html>
