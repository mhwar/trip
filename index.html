  `);

  // Hook up the "new city" select
  const sel = $("ct-to-city");
  if (sel) sel.onchange = () => {
    const row = $("ct-new-city-row");
    if (row) row.style.display = sel.value === '__new__' ? '' : 'none';
  };
}

function saveCityTransfer(dayIdx, fromCityId, fromCityName) {
  // Determine destination city
  let toCityId = '';
  let toCityName = '';
  const sel = $("ct-to-city");
  const txtInput = $("ct-to-city-txt");

  if (sel) {
    if (sel.value === '__new__') {
      toCityName = $("ct-new-city-name")?.value.trim();
      if (!toCityName) { alert("يرجى كتابة اسم المدينة الجديدة"); return; }
      toCityId = toCityName.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9؀-ۿ-]/g,"").slice(0,30) || ("city_"+Date.now());
      if (!state.customCities.find(c=>c.id===toCityId)) {
        state.customCities.push({ id: toCityId, name: toCityName, color: "#0891b2" });
        state.cityColors[toCityId] = "#0891b2";
        saveCustomCities(); saveCityColors();
      }
    } else {
      toCityId = sel.value;
      if (!toCityId) { alert("يرجى اختيار مدينة الوصول"); return; }
      toCityName = cityById(toCityId)?.name || state.customCities?.find(c=>c.id===toCityId)?.name || toCityId;
    }
  } else if (txtInput) {
    toCityName = txtInput.value.trim();
    if (!toCityName) { alert("يرجى كتابة اسم المدينة"); return; }
    toCityId = toCityName.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9؀-ۿ-]/g,"").slice(0,30) || ("city_"+Date.now());
    if (!state.customCities.find(c=>c.id===toCityId)) {
      state.customCities.push({ id: toCityId, name: toCityName, color: "#0891b2" });
      state.cityColors[toCityId] = "#0891b2";
      saveCustomCities(); saveCityColors();
    }
  }

  const modeMap = { flight:"✈️ طيران", train:"🚄 قطار", bus:"🚌 باص", car:"🚗 سيارة خاصة", rental:"🚗 سيارة مستأجرة", ferry:"⛴️ عبارة", other:"🛤️" };
  const mode = $("ct-mode").value;
  const time = $("ct-time").value;
  const ref  = $("ct-ref").value.trim();
  const dur  = $("ct-dur").value.trim();
  const notes = $("ct-notes").value.trim();
  const applyForward = $("ct-apply-forward").checked;

  const day = state.itinerary[dayIdx];
  // Add transport item to this day
  day.type = "transit";
  day.flight = { from: fromCityName || fromCityId, to: toCityName, depTime: time, arrTime: "" };
  const itemId = "tr_" + Date.now();
  const modeLabel = modeMap[mode] || mode;
  const itemText = `${modeLabel}: ${fromCityName || fromCityId} → ${toCityName}${ref ? ` (${ref})` : ''}${dur ? ` · ${dur}` : ''}`;
  day.items.push({
    id: itemId, time, type: "transport",
    text: itemText,
    notes: notes || null,
    bookingLink: null, requiresTicket: mode==='flight', done: false, locked: false
  });
  day.city = toCityId; // day of travel ends in the new city

  // Apply new city forward
  if (applyForward) {
    for (let i = dayIdx + 1; i < state.itinerary.length; i++) {
      if (!state.itinerary[i].city || state.itinerary[i].city === fromCityId) {
        state.itinerary[i].city = toCityId;
        // Inherit hotel from last day if not set
        if (!state.itinerary[i].hotel?.name && day.hotel?.name) {
          state.itinerary[i].hotel = { ...day.hotel };
        }
      } else break; // stop at first day that already has a different city
    }
  }

  saveItin();
  closeModal();
  renderItinerary();
}

function duplicateDay(idx) {
  const original = state.itinerary[idx];
  // Deep clone with new IDs for items
  const copy = JSON.parse(JSON.stringify(original));
  copy.items = (copy.items || []).map(it => ({ ...it, id: "i_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7) }));
  copy.title = (copy.title || "") + " (نسخة)";
  state.itinerary.splice(idx + 1, 0, copy);
  renumberDays();
  saveItin();
  state.activeDayIdx = idx + 1;
  renderItinerary();
}

function moveDayUp(idx) {
  if (idx === 0) return;
  [state.itinerary[idx], state.itinerary[idx - 1]] = [state.itinerary[idx - 1], state.itinerary[idx]];
  renumberDays();
  saveItin();
  state.activeDayIdx = idx - 1;
  renderItinerary();
}

function moveDayDown(idx) {
  if (idx >= state.itinerary.length - 1) return;
  [state.itinerary[idx], state.itinerary[idx + 1]] = [state.itinerary[idx + 1], state.itinerary[idx]];
  renumberDays();
  saveItin();
  state.activeDayIdx = idx + 1;
  renderItinerary();
}

// ─── 🔍 DAY ANALYTICS & SMART WARNINGS ───
function analyzeDayWarnings(day) {
  const warnings = [];
  const items = (day.items || []).slice().sort((a, b) =>
    (a.time || "99:99").localeCompare(b.time || "99:99")
  );
  const itemsWithTime = items.filter(i => i.time);

  // Warning 1: Too many activities
  if (items.length >= 9) {
    warnings.push({ level: "warn", icon: "⚠️", text: `يوم مزدحم - ${items.length} نشاط. فكّر في تأجيل بعضها.` });
  }

  // Warning 2: Time conflicts (overlapping items - <30min gap when one is meal/activity)
  for (let i = 0; i < itemsWithTime.length - 1; i++) {
    const a = itemsWithTime[i], b = itemsWithTime[i + 1];
    if (a.time === b.time) {
      warnings.push({ level: "err", icon: "⏰", text: `تداخل: نشاطان في نفس الوقت (${a.time})` });
    }
  }

  // Warning 3: No meals planned
  const hasMeal = items.some(i => i.type === "food");
  if (items.length >= 3 && !hasMeal && day.type === "normal") {
    warnings.push({ level: "info", icon: "🍽️", text: "لم تضع وجبة في هذا اليوم" });
  }

  // Warning 4: Friday → no Friday prayer
  if (day.weekday === "الجمعة" && !items.some(i => i.type === "mosque")) {
    warnings.push({ level: "info", icon: "🕌", text: "يوم جمعة - لم تضع وقتاً لصلاة الجمعة" });
  }

  // Warning 5: Long distance between consecutive items
  for (let i = 0; i < itemsWithTime.length - 1; i++) {
    const a = itemsWithTime[i], b = itemsWithTime[i + 1];
    if (a.lat && a.lng && b.lat && b.lng) {
      const dist = calcDistKm(a.lat, a.lng, b.lat, b.lng);
      if (dist > 20) {
        warnings.push({ level: "info", icon: "🚇", text: `مسافة كبيرة (${dist.toFixed(0)}كم) بين "${shortText(a.text)}" و "${shortText(b.text)}"` });
      }
    }
  }

  // Warning 6: Very early start
  if (itemsWithTime.length && itemsWithTime[0].time < "06:00") {
    warnings.push({ level: "info", icon: "🌅", text: `بداية مبكرة جداً (${itemsWithTime[0].time}) - تأكد من النوم مبكراً` });
  }

  // Warning 7: Very late ending
  if (itemsWithTime.length && itemsWithTime[itemsWithTime.length - 1].time > "23:00") {
    warnings.push({ level: "info", icon: "🌙", text: "ينتهي اليوم متأخراً - فكّر في الاستراحة قبل النشاط الأخير" });
  }

  return warnings;
}

function calcDistKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
            Math.sin(dLng/2) * Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function shortText(s) {
  if (!s) return "";
  return s.length > 25 ? s.slice(0, 25) + "…" : s;
}

// Compute buffer time between two consecutive items
function computeBuffer(prevTime, nextTime) {
  if (!prevTime || !nextTime) return null;
  const [h1, m1] = prevTime.split(":").map(Number);
  const [h2, m2] = nextTime.split(":").map(Number);
  const mins = (h2 * 60 + m2) - (h1 * 60 + m1);
  if (mins <= 0) return null;
  if (mins < 30) return null; // too short to show
  if (mins < 60) return `${mins}د فجوة`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m === 0 ? `${h}س فجوة` : `${h}س ${m}د فجوة`;
}

// Toggle item completion status
function toggleItemDone(id) {
  const day = state.itinerary[state.activeDayIdx];
  const item = day.items.find(i => i.id === id);
  if (!item) return;
  item.done = !item.done;
  saveItin();
  renderItinerary();
}


</script>
<script>
// ═══════════════════════════════════════════════════════════
//   MODAL HELPERS
// ═══════════════════════════════════════════════════════════

function openModal(html) {
  $("modal-body").innerHTML = html;
  $("modal-bk").classList.add("show");
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  $("modal-bk").classList.remove("show");

}

// ═══════════════════════════════════════════════════════════
//   ITEM PICKER MODAL (library + new)
// ═══════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════
//   📋 CATEGORY-BASED ITEM PICKER (Logical Day Builder)
// ═══════════════════════════════════════════════════════════

// 7 logical categories for building a day
const ADD_CATEGORIES = [
  { id: "stay", icon: "🏨", label: "السكن", desc: "تسجيل دخول/خروج، فندق", color: "#1a4d4a", types: ["hotel"] },
  { id: "transport", icon: "✈️", label: "مواصلات", desc: "طيران، KTX، AREX، تنقل", color: "#f59e0b", types: ["transport"] },
  { id: "meal", icon: "🍽️", label: "وجبة", desc: "فطور، غداء، عشاء", color: "#16a34a", types: ["food"] },
  { id: "activity", icon: "📍", label: "نشاط/زيارة", desc: "معلم، مسجد، تسوق، ترفيه", color: "#0891b2", types: ["attraction", "mosque", "shop", "entertainment", "festival"] },
  { id: "tour", icon: "🎯", label: "جولة منظمة", desc: "DMZ، Gyeongju، جولات حجزها مسبق", color: "#7c3aed", types: ["tour"] },
  { id: "rest", icon: "☕", label: "راحة/استراحة", desc: "نوم، صلاة، تجوّل حر", color: "#d97706", types: ["rest"] },
  { id: "note", icon: "📝", label: "ملاحظة", desc: "تذكير، معلومة مهمة لليوم", color: "#64748b", types: ["note"] }
];

function openItemPicker(dayIdx) {
  state.pendingInsert = { dayIdx };
  state.pickerStep = "category"; // category → subtype → details
  state.pickerCategory = null;
  state.pickerType = "all";
  renderPicker();
}

function renderPicker() {
  const day = state.itinerary[state.pendingInsert.dayIdx];
  openModal(`
    <div class="modal-h">
      <h3>${state.pickerStep === 'category' ? 'ماذا تريد إضافة؟' : 'إضافة بند'} · يوم ${day.day}</h3>
      <button class="modal-x" onclick="closeModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="picker-body"></div>
  `);
  renderPickerBody();
}

function renderPickerBody() {
  const body = $("picker-body");
  if (!body) return;
  if (state.pickerStep === "category") {
    body.innerHTML = renderCategoryGrid();
  } else if (state.pickerStep === "details") {
    body.innerHTML = renderCategoryFlow();
  }
}

function renderCategoryGrid() {
  return `
    <p class="txs clm mb3">اختر نوع البند الذي تريد إضافته. كل نوع له حقول مخصصة وذكية.</p>
    <div class="cat-grid">
      ${ADD_CATEGORIES.map(c => `
        <button class="cat-card" onclick="selectCategory('${c.id}')" style="--cat-c:${c.color}">
          <div class="cat-ic">${c.icon}</div>
          <div class="cat-info">
            <div class="cat-l">${c.label}</div>
            <div class="cat-d">${c.desc}</div>
          </div>
          <svg class="cat-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      `).join('')}
    </div>
  `;
}

function selectCategory(catId) {
  state.pickerCategory = catId;
  state.pickerStep = "details";
  renderPicker();
}

function backToCategory() {
  state.pickerStep = "category";
  state.pickerCategory = null;
  renderPicker();
}

function renderCategoryFlow() {
  const cat = ADD_CATEGORIES.find(c => c.id === state.pickerCategory);
  const day = state.itinerary[state.pendingInsert.dayIdx];

  // Suggest next time
  const sorted = [...day.items].sort((a,b) => (a.time || "99:99").localeCompare(b.time || "99:99"));
  const lastTime = sorted.length ? sorted[sorted.length - 1].time : "09:00";
  const [h, m] = (lastTime || "09:00").split(":").map(Number);
  const nextH = Math.min(h + (cat.id === 'meal' ? 3 : 2), 22);
  const suggestedTime = `${String(nextH).padStart(2,'0')}:00`;

  let formHTML = '';

  if (cat.id === "stay") {
    formHTML = renderStayForm(suggestedTime);
  } else if (cat.id === "transport") {
    formHTML = renderTransportForm(suggestedTime);
  } else if (cat.id === "meal") {
    formHTML = renderMealForm(suggestedTime);
  } else if (cat.id === "activity") {
    formHTML = renderActivityForm(suggestedTime);
  } else if (cat.id === "tour") {
    formHTML = renderTourForm(suggestedTime);
  } else if (cat.id === "rest") {
    formHTML = renderRestForm(suggestedTime);
  } else if (cat.id === "note") {
    formHTML = renderNoteForm(suggestedTime);
  }

  return `
    <button class="back-btn" onclick="backToCategory()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      رجوع للفئات
    </button>
    <div class="cat-header" style="--cat-c:${cat.color}">
      <div class="cat-header-ic">${cat.icon}</div>
      <div>
        <div class="fb7 cli">${cat.label}</div>
        <div class="txx clm">${cat.desc}</div>
      </div>
    </div>
    ${formHTML}
  `;
}

    </div>
    <div class="modal-act">
      <button class="btn btn-sec" onclick="closeModal()">إلغاء</button>

function saveStayItem() {
  const action = $("stay-action").value;
  const time = $("stay-time").value;
  const name = $("stay-name").value.trim();
  if (!name) { alert("اسم الفندق مطلوب"); return; }

  const booking = $("stay-booking").value.trim();
  const room = $("stay-room").value.trim();
  const note = $("stay-note").value.trim();

  const actionLabels = { checkin: "🛬 Check-in", checkout: "🛫 Check-out", stay: "🛌 مبيت" };

  const meta = [];

  if (room) meta.push(`غرفة: ${room}`);
  if (area) meta.push(area);

  const day = state.itinerary[state.pendingInsert.dayIdx];
  day.items.push({
    id: "i_" + Date.now(),
    time, text, type: "hotel",
    stayAction: action,
    stayName: name, stayArea: area, stayBooking: booking, stayRoom: room,
    note: note || (meta.length ? meta.join(" · ") : null)
  });
  saveItin();
  closeModal();
  renderItinerary();
}

// ─── ✈️ TRANSPORT (Flights, Trains, Transfers) ───
function renderTransportForm(suggestedTime) {

          <option value="metro">🚇 مترو</option>
          <option value="rental">🚗 سيارة مستأجرة</option>

function saveTransportItem() {
  const mode = $("tr-mode").value;
  const time = $("tr-time").value;
  const from = $("tr-from").value.trim();
  const to = $("tr-to").value.trim();
  if (!from || !to) { alert("نقطة الانطلاق والوصول مطلوبتان"); return; }
  const num = $("tr-num").value.trim();
  const dur = $("tr-dur").value.trim();
  const price = $("tr-price").value.trim();
  const seat = $("tr-seat").value.trim();
  const note = $("tr-note").value.trim();
  const locked = $("tr-locked").checked;

  const icons = { flight: "✈️", train: "🚄", arex: "🚆", bus: "🚌", taxi: "🚖", metro: "🚇", rental: "🚗", ferry: "⛴️" };
  let text = `${icons[mode]} ${from} → ${to}`;
  if (num) text += ` (${num})`;
  if (dur) text += ` · ${dur}`;

  const meta = [];
  if (seat) meta.push(seat);
  if (price) meta.push(price);
  const fullNote = [note, meta.join(" · ")].filter(Boolean).join(" — ");

  const day = state.itinerary[state.pendingInsert.dayIdx];
  day.items.push({
    id: "i_" + Date.now(),
    time, text, type: "transport",
    transportMode: mode,
    transportFrom: from, transportTo: to, transportNum: num,
    transportDuration: dur, transportPrice: price, transportSeat: seat,
    note: fullNote || null,
    locked
  });
  saveItin();
  closeModal();
  renderItinerary();
}

let actFilter = "all";
function setActFilter(t, ev) {

function renderActLibList() {
  const day = state.itinerary[state.pendingInsert.dayIdx];
  const q = ($("act-search")?.value || "").toLowerCase();
  const list = $("act-lib-list");
  if (!list) return;

  const types = ["attraction", "mosque", "shop", "entertainment", "festival"];
  const filtered = allLib().filter(l => {
    if (l.city !== day.city) return false;
    if (!types.includes(l.type)) return false;
    if (actFilter !== "all" && l.type !== actFilter) return false;
    if (q && !((l.name || '') + ' ' + (l.area || '')).toLowerCase().includes(q)) return false;
    return true;
  });

  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="empty-i">🔍</div><div class="empty-t">لا نتائج</div><p class="empty-d">جرّب "موقع جديد"</p></div>`;
    return;
  }

  list.innerHTML = `<div class="picker-list">${filtered.map(l => `
    <button class="picker-item" onclick="addActivityFromLib('${l.id}')">
      <div class="picker-item-ic" style="background:${TYPES[l.type]?.color || '#888'}1a;color:${TYPES[l.type]?.color || '#888'}">${l.icon}</div>
      <div class="picker-item-info">
        <div class="picker-item-n">${l.name}</div>
        <div class="picker-item-m">${l.area} · ${TYPES[l.type]?.label || l.type}</div>
        <div class="picker-item-pills">
          ${l.halal ? '<span class="pill pill-sm pill-ok">🥩 حلال</span>' : ''}
          ${l.price ? `<span class="pill pill-sm">${l.price}</span>` : ''}
        </div>
      </div>
    </button>
  `).join('')}</div>`;
}

function saveActivityNew() {
  const name = $("act-name").value.trim();
  if (!name) { alert("الاسم مطلوب"); return; }
  const type = $("act-type").value;
  const time = $("act-time").value;

  const ticket = $("act-ticket").value.trim();
  const price = $("act-price").value.trim();
  const dur = $("act-dur").value.trim();
  const close = $("act-close").value;
  const lat = parseFloat($("act-lat").value) || null;
  const lng = parseFloat($("act-lng").value) || null;
  const note = $("act-note").value.trim();
  const save = $("act-save").checked;

  const meta = [];
  if (ticket) meta.push(`🎫 ${ticket}`);
  if (price) meta.push(price);
  if (dur) meta.push(`⏱️ ${dur}`);
  if (close) meta.push(`يغلق ${close}`);

  const day = state.itinerary[state.pendingInsert.dayIdx];

  if (save) {
    const customId = "c_" + Date.now();
    state.customLib.push({
      id: customId, name, type, area,
      icon: TYPES[type]?.icon || "📍",
      city: day.city, lat, lng, note, price, custom: true

    saveLib();
    day.items.push({
      id: "i_" + Date.now(), time, text: name, type, refId: customId,
      lat, lng, note: [note, meta.join(" · ")].filter(Boolean).join(" — ") || null

    day.items.push({
      id: "i_" + Date.now(), time, text: name, type,
      lat, lng, note: [note, meta.join(" · ")].filter(Boolean).join(" — ") || null
    });
  }
  saveItin();
  closeModal();
  renderItinerary();
}

function openTimePicker(refId) {
  const item = libById(refId);
  if (!item) return;
  const day = state.itinerary[state.pendingInsert.dayIdx];
  // Suggest next time slot
  const sorted = [...day.items].sort((a,b) => (a.time || "99:99").localeCompare(b.time || "99:99"));
  const lastTime = sorted.length ? sorted[sorted.length - 1].time : "09:00";
  const [h, m] = (lastTime || "09:00").split(":").map(Number);
  const nextH = Math.min(h + 2, 22);
  const suggested = `${String(nextH).padStart(2,'0')}:00`;

  openModal(`
    <div class="modal-h">
      <h3>وقت الزيارة</h3>
      <button class="modal-x" onclick="closeModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

    </div>
    <div class="card mb3">

        <div class="picker-item-ic" style="background:${TYPES[item.type]?.color || '#888'}1a;color:${TYPES[item.type]?.color || '#888'}">${item.icon}</div>
        <div class="fls">
          <div class="fb6 cli txm">${item.name}</div>
          <div class="txx clm">${item.area}</div>
        </div>
      </div>
    </div>
    <div class="fld">
      <label>الوقت</label>
      <input type="time" class="input" id="time-pick" value="${suggested}">
    </div>
    <div class="fld">
      <label>وصف مخصص (اختياري - افتراضياً اسم الموقع)</label>
      <input type="text" class="input" id="text-pick" placeholder="${item.name}">

  `);
}

}

    </div>
  `);
}

function saveFlightFromModal(kind, i) {
  const f = {
    airline: $("fl-air").value.trim(),
    from: $("fl-from").value.trim(),
    to: $("fl-to").value.trim(),
    depDate: $("fl-date").value,
    depTime: $("fl-dep").value,
    arrTime: $("fl-arr").value,
    pnr: $("fl-pnr").value.trim()
  };
  const key = kind === "out" ? "outboundFlights" : "returnFlights";
  if (!state.tripInfo[key]) state.tripInfo[key] = [];
  if (i < 0) state.tripInfo[key].push(f);
  else state.tripInfo[key][i] = f;
  saveTripInfo();
  closeModal();
  renderTripInfo();
}

function deleteFlight(kind, i) {
  if (!confirm("حذف هذه الرحلة؟")) return;
  const key = kind === "out" ? "outboundFlights" : "returnFlights";
  state.tripInfo[key].splice(i, 1);
  saveTripInfo();
  renderTripInfo();
}

function saveTripInfoForm() {
  state.tripInfo.destination = $("ti-dest")?.value.trim() || state.tripInfo.destination;
  state.tripInfo.travelers = parseInt($("ti-trav")?.value, 10) || 1;
  state.tripInfo.startDate = $("ti-sdate")?.value || state.tripInfo.startDate;
  state.tripInfo.endDate = $("ti-edate")?.value || state.tripInfo.endDate;
  state.tripInfo.ticketRef = $("ti-ref")?.value.trim() || "";
  state.tripInfo.notes = $("ti-notes")?.value.trim() || "";
  saveTripInfo();
}

function updateDayMetaSections() {
  const v = $("dm-type").value;
  $("flight-fields").hidden = v === 'normal';
}

function saveDayMeta() {
  const day = state.itinerary[state.activeDayIdx];
  day.title = $("dm-title").value.trim();
  day.city = $("dm-city").value;
  day.type = $("dm-type").value;
  day.narrative = $("dm-narrative").value.trim() || null;
  day.notes = $("dm-notes").value.trim() || null;

  if (day.type !== "normal") {
    day.flight = {
      from: $("dm-from").value.trim(),
      to: $("dm-to").value.trim(),
      depTime: $("dm-dep").value,
      arrTime: $("dm-arr").value,
      mode: $("dm-mode").value,
      ref: $("dm-flref").value.trim(),
      checkoutTime: $("dm-checkout-time").value
    };
  } else {
    day.flight = null;
  }

  // Hotel handling — apply to N consecutive days
  const hotelName = $("dm-hotel-name").value.trim();
  if (hotelName) {
    const nights = Math.max(1, parseInt($("dm-hotel-nights").value, 10) || 1);
    const hotel = {
      name: hotelName,
      address: $("dm-hotel-addr").value.trim(),
      checkIn: $("dm-hotel-cin").value || "15:00",
      checkOut: $("dm-hotel-cout").value || "11:00",
      nights,
      bookingLink: $("dm-hotel-link").value.trim(),
      notes: $("dm-hotel-notes").value.trim()
    };
    const startIdx = state.activeDayIdx;
    const endIdx = Math.min(state.itinerary.length - 1, startIdx + nights - 1);
    for (let i = startIdx; i <= endIdx; i++) {
      state.itinerary[i].hotel = {
        ...hotel,
        nightIndex: i - startIdx + 1,
        totalNights: nights,
        isFirst: i === startIdx,
        isLast: i === endIdx
      };
    }
  } else {
    day.hotel = null;
  }

  saveItin();
  closeModal();
  renderItinerary();
}

<script>
// ═══════════════════════════════════════════════════════════

function _linkLibToTrip(libId) {
  const trip = TripsRegistry.get(Trip.current);
  if (!trip) return;
  trip.countryLib = libId;
  TripsRegistry.upsert(trip);
  renderLibrary();
}

function renderLibrary() {
  const trip = TripsRegistry.get(Trip.current);
  const linkedLib = trip?.countryLib || null;
  const all = allLib();
  const hasLib = all.length > 0 || state.customLib.length > 0;

  if (!hasLib) {
    // Auto-detect matching library from trip name / destination / country
    const globalLibs = getGlobalLibs();
    const availableLibIds = ["korea", ...Object.keys(globalLibs)];
    const tripText = ((trip?.name || "") + " " + (trip?.destination || "") + " " + (state.tripInfo?.arrCity || "")).toLowerCase();
    const countryKeywords = {
      turkey: ["تركيا","turkey","turkish","اسطنبول","إسطنبول","istanbul","ankara","antalya"],
      uk: ["بريطانيا","britain","uk","england","london","لندن","ادنبره","edinburgh"],
      korea: ["كوريا","korea","korean","seoul","سيول","busan"],
      japan: ["اليابان","japan","japanese","tokyo","طوكيو"],
      malaysia: ["ماليزيا","malaysia","kuala","كوالا"],
      uae: ["الإمارات","امارات","uae","dubai","دبي","abudhabi"],
      egypt: ["مصر","egypt","cairo","القاهرة"],
      morocco: ["المغرب","morocco","marrakech","مراكش"],
      france: ["فرنسا","france","paris","باريس"],
      italy: ["إيطاليا","italy","rome","روما"],
      spain: ["إسبانيا","spain","barcelona","برشلونة"],
    };
    let suggestedLib = null;
    for (const [key, keywords] of Object.entries(countryKeywords)) {
      if (keywords.some(k => tripText.includes(k)) && availableLibIds.includes(key)) {
        suggestedLib = key;
        break;
      }
    }
    const suggestedMeta = suggestedLib ? (LIB_META[suggestedLib] || {}) : null;
    const libCount = suggestedLib === "korea"
      ? (typeof LIB !== 'undefined' ? LIB.length : 0)
      : (globalLibs[suggestedLib] || []).length;

    $("sec-library").innerHTML = `
      <div class="sec-t">
        <div class="sec-t-r">
          <div class="sec-t-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div>
          <h2>مكتبة المواقع</h2>
        </div>
        <p>مواقع مقترحة لزيارتها خلال رحلتك</p>
      </div>
      <div class="itin-welcome">
        <div class="itin-welcome-icon">📚</div>
        ${suggestedLib ? `
          <h3 class="itin-welcome-title">${suggestedMeta.icon||'🌍'} تم اكتشاف مكتبة ${suggestedMeta.name||suggestedLib}</h3>
          <p class="itin-welcome-desc">يوجد ${libCount} موقع في مكتبة ${suggestedMeta.name||suggestedLib} جاهزة للربط بهذه الرحلة.</p>

            <button class="btn btn-pri" onclick="_linkLibToTrip('${suggestedLib}')">
              ${suggestedMeta.icon||'📚'} ربط مكتبة ${suggestedMeta.name||suggestedLib}
            </button>
            <button class="btn btn-out" onclick="openTripSettings()">⚙️ إعدادات الرحلة</button>
          </div>
        ` : `
          <h3 class="itin-welcome-title">لا توجد مكتبة مرتبطة</h3>
          <p class="itin-welcome-desc">اختر مكتبة لربطها بهذه الرحلة من الإعدادات.</p>
          <button class="btn btn-pri" onclick="openTripSettings()" style="margin-top:1rem">⚙️ إعدادات الرحلة → المكتبة المرتبطة</button>
        `}
      </div>
    `;
    return;
  }

  const meta = LIB_META[linkedLib] || {};
  const stats = {
    total: all.length,
    halal: all.filter(l => l.halal).length,
    gf: all.filter(l => l.gf).length,
    custom: state.customLib.length
  };

  // Build city list from the library items (not hardcoded CITIES)
  const libCities = linkedLib === "korea"

        <input type="text" id="lib-search" placeholder="ابحث بالاسم أو المنطقة..." value="${state.libFilters.q || ''}" oninput="state.libFilters.q=this.value;renderLibList()">

        ${libCities.map(c => `<button class="flt-chip ${state.libFilters.city === c.id ? 'act' : ''}" onclick="state.libFilters.city='${c.id}';renderLibList()">${c.name}</button>`).join('')}

        <button class="flt-chip ${state.libFilters.fav ? 'act-orng' : ''}" onclick="state.libFilters.fav=!state.libFilters.fav;renderLibList()">❤️ المفضلة</button>

  renderLibList();
}

function renderLibList() {
  const list = $("lib-list");
  const bar = $("lib-result-bar");
  if (!list) return;
  const f = state.libFilters;

  let filtered = allLib().filter(l => {
    if (f.city !== "all" && l.city !== f.city) return false;
    if (f.type !== "all" && l.type !== f.type) return false;
    if (f.halal && !l.halal) return false;
    if (f.gf && !l.gf) return false;
    if (f.fav && !state.favs.includes(l.id)) return false;
    if (f.q) {
      const q = f.q.toLowerCase();
      const hay = ((l.name || '') + ' ' + (l.area || '') + ' ' + (l.note || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  // Sort
  if (f.sort === "name") filtered.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  else if (f.sort === "city") filtered.sort((a, b) => (a.city || '').localeCompare(b.city) || a.name.localeCompare(b.name, 'ar'));
  else if (f.sort === "type") filtered.sort((a, b) => (a.type || '').localeCompare(b.type) || a.name.localeCompare(b.name, 'ar'));

  // Active filter pills
  const activePills = [];
  if (f.city !== "all") activePills.push({ k: 'city', l: cityById(f.city)?.name || f.city, clear: "state.libFilters.city='all'" });
  if (f.type !== "all") activePills.push({ k: 'type', l: TYPES[f.type]?.label || f.type, clear: "state.libFilters.type='all'" });
  if (f.halal) activePills.push({ k: 'halal', l: '🥩 حلال', clear: "state.libFilters.halal=false" });
  if (f.gf) activePills.push({ k: 'gf', l: '🌾 GF', clear: "state.libFilters.gf=false" });
  if (f.fav) activePills.push({ k: 'fav', l: '❤️ مفضلة', clear: "state.libFilters.fav=false" });
  if (f.q) activePills.push({ k: 'q', l: `"${f.q}"`, clear: "state.libFilters.q=''" });

  if (bar) {
    bar.innerHTML = `
      <div class="flt-result-bar">
        <div class="flt-cnt">
          <strong>${filtered.length}</strong> من ${allLib().length} موقع
          ${activePills.length > 0 ? `· <span class="flt-cnt-active">${activePills.length} فلتر نشط</span>` : ''}
        </div>
        ${activePills.length > 0 ? `
          <div class="flt-active-list">
            ${activePills.map(p => `
              <span class="flt-active-pill">
                ${p.l}
                <button onclick="${p.clear};renderLibrary()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
              </span>
            `).join('')}
            <button class="flt-clear-all" onclick="resetFilters()">مسح الكل</button>
          </div>
        ` : ''}
      </div>
    `;
  }

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="empty-i">🔍</div>
        <div class="empty-t">لا توجد نتائج</div>
        <p class="empty-d">جرّب تغيير الفلاتر أو ابحث عن كلمة أخرى. لديك ${activePills.length} فلتر نشط الآن.</p>
        <div class="empty-acts">
          ${activePills.length > 0 ? `<button class="btn btn-pri" onclick="resetFilters()">مسح كل الفلاتر</button>` : ''}
        </div>
      </div>
    `;
    return;
  }

  list.innerHTML = `<div class="lib-grid">${filtered.map(l => renderPOI(l)).join('')}</div>`;
}

function resetFilters() {
  state.libFilters = { type: 'all', city: 'all', halal: false, gf: false, fav: false, q: '', sort: 'default' };
  renderLibrary();
}

        <svg viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>

        ${l.gf ? '<span class="pill pill-sm pill-gold">🌾 GF</span>' : ''}
        ${l.cert ? `<span class="pill pill-sm pill-orng">${l.cert}</span>` : ''}

      ${l.note ? `<div class="poi-note">${l.note}</div>` : ''}
      <div class="poi-acts">
        <button class="poi-add" onclick="addToDayPick('${l.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          أضف ليوم

        ${l.lat && l.lng ? `<a class="poi-link" href="https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}" target="_blank" title="فتح بالخرائط">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>

        </button>` : ''}
      </div>
    </div>
  `;
}

function toggleFav(id) {
  const i = state.favs.indexOf(id);
  if (i >= 0) state.favs.splice(i, 1);
  else state.favs.push(id);
  saveFavs();
  renderLibList();
}

function deleteCustom(id) {
  if (!confirm("حذف هذا الموقع من المكتبة المخصصة؟")) return;
  state.customLib = state.customLib.filter(l => l.id !== id);
  saveLib();
  renderLibrary();
}

function addToDayPick(refId) {
  const item = libById(refId);
  if (!item) return;
  // Choose day
  openModal(`
    <div class="modal-h">
      <h3>أي يوم؟</h3>
      <button class="modal-x" onclick="closeModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <p class="txs clm mb3">اختر اليوم لإضافة <strong>${item.name}</strong>:</p>
    <div style="max-height:24rem;overflow-y:auto">
      ${state.itinerary.filter(d => d.city === item.city).map(d => `
        <button class="picker-item" onclick="state.activeDayIdx=${d.day-1};state.pendingInsert={dayIdx:${d.day-1}};closeModal();openTimePicker('${refId}')">
          <div class="picker-item-ic" style="background:var(--accent);color:white">${d.day}</div>
          <div class="picker-item-info">
            <div class="picker-item-n">يوم ${d.day} · ${d.weekday}</div>

      `).join('')}

    <p class="txx clm mt2 tac">⚠️ يظهر فقط أيام ${cityById(item.city).name}</p>
  `);
}

    </div>

    <div class="fb mb2">
      <button class="fb-btn ${state.mapCity === 'all' ? 'act' : ''}" onclick="state.mapCity='all';drawMarkers()">كل المدن</button>
      ${isKoreaTrip()
        ? CITIES.map(c => `<button class="fb-btn ${state.mapCity === c.id ? 'act' : ''}" onclick="state.mapCity='${c.id}';flyToCity('${c.id}');drawMarkers()">${c.name}</button>`).join('')

        ["mosque","🕌 مساجد","#047857"],
        ["shop","🛍️ تسوق","#7c3aed"],
        ["festival","🎉 فعاليات","#db2777"],
        ["custom","⭐ مخصص","var(--gold)"]
      ].map(([k, lbl, col]) => `
        <button class="lg-d fb-btn ${state.mapLayers[k] ? 'act' : ''}" onclick="state.mapLayers['${k}']=!state.mapLayers['${k}'];drawMarkers()" style="border-color:${col}">
          <span class="lg-dot" style="background:${col}"></span>
          <span style="font-size:0.7rem">${lbl}</span>
        </button>
      `).join('')}
    </div>

    <div class="map-wrap"><div id="tripmap"></div></div>

    <p class="txx clm tac mt1">💡 اضغط على نقطة على الخريطة لعرض التفاصيل</p>

function initMap() {
  // Wait for Leaflet to load (it's loaded async from CDN)
  if (typeof L === 'undefined') {
    const tm = document.getElementById('tripmap');
    if (tm) tm.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--muted)">⏳ جاري تحميل الخريطة...</div>';
    setTimeout(initMap, 200);
    return;
  }
  if (state.mapInst) {
    state.mapInst.remove();
    state.mapInst = null;
  }
  const tm = document.getElementById('tripmap');
  if (!tm) return;
  tm.innerHTML = ''; // clear any loading message
  const map = L.map('tripmap', { zoomControl: true }).setView([36.5, 127.5], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 19
  }).addTo(map);
  state.mapInst = map;
  state.mapMarkers = L.layerGroup().addTo(map);
  drawMarkers();
}

function flyToCity(cid) {
  const c = cityById(cid);
  if (state.mapInst && c) state.mapInst.setView([c.lat, c.lng], 11);
}

function drawMarkers() {
  if (typeof L === 'undefined' || !state.mapMarkers) return;
  state.mapMarkers.clearLayers();

  // Library POIs
  allLib().forEach(l => {
    if (!l.lat || !l.lng) return;
    if (state.mapCity !== "all" && l.city !== state.mapCity) return;
    if (l.custom && !state.mapLayers.custom) return;
    if (!l.custom && !state.mapLayers[l.type]) return;
    const color = TYPES[l.type]?.color || "#888";
    const icon = L.divIcon({
      className: '',
      html: `<div style="background:${color};width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);font-size:14px">${l.icon}</div>`,
      iconSize: [28, 28], iconAnchor: [14, 14]
    });
    L.marker([l.lat, l.lng], { icon }).addTo(state.mapMarkers).bindPopup(`
      <div style="font-family:'IBM Plex Sans Arabic',sans-serif">
        <strong style="font-size:13px">${l.icon} ${l.name}</strong><br>
        <span style="font-size:11px;color:#888">${cityById(l.city)?.name} · ${l.area}</span><br>
        ${l.halal ? '<span style="font-size:10px;color:#047857">🥩 حلال</span> ' : ''}
        ${l.gf ? '<span style="font-size:10px;color:#b8924a">🌾 GF</span>' : ''}
        ${l.note ? `<p style="font-size:11px;margin-top:4px">${l.note}</p>` : ''}
        ${l.lat ? `<a href="https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}" target="_blank" style="font-size:11px">فتح بخرائط Google</a>` : ''}
      </div>
    `);
  });

  // Plan items (itinerary)
  if (state.mapLayers.plan) {
    state.itinerary.forEach((d, di) => {
      d.items.forEach(it => {
        if (!it.lat || !it.lng) return;
        if (state.mapCity !== "all" && d.city !== state.mapCity) return;
        const icon = L.divIcon({
          className: '',
          html: `<div style="background:var(--accent);color:white;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--gold);box-shadow:0 2px 6px rgba(0,0,0,0.4);font-size:11px;font-weight:700">D${d.day}</div>`,
          iconSize: [26, 26], iconAnchor: [13, 13]
        });
        L.marker([it.lat, it.lng], { icon }).addTo(state.mapMarkers).bindPopup(`
          <div style="font-family:'IBM Plex Sans Arabic',sans-serif">
            <strong style="font-size:13px">${TYPES[it.type]?.icon || ''} ${it.text}</strong><br>
            <span style="font-size:11px;color:#888">يوم ${d.day} · ${it.time || ''}</span>
          </div>
        `);
      });
    });
  }
}

function renderTasks() {

  const isVisible = (t) => {
    if (filter === "all") return true;

  const visibleTotal = tasks.filter(isVisible).length;

// Rates relative to USD (approximate, May 2026)
const CUR_RATES = {
  USD: 1,
  KRW: 1330,
  SAR: 3.75,
  EUR: 0.92,
  AED: 3.67
};

const CUR_INFO = {
  USD: { flag: "🇺🇸", name: "دولار أمريكي" },
  KRW: { flag: "🇰🇷", name: "وون كوري" },
  SAR: { flag: "🇸🇦", name: "ريال سعودي" },
  EUR: { flag: "🇪🇺", name: "يورو" },
  AED: { flag: "🇦🇪", name: "درهم إماراتي" }
};

function fmtCur(n, c) {
  if (!isFinite(n)) return "0";
  const opts = c === "KRW" ? { maximumFractionDigits: 0 } : { maximumFractionDigits: 2 };
  return n.toLocaleString("en-US", opts);
}

function openCurrency() {
  state.curBase = state.curBase || "SAR";
  state.curAmount = state.curAmount || 100;
  renderCurrency();
}

function renderCurrency() {
  const base = state.curBase;
  const amount = state.curAmount;
  const usd = amount / CUR_RATES[base];

  const targetOrder = ["KRW", "SAR", "USD", "EUR", "AED"].filter(c => c !== base);
  // Always show base first
  const display = [base, ...targetOrder];

  openModal(`
    <div class="modal-h">
      <h3>💱 محول العملات</h3>
      <button class="modal-x" onclick="closeModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="cur-quick mb2" style="border:none;padding:0;margin-top:0">
      <span class="txx clm fb6" style="margin-left:0.3rem;align-self:center">المبلغ بـ:</span>
      ${["SAR","USD","KRW"].map(c => `
        <button class="cur-quick-btn ${base === c ? 'act' : ''}" onclick="state.curBase='${c}';renderCurrency()">${CUR_INFO[c].flag} ${c}</button>
      `).join('')}
    </div>

    <div class="cur-grid">
      ${display.map((c, i) => {
        const val = i === 0 ? amount : (usd * CUR_RATES[c]);
        const isBase = i === 0;
        return `
          <div class="cur-row" style="${isBase ? 'background:var(--cream);border-color:var(--accent)' : ''}">
            <div class="cur-flag">${CUR_INFO[c].flag}</div>
            <div class="cur-info">
              <div class="cur-c">${c}</div>
              <div class="cur-l">${CUR_INFO[c].name}</div>
            </div>
            <input type="number" class="cur-inp" 
              value="${fmtCur(val, c).replace(/,/g,'')}"
              ${isBase ? '' : 'readonly'}
              ${isBase ? `oninput="state.curAmount=parseFloat(this.value)||0;updateCurDisplay()"` : ''}
              id="cur-${c}">
          </div>
        `;
      }).join('')}
    </div>

    <div class="cur-quick mb2">
      <span class="txx clm fb6" style="margin-left:0.3rem;align-self:center">مبالغ سريعة:</span>
      ${[100, 500, 1000, 5000, 10000].map(n => `
        <button class="cur-quick-btn" onclick="state.curAmount=${n};renderCurrency()">${n.toLocaleString()}</button>
      `).join('')}
    </div>

    <div class="cur-rate-info">
      📊 1 ${base} = ${fmtCur(CUR_RATES.KRW / CUR_RATES[base], 'KRW')} ₩  ·  ${fmtCur(CUR_RATES.SAR / CUR_RATES[base], 'SAR')} ر.س  ·  ${fmtCur(1 / CUR_RATES[base], 'USD')} $
      <br><span style="opacity:0.7">⚠️ الأسعار تقريبية - تحقق من البنك قبل السفر</span>
    </div>
  `);
}

function updateCurDisplay() {
  const base = state.curBase;
  const amount = state.curAmount;
  const usd = amount / CUR_RATES[base];
  ["KRW","SAR","USD","EUR","AED"].forEach(c => {
    if (c === base) return;
    const el = $("cur-" + c);
    if (el) el.value = fmtCur(usd * CUR_RATES[c], c).replace(/,/g,'');
  });
}

// Copy Korean text helper
function copyKorean(btn, text) {
  const orig = btn.innerHTML;
  navigator.clipboard.writeText(text).then(() => {
    btn.innerHTML = '✅ تم النسخ';
    setTimeout(() => { btn.innerHTML = orig; }, 1800);
  }).catch(() => {
    btn.innerHTML = '⚠️ فشل';
    setTimeout(() => { btn.innerHTML = orig; }, 1800);
  });
}

function syncGetCode() {
  let code = localStorage.getItem("kt2_sync_code");
  if (!code) {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    code = Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
    localStorage.setItem("kt2_sync_code", code);
  }
  return code;
}

function syncGetAllState() {
  return {
    itinerary: state.itinerary,
    customLib: state.customLib,
    budget: state.budget,
    tasks: state.tasks,
    favs: state.favs,
    tripInfo: state.tripInfo,
    cityColors: state.cityColors
  };
}

function syncApplyState(data) {
  if (data.itinerary)   { state.itinerary   = data.itinerary;   Storage.set("kt2_itin", data.itinerary); }
  if (data.customLib)   { state.customLib   = data.customLib;   Storage.set("kt2_clib", data.customLib); }
  if (data.budget)      { state.budget      = data.budget;      Storage.set("kt2_bud",  data.budget); }
  if (data.tasks)       { state.tasks       = data.tasks;       Storage.set("kt2_tasks", data.tasks); }
  if (data.favs)        { state.favs        = data.favs;        Storage.set("kt2_favs", data.favs); }
  if (data.tripInfo)    { state.tripInfo    = data.tripInfo;    Storage.set("kt2_tripinfo", data.tripInfo); }
  if (data.cityColors)  { state.cityColors  = data.cityColors;  Storage.set("kt2_citycolors", data.cityColors); CITY_COLORS = { ...data.cityColors }; }
  switchTab(state.active);
}

// Debounced cloud auto-sync (triggered automatically after any Trip.save)
let _autoSyncTimer = null;
let _autoSyncInflight = false;
function scheduleAutoSync() {
  const code = localStorage.getItem("kt2_sync_code");
  if (!code) return;
  if (_autoSyncTimer) clearTimeout(_autoSyncTimer);
  _autoSyncTimer = setTimeout(async () => {
    if (_autoSyncInflight) { scheduleAutoSync(); return; }
    _autoSyncInflight = true;
    const indicator = $("auto-sync-indicator");
    if (indicator) { indicator.textContent = "↻ جاري الحفظ..."; indicator.style.opacity = "1"; }
    const ok = await syncSave(code);
    if (indicator) {
      indicator.textContent = ok ? "✓ محفوظ في السحابة" : "⚠️ فشل الحفظ";
      setTimeout(() => { indicator.style.opacity = "0"; }, 2000);
    }
    _autoSyncInflight = false;
  }, 1500);
}

async function syncSave(code) {
  const fab = $("sync-fab");
  if (fab) { fab.classList.add("saving"); fab.querySelector("span") && (fab.querySelector("span").textContent = "جاري..."); }
  try {
    const res = await fetch("/.netlify/functions/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, data: syncGetAllState() })
    });
    return res.ok;
  } catch { return false; }
  finally { if (fab) fab.classList.remove("saving"); }
}

async function syncLoad(code) {
  try {
    const res = await fetch(`/.netlify/functions/load?code=${encodeURIComponent(code)}`);
    if (!res.ok) return null;
    const json = await res.json();
    return json.data || null;
  } catch { return null; }
}

  const code = syncGetCode();
  openModal(`

      </button>
    </div>
    <div class="sync-box">
      <p class="sync-sub">احفظ رمزك واستخدمه على أي جهاز لاستعادة بياناتك</p>

      <div class="sync-code-display" onclick="navigator.clipboard?.writeText('${code}');this.textContent='✓ تم النسخ!';setTimeout(()=>this.textContent='${code}',1500)" title="اضغط لنسخ الرمز">${code}</div>
      <p class="sync-hint">رمزك الشخصي — اضغط لنسخه</p>

      <button class="btn btn-pri" style="width:100%" onclick="doSyncSave('${code}')">
        ☁️ رفع بياناتي الآن
      </button>

      <div class="sync-divider"><span>أو استعد من رمز آخر</span></div>

      <div class="sync-load-row">
        <input type="text" class="input" id="sync-load-input" placeholder="أدخل الرمز (مثال: KR7X2M)" maxlength="10" style="text-transform:uppercase;letter-spacing:0.1em">
        <button class="btn btn-out" onclick="doSyncLoad()">تحميل</button>
      </div>

      <div class="sync-status" id="sync-status"></div>
    </div>
  `);
}

async function doSyncSave(code) {
  const st = $("sync-status");
  st.className = "sync-status"; st.textContent = "جاري الرفع..."; st.style.display = "block";
  const ok = await syncSave(code);
  if (ok) {
    st.className = "sync-status ok";
    st.textContent = "✓ تم حفظ بياناتك بنجاح على السحابة";
  } else {
    st.className = "sync-status err";
    st.textContent = "✗ فشل الاتصال، تحقق من الإنترنت وحاول مجدداً";
  }
}

async function doSyncLoad() {
  const input = $("sync-load-input");
  const st = $("sync-status");
  const code = (input?.value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length < 4) {
    st.className = "sync-status err"; st.textContent = "الرمز قصير جداً"; return;
  }
  st.className = "sync-status"; st.textContent = "جاري التحميل..."; st.style.display = "block";
  const data = await syncLoad(code);
  if (!data) {
    st.className = "sync-status err"; st.textContent = "✗ الرمز غير موجود أو منتهي";
    return;
  }
  syncApplyState(data);
  localStorage.setItem("kt2_sync_code", code);
  st.className = "sync-status ok"; st.textContent = "✓ تم تحميل البيانات بنجاح!";
  setTimeout(closeModal, 1500);
}

function getGlobalLibs() {
  try { return JSON.parse(localStorage.getItem("kt2_global_libs") || "{}"); } catch { return {}; }
}
function saveGlobalLibs(libs) {
  localStorage.setItem("kt2_global_libs", JSON.stringify(libs));
}

function renderLibrariesTab() {
  const customLibs = getGlobalLibs();

    const items = id === "korea" ? (typeof LIB !== 'undefined' ? LIB : []) : (customLibs[id] || []);

    const byType = {};
    items.forEach(x => { byType[x.type] = (byType[x.type]||0)+1; });
    return { items, meta, cities, byType,
      name: meta.name || id,
      icon: meta.icon || "🌍",

      <div style="text-align:center;padding:0.5rem 0">

        <div class="fb6" style="font-size:0.85rem">إضافة مكتبة لوجهة جديدة</div>

// ─── Library Browser Modal ───
function openLibBrowser(libId) {
  const isKorea = libId === "korea";
  const allItems = isKorea
    ? (typeof LIB !== 'undefined' ? LIB : [])
    : (getGlobalLibs()[libId] || []);
  const meta = LIB_META[libId] || {};
  const name = meta.name || libId;
  const icon = meta.icon || "🌍";

  const cities = [...new Set(allItems.map(x=>x.city).filter(Boolean))];
  const types  = [...new Set(allItems.map(x=>x.type).filter(Boolean))];
  const typeLabels = {food:"مطاعم",attraction:"معالم",mosque:"مساجد",shop:"تسوق",entertainment:"ترفيه",transport:"مواصلات",tour:"جولات",cafe:"مقاهي",hotel:"فنادق",festival:"فعاليات",other:"أخرى"};
  const typeIcons  = {food:"🍽️",attraction:"📍",mosque:"🕌",shop:"🛍️",entertainment:"🎢",transport:"🚄",tour:"🎯",cafe:"☕",hotel:"🏨",festival:"🎉",other:"⭐"};

  function renderItems(cityF, typeF, q) {
    let items = allItems;
    if (cityF) items = items.filter(x=>x.city===cityF);
    if (typeF) items = items.filter(x=>x.type===typeF);
    if (q) { const lq=q.toLowerCase(); items = items.filter(x=>(x.name+x.area+x.note).toLowerCase().includes(lq)); }
    if (!items.length) return `<p style="text-align:center;color:var(--muted);padding:2rem">لا توجد نتائج</p>`;
    return items.map(it => `
      <div style="background:var(--cream);border-radius:10px;padding:0.75rem;display:flex;gap:0.7rem;align-items:flex-start">
        <div style="font-size:1.4rem;line-height:1">${it.icon||typeIcons[it.type]||"📍"}</div>
        <div style="flex:1;min-width:0">
          <div class="fb6" style="font-size:0.85rem">${it.name}${it.halal?'<span style="color:#047857;font-size:0.65rem;margin-right:4px">● حلال</span>':''}</div>
          ${it.area?`<div style="font-size:0.7rem;color:var(--muted)">${LIB_CITY_NAMES[it.city]||it.city||''} · ${it.area}</div>`:''}
          ${it.note?`<div style="font-size:0.72rem;color:var(--ink-soft);margin-top:2px">${it.note}</div>`:''}
          ${it.price?`<div style="font-size:0.68rem;color:var(--gold);margin-top:2px">${it.price}</div>`:''}
        </div>
        ${!isKorea?`<button title="حذف" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.75rem;padding:2px 4px" onclick="deleteLibItem('${libId}','${it.id}')">✕</button>`:''}
      </div>
    `).join('');
  }

  function buildModal(cityF='', typeF='', q='') {
    return `
      <div class="modal-h">
        <h3>${icon} مكتبة ${name}</h3>
        <button class="modal-x" onclick="closeModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.75rem">
        <input type="text" class="input" id="lb-search" placeholder="بحث..." value="${q}" oninput="_libFilter('${libId}')" style="flex:1;min-width:120px;padding:0.4rem 0.6rem;font-size:0.8rem">
        <select class="input" id="lb-city" onchange="_libFilter('${libId}')" style="padding:0.4rem 0.6rem;font-size:0.8rem">
          <option value="">كل المدن</option>
          ${cities.map(c=>`<option value="${c}"${cityF===c?' selected':''}>${LIB_CITY_NAMES[c]||c}</option>`).join('')}
        </select>
        <select class="input" id="lb-type" onchange="_libFilter('${libId}')" style="padding:0.4rem 0.6rem;font-size:0.8rem">
          <option value="">كل الأنواع</option>
          ${types.map(t=>`<option value="${t}"${typeF===t?' selected':''}>${typeIcons[t]||''} ${typeLabels[t]||t}</option>`).join('')}
        </select>
      </div>
      <div id="lb-results" style="display:flex;flex-direction:column;gap:0.5rem;max-height:55vh;overflow-y:auto">
        ${renderItems(cityF, typeF, q)}
      </div>
      <div style="margin-top:0.75rem;display:flex;gap:0.5rem;justify-content:space-between;flex-wrap:wrap;align-items:center">
        <div style="display:flex;gap:0.4rem;flex-wrap:wrap">
          ${!isKorea?`<button class="btn btn-out btn-sm" onclick="openAddLibItemModal('${libId}')">+ إضافة موقع</button>`:''}
          ${!isKorea?`
            <button class="btn btn-pri btn-sm" style="background:linear-gradient(135deg,#6366f1,#8b5cf6)" onclick="closeModal();setTimeout(()=>openGeminiAssistant('${libId}'),80)">
              🤖 توليد بـ AI
            </button>
            <div style="position:relative;display:inline-block">
              <button class="btn btn-out btn-sm" id="lb-ai-menu-btn" onclick="_toggleLibAiMenu('${libId}')" title="مهام AI سريعة">▾</button>
              <div id="lb-ai-menu" style="display:none;position:absolute;bottom:2rem;right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:999;min-width:170px;padding:0.4rem 0">
                ${['hotels','halal_food','mosques','attractions','shopping','enrich'].map(tid => {
                  const t = GEMINI_TASKS.find(x=>x.id===tid);
                  return t ? `<button onclick="_libQuickGenerate('${libId}','${tid}')" style="display:flex;gap:0.5rem;align-items:center;width:100%;padding:0.45rem 0.75rem;background:none;border:none;cursor:pointer;font-size:0.78rem;text-align:right;color:var(--ink)"><span>${t.icon}</span><span>${t.label}</span></button>` : '';

              </div>
            </div>
          `:''}
        </div>
        <span class="txs clm" style="font-size:0.72rem">${allItems.length} موقع إجمالاً</span>
      </div>
    `;
  }

  window._libFilter = function(lid) {
    const q  = ($("lb-search")||{value:''}).value.trim();
    const cf = ($("lb-city")||{value:''}).value;
    const tf = ($("lb-type")||{value:''}).value;
    const res = document.getElementById("lb-results");
    if (res) {
      const items2 = lid==="korea"
        ? (typeof LIB!=='undefined'?LIB:[])
        : (getGlobalLibs()[lid]||[]);
      let fil = items2;
      if (cf) fil = fil.filter(x=>x.city===cf);
      if (tf) fil = fil.filter(x=>x.type===tf);
      if (q) { const lq=q.toLowerCase(); fil=fil.filter(x=>(x.name+x.area+x.note).toLowerCase().includes(lq)); }
      if (!fil.length) { res.innerHTML='<p style="text-align:center;color:var(--muted);padding:2rem">لا توجد نتائج</p>'; return; }
      res.innerHTML = fil.map(it=>`
        <div style="background:var(--cream);border-radius:10px;padding:0.75rem;display:flex;gap:0.7rem;align-items:flex-start">
          <div style="font-size:1.4rem;line-height:1">${it.icon||typeIcons[it.type]||"📍"}</div>
          <div style="flex:1;min-width:0">
            <div class="fb6" style="font-size:0.85rem">${it.name}${it.halal?'<span style="color:#047857;font-size:0.65rem;margin-right:4px">● حلال</span>':''}</div>
            ${it.area?`<div style="font-size:0.7rem;color:var(--muted)">${LIB_CITY_NAMES[it.city]||it.city||''} · ${it.area}</div>`:''}
            ${it.note?`<div style="font-size:0.72rem;color:var(--ink-soft);margin-top:2px">${it.note}</div>`:''}
          </div>
          ${lid!=="korea"?`<button title="حذف" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.75rem;padding:2px 4px" onclick="deleteLibItem('${lid}','${it.id}')">✕</button>`:''}
        </div>`).join('');
    }
  };

  openModal(buildModal());
}

  const libs = getGlobalLibs();

  libs[libId] = libs[libId].filter(x=>x.id!==itemId);
  saveGlobalLibs(libs);
  openLibBrowser(libId);
}

function saveLibItem(libId) {
  const name = ($("ali-name")||{}).value?.trim();
  if (!name) { alert("الاسم مطلوب"); return; }
  const libs = getGlobalLibs();
  if (!libs[libId]) libs[libId] = [];
  const item = {
    id: `${libId}_${Date.now()}`,
    name,
    type: ($("ali-type")||{}).value || "attraction",
    city: ($("ali-city")||{}).value?.trim().toLowerCase() || "",
    area: ($("ali-area")||{}).value?.trim() || "",
    icon: ($("ali-icon")||{}).value?.trim() || "",
    note: ($("ali-note")||{}).value?.trim() || "",
    halal: ($("ali-halal")||{}).value === "1"
  };
  libs[libId].push(item);
  saveGlobalLibs(libs);
  openLibBrowser(libId);
}

function saveNewLib() {
  const name = ($("al-name")||{}).value?.trim();
  if (!name) { alert("اسم الوجهة مطلوب"); return; }
  const id = name.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"").slice(0,30) || ("lib_"+Date.now());
  const jsonStr = ($("al-json")||{}).value?.trim();
  let items = [];
  if (jsonStr) {
    try { items = JSON.parse(jsonStr); if (!Array.isArray(items)) throw new Error("ليس مصفوفة"); }
    catch (e) { alert("JSON غير صحيح: "+e.message); return; }
  }
  items = items.map((it,i)=>({ id:it.id||`${id}_${i+1}`, ...it }));
  const libs = getGlobalLibs();
  libs[id] = items;
  saveGlobalLibs(libs);
  closeModal();
  renderDashboard();
}

function deleteCustomLib(id) {
  if (!confirm(`حذف مكتبة "${LIB_META[id]?.name||id}" نهائياً؟`)) return;
  const libs = getGlobalLibs();
  delete libs[id];
  saveGlobalLibs(libs);
  renderDashboard();
}

  el.value = task.prompt(country.name, country.cities, existingCount);

async function runGeminiAssistant() {
  const key    = ($("gem-key")||{}).value?.trim();
  const libVal = ($("gem-lib")||{}).value || "";
  const prompt = ($("gem-prompt")||{}).value?.trim();
  const status = document.getElementById("gem-status");
  const btn    = document.getElementById("gem-btn");
  const preview= document.getElementById("gem-preview");

  if (!key)    { status.textContent="⚠️ أدخل مفتاح API أولاً"; return; }
  if (!prompt) { status.textContent="⚠️ الطلب فارغ"; return; }

  const isNew = libVal.startsWith("new:");
  const libId = isNew ? libVal.replace("new:","") : libVal;
  if (!libId)  { status.textContent="⚠️ اختر المكتبة أولاً"; return; }

  const model = ($("gem-model")||{}).value || "gemini-2.5-flash-preview-05-20";
  localStorage.setItem("kt2_gemini_key", key);
  localStorage.setItem("kt2_gemini_model", model);
  btn.disabled = true;
  status.textContent = `⏳ جاري الإرسال إلى ${model}...`;
  preview.innerHTML = "";

  const systemInstr = `أنت مساعد متخصص في بناء مكتبات مواقع سياحية بصيغة JSON.
قواعد صارمة:
1. أجب بـ JSON فقط — مصفوفة مباشرة بدون أي كلام قبلها أو بعدها.
2. كل عنصر يجب أن يحتوي على: name, type, city, area, icon, note
3. الحقول: name (الاسم), type (hotel|food|attraction|mosque|shop|entertainment|other), city (بالإنجليزية حروف صغيرة بدون مسافات), area (الحي/المنطقة), icon (إيموجي واحد), note (وصف مفيد بالعربية), halal (true/false للمطاعم), price (للمطاعم والفنادق), lat, lng (إحداثيات تقريبية).
4. للفنادق: type="hotel", icon="🏨", price=عدد النجوم ("⭐⭐⭐⭐⭐")
5. للمساجد: type="mosque", icon="🕌"
6. المكتبة يجب أن تكون متنوعة ومفيدة للسائح المسلم.
مثال صحيح:
[{"name":"برج غلطة","type":"attraction","city":"istanbul","area":"بيوغلو","icon":"🗼","note":"برج جنوي القرن 14م - إطلالة بانورامية","lat":41.0256,"lng":28.9741}]`;

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        systemInstruction: { parts:[{text:systemInstr}] },
        contents: [{parts:[{text:prompt}]}],
        generationConfig: { temperature:0.35, maxOutputTokens:8192 }
      })
    });
    const data = await res.json();
    if (!res.ok) {
      // Preserve exact API error for debugging
      const apiMsg = data.error?.message || JSON.stringify(data.error || data);
      const apiCode = data.error?.code || res.status;
      const apiStatus = data.error?.status || "";
      throw Object.assign(new Error(apiMsg), { apiCode, apiStatus, rawData: data });
    }

    const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
    const jsonMatch = raw.match(/\[[\s\S]*?\]/s) || raw.match(/\[[\s\S]*/);
    if (!jsonMatch) throw new Error("لم يُرجع Gemini JSON صالحاً — جرّب مرة أخرى");
    let items;
    try { items = JSON.parse(jsonMatch[0]); }
    catch { throw new Error("خطأ في تحليل JSON — جرّب مرة أخرى"); }
    if (!Array.isArray(items) || !items.length) throw new Error("القائمة فارغة");

    status.textContent = `✓ تم استلام ${items.length} موقع — راجع المعاينة أدناه`;

    const taskId = window._gemState?.task || "";
    preview.innerHTML = `
      <div style="border:1px solid var(--border);border-radius:10px;overflow:hidden">
        <div style="background:var(--accent);color:white;padding:0.4rem 0.75rem;font-size:0.78rem;font-weight:600">
          معاينة ${items.length} موقع مقترح
        </div>
        <div style="max-height:180px;overflow-y:auto;padding:0.5rem">
          ${items.slice(0,8).map(it=>`
            <div style="display:flex;gap:0.4rem;padding:4px 0;border-bottom:1px solid var(--border);font-size:0.75rem">
              <span>${it.icon||"📍"}</span>
              <span style="flex:1"><strong>${it.name}</strong></span>
              <span style="color:var(--muted)">${LIB_CITY_NAMES[it.city]||it.city||''}</span>
              <span style="color:var(--accent);font-size:0.65rem">${it.type||''}</span>
            </div>`).join('')}
          ${items.length>8?`<div style="font-size:0.7rem;color:var(--muted);padding:4px">... و${items.length-8} مواقع إضافية</div>`:''}
        </div>
      </div>
      <div style="margin-top:0.6rem;display:flex;gap:0.5rem;flex-wrap:wrap">
        <button class="btn btn-pri btn-sm" onclick="_geminiAppend(${JSON.stringify(items).replace(/\\/g,'\\\\').replace(/"/g,'&quot;')}, '${libId}', ${isNew})">✓ إضافة للمكتبة</button>
        <button class="btn btn-out btn-sm" onclick="document.getElementById('gem-preview').innerHTML='';document.getElementById('gem-status').textContent='جاهز'">تجاهل</button>
      </div>
    `;
  } catch(e) {
    const rawMsg = e.message || "";
    const code = e.apiCode || "";
    // Show exact API error + short hint
    let hint = "";
    if (e.apiStatus === "RESOURCE_EXHAUSTED" || rawMsg.includes("RESOURCE_EXHAUSTED")) {
      if (rawMsg.includes("limit: 0") || rawMsg.includes("free_tier")) {
        hint = "💡 مشروعك مفعّل الفوترة (Billing) → الحصة المجانية = 0 تلقائياً.<br>الحل: اختر موديلاً من قسم <strong>«مشروع مدفوع»</strong> مثل <strong>gemini-2.5-flash</strong> — سيعمل مباشرةً مع مشروعك المدفوع.";
      } else {
        hint = "💡 تجاوزت الحصة اليومية — انتظر إعادة التعيين أو بدّل الموديل.";
      }
    } else if (code === 400 || rawMsg.includes("not found") || rawMsg.includes("not supported")) {
      hint = "💡 الموديل غير متاح — جرّب موديلاً آخر من القائمة.";
    } else if (code === 403 || rawMsg.includes("API_KEY") || rawMsg.includes("permission")) {
      hint = "💡 تحقق من المفتاح في aistudio.google.com — قد يكون محدود الصلاحيات.";
    }
    status.innerHTML = `<details open><summary style="cursor:pointer;color:var(--danger)">❌ خطأ من Gemini API (HTTP ${code||'?'})</summary><pre style="font-size:0.68rem;white-space:pre-wrap;margin:0.4rem 0;background:var(--cream);padding:0.5rem;border-radius:6px;max-height:120px;overflow-y:auto">${rawMsg.replace(/</g,'&lt;')}</pre>${hint?`<div style="font-size:0.75rem;color:var(--muted);margin-top:0.3rem">${hint}</div>`:''}</details>`;
    status.textContent = "❌ " + msg;
  }
  btn.disabled = false;
}

function _geminiAppend(items, libId, isNewLib) {
  const libs = getGlobalLibs();
  if (!libs[libId]) libs[libId] = [];
  const existing = new Set(libs[libId].map(x=>(x.name||"").toLowerCase()));
  let added = 0;
  items.forEach((it,i) => {
    const nm = (it.name||"").toLowerCase();
    if (!existing.has(nm)) {
      libs[libId].push({ id:`${libId}_gem_${Date.now()}_${i}`, ...it });
      existing.add(nm);
      added++;
    }
  });
  // Register new country in LIB_META if it was a new lib
  if (isNewLib && GEMINI_COUNTRIES[libId]) {
    const gc = GEMINI_COUNTRIES[libId];
    LIB_META[libId] = { name:gc.name, icon:"🌍", color:"#0891b2", cities: gc.cities.split("و").map(c=>c.trim()), builtIn:false };
  }
  saveGlobalLibs(libs);
  closeModal();
  renderDashboard();
  setTimeout(()=>openLibBrowser(libId), 120);
}

function generateAccessKey() {
  const chars = "abcdefghjkmnpqrstuvwxyz23456789";
  const key = Array.from({ length: 10 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
  const keys = getAccessKeys();
  keys.push(key);
  saveAccessKeys(keys);
  renderDashboard();
}

function revokeAccessKey(key) {
  if (!confirm(`إلغاء صلاحية المفتاح "${key}"؟ من يستخدمه لن يستطيع الدخول.`)) return;
  const keys = getAccessKeys().filter(k => k !== key);
  saveAccessKeys(keys);
  renderDashboard();
}

    japan: { name: "اليابان 2026", icon: "🇯🇵", color: "#c0392b", city: "طوكيو", air: "NRT" },
    turkey: { name: "تركيا 2026", icon: "🇹🇷", color: "#e74c3c", city: "إسطنبول", air: "IST" },
    malaysia: { name: "ماليزيا 2026", icon: "🇲🇾", color: "#2ecc71", city: "كوالالمبور", air: "KUL" },
    uae: { name: "الإمارات 2026", icon: "🇦🇪", color: "#e67e22", city: "دبي", air: "DXB" },

}

function createNewTrip() {
  const country = $("ct-country").value;
  if (!country) { alert("يرجى اختيار الدولة أولاً"); return; }
  const name = $("ct-name").value.trim();
  if (!name) { alert("اسم الرحلة مطلوب"); return; }

  const destVal = country === "other" ? ($("ct-dest").value.trim() || name) : name;
  // Link to global library by country key (korea=built-in, turkey/uk=global lib)
  const knownLibs = ["korea","turkey","uk","japan","france","italy","spain","malaysia","uae","egypt","morocco","greece","indonesia","portugal","netherlands","switzerland"];
  const countryLib = knownLibs.includes(country) ? country : null;
  const id = generateTripId(name);

  const depCity = $("ct-depcity").value.trim();
  const depAir = $("ct-depair").value.trim();
  const arrCity = $("ct-arrcity").value.trim();
  const arrAir = $("ct-arrair").value.trim();
  const sdate = $("ct-sdate").value || "";
  const edate = $("ct-edate").value || "";

  const trip = {
    id, name,
    destination: destVal,
    icon: $("ct-icon").value.trim() || "🗺️",
    color: $("ct-color").value || "#0891b2",
    countryLib,
    startDate: sdate,
    endDate: edate,
    depCity, depAir, arrCity, arrAir,
    isBuiltIn: false,
    createdAt: new Date().toISOString().split('T')[0]
  };
  TripsRegistry.upsert(trip);

  const oldCurrent = Trip.current;
  Trip.current = id;

  // Auto-generate skeleton days from dates (if provided)
  const skeletonDays = [];
  if (sdate && edate) {
    const start = new Date(sdate);
    const end = new Date(edate);
    const ms = end - start;
    const dayCount = Math.round(ms / 86400000) + 1;
    if (dayCount > 0 && dayCount <= 60) {
      const weekdays = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
      const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
      const cityForDay = arrCity || "";
      for (let i = 0; i < dayCount; i++) {
        const dt = new Date(start);
        dt.setDate(start.getDate() + i);
        const isFirst = i === 0;
        const isLast = i === dayCount - 1;
        skeletonDays.push({
          day: i + 1,
          date: dt.toISOString().split('T')[0],
          dateLabel: `${dt.getDate()} ${months[dt.getMonth()]}`,
          weekday: weekdays[dt.getDay()],
          city: cityForDay,
          title: "",
          type: isFirst ? "arrival" : (isLast ? "departure" : "normal"),
          flight: null, narrative: null, notes: null, hotel: null, items: []
        });
      }
    }
  }

  Trip.save("itin", skeletonDays);
  Trip.save("clib", []);
  Trip.save("favs", []);
  Trip.save("tasks", []);
  Trip.save("tripinfo", {
    destination: destVal,
    startDate: sdate, endDate: edate,
    depCity, depAirport: depAir,
    arrCity, arrAirport: arrAir,
    travelers: 1, ticketRef: "",
    outboundFlights: [], returnFlights: [], notes: ""
  });
  Trip.save("citycolors", {});
  Trip.current = oldCurrent;

  closeModal();
  navTo({ trip: id });
}

function deleteTrip(id) {
  const t = TripsRegistry.get(id);
  if (!t || t.isBuiltIn) return;
  if (!confirm(`حذف رحلة "${t.name}" نهائياً؟ لا يمكن التراجع.`)) return;
  TripsRegistry.remove(id);
  renderDashboard();
}

function exitOwnerMode() {
  if (!confirm("الخروج من وضع المالك؟ ستحتاج المفتاح للدخول مرة أخرى.")) return;
  localStorage.removeItem("kt2_is_owner");
  location.href = "/";
}

  const trip = TripsRegistry.get(Trip.current) || {};
  const missing = [];
  if (!(t.arrCity || trip.arrCity)) missing.push("مدينة الوصول");
  if (!t.startDate) missing.push("تاريخ المغادرة");
  if (!t.endDate) missing.push("تاريخ العودة");
  if (state.itinerary.length === 0) missing.push("أيام الجدول");
  else if (!state.itinerary[0]?.hotel?.name) missing.push("فندق الوصول");
  return missing;
}

function tsSyncDays() {
  const s = $("ts-sdate")?.value;
  const e = $("ts-edate")?.value;
  if (s && e) {
    const ms = new Date(e) - new Date(s);
    const d = Math.round(ms / 86400000);
    if (d >= 0) {
      $("ts-days").value = d + 1;
      const hint = $("ts-days-hint");
      if (hint) hint.textContent = `(محسوب تلقائياً من التاريخين: ${d + 1} يوم)`;
    }
  }
}

function getTripCities() {
  const map = {};
  state.itinerary.forEach(d => {
    if (!d.city) return;
    if (!map[d.city]) {
      const cityInfo = cityById(d.city) || state.customCities?.find(c => c.id === d.city);
      map[d.city] = {
        id: d.city,
        name: cityInfo?.name || d.city,
        color: state.cityColors[d.city] || CITY_COLORS_DEFAULT[d.city] || '#1a4d4a',
        daysCount: 0,
        firstDate: d.dateLabel || '',
        hotel: ''
      };
    }
    map[d.city].daysCount++;
    if (d.hotel?.name && !map[d.city].hotel) map[d.city].hotel = d.hotel.name;
  });
  return Object.values(map);
}

function addCustomCity() {
  const name = $("ts-new-city-name")?.value.trim();
  if (!name) return;
  const color = $("ts-new-city-color")?.value || "#0891b2";
  const id = name.toLowerCase().replace(/\s+/g, "-").replace(/[^a-z0-9؀-ۿ-]/g, "").slice(0, 30) || ("city_" + Date.now());
  if (state.customCities.find(c => c.id === id || c.name === name)) { alert("المدينة موجودة بالفعل"); return; }
  state.customCities.push({ id, name, color });
  state.cityColors[id] = color;
  saveCustomCities();
  saveCityColors();
  // Refresh just the cities section in the modal
  openTripSettings();
}

function removeCustomCity(id) {
  state.customCities = state.customCities.filter(c => c.id !== id);
  saveCustomCities();
  openTripSettings();
}

function editCityInSettings(cityId) {
  // Find first day with that city and trigger setDayMeta on it
  const idx = state.itinerary.findIndex(d => d.city === cityId);
  if (idx < 0) return;
  state.activeDayIdx = idx;
  closeModal();
  switchTab('itinerary');
  setTimeout(() => setDayMeta(), 200);
}

function saveTripSettings() {
  const newName = $("ts-name").value.trim();
  const sdate = $("ts-sdate").value;
  const edate = $("ts-edate").value;
  const targetDays = Math.max(0, parseInt($("ts-days").value, 10) || 0);

  // Gather new fields
  const depCity = $("ts-depcity")?.value.trim() || "";
  const depAirport = $("ts-depair")?.value.trim() || "";
  const arrCity = $("ts-arrcity")?.value.trim() || "";
  const arrAirport = $("ts-arrair")?.value.trim() || "";
  const retDepCity = $("ts-retdepcity")?.value.trim() || "";
  const retAirport = $("ts-retair")?.value.trim() || "";
  const hotelName = $("ts-hotel-name")?.value.trim() || "";
  const hotelArea = $("ts-hotel-area")?.value.trim() || "";
  const hotelLink = $("ts-hotel-link")?.value.trim() || "";

  // Update tripInfo
  if (sdate) state.tripInfo.startDate = sdate;
  if (edate) state.tripInfo.endDate = edate;
  if (depCity) state.tripInfo.depCity = depCity;
  if (depAirport) state.tripInfo.depAirport = depAirport;
  if (arrCity) state.tripInfo.arrCity = arrCity;
  if (arrAirport) state.tripInfo.arrAirport = arrAirport;
  if (retDepCity) state.tripInfo.retDepCity = retDepCity;
  if (retAirport) state.tripInfo.retAirport = retAirport;
  saveTripInfo();

  // Update trip registry
  const newCountryLib = $("ts-countrylib")?.value ?? undefined;
  if (newName || sdate || edate || newCountryLib !== undefined) {
    const trip = TripsRegistry.get(Trip.current) || { ...TripsRegistry.KOREA_DEFAULT };
    if (newName) trip.name = newName;
    if (sdate) trip.startDate = sdate;
    if (edate) trip.endDate = edate;
    if (depCity) trip.depCity = depCity;
    if (depAirport) trip.depAir = depAirport;
    if (arrCity) trip.arrCity = arrCity;
    if (arrAirport) trip.arrAir = arrAirport;
    if (newCountryLib !== undefined) trip.countryLib = newCountryLib || null;
    TripsRegistry.upsert(trip);
  }

  // Auto-generate days from sdate/targetDays with proper city + hotel
  const defaultCity = arrCity || (state.itinerary[0]?.city || (isKoreaTrip() ? "seoul" : ""));
  const defaultHotel = hotelName ? { name: hotelName, area: hotelArea, bookingLink: hotelLink || null } : null;

  // Add days if needed
  while (state.itinerary.length < targetDays) {
    state.itinerary.push({
      day: 0, date: "", dateLabel: "", weekday: "",
      city: state.itinerary[state.itinerary.length - 1]?.city || defaultCity,
      title: "", type: "normal",
      flight: null, narrative: null, notes: null,
      hotel: state.itinerary[state.itinerary.length - 1]?.hotel || (defaultHotel ? { ...defaultHotel } : null),
      items: []
    });
  }
  // Remove from end
  while (state.itinerary.length > targetDays && state.itinerary.length > 0) {
    state.itinerary.pop();
  }

  // Apply default city/hotel to days that don't have them yet (smart: only fill blanks)
  if (state.itinerary.length > 0 && sdate) {
    const start = new Date(sdate);
    const weekdays = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
    const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
    state.itinerary.forEach((d, i) => {
      const dt = new Date(start);
      dt.setDate(start.getDate() + i);
      const iso = dt.toISOString().split('T')[0];
      if (!d.date) d.date = iso;
      if (!d.weekday) d.weekday = weekdays[dt.getDay()];
      if (!d.dateLabel) d.dateLabel = `${dt.getDate()} ${months[dt.getMonth()]}`;
      if (!d.city && defaultCity) d.city = defaultCity;
      if (!d.hotel?.name && defaultHotel) d.hotel = { ...defaultHotel };
    });
    // Mark first day as arrival, last as departure (if not already set)
    if (state.itinerary[0] && state.itinerary[0].type === 'normal') state.itinerary[0].type = 'arrival';
    const last = state.itinerary[state.itinerary.length - 1];
    if (last && last.type === 'normal' && state.itinerary.length > 1) last.type = 'departure';
  }

  renumberDays();
  if (state.activeDayIdx >= state.itinerary.length) state.activeDayIdx = Math.max(0, state.itinerary.length - 1);
  saveItin();

  closeModal();
  updateHeaderForTrip();
  renderItinerary();
}

function addNewDayQuiet() {
  const last = state.itinerary[state.itinerary.length - 1];
  const t = state.tripInfo || {};
  const defaultCity = isKoreaTrip() ? "seoul" : (t.arrCity || "");
  const newDay = {
    day: 0, date: "", dateLabel: "", weekday: "",
    city: last?.city || defaultCity,
    title: "", type: "normal",
    flight: null, narrative: null, notes: null,
    hotel: last?.hotel ? { ...last.hotel } : null,
    items: []
  };
  state.itinerary.push(newDay);
  renumberDays();
}

function openShareModalFor(tripId) {
  const oldCurrent = Trip.current;
  Trip.current = tripId;
  let code = Trip.load("sync_code", null);
  Trip.current = oldCurrent;
  if (!code) {
    if (confirm("هذه الرحلة لم تُرفع للسحابة بعد. افتح الرحلة وارفعها أولاً.")) {
      navTo({ trip: tripId });
    }
    return;
  }
  showShareLink(tripId, code);
}

function openShareModal() {
  let code = Trip.load("sync_code", null);
  if (!code) {
    // Auto-generate
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    code = Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
    Trip.save("sync_code", code);
  }
  showShareLink(Trip.current, code);
}

function showShareLink(tripId, code) {
  const url = `${location.origin}/?trip=${encodeURIComponent(tripId)}&code=${encodeURIComponent(code)}`;
  openModal(`
    <div class="modal-h">

      <button class="modal-x" onclick="closeModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-box">
