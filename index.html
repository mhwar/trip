<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#1a4d4a">
<title>رحلة كوريا · مخطط ذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root {
  --bg: #f7f3ec;
  --paper: #fdfaf3;
  --ink: #1a1612;
  --ink-soft: #403a32;
  --muted: #6b6358;
  --accent: #1a4d4a;
  --accent-dk: #0f3331;
  --persimmon: #c9442b;
  --gold: #b8924a;
  --cream: #ede5d3;
  --border: #d9cfb9;
  --ok: #10b981;
  --warn: #f59e0b;
  --err: #ef4444;
  --sh: 0 1px 3px rgba(26,22,18,0.08);
  --sh-md: 0 4px 12px rgba(26,22,18,0.08);
  --r-sm: 0.375rem;
  --r-md: 0.5rem;
  --r-lg: 0.75rem;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  min-height: 100vh;
  font-size: 15px;
  overflow-x: hidden;
}
button, input, select, textarea, a { font-family: inherit; }
button { cursor: pointer; background: none; border: none; color: inherit; }
input, select, textarea {
  font-size: 16px; /* prevents iOS zoom */
  -webkit-appearance: none;
}
@media (min-width: 640px) { body { font-size: 14px; } }

/* ─────────────────────────────────────────
   HEADER (compact mobile, expanded desktop)
   ───────────────────────────────────────── */
.hdr {
  background: var(--accent);
  color: var(--paper);
  padding: 1.25rem 1rem 1rem;
  position: relative;
  overflow: hidden;
}
.hdr::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 15% 25%, rgba(184,146,74,0.35) 0%, transparent 45%),
    radial-gradient(circle at 85% 75%, rgba(201,68,43,0.25) 0%, transparent 45%);
  pointer-events: none;
}
.hdr-c { position: relative; max-width: 75rem; margin: 0 auto; }
.hdr-tag {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: var(--gold);
  margin-bottom: 0.4rem;
}
.hdr-tag svg { width: 12px; height: 12px; }
.hdr h1 {
  font-size: clamp(1.5rem, 6vw, 2.5rem);
  line-height: 1.1;
  margin-bottom: 0.25rem;
  font-weight: 700;
}
.hdr-sub {
  font-size: 0.85rem;
  color: rgba(253,250,243,0.85);
  margin-bottom: 0.875rem;
}
.hdr-stats {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.sb {
  flex: 1;
  min-width: max-content;
  padding: 0.5rem 0.65rem;
  border-radius: var(--r-md);
  background: rgba(253,250,243,0.12);
  border: 1px solid rgba(253,250,243,0.2);
  backdrop-filter: blur(8px);
}
.sb-acc { background: var(--persimmon); border-color: var(--persimmon); }
.sb-l { font-size: 0.55rem; letter-spacing: 0.06em; opacity: 0.75; margin-bottom: 0.15rem; text-transform: uppercase; }
.sb-v { font-size: 0.78rem; font-weight: 600; }

.hdr-tools {
  display: flex; gap: 0.4rem;
  margin-top: 0.6rem;
  flex-wrap: wrap;
}
.ht-btn {
  display: inline-flex; align-items: center; gap: 0.3rem;
  padding: 0.4rem 0.65rem;
  border-radius: var(--r-sm);
  font-size: 0.7rem;
  font-weight: 500;
  background: rgba(253,250,243,0.18);
  color: var(--paper);
  border: 1px solid rgba(253,250,243,0.25);
  transition: all 0.15s;
}
.ht-btn:hover {
  background: rgba(253,250,243,0.3);
  transform: translateY(-1px);
}
.ht-btn svg { width: 12px; height: 12px; opacity: 0.85; }
@media (min-width: 768px) {
  .ht-btn { font-size: 0.78rem; padding: 0.45rem 0.8rem; }
  .ht-btn svg { width: 14px; height: 14px; }
}
@media (min-width: 768px) {
  .hdr { padding: 2rem 1.5rem 1.75rem; }
  .hdr-sub { font-size: 1rem; }
  .sb-l { font-size: 0.6rem; }
  .sb-v { font-size: 0.85rem; }
}

/* ─────────────────────────────────────────
   NAV (sticky, scroll-snap on mobile)
   ───────────────────────────────────────── */
nav {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(247,243,236,0.97);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav-c {
  max-width: 75rem;
  margin: 0 auto;
  padding: 0.4rem 0.5rem;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.nav-c::-webkit-scrollbar { display: none; }
.nav-tabs { display: flex; gap: 0.2rem; min-width: max-content; }
.nav-t {
  display: flex; align-items: center; gap: 0.35rem;
  padding: 0.5rem 0.75rem;
  border-radius: var(--r-sm);
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--ink-soft);
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}
.nav-t:hover { background: rgba(0,0,0,0.04); }
.nav-t.act { background: var(--accent); color: var(--paper); }
.nav-t svg { width: 13px; height: 13px; flex-shrink: 0; }
@media (min-width: 768px) {
  .nav-t { padding: 0.55rem 0.95rem; font-size: 0.83rem; }
}

/* ─────────────────────────────────────────
   MAIN CONTENT
   ───────────────────────────────────────── */
main {
  max-width: 75rem;
  margin: 0 auto;
  padding: 1.25rem 0.875rem 6rem;
}
@media (min-width: 768px) { main { padding: 2rem 1.5rem; } }

.sec { display: none; animation: fade 0.2s; }
.sec.act { display: block; }
@keyframes fade {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}

/* ─── Section heading ─── */
.sec-t {
  margin-bottom: 1.25rem;
  padding-bottom: 0.875rem;
  border-bottom: 1px solid var(--border);
}
.sec-t-r {
  display: flex; align-items: center; gap: 0.625rem;
  margin-bottom: 0.35rem;
}
.sec-t-i {
  width: 2rem; height: 2rem;
  border-radius: var(--r-sm);
  background: var(--accent);
  color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sec-t-i svg { width: 16px; height: 16px; }
.sec-t h2 { font-size: 1.25rem; font-weight: 700; }
.sec-t p { font-size: 0.78rem; color: var(--muted); }
@media (min-width: 768px) {
  .sec-t { margin-bottom: 1.75rem; padding-bottom: 1.25rem; }
  .sec-t-i { width: 2.5rem; height: 2.5rem; }
  .sec-t-i svg { width: 20px; height: 20px; }
  .sec-t h2 { font-size: 1.6rem; }
  .sec-t p { font-size: 0.85rem; }
}

/* ─── Card primitives ─── */
.card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 0.875rem;
}
.card-cream { background: var(--cream); }
.card-acc { background: rgba(26,77,74,0.07); border-color: rgba(26,77,74,0.25); }
.card-orng { background: rgba(201,68,43,0.07); border-color: rgba(201,68,43,0.25); }
.card-gold { background: rgba(184,146,74,0.08); border-color: rgba(184,146,74,0.3); }
@media (min-width: 768px) { .card { padding: 1.125rem; } }

/* ─── Pills ─── */
.pill {
  display: inline-flex; align-items: center; gap: 0.2rem;
  font-size: 0.65rem;
  padding: 0.15rem 0.5rem;
  border-radius: 9999px;
  font-weight: 500;
  background: rgba(26,77,74,0.12);
  color: var(--accent);
  border: 1px solid rgba(26,77,74,0.25);
  white-space: nowrap;
}
.pill-orng { background: rgba(201,68,43,0.12); color: var(--persimmon); border-color: rgba(201,68,43,0.25); }
.pill-gold { background: rgba(184,146,74,0.18); color: var(--gold); border-color: rgba(184,146,74,0.3); }
.pill-warn { background: rgba(245,158,11,0.15); color: #b45309; border-color: rgba(245,158,11,0.4); }
.pill-ok { background: rgba(16,185,129,0.12); color: #047857; border-color: rgba(16,185,129,0.3); }
.pill-err { background: rgba(239,68,68,0.12); color: #b91c1c; border-color: rgba(239,68,68,0.3); }
.pill-sm { font-size: 0.6rem; padding: 0.1rem 0.4rem; }

/* ─── Grid ─── */
.gr { display: grid; gap: 0.75rem; }
.g2 { grid-template-columns: repeat(2, 1fr); }
.g3 { grid-template-columns: 1fr; }
.g4 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 768px) {
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .mdg2 { grid-template-columns: repeat(2, 1fr); }
}

/* ─── Buttons ─── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
  padding: 0.55rem 0.875rem;
  border-radius: var(--r-sm);
  font-size: 0.83rem;
  font-weight: 500;
  transition: all 0.15s;
  white-space: nowrap;
  min-height: 38px;
}
.btn svg { width: 13px; height: 13px; flex-shrink: 0; }
.btn-pri { background: var(--accent); color: var(--paper); }
.btn-pri:hover { background: var(--accent-dk); }
.btn-sec { background: var(--cream); color: var(--ink-soft); }
.btn-sec:hover { background: var(--border); }
.btn-orng { background: var(--persimmon); color: var(--paper); }
.btn-orng:hover { filter: brightness(0.95); }
.btn-out { background: transparent; border: 1px solid var(--border); color: var(--ink-soft); }
.btn-out:hover { background: var(--cream); }
.btn-sm { padding: 0.35rem 0.65rem; font-size: 0.72rem; min-height: 30px; }
.btn-block { width: 100%; }

/* ─── Input ─── */
.input {
  width: 100%;
  padding: 0.55rem 0.75rem;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: var(--paper);
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  font-size: 0.9rem;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,77,74,0.1); }
.input-sm { padding: 0.35rem 0.55rem; font-size: 0.83rem; }
textarea.input { resize: vertical; min-height: 60px; }
.fld { margin-bottom: 0.75rem; }
.fld label {
  display: block;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--ink-soft);
  margin-bottom: 0.25rem;
}
.fld-row { display: flex; gap: 0.5rem; }
.fld-row > * { flex: 1; min-width: 0; }

/* ─── Filter bar ─── */
.fb {
  display: flex; flex-wrap: wrap; gap: 0.35rem;
  margin-bottom: 0.875rem;
}
.fb-btn {
  padding: 0.4rem 0.7rem;
  border-radius: var(--r-sm);
  font-size: 0.75rem;
  font-weight: 500;
  background: var(--paper);
  color: var(--ink-soft);
  border: 1px solid var(--border);
  display: flex; align-items: center; gap: 0.3rem;
  white-space: nowrap;
  transition: all 0.15s;
}
.fb-btn.act { background: var(--accent); color: var(--paper); border-color: var(--accent); }
.fb-btn svg { width: 11px; height: 11px; }
.fb-cnt { opacity: 0.7; font-variant-numeric: tabular-nums; }

/* ─── Tab strip (inner tabs) ─── */
.tabs {
  display: flex; gap: 0.2rem;
  background: var(--cream);
  padding: 0.2rem;
  border-radius: var(--r-md);
  margin-bottom: 0.875rem;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1;
  min-width: max-content;
  padding: 0.5rem 0.75rem;
  border-radius: var(--r-sm);
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--ink-soft);
  display: flex; align-items: center; justify-content: center; gap: 0.3rem;
  white-space: nowrap;
  transition: all 0.15s;
}
.tab.act {
  background: var(--paper);
  color: var(--ink);
  box-shadow: var(--sh);
  font-weight: 600;
}
.tab svg { width: 12px; height: 12px; }

/* ─── Empty state ─── */
.empty {
  text-align: center;
  padding: 2.5rem 1rem;
  background: var(--paper);
  border: 2px dashed var(--border);
  border-radius: var(--r-md);
}
.empty-i {
  width: 3rem; height: 3rem;
  margin: 0 auto 0.875rem;
  border-radius: 50%;
  background: var(--cream);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
}
.empty-t { font-size: 1rem; font-weight: 600; color: var(--ink); margin-bottom: 0.35rem; }
.empty-d { font-size: 0.83rem; color: var(--muted); margin-bottom: 1rem; max-width: 24rem; margin-left: auto; margin-right: auto; }
.empty-acts { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }

/* ─── Modal ─── */
.modal-bk {
  position: fixed; inset: 0;
  background: rgba(26,22,18,0.55);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
}
.modal-bk.show { display: flex; }
.modal {
  background: var(--paper);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  width: 100%;
  max-width: 32rem;
  padding: 1.25rem;
  max-height: 92vh;
  overflow-y: auto;
  animation: slideUp 0.25s ease-out;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: none; }
}
@media (min-width: 640px) {
  .modal-bk { align-items: center; padding: 1rem; }
  .modal { border-radius: var(--r-lg); animation: zoomIn 0.2s ease-out; }
  @keyframes zoomIn {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
}
.modal-h {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
}
.modal-h h3 { font-size: 1.05rem; font-weight: 700; }
.modal-x {
  width: 2rem; height: 2rem;
  border-radius: 50%;
  background: var(--cream);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
}
.modal-act {
  display: flex; gap: 0.5rem; justify-content: flex-end;
  margin-top: 1.25rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

/* ─── Utils ─── */
.flx { display: flex; }
.flx-c { display: flex; flex-direction: column; }
.itm { align-items: center; }
.its { align-items: flex-start; }
.jb { justify-content: space-between; }
.je { justify-content: flex-end; }
.jc { justify-content: center; }
.fls { flex: 1; min-width: 0; }
.fwr { flex-wrap: wrap; }
.g25 { gap: 0.25rem; }
.g35 { gap: 0.35rem; }
.g5 { gap: 0.5rem; }
.g75 { gap: 0.75rem; }
.g1 { gap: 1rem; }
.txx { font-size: 0.7rem; }
.txs { font-size: 0.8rem; }
.txm { font-size: 0.85rem; }
.fb5 { font-weight: 500; }
.fb6 { font-weight: 600; }
.fb7 { font-weight: 700; }
.cli { color: var(--ink); }
.cls { color: var(--ink-soft); }
.clm { color: var(--muted); }
.cla { color: var(--accent); }
.clp { color: var(--persimmon); }
.cn { font-variant-numeric: tabular-nums; }
.tac { text-align: center; }
.mb1 { margin-bottom: 0.5rem; }
.mb2 { margin-bottom: 0.75rem; }
.mb3 { margin-bottom: 1rem; }
.mb4 { margin-bottom: 1.25rem; }
.mb5 { margin-bottom: 1.5rem; }
.mt1 { margin-top: 0.5rem; }
.mt2 { margin-top: 0.75rem; }
.mt3 { margin-top: 1rem; }
[hidden] { display: none !important; }

/* ─── Footer ─── */
footer {
  text-align: center;
  padding: 1.5rem 1rem;
  border-top: 1px solid var(--border);
  margin-top: 2rem;
}
footer p { font-size: 0.7rem; color: var(--muted); }

/* ── SYNC BUTTON ── */
.sync-fab {
  position: fixed; bottom: 5rem; left: 1rem;
  background: var(--accent); color: var(--paper);
  border-radius: 2rem; padding: 0.55rem 1rem;
  font-size: 0.78rem; font-weight: 600;
  display: flex; align-items: center; gap: 0.4rem;
  box-shadow: var(--sh-md); z-index: 90;
  transition: background 0.15s;
}
.sync-fab:hover { background: var(--accent-dk); }
.sync-fab svg { width: 15px; height: 15px; flex-shrink: 0; }
.sync-fab.saving { opacity: 0.7; pointer-events: none; }

/* ── SYNC MODAL ── */
.sync-box { padding: 1.5rem; max-width: 360px; }
.sync-box h3 { font-size: 1rem; margin-bottom: 0.25rem; }
.sync-box .sync-sub { font-size: 0.78rem; color: var(--muted); margin-bottom: 1.25rem; }
.sync-code-display {
  background: var(--cream); border: 2px solid var(--accent);
  border-radius: var(--r-md); padding: 0.75rem 1rem;
  text-align: center; font-size: 1.6rem; font-weight: 700;
  letter-spacing: 0.25em; color: var(--accent);
  margin-bottom: 0.5rem; cursor: pointer; user-select: all;
}
.sync-code-display:hover { background: var(--border); }
.sync-hint { font-size: 0.72rem; color: var(--muted); text-align: center; margin-bottom: 1.25rem; }
.sync-divider { display: flex; align-items: center; gap: 0.5rem; margin: 1rem 0; }
.sync-divider span { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
.sync-divider::before, .sync-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.sync-load-row { display: flex; gap: 0.5rem; }
.sync-load-row input { flex: 1; }
.sync-status { font-size: 0.78rem; margin-top: 0.75rem; padding: 0.5rem 0.75rem;
  border-radius: var(--r-sm); display: none; }
.sync-status.ok { background: #d1fae5; color: #065f46; display: block; }
.sync-status.err { background: #fee2e2; color: #991b1b; display: block; }

/* ── TRIP INFO TAB ── */
.ti-card {
  background: var(--paper); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 1rem 1.1rem;
  margin-bottom: 1rem; box-shadow: var(--sh);
}
.ti-card h4 {
  font-size: 0.92rem; color: var(--accent); margin-bottom: 0.6rem;
  display: flex; align-items: center; gap: 0.4rem;
}
.ti-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 0.75rem; }
@media (max-width: 480px) { .ti-grid { grid-template-columns: 1fr; } }
.ti-fld label { font-size: 0.7rem; color: var(--muted); display: block; margin-bottom: 0.2rem; }
.ti-fld .input { font-size: 0.85rem; padding: 0.45rem 0.6rem; }
.ti-flight {
  background: var(--cream); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 0.65rem 0.8rem; margin-bottom: 0.5rem;
  display: grid; grid-template-columns: auto 1fr auto; gap: 0.5rem; align-items: center;
}
.ti-flight-no { font-weight: 700; color: var(--accent); font-size: 0.78rem; }
.ti-flight-r { font-size: 0.78rem; color: var(--ink-soft); }
.ti-flight-r strong { color: var(--ink); font-weight: 600; }
.ti-flight-t { text-align: left; font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
.ti-flight-x {
  background: transparent; color: var(--err); padding: 0.2rem 0.4rem;
  border-radius: var(--r-sm); font-size: 0.85rem;
}
.ti-add {
  width: 100%; padding: 0.55rem; border: 1.5px dashed var(--border);
  border-radius: var(--r-md); color: var(--muted); font-size: 0.78rem;
  background: transparent; transition: all 0.15s;
}
.ti-add:hover { border-color: var(--accent); color: var(--accent); }

/* ── HOTEL BANNER (in day) ── */
.day-hotel {
  background: linear-gradient(135deg, rgba(26,77,74,0.08), rgba(184,146,74,0.05));
  border: 1px solid var(--accent); border-radius: var(--r-md);
  padding: 0.7rem 0.9rem; margin-bottom: 0.85rem;
  display: flex; gap: 0.65rem; align-items: flex-start;
}
.day-hotel-ic { font-size: 1.3rem; flex-shrink: 0; }
.day-hotel-bd { flex: 1; min-width: 0; }
.day-hotel-n { font-weight: 700; color: var(--accent); font-size: 0.88rem; margin-bottom: 0.15rem; }
.day-hotel-m {
  display: flex; gap: 0.65rem; flex-wrap: wrap;
  font-size: 0.7rem; color: var(--ink-soft); margin-top: 0.2rem;
}

.dt-between-btn:hover { background: var(--accent); color: var(--paper); border-color: var(--accent); transform: scale(1.15); }

/* Day header */
.day-hdr {
  display: flex; align-items: flex-start; gap: 0.75rem;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 0.875rem;
  margin-bottom: 0.875rem;
}
.day-hdr.transit { border-right: 4px solid var(--warn); }
.day-hdr.arrival { border-right: 4px solid var(--ok); }
.day-hdr.departure { border-right: 4px solid var(--err); }
.day-hdr-i {
  width: 2.5rem; height: 2.5rem;
  border-radius: var(--r-md);
  background: var(--accent);
  color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 1.1rem;
  font-weight: 700;
}
.day-hdr.transit .day-hdr-i { background: var(--warn); }
.day-hdr.arrival .day-hdr-i { background: var(--ok); }
.day-hdr.departure .day-hdr-i { background: var(--err); }
.day-hdr-info { flex: 1; min-width: 0; }
.day-hdr-d { font-size: 0.7rem; color: var(--muted); }
.day-hdr-t {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--ink);
  margin: 0.1rem 0 0.3rem;
}
.day-hdr-row {
  display: flex; flex-wrap: wrap; gap: 0.3rem;
  align-items: center;
}

/* Flight banner */
.fl-bnr {
  background: rgba(245,158,11,0.1);
  border: 1px solid rgba(245,158,11,0.35);
  border-radius: var(--r-md);
  padding: 0.625rem 0.75rem;
  margin-bottom: 0.75rem;
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.78rem;
  color: #92400e;
}
.fl-bnr svg { color: var(--warn); flex-shrink: 0; }

/* Narrative card - day description */
.narrative-card {
  background: linear-gradient(135deg, rgba(184,146,74,0.08) 0%, rgba(26,77,74,0.05) 100%);
  border: 1px solid rgba(184,146,74,0.3);
  border-right: 3px solid var(--gold);
  border-radius: var(--r-md);
  padding: 0.75rem 0.875rem;
  margin-bottom: 0.875rem;
  display: flex;
  gap: 0.625rem;
  align-items: flex-start;
}
.narrative-icon {
  font-size: 1.1rem;
  flex-shrink: 0;
  line-height: 1.4;
}
.narrative-text {
  font-size: 0.78rem;
  line-height: 1.7;
  color: var(--ink-soft);
  flex: 1;
}
@media (min-width: 768px) {
  .narrative-text { font-size: 0.83rem; }
}

/* ═════════════════════════════════════════
   PRE-TRIP TASKS
   ═════════════════════════════════════════ */
.task-prog {
  height: 8px;
  border-radius: 9999px;
  background: rgba(0,0,0,0.08);
  overflow: hidden;
}
.task-prog-f {
  height: 100%;
  border-radius: 9999px;
  transition: width 0.4s;
}
.task-cat {
  margin-bottom: 1rem;
}
.task-cat-h {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0;
  border-bottom: 2px solid var(--border);
}
.task-cat-cnt {
  font-size: 0.7rem;
  color: var(--muted);
  font-weight: 500;
  background: var(--cream);
  padding: 0.15rem 0.5rem;
  border-radius: 9999px;
}
.task {
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
  padding: 0.65rem 0.75rem;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  margin-bottom: 0.4rem;
  transition: all 0.15s;
}
.task:hover { border-color: var(--accent); }
.task-done {
  opacity: 0.6;
  background: var(--cream);
}
.task-done .task-label {
  text-decoration: line-through;
  color: var(--muted);
}
.task-check {
  width: 1.5rem;
  height: 1.5rem;
  border: 2px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--bg);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
}
.task-check:hover { border-color: var(--accent); }
.task-done .task-check {
  background: var(--ok);
  border-color: var(--ok);
  color: white;
}
.task-check svg { width: 14px; height: 14px; }
.task-info { flex: 1; min-width: 0; }
.task-label {
  font-size: 0.83rem;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.5;
}
.task-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  margin-top: 0.35rem;
  align-items: center;
}

/* Trip flow visualization */
.trip-flow {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.trip-leg {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.5rem 0.65rem;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
}
.trip-leg-num {
  width: 1.75rem;
  height: 1.75rem;
  border-radius: 50%;
  background: var(--accent);
  color: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  font-weight: 700;
  flex-shrink: 0;
}
.trip-leg-info { flex: 1; min-width: 0; }
.trip-leg-t {
  font-size: 0.83rem;
  font-weight: 700;
  color: var(--ink);
}
.trip-leg-d {
  font-size: 0.7rem;
  color: var(--muted);
  line-height: 1.5;
  margin-top: 1px;
}
.trip-arrow {
  text-align: center;
  font-size: 0.7rem;
  color: var(--accent);
  font-weight: 600;
  padding: 0.2rem 0;
  position: relative;
}
.trip-arrow::before {
  content: '';
  display: block;
  width: 2px;
  height: 0.5rem;
  background: var(--border);
  margin: 0 auto 0.2rem;
}

/* Timeline */
.tl {
  position: relative;
  padding-right: 3.5rem;
  margin-bottom: 1rem;
}
.tl::before {
  content: '';
  position: absolute;
  right: 2.4rem;
  top: 0.5rem;
  bottom: 0.5rem;
  width: 2px;
  background: var(--border);
}
.tl-row {
  position: relative;
  margin-bottom: 0.5rem;
}
.tl-time {
  position: absolute;
  right: -3.5rem;
  top: 0.5rem;
  width: 2.4rem;
  text-align: center;
  font-size: 0.62rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  background: var(--bg);
  padding: 2px 0;
  border-radius: 4px;
}
.tl-dot {
  position: absolute;
  right: -1.4rem;
  top: 0.85rem;
  width: 0.8rem; height: 0.8rem;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg);
  z-index: 1;
}
.tl-row.t-food .tl-dot { background: var(--persimmon); }
.tl-row.t-attraction .tl-dot { background: var(--accent); }
.tl-row.t-entertainment .tl-dot { background: #e11d48; }
.tl-row.t-tour .tl-dot { background: #0891b2; }
.tl-row.t-transport .tl-dot { background: var(--warn); }
.tl-row.t-hotel .tl-dot { background: var(--gold); }
.tl-row.t-mosque .tl-dot { background: #047857; }
.tl-row.t-shop .tl-dot { background: #7c3aed; }
.tl-row.t-festival .tl-dot { background: #db2777; }
.tl-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 0.625rem 0.75rem;
  display: flex; align-items: flex-start; gap: 0.5rem;
  transition: border-color 0.15s;
}
.tl-card.locked { opacity: 0.85; background: var(--cream); }

/* Transport card - dashed border for "movement" feel */
.tl-card.tl-transport {
  background: rgba(245,158,11,0.04);
  border: 1px dashed rgba(245,158,11,0.5);
  border-right: 3px solid var(--warn);
}
/* Tour card - highlighted activity */
.tl-card.tl-tour {
  background: rgba(8,145,178,0.04);
  border: 1px solid rgba(8,145,178,0.35);
  border-right: 3px solid #0891b2;
}
.tl-tr-note {
  font-size: 0.7rem;
  color: var(--ink-soft);
  background: rgba(245,158,11,0.06);
  border-right: 2px solid var(--warn);
  padding: 0.35rem 0.5rem;
  border-radius: var(--r-sm);
  margin-top: 0.4rem;
  line-height: 1.55;
}
.tl-card-ic {
  width: 1.85rem; height: 1.85rem;
  border-radius: var(--r-sm);
  background: var(--cream);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 1rem;
}
.tl-card-info { flex: 1; min-width: 0; }
.tl-card-t {
  font-size: 0.83rem;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.35;
  word-wrap: break-word;
}
.tl-card-m {
  font-size: 0.68rem;
  color: var(--muted);
  margin-top: 0.15rem;
  display: flex; flex-wrap: wrap; gap: 0.4rem;
}
.tl-card-acts {
  display: flex; gap: 0.25rem;
  margin-top: 0.4rem;
}
.tl-card-act {
  font-size: 0.62rem;
  padding: 0.15rem 0.4rem;
  border-radius: var(--r-sm);
  background: var(--cream);
  color: var(--ink-soft);
  text-decoration: none;
  display: inline-flex; align-items: center; gap: 0.2rem;
}
.tl-card-act:hover { background: var(--border); }
.tl-card-act svg { width: 10px; height: 10px; }
.tl-card-x {
  flex-shrink: 0;
  width: 1.6rem; height: 1.6rem;
  border-radius: var(--r-sm);
  color: var(--persimmon);
  opacity: 0.55;
  display: flex; align-items: center; justify-content: center;
}
.tl-card-x:hover { opacity: 1; background: rgba(201,68,43,0.1); }
.tl-card-x svg { width: 13px; height: 13px; }

.tl-add {
  margin-right: -1rem;
  margin-top: 0.5rem;
  padding: 0.65rem 0.75rem;
  border: 2px dashed var(--border);
  border-radius: var(--r-md);
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  gap: 0.4rem;
  width: calc(100% + 1rem);
  font-size: 0.8rem;
  transition: all 0.15s;
}
.tl-add:hover { border-color: var(--accent); color: var(--accent); background: rgba(26,77,74,0.04); }
.tl-add svg { width: 14px; height: 14px; }

/* ═════════════════════════════════════════
   📋 CATEGORY PICKER (Logical Day Builder)
   ═════════════════════════════════════════ */
.cat-grid {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.cat-card {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.85rem;
  background: var(--paper);
  border: 1.5px solid var(--border);
  border-right: 4px solid var(--cat-c, var(--accent));
  border-radius: var(--r-md);
  cursor: pointer;
  text-align: right;
  font-family: inherit;
  transition: all 0.15s;
}
.cat-card:hover {
  border-color: var(--cat-c, var(--accent));
  background: var(--cream);
  transform: translateX(-2px);
}
.cat-ic {
  font-size: 1.6rem;
  flex-shrink: 0;
  width: 2.75rem;
  height: 2.75rem;
  border-radius: 50%;
  background: rgba(0,0,0,0.04);
  display: flex;
  align-items: center;
  justify-content: center;
}
.cat-info { flex: 1; min-width: 0; }
.cat-l {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--ink);
}
.cat-d {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 1px;
  line-height: 1.4;
}
.cat-chev {
  width: 18px;
  height: 18px;
  color: var(--muted);
  flex-shrink: 0;
}
.cat-header {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.6rem 0.75rem;
  background: var(--cream);
  border-right: 3px solid var(--cat-c);
  border-radius: var(--r-sm);
  margin-bottom: 0.875rem;
}
.cat-header-ic {
  font-size: 1.4rem;
  width: 2.25rem;
  height: 2.25rem;
  border-radius: 50%;
  background: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.35rem 0.6rem;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-size: 0.75rem;
  color: var(--muted);
  cursor: pointer;
  margin-bottom: 0.75rem;
  font-family: inherit;
}
.back-btn:hover { color: var(--accent); border-color: var(--accent); }
.back-btn svg { width: 14px; height: 14px; }

/* ═════════════════════════════════════════
   🗓️ DAY MANAGEMENT TOOLBAR
   ═════════════════════════════════════════ */
.day-toolbar {
  display: flex;
  gap: 0.35rem;
  padding: 0.4rem 0.5rem;
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  margin-bottom: 0.875rem;
  overflow-x: auto;
  flex-wrap: nowrap;
}
.day-tb-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.4rem 0.55rem;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-size: 0.72rem;
  color: var(--ink-soft);
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: all 0.15s;
  flex-shrink: 0;
}
.day-tb-btn:hover:not(:disabled) {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.day-tb-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.day-tb-btn svg { width: 12px; height: 12px; }
.day-tb-danger:hover:not(:disabled) {
  background: var(--persimmon) !important;
  border-color: var(--persimmon) !important;
}

/* ═════════════════════════════════════════
   ⚠️ DAY WARNINGS
   ═════════════════════════════════════════ */
.day-warns {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  margin-bottom: 0.875rem;
}
.day-warn {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  padding: 0.55rem 0.7rem;
  border-radius: var(--r-sm);
  font-size: 0.78rem;
  line-height: 1.5;
}
.day-warn-info {
  background: rgba(8,145,178,0.07);
  border: 1px solid rgba(8,145,178,0.25);
  color: #075985;
}
.day-warn-warn {
  background: rgba(245,158,11,0.08);
  border: 1px solid rgba(245,158,11,0.35);
  color: #92400e;
}
.day-warn-err {
  background: rgba(239,68,68,0.06);
  border: 1px solid rgba(239,68,68,0.3);
  color: #991b1b;
}
.day-warn-i { font-size: 1rem; flex-shrink: 0; }
.day-warn-t { flex: 1; }

/* ═════════════════════════════════════════
   ⏱️ BUFFER TIME (between items)
   ═════════════════════════════════════════ */
.tl-buffer {
  position: relative;
  padding: 0.35rem 0;
  margin-right: 6.5rem;
  margin-left: 0;
}
.tl-buffer::before {
  content: '';
  position: absolute;
  right: -3.6rem;
  top: 0;
  bottom: 0;
  width: 2px;
  background: repeating-linear-gradient(to bottom, var(--border) 0, var(--border) 4px, transparent 4px, transparent 8px);
}
.tl-buffer-l {
  display: inline-block;
  font-size: 0.68rem;
  color: var(--muted);
  background: var(--bg);
  padding: 0.15rem 0.5rem;
  border-radius: 9999px;
  border: 1px dashed var(--border);
  font-style: italic;
}

/* ═════════════════════════════════════════
   ✅ ITEM STATUS (done) + 🔒 LOCKED
   ═════════════════════════════════════════ */
.tl-row-done .tl-card {
  opacity: 0.55;
  background: var(--cream) !important;
}
.tl-row-done .tl-card-t {
  text-decoration: line-through;
  color: var(--muted);
}
.tl-row-done .tl-dot {
  background: var(--ok) !important;
}
.tl-row-locked .tl-card {
  border-style: solid !important;
  border-width: 1.5px !important;
}
.tl-lock {
  display: inline-block;
  margin-right: 0.3rem;
  font-size: 0.85rem;
  vertical-align: middle;
}
.tl-card-done {
  background: transparent !important;
}
.tl-card-done.is-done {
  background: var(--ok) !important;
  color: white !important;
  border-color: var(--ok) !important;
}

/* ═════════════════════════════════════════
   🎨 NEW TYPE COLORS
   ═════════════════════════════════════════ */
.tl-row.t-rest .tl-dot { background: #d97706; }
.tl-row.t-note .tl-dot { background: #64748b; }
.tl-row.t-hotel .tl-dot { background: var(--accent); }
.tl-row.t-food .tl-dot { background: #16a34a; }
.tl-row.t-mosque .tl-dot { background: #0891b2; }

.tl-card.tl-hotel {
  background: rgba(26,77,74,0.04);
  border-right: 3px solid var(--accent);
}
.tl-card.tl-food {
  background: rgba(22,163,74,0.04);
  border-right: 3px solid #16a34a;
}
.tl-card.tl-mosque {
  background: rgba(8,145,178,0.04);
  border-right: 3px solid #0891b2;
}
.tl-card.tl-rest {
  background: rgba(217,119,6,0.04);
  border-right: 3px solid #d97706;
}
.tl-card.tl-note {
  background: rgba(100,116,139,0.04);
  border-right: 3px solid #64748b;
}

.poi-ic.t-hotel { background: rgba(26,77,74,0.12); color: var(--accent); }
.poi-ic.t-rest { background: rgba(217,119,6,0.12); color: #d97706; }
.poi-ic.t-note { background: rgba(100,116,139,0.12); color: #64748b; }


/* ═════════════════════════════════════════
   HOTEL DISTRICTS
   ═════════════════════════════════════════ */

.dist-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
  margin-bottom: 0.875rem;
}
.dist-h {
  padding: 0.875rem;
  background: var(--cream);
  border-bottom: 1px solid var(--border);
}
.dist-n {
  font-size: 1rem;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 0.2rem;
  display: flex; align-items: center; gap: 0.4rem;
}
.dist-tag { font-size: 0.7rem; color: var(--muted); }
.dist-pros {
  display: flex; flex-direction: column; gap: 0.25rem;
  margin-top: 0.625rem;
}
.dist-pro {
  font-size: 0.75rem;
  color: var(--ink-soft);
  display: flex; align-items: flex-start; gap: 0.4rem;
}
.dist-pro::before {
  content: '✓';
  color: var(--ok);
  font-weight: 700;
  flex-shrink: 0;
}
.dist-best { font-size: 0.7rem; color: var(--persimmon); margin-top: 0.4rem; font-weight: 600; }
.dist-hotels {
  padding: 0.5rem 0.875rem;
}
.hotel-row {
  display: flex; align-items: flex-start; gap: 0.625rem;
  padding: 0.625rem 0;
  border-bottom: 1px solid var(--border);
}
.hotel-row:last-child { border-bottom: none; }
.hotel-rk {
  width: 1.5rem; height: 1.5rem;
  border-radius: 50%;
  background: var(--accent);
  color: var(--paper);
  font-size: 0.7rem;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.hotel-info { flex: 1; min-width: 0; }
.hotel-n { font-size: 0.85rem; font-weight: 600; color: var(--ink); }
.hotel-pr { font-size: 0.7rem; color: var(--persimmon); font-weight: 600; margin-top: 1px; }
.hotel-no { font-size: 0.72rem; color: var(--muted); margin-top: 2px; line-height: 1.5; }
.hotel-acts { display: flex; gap: 0.3rem; margin-top: 0.4rem; flex-wrap: wrap; }

/* ═════════════════════════════════════════
   LIBRARY (POIs - reusable items)
   ═════════════════════════════════════════ */

.lib-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.5rem;
  margin-bottom: 1rem;
}
@media (min-width: 768px) {
  .lib-stats { grid-template-columns: repeat(4, 1fr); }
}
.lib-stat {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 0.65rem;
  text-align: center;
}
.lib-stat-i { font-size: 1.4rem; margin-bottom: 0.15rem; }
.lib-stat-v { font-size: 1.2rem; font-weight: 700; line-height: 1; }

}

.poi-ic.t-tour { background: rgba(8,145,178,0.12); color: #0891b2; }
.poi-ic.t-cafe { background: rgba(184,146,74,0.18); color: var(--gold); }
.poi-ic.t-hotel { background: rgba(184,146,74,0.18); color: var(--gold); }
.poi-ic.t-shop { background: rgba(124,58,237,0.12); color: #7c3aed; }
.poi-ic.t-mosque { background: rgba(16,185,129,0.12); color: #047857; }
.poi-ic.t-transport { background: rgba(245,158,11,0.15); color: #b45309; }

.picker-tabs {

.picker-tab {

}

}

.picker-list {

  overflow-y: auto;
  padding-right: 4px;

}
.picker-item {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.6rem;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);

  background: var(--paper);
  transition: all 0.15s;
  width: 100%;

}
.picker-item:hover {
  border-color: var(--accent);

}
.picker-item-ic {

}
.picker-item-info { flex: 1; min-width: 0; }

.picker-item-m { font-size: 0.68rem; color: var(--muted); margin-top: 1px; }

.s-row { position: relative; margin-bottom: 0.75rem; }

.s-inp { width: 100%; padding: 0.55rem 2.2rem 0.55rem 0.7rem; }

/* ═════════════════════════════════════════
   MAP
   ═════════════════════════════════════════ */
.map-wrap {
  height: 22rem;
  border-radius: var(--r-md);
  overflow: hidden;
  border: 1px solid var(--border);
  margin-bottom: 0.875rem;
}
@media (min-width: 768px) { .map-wrap { height: 32rem; } }
#tripmap { height: 100%; width: 100%; }

.map-leg {
  display: flex; flex-wrap: wrap; gap: 0.5rem;
  padding: 0.5rem 0.65rem;
  background: var(--cream);
  border-radius: var(--r-sm);
  font-size: 0.68rem;
  margin-bottom: 0.75rem;
}
.lg-d { display: flex; align-items: center; gap: 0.3rem; }
.lg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ═════════════════════════════════════════
   BUDGET
   ═════════════════════════════════════════ */
.bud-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
  margin-bottom: 1rem;
}
.bud-stat { padding: 0.65rem; text-align: center; }
.bud-l { font-size: 0.6rem; opacity: 0.85; margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.04em; }
.bud-v { font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.bud-sar { font-size: 0.6rem; margin-top: 0.15rem; opacity: 0.75; }
.bud-act-c { background: rgba(201,68,43,0.1); border-color: rgba(201,68,43,0.3); }
.bud-act-c .bud-l, .bud-act-c .bud-v, .bud-act-c .bud-sar { color: var(--persimmon); }
.bud-rem-c { background: rgba(26,77,74,0.1); border-color: rgba(26,77,74,0.3); }
.bud-rem-c .bud-l, .bud-rem-c .bud-v, .bud-rem-c .bud-sar { color: var(--accent); }

.b-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
.b-icon { font-size: 1.2rem; }
.b-info { flex: 1; min-width: 0; }
.b-n { font-size: 0.8rem; font-weight: 600; color: var(--ink); }
.b-num { font-size: 0.65rem; display: flex; gap: 0.5rem; margin-top: 1px; color: var(--muted); }
.b-inp {
  width: 4rem;
  padding: 0.3rem 0.4rem;
  text-align: center;
  font-variant-numeric: tabular-nums;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--bg); color: var(--ink);
  outline: none; font-size: 0.78rem;
}
.b-prog { height: 4px; border-radius: 9999px; background: var(--cream); overflow: hidden; }
.b-prog-f { height: 100%; transition: width 0.3s; }

/* ═════════════════════════════════════════
   CITY OVERVIEW
   ═════════════════════════════════════════ */
.city-banner {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 1rem;
  margin-bottom: 1rem;
}
.city-banner h3 {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 0.2rem;
}
.city-banner .cb-en { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.5rem; }
.city-banner p { font-size: 0.83rem; color: var(--ink-soft); line-height: 1.65; margin-bottom: 0.75rem; }

/* ═════════════════════════════════════════
   MISC
   ═════════════════════════════════════════ */

.tr-info {
  display: flex; flex-direction: column; gap: 0.25rem;
  padding: 0.55rem 0;
  border-bottom: 1px solid var(--border);
}
.tr-info:last-child { border-bottom: none; }
.tr-mode { font-weight: 600; font-size: 0.83rem; color: var(--ink); }
.tr-meta { font-size: 0.7rem; color: var(--muted); }
.tr-pr { font-size: 0.78rem; color: var(--persimmon); font-weight: 600; }

.tip-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
.tip-list li {
  font-size: 0.78rem;
  color: var(--ink-soft);
  line-height: 1.55;
  padding-right: 1.2rem;
  position: relative;
}
.tip-list li::before {
  content: '💡';
  position: absolute;
  right: 0;
  top: 0;
}
.tip-list li.cle::before { content: '⚠️'; }
.tip-list li.cle { color: var(--persimmon); }

/* Translation card */
.tc {
  background: var(--accent);
  color: var(--paper);
  border-radius: var(--r-md);
  padding: 0.875rem;
}
.tc-t {
  font-size: 0.95rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
}
.tc-text {
  background: rgba(253,250,243,0.1);
  border-radius: var(--r-sm);
  padding: 0.65rem;
  font-size: 0.78rem;
  line-height: 1.6;
  font-family: 'Courier New', monospace;
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 0.5rem;
}

/* App icons */
.app-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.4rem;
}
@media (min-width: 768px) { .app-grid { grid-template-columns: repeat(4, 1fr); } }
.app-c {
  text-align: center;
  background: var(--cream);
  padding: 0.6rem 0.4rem;
  border-radius: var(--r-sm);
}
.app-i { font-size: 1.3rem; margin-bottom: 0.1rem; }
.app-n { font-size: 0.7rem; font-weight: 700; color: var(--ink); }
.app-no { font-size: 0.6rem; color: var(--muted); margin-top: 1px; line-height: 1.3; }

/* Emergency rows */
.em-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.5rem 0;
  border-bottom: 1px solid rgba(201,68,43,0.2);
  gap: 0.5rem;
}
.em-row:last-child { border-bottom: none; }
.em-n { font-size: 0.8rem; font-weight: 600; color: var(--ink); }
.em-m { font-size: 0.68rem; color: var(--muted); }
.em-p {
  font-size: 0.78rem; font-weight: 700;
  font-variant-numeric: tabular-nums;
  padding: 0.3rem 0.55rem;
  border-radius: var(--r-sm);
  background: var(--persimmon);
  color: var(--paper);
  text-decoration: none;
  white-space: nowrap;
}

/* Festival rows */
.fest-row {
  display: flex; flex-direction: column; gap: 0.3rem;
  padding: 0.625rem 0;
  border-bottom: 1px solid var(--border);
}
.fest-row:last-child { border-bottom: none; }
@media (min-width: 640px) {
  .fest-row { flex-direction: row; align-items: center; gap: 0.75rem; }
}

/* Highlight badge */
.hl {
  font-size: 0.7rem;
  padding: 0.4rem 0.55rem;
  border-radius: var(--r-sm);
  background: var(--cream);
  color: var(--ink-soft);
  display: flex; align-items: center; gap: 0.35rem;
}
.hl svg { color: var(--gold); flex-shrink: 0; }

/* FAB - floating action button on mobile */
.fab {
  position: fixed;
  bottom: 1rem;
  left: 1rem;
  z-index: 25;
  width: 3.25rem; height: 3.25rem;
  border-radius: 50%;
  background: var(--persimmon);
  color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(201,68,43,0.35);
  transition: transform 0.15s;
}
.fab:hover { transform: scale(1.05); }
.fab svg { width: 22px; height: 22px; }

/* Quick info bar (date, weather) */
.qi-bar {
  display: flex; gap: 0.4rem; flex-wrap: wrap;
  margin-bottom: 0.875rem;
}
.qi-pill {
  font-size: 0.7rem;
  padding: 0.3rem 0.55rem;
  border-radius: var(--r-sm);
  background: var(--cream);
  color: var(--ink-soft);
  display: flex; align-items: center; gap: 0.3rem;
}
.qi-pill svg { width: 11px; height: 11px; }

/* ═══════════════ PRINT / PDF EXPORT ═══════════════ */
#print-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 9999;
  background: #fff; overflow-y: auto; padding: 1.5rem;
  font-family: 'Segoe UI', Tahoma, sans-serif; direction: rtl;
}
#print-overlay.active { display: block; }
.print-close-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 1rem; gap: 0.5rem; flex-wrap: wrap;
}
.print-header { border-bottom: 2px solid #1a4d4a; padding-bottom: 0.75rem; margin-bottom: 1rem; }
.print-title { font-size: 1.4rem; font-weight: 700; color: #1a4d4a; }
.print-sub { font-size: 0.85rem; color: #666; margin-top: 0.2rem; }
.print-section { margin-bottom: 1.2rem; }
.print-section h3 { font-size: 0.9rem; font-weight: 700; color: #1a4d4a; border-bottom: 1px solid #e0e7e4; padding-bottom: 0.3rem; margin-bottom: 0.6rem; }
.print-item { display: flex; gap: 0.75rem; padding: 0.45rem 0; border-bottom: 1px dashed #eee; align-items: flex-start; }
.print-item-time { font-size: 0.75rem; font-weight: 600; color: #1a4d4a; min-width: 3rem; padding-top: 0.1rem; }
.print-item-body { flex: 1; }
.print-item-text { font-size: 0.82rem; font-weight: 600; }
.print-item-note { font-size: 0.72rem; color: #888; }
.print-hotel-card { background: #f0f8f5; border: 1px solid #c8e6d9; border-radius: 6px; padding: 0.6rem 0.8rem; font-size: 0.82rem; }
.print-tips { background: #fffbf0; border: 1px solid #f9e4a0; border-radius: 6px; padding: 0.6rem 0.8rem; font-size: 0.78rem; }
.print-footer { font-size: 0.68rem; color: #aaa; text-align: center; margin-top: 2rem; border-top: 1px solid #eee; padding-top: 0.5rem; }
@media print {
  body > *:not(#print-overlay) { display: none !important; }
  #print-overlay { display: block !important; position: static !important; }
  .print-close-bar { display: none !important; }
}

const OWNER_KEY = "mhwar2026"; // Primary owner key
// Additional access keys: stored in localStorage as JSON ["key1","key2",...]
function getAccessKeys() {
  try { return JSON.parse(localStorage.getItem("kt2_access_keys") || "[]"); } catch { return []; }
}
function saveAccessKeys(keys) {
  localStorage.setItem("kt2_access_keys", JSON.stringify(keys));
}
function isValidAccessKey(key) {
  if (key === OWNER_KEY) return true;
  return getAccessKeys().includes(key);
}

const Trip = {
  current: "korea", // current trip ID

  storageKey(suffix) {
    return this.current === "korea" ? `kt2_${suffix}` : `kt2_trip_${this.current}_${suffix}`;
  },
  load(suffix, def) {
    try { const v = localStorage.getItem(this.storageKey(suffix)); return v !== null ? JSON.parse(v) : def; }
    catch { return def; }
  },
  save(suffix, val) {
    try { localStorage.setItem(this.storageKey(suffix), JSON.stringify(val)); } catch {}
    // Trigger debounced cloud auto-sync if user has sync code
    if (typeof scheduleAutoSync === 'function') scheduleAutoSync();
  },
  delete(suffix) { try { localStorage.removeItem(this.storageKey(suffix)); } catch {} }
};

const TripsRegistry = {
  KOREA_DEFAULT: {
    id: "korea", name: "كوريا الجنوبية", destination: "كوريا الجنوبية",
    icon: "🇰🇷", color: "#1a4d4a", isBuiltIn: true, countryLib: "korea",
    startDate: "2026-05-14", endDate: "2026-05-24",
    createdAt: "2026-01-01"
  },
  list() {
    const stored = (() => {
      try { return JSON.parse(localStorage.getItem("kt2_trips_registry") || "[]"); } catch { return []; }
    })();
    if (!stored.find(t => t.id === "korea")) stored.unshift(this.KOREA_DEFAULT);
    return stored;
  },
  save(list) { localStorage.setItem("kt2_trips_registry", JSON.stringify(list)); },
  get(id) { return this.list().find(t => t.id === id); },
  upsert(trip) {
    const list = this.list().filter(t => t.id !== trip.id);
    list.push(trip);
    this.save(list);
  },
  remove(id) {
    if (id === "korea") return false;
    const list = this.list().filter(t => t.id !== id);
    this.save(list);
    // Clean up trip data
    Object.keys(localStorage).filter(k => k.startsWith(`kt2_trip_${id}_`)).forEach(k => localStorage.removeItem(k));
    return true;
  }
};

function isOwner() {
  return localStorage.getItem("kt2_is_owner") === "1";
}

function isKoreaTrip() {
  if (Trip.current === "korea") return true;
  const t = TripsRegistry.get(Trip.current);
  return t?.countryLib === "korea";
}

function getRouteParams() {
  const u = new URL(location.href);
  return {
    trip: u.searchParams.get("trip"),
    dashboard: u.searchParams.get("dashboard") === "1",
    owner: u.searchParams.get("owner"),
    loadCode: u.searchParams.get("code")
  };
}

function applyRoute() {
  const p = getRouteParams();

  // 1. Owner key check (supports primary OWNER_KEY + additional access keys)
  if (p.owner !== null) {
    if (isValidAccessKey(p.owner)) {
      localStorage.setItem("kt2_is_owner", "1");
      const url = new URL(location.href); url.searchParams.delete("owner");
      history.replaceState(null, "", url.toString());
      alert("✓ تم تفعيل صلاحية الوصول");
    } else {
      alert("مفتاح الوصول غير صحيح");
    }
  }

  // 2. Determine view
  const showDashboard = p.dashboard && isOwner();
  const tripId = p.trip || (isOwner() ? null : "korea");

  return { showDashboard, tripId, loadCode: p.loadCode };
}

function navTo({ trip, dashboard, code }) {
  const u = new URL(location.href);
  u.searchParams.delete("trip");
  u.searchParams.delete("dashboard");
  u.searchParams.delete("code");
  if (dashboard) u.searchParams.set("dashboard", "1");
  if (trip) u.searchParams.set("trip", trip);
  if (code) u.searchParams.set("code", code);
  location.href = u.toString();
}

function generateTripId(name) {
  const base = (name || "trip").toLowerCase()
    .replace(/[؀-ۿ]+/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 24) || "trip";
  let id = base;
  let n = 1;
  const existing = TripsRegistry.list().map(t => t.id);
  while (existing.includes(id)) { id = `${base}-${++n}`; }
  return id;
}

}

// Default empty itinerary (12 days)
const TRIP_START = new Date("2026-05-14");

// Creates blank day objects (skeleton) — used by template import
function makeSkeletonDays() {
  const days = [];
  for (let i = 0; i < 11; i++) {
    const d = new Date(TRIP_START);
    d.setDate(d.getDate() + i);
    const weekdays = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
    let city;
    if (i < 4) city = "seoul";
    else if (i < 7) city = "jeju";
    else if (i < 9) city = "busan";
    else city = "seoul";
    days.push({
      day: i + 1,
      date: d.toISOString().split('T')[0],
      dateLabel: `${d.getDate()} ${["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"][d.getMonth()]}`,
      weekday: weekdays[d.getDay()],
      city, title: "", type: "normal", flight: null, items: []
    });
  }
  return days;
}

// All POIs (built-in + custom) — respects countryLib of current trip
function allLib() {
  const t = TripsRegistry.get(Trip.current);
  const lib = t?.countryLib || null;
  let base = [];
  if (lib === "korea") {
    base = typeof LIB !== 'undefined' ? [...LIB] : [];
  } else if (lib) {
    // Non-Korea global library (turkey, uk, or any custom)
    const libs = (() => { try { return JSON.parse(localStorage.getItem("kt2_global_libs") || "{}"); } catch { return {}; } })();
    base = libs[lib] || [];
  }
  return [...base, ...state.customLib];
}

      ${t.label}
    </button>
  `).join("");
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => switchTab(b.dataset.tab));
}

function switchTab(id) {
  state.active = id;
  Trip.save("tab", id);
  document.querySelectorAll(".sec").forEach(s => s.classList.remove("act"));
  $("sec-" + id).classList.add("act");
  document.querySelectorAll(".nav-t").forEach(t => t.classList.toggle("act", t.dataset.tab === id));
  // Show FAB on itinerary
  $("fab").hidden = id !== "itinerary";
  window.scrollTo({ top: 0, behavior: "smooth" });
  renderSection(id);
}

function renderSection(id) {
  if (id === "overview") renderOverview();
  else if (id === "tasks") renderTasks();
  else if (id === "itinerary") renderItinerary();
  else if (id === "cities") renderCities();
  else if (id === "library") renderLibrary();
  else if (id === "map") renderMapSec();
  else if (id === "budget") renderBudget();
  else if (id === "info") renderInfo();
  else if (id === "tripinfo") renderTripInfo();
}

function renderDayTabs() {
  const tabs = $("day-tabs");
  let html = '';
  state.itinerary.forEach((d, i) => {
    const col = state.cityColors[d.city] || CITY_COLORS_DEFAULT[d.city] || "#1a4d4a";
    const isAct = i === state.activeDayIdx;
    const borderType = d.type !== 'normal' ? ` ${d.type}` : '';
    const cityShort = (cityById(d.city)?.name || d.city).replace('جزيرة ','');
    html += `
      <button class="dt${borderType}${isAct ? ' act' : ''}"
        onclick="state.activeDayIdx=${i};renderItinerary()"
        style="${isAct ? `background:${col};border-color:${col}` : `border-top:3px solid ${col}`}">
        <div class="dt-d">يوم</div>
        <div class="dt-n">${d.day}</div>
        <div class="dt-c">${cityShort}</div>
      </button>
    `;
    // "+" between days (except after last day, that gets its own end-of-strip button)
    if (i < state.itinerary.length - 1) {
      html += `<div class="dt-between"><button class="dt-between-btn" onclick="addNewDay(${i})" title="إضافة يوم بين اليوم ${d.day} و${d.day + 1}">+</button></div>`;
    }
  });
  tabs.innerHTML = html;
}

function saveFirstDay() {
  const type = $("fd-type").value;
  const city = $("fd-city").value;
  const dateStr = $("fd-date").value || state.tripInfo?.startDate || new Date().toISOString().split('T')[0];
  const arrTime = $("fd-arr").value;
  const transport = $("fd-transport").value;
  const note = $("fd-note").value.trim();

  // Update tripInfo startDate if changed
  if (dateStr && state.tripInfo) {
    state.tripInfo.startDate = dateStr;
    saveTripInfo();
  }

  const transportLabels = { train: "قطار AREX", bus: "حافلة عامة", taxi: "تاكسي", private: "سيارة خاصة", limousine: "ليموزين المطار" };
  const transportIcons = { train: "🚆", bus: "🚌", taxi: "🚕", private: "🚗", limousine: "🚌" };

  const d = new Date(dateStr);
  const weekdays = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

  const items = [];
  if (arrTime) {
    items.push({
      id: "fd_" + Date.now(),
      time: arrTime, type: "transport",
      text: `${transportIcons[transport] || '🚆'} من المطار للفندق بـ${transportLabels[transport] || transport}`,
      notes: note || null, bookingLink: null, requiresTicket: false, done: false, locked: false
    });
  }

  const newDay = {
    day: 1,
    date: dateStr,
    dateLabel: `${d.getDate()} ${months[d.getMonth()]}`,
    weekday: weekdays[d.getDay()],
    city, title: type === 'arrival' ? 'يوم الوصول' : '',
    type, flight: type === 'arrival' ? { from: "المطار", to: city, arrTime, mode: transport } : null,
    narrative: null, notes: null, hotel: null, items
  };

  state.itinerary = [newDay];
  saveItin();
  state.activeDayIdx = 0;
  closeModal();
  renderItinerary();
}

      </button>
      <button class="day-tb-btn" onclick="moveDayDown(${state.activeDayIdx})" title="نقل لأسفل" ${state.activeDayIdx === state.itinerary.length - 1 ? 'disabled' : ''}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <button class="day-tb-btn" onclick="openCityTransferModal(${state.activeDayIdx})" title="تسجيل انتقال لمدينة أخرى">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
        <span>انتقال</span>
      </button>
      <button class="day-tb-btn" onclick="printDay(${state.activeDayIdx})" title="تصدير اليوم PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        <span>PDF</span>
      </button>
      <button class="day-tb-btn day-tb-danger" onclick="deleteDay(${state.activeDayIdx})" title="حذف اليوم" ${state.itinerary.length <= 1 ? 'disabled' : ''}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
        <span>حذف</span>
      </button>
    </div>
  `;

  // Flight banner
  if (day.flight) {
    const f = day.flight;
    let txt = `<strong>${day.type === 'arrival' ? '🛬 الوصول:' : day.type === 'departure' ? '🛫 المغادرة:' : '✈️ التنقل:'}</strong> `;
    txt += `${f.from} → ${f.to}`;
    if (f.depTime) txt += ` · انطلاق ${f.depTime}`;
    if (f.arrTime) txt += ` · وصول ${f.arrTime}`;
    html += `<div class="fl-bnr">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
      <span>${txt}</span>
    </div>`;
  }

  // ─── Hotel banner ───
  if (day.hotel && day.hotel.name) {
    const h = day.hotel;
    const isCheckIn = h.isFirst;
    const isCheckOut = h.isLast && h.totalNights > 1;
    const mapsLink = h.address ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(h.address)}` : null;
    html += `<div class="day-hotel">
      <div class="day-hotel-ic">🏨</div>
      <div class="day-hotel-bd">
        <div class="day-hotel-n">
          ${h.totalNights > 1 ? `<span class="day-hotel-night-pill">ليلة ${h.nightIndex}/${h.totalNights}</span>` : ''}
          ${h.name}
        </div>
        ${h.address ? `<div class="txs clm">📍 ${h.address}</div>` : ''}
        <div class="day-hotel-m">
          ${isCheckIn ? `<span>🟢 دخول ${h.checkIn || '15:00'}</span>` : ''}
          ${isCheckOut ? `<span>🔴 خروج ${h.checkOut || '11:00'}</span>` : ''}
          ${!isCheckIn && !isCheckOut ? `<span>🛏️ مبيت</span>` : ''}
        </div>
        ${h.notes ? `<div class="txs cls" style="margin-top:0.3rem">${h.notes}</div>` : ''}
        <div style="display:flex;gap:0.4rem;margin-top:0.5rem;flex-wrap:wrap">
          ${mapsLink ? `<a class="day-hotel-act" href="${mapsLink}" target="_blank">📍 خرائط</a>` : ''}
          ${h.bookingLink ? `<a class="day-hotel-act" href="${h.bookingLink}" target="_blank">🔗 الحجز</a>` : ''}
        </div>
      </div>
    </div>`;
  }

  // ─── Day-level personal notes ───
  if (day.notes) {
    html += `<div class="day-notes">📒 ${day.notes}</div>`;
  }

  // ─── Narrative card (description of the day) ───
  if (day.narrative) {
    html += `<div class="narrative-card">
      <div class="narrative-icon">💡</div>
      <div class="narrative-text">${day.narrative}</div>
    </div>`;
  }

  // ─── Smart Warnings ───
  const warnings = analyzeDayWarnings(day);
  if (warnings.length > 0) {
    html += `<div class="day-warns">
      ${warnings.map(w => `
        <div class="day-warn day-warn-${w.level}">
          <span class="day-warn-i">${w.icon}</span>
          <span class="day-warn-t">${w.text}</span>
        </div>
      `).join('')}
    </div>`;
  }

  // Timeline
  if (day.items.length === 0) {
    html += `<div class="empty">
      <div class="empty-i">📍</div>
      <div class="empty-t">لا توجد أنشطة لهذا اليوم</div>
      <p class="empty-d">اضغط الزر أدناه لإضافة بند بفئته (سكن، مواصلات، وجبة، نشاط، جولة، راحة، ملاحظة)</p>
      <div class="empty-acts">
        <button class="btn btn-pri" onclick="openItemPicker(${state.activeDayIdx})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          + إضافة بند
        </button>
      </div>
    </div>`;
  } else {
    const sorted = [...day.items].sort((a,b) => (a.time || "99:99").localeCompare(b.time || "99:99"));

    // Build timeline with buffer separators
    let timelineHTML = '';
    sorted.forEach((it, i) => {
      // Add buffer time separator before this item (except first)
      if (i > 0) {
        const prev = sorted[i - 1];
        const buffer = computeBuffer(prev.time, it.time);
        if (buffer) {
          timelineHTML += `<div class="tl-buffer"><span class="tl-buffer-l">⏱️ ${buffer}</span></div>`;
        }
      }
      timelineHTML += renderTimelineItem(it);
    });

    html += `<div class="tl">
      ${timelineHTML}
      <button class="tl-add" onclick="openItemPicker(${state.activeDayIdx})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        + إضافة بند للجدول
      </button>
    </div>`;
  }

  $("day-content").innerHTML = html;
}


function renderTimelineItem(it) {
  const t = TYPES[it.type] || TYPES.attraction;
  const ref = it.refId ? libById(it.refId) : null;
  const lat = it.lat || ref?.lat;
  const lng = it.lng || ref?.lng;
  const noteText = it.note || ref?.note;

  // Determine card style based on type
  let cardClass = '', icBg = '', icColor = '', typePill = '', pillExtra = '';
  if (it.type === 'transport') {
    cardClass = 'tl-transport';
    icBg = 'rgba(245,158,11,0.18)'; icColor = '#b45309';
    typePill = '<span class="pill pill-sm pill-warn">🚆 تنقل</span>';
  } else if (it.type === 'tour') {
    cardClass = 'tl-tour';
    icBg = 'rgba(8,145,178,0.18)'; icColor = '#0891b2';
    typePill = '<span class="pill pill-sm" style="background:rgba(8,145,178,0.15);color:#0891b2;border-color:rgba(8,145,178,0.4)">🎯 جولة</span>';
  } else if (it.type === 'hotel') {
    cardClass = 'tl-hotel';
    icBg = 'rgba(26,77,74,0.18)'; icColor = 'var(--accent)';
    typePill = '<span class="pill pill-sm" style="background:rgba(26,77,74,0.15);color:var(--accent);border-color:rgba(26,77,74,0.4)">🏨 سكن</span>';
  } else if (it.type === 'food') {
    cardClass = 'tl-food';
    icBg = 'rgba(22,163,74,0.18)'; icColor = '#16a34a';
    const mealLabels = { breakfast: "🌅 فطور", lunch: "☀️ غداء", dinner: "🌃 عشاء", snack: "🍡 خفيف" };
    typePill = `<span class="pill pill-sm pill-ok">${mealLabels[it.mealType] || '🍽️ وجبة'}</span>`;
  } else if (it.type === 'mosque') {
    cardClass = 'tl-mosque';
    icBg = 'rgba(8,145,178,0.18)'; icColor = '#0891b2';
    typePill = '<span class="pill pill-sm">🕌 صلاة</span>';
  } else if (it.type === 'rest') {
    cardClass = 'tl-rest';
    icBg = 'rgba(217,119,6,0.18)'; icColor = '#d97706';
    typePill = '<span class="pill pill-sm" style="background:rgba(217,119,6,0.15);color:#d97706">☕ راحة</span>';
  } else if (it.type === 'note') {
    cardClass = 'tl-note';
    icBg = 'rgba(100,116,139,0.18)'; icColor = '#475569';
    typePill = '<span class="pill pill-sm" style="background:rgba(100,116,139,0.15);color:#475569">📝 ملاحظة</span>';
  } else {
    icBg = 'rgba(26,77,74,0.12)'; icColor = 'var(--accent)';
    typePill = `<span class="pill pill-sm">${t.label}</span>`;
  }

  // Halal/GF tags for food
  if (it.type === 'food') {
    if (it.mealHalal || ref?.halal) pillExtra += '<span class="pill pill-sm pill-ok">🥩 حلال</span>';
    if (it.mealGf || ref?.gf) pillExtra += '<span class="pill pill-sm pill-gold">🌾 GF</span>';
  }

  return `
    <div class="tl-row t-${it.type} ${it.done ? 'tl-row-done' : ''} ${it.locked ? 'tl-row-locked' : ''}">
      <div class="tl-time">${it.time || '—'}</div>
      <div class="tl-dot"></div>
      <div class="tl-card ${cardClass}">
        <div class="tl-card-ic" style="background:${icBg};color:${icColor}">${ref?.icon || t.icon}</div>
        <div class="tl-card-info">
          <div class="tl-card-t">
            ${it.text}
            ${it.locked ? '<span class="tl-lock" title="بند مقفول - حجز مهم">🔒</span>' : ''}
          </div>
          <div class="tl-card-m">
            ${typePill}
            ${pillExtra}
            ${ref?.price ? `<span class="pill pill-sm">${ref.price}</span>` : ''}
            ${it.requiresTicket ? '<span class="pill pill-sm pill-ticket">🎟️ يحتاج تذكرة</span>' : ''}
          </div>
          ${noteText ? `<div class="tl-tr-note">${noteText}</div>` : ''}
          ${it.notes ? `<div class="tl-item-notes">📒 ${it.notes}</div>` : ''}
          ${it.bookingLink ? `<a class="tl-card-link" href="${it.bookingLink}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            فتح رابط الحجز
          </a>` : ''}
          <div class="tl-card-acts">
            ${lat && lng ? `<a class="tl-card-act" href="https://www.google.com/maps/search/?api=1&query=${lat},${lng}" target="_blank">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>
              خرائط
            </a>` : ''}
            <button class="tl-card-act" onclick="editItem('${it.id}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/></svg>
              تعديل
            </button>
            <button class="tl-card-act tl-card-done ${it.done ? 'is-done' : ''}" onclick="toggleItemDone('${it.id}')" title="${it.done ? 'إلغاء الإكمال' : 'تم'}">
              ${it.done ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>'}
              ${it.done ? 'مكتمل' : 'تم'}
            </button>
          </div>
        </div>
        <button class="tl-card-x" onclick="removeItem('${it.id}')" title="حذف">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
  `;
}


function removeItem(id) {
  const day = state.itinerary[state.activeDayIdx];
  const item = day.items.find(i => i.id === id);
  if (!item) return;
  if (item.locked) {
    if (!confirm(`⚠️ هذا البند مقفول 🔒 (لحماية حجز مهم).\n\n"${item.text}"\n\nهل تريد فعلاً حذفه؟`)) return;
  }
  day.items = day.items.filter(i => i.id !== id);
  saveItin();
  renderDayContent();
}

function quickAdd() {
  openItemPicker(state.activeDayIdx);
}

// ─── 🗓️ DAY MANAGEMENT ───
function getTripStartDate() {
  const sd = state.tripInfo?.startDate;
  return sd ? new Date(sd) : new Date(TRIP_START);
}

function renumberDays() {
  const base = getTripStartDate();
  state.itinerary.forEach((d, i) => {
    d.day = i + 1;
    const date = new Date(base);
    date.setDate(date.getDate() + i);
    const weekdays = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
    const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
    d.date = date.toISOString().split('T')[0];
    d.dateLabel = `${date.getDate()} ${months[date.getMonth()]}`;
    d.weekday = weekdays[date.getDay()];
  });
}

function addNewDay(afterIdx) {
  const sourceDay = state.itinerary[afterIdx];
  const t = state.tripInfo || {};
  const defaultCity = isKoreaTrip() ? "seoul" : (t.arrCity || "");
  const newDay = {
    day: 0, // will be renumbered
    date: "",
    dateLabel: "",
    weekday: "",
    city: sourceDay?.city || defaultCity,
    title: "",
    type: "normal",
    flight: null,
    narrative: null,
    notes: null,
    hotel: sourceDay?.hotel ? { ...sourceDay.hotel } : null,
    items: []
  };
  state.itinerary.splice(afterIdx + 1, 0, newDay);
  renumberDays();
  saveItin();
  state.activeDayIdx = afterIdx + 1;
  renderItinerary();
}

function deleteDay(idx) {
  if (state.itinerary.length <= 1) {
    alert("لا يمكن حذف اليوم الوحيد");
    return;
  }
  const day = state.itinerary[idx];
  const hasContent = (day.items?.length || 0) > 0 || day.title || day.flight;
  const confirmMsg = hasContent
    ? `حذف يوم ${day.day} (${day.dateLabel})؟\n\nيحتوي على ${day.items?.length || 0} نشاط${day.title ? ` · "${day.title}"` : ''}.\n\nلا يمكن التراجع.`
    : `حذف يوم ${day.day} (${day.dateLabel})؟`;
  if (!confirm(confirmMsg)) return;
  state.itinerary.splice(idx, 1);
  renumberDays();
  saveItin();
  state.activeDayIdx = Math.min(idx, state.itinerary.length - 1);
  renderItinerary();
}

function printDay(dayIdx) {
  const day = state.itinerary[dayIdx];
  const trip = TripsRegistry.get(Trip.current) || TripsRegistry.KOREA_DEFAULT;
  const t = state.tripInfo || {};
  const cityName = cityById(day.city)?.name || state.customCities?.find(c=>c.id===day.city)?.name || day.city || '';
  const sorted = [...(day.items || [])].sort((a,b) => (a.time||"99:99").localeCompare(b.time||"99:99"));

  const modeIcons = { flight:"✈️", train:"🚄", arex:"🚆", bus:"🚌", taxi:"🚖", metro:"🚇", rental:"🚗", ferry:"⛴️", transport:"🚌" };

  const overlay = $("print-overlay");
  overlay.innerHTML = `
    <div class="print-close-bar">
      <div style="font-weight:600">معاينة اليوم ${day.day} قبل الطباعة</div>
      <div style="display:flex;gap:0.5rem">
        <button class="btn btn-pri" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
        <button class="btn btn-sec" onclick="closePrintOverlay()">✕ إغلاق</button>
      </div>
    </div>

    <div class="print-header">
      <div class="print-title">${trip.icon || '✈️'} ${trip.name} · اليوم ${day.day} — ${day.weekday}، ${day.dateLabel}</div>
      <div class="print-sub">
        ${cityName ? `📍 ${cityName}` : ''}
        ${t.travelers ? ` · 👤 ${t.travelers} مسافر` : ''}
        ${t.ticketRef ? ` · رقم التذكرة: ${t.ticketRef}` : ''}
      </div>
    </div>

    ${day.hotel?.name ? `
    <div class="print-section">
      <h3>🏨 السكن</h3>
      <div class="print-hotel-card">
        <strong>${day.hotel.name}</strong>
        ${day.hotel.area ? ` · ${day.hotel.area}` : ''}
        ${day.hotel.address ? `<br>📍 ${day.hotel.address}` : ''}
        ${day.hotel.checkIn ? `<br>دخول: ${day.hotel.checkIn}` : ''}
        ${day.hotel.checkOut ? ` · خروج: ${day.hotel.checkOut}` : ''}
        ${day.hotel.notes ? `<br><em>${day.hotel.notes}</em>` : ''}
      </div>
    </div>` : ''}

    ${day.flight ? `
    <div class="print-section">
      <h3>✈️ الانتقال</h3>
      <div class="print-item">
        <div class="print-item-time">${day.flight.depTime || '--:--'}</div>
        <div class="print-item-body">
          <div class="print-item-text">${day.flight.from} → ${day.flight.to}</div>
          ${day.flight.arrTime ? `<div class="print-item-note">الوصول: ${day.flight.arrTime}</div>` : ''}
        </div>
      </div>
    </div>` : ''}

    ${sorted.length > 0 ? `
    <div class="print-section">
      <h3>📅 الجدول (${sorted.length} بند)</h3>
      ${sorted.map(it => {
        const tp = TYPES[it.type] || {};
        return `<div class="print-item">
          <div class="print-item-time">${it.time || '--:--'}</div>
          <div class="print-item-body">
            <div class="print-item-text">${tp.icon || ''} ${it.text || it.name || ''}</div>
            ${it.notes ? `<div class="print-item-note">📌 ${it.notes}</div>` : ''}
            ${it.bookingLink ? `<div class="print-item-note">🔗 ${it.bookingLink}</div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>` : '<div class="print-section"><h3>📅 الجدول</h3><p style="color:#aaa;font-size:0.8rem">لا توجد أنشطة مسجلة لهذا اليوم</p></div>'}

    ${(day.notes || day.narrative) ? `
    <div class="print-section">
      <h3>📒 ملاحظات اليوم</h3>
      <div class="print-tips">
        ${day.narrative ? `<p><strong>الوصف:</strong> ${day.narrative}</p>` : ''}
        ${day.notes ? `<p><strong>ملاحظاتي:</strong> ${day.notes}</p>` : ''}
      </div>
    </div>` : ''}

    <div class="print-section">
      <h3>💡 معلومات مفيدة</h3>
      <div class="print-tips">
        <p>📞 الطوارئ: 112 (دولي) · 911 (محلي)</p>
        ${t.depAirport ? `<p>✈️ مطار المغادرة: ${t.depAirport} ${t.depCity ? `(${t.depCity})` : ''}</p>` : ''}
        ${t.arrAirport ? `<p>🛬 مطار الوصول: ${t.arrAirport} ${t.arrCity ? `(${t.arrCity})` : ''}</p>` : ''}
        ${t.ticketRef ? `<p>🎫 مرجع الحجز: ${t.ticketRef}</p>` : ''}
      </div>
    </div>

    <div class="print-footer">تم إنشاء هذا الجدول بواسطة منصة رحلاتي · ${new Date().toLocaleDateString('ar-SA')}</div>
  `;
  overlay.classList.add('active');
}

function closePrintOverlay() {
  const overlay = $("print-overlay");
  overlay.classList.remove('active');
  overlay.innerHTML = '';
}

function openCityTransferModal(dayIdx) {
  const day = state.itinerary[dayIdx];
  const fromCity = day.city || '';
  const fromName = cityById(fromCity)?.name || state.customCities?.find(c=>c.id===fromCity)?.name || fromCity;
  const allCities = [
    ...(isKoreaTrip() ? CITIES : []),
    ...(state.customCities || [])
  ];
  const otherCities = allCities.filter(c => c.id !== fromCity);

  openModal(`
    <div class="modal-h">
      <h3>🏙️ انتقال لمدينة أخرى</h3>
      <button class="modal-x" onclick="closeModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <p class="txs clm mb3">يُضيف بند انتقال لهذا اليوم ويغير مدينة الأيام التالية</p>

    <div class="fld-row">
      <div class="fld">
        <label>من مدينة</label>
        <input type="text" class="input" value="${fromName}" readonly style="opacity:0.6">
      </div>
      <div class="fld">
        <label>إلى مدينة *</label>
        ${otherCities.length > 0
          ? `<select class="input" id="ct-to-city">

      </div>
    </div>
    ${otherCities.length > 0 ? `<div class="fld" id="ct-new-city-row" style="display:none"><label>اسم المدينة الجديدة</label><input type="text" class="input" id="ct-new-city-name" placeholder="مثال: أنقرة"></div>` : ''}

    <div class="fld-row">
      <div class="fld">
        <label>وسيلة النقل *</label>
        <select class="input" id="ct-mode">
          <option value="flight">✈️ طيران</option>

          <option value="bus">🚌 باص</option>

          <option value="rental">🚗 سيارة مستأجرة</option>
          <option value="ferry">⛴️ عبارة / سفينة</option>

        </select>
      </div>

        <label>الوقت</label>

    <div class="fld-row">
      <div class="fld">
        <label>رقم الرحلة / الخط (اختياري)</label>
        <input type="text" class="input" id="ct-ref" placeholder="مثال: TK 301">

        <label>مدة الرحلة (اختياري)</label>

      </div>

    <div class="fld">
      <label>ملاحظات (اختياري)</label>

    </div>
    <div class="fld">
      <label>
        <input type="checkbox" id="ct-apply-forward" checked style="width:auto;margin-left:0.4rem">
        تطبيق المدينة الجديدة على باقي الأيام التالية (يمكن تعديلها لاحقاً)
      </label>
    </div>
    <div class="modal-act">
      <button class="btn btn-sec" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-pri" onclick="saveCityTransfer(${dayIdx}, '${fromCity}', '${fromName}')">إضافة الانتقال</button>
